[project]
name = "hiddeneco"
version = "0.1.0"
description = "Local-first documentary production pipeline for The Hidden Economics"
requires-python = ">=3.10"
dependencies = ["pillow>=10.1", "numpy>=1.26", "pyyaml>=6.0", "pydantic>=2.5", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
piper = ["piper-tts>=1.2"]

[project.scripts]
hiddeneco = "hiddeneco.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hiddeneco*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
