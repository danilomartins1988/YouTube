title: Why Switzerland Is So Rich
slug: why-switzerland-is-so-rich
language: en
# Deliverables live in deliverables/<id>/ (deliverable.yaml + script.yaml + storyboard.yaml).
# They share this topic's dossier (sources.yaml) and visual identity.
# Per-video visual identity. Each episode gets its own palette, type pairing and motifs so the
# channel never looks like a template farm. QC compares scene grammar against earlier projects.
# Made before the US-dollar rule (2026-11-05); keeps its local-currency figures.
currency_exempt: true
# 2026-11-08 cartoon redo: animated with the Remotion engine (CartoonStage worlds).
renderer: remotion
remotion_geo: [world]
style:
  name: alpine-ledger
  palette:            # bright cartoon day with Swiss red (2026-11-08 cartoon redo)
    bg: "#BFE8FA"
    bg2: "#EAF8FF"
    ink: "#10213A"
    muted: "#4F6B80"
    land: "#8BD47A"
    border: "#2E5A73"
    accent: "#E53935"
    accent2: "#1E7FD8"
    accent3: "#23995A"
    risk: "#C62828"
  fonts:
    display: InterDisplay-Bold
    heading: InterDisplay-SemiBold
    body: Inter-Regular
    body_bold: Inter-SemiBold
  motifs: [ledger-rules, chapter-tags, film-grain]
youtube:
  category: Education
  default_language: en
  made_for_kids: false

# Published before the channel-intro and presenter standards (2026-11-05): kept exactly as released.
# For a future re-edit, set intro.enabled: true (and add presenter scenes or keep presenter_exempt).
intro: {enabled: false}
presenter_exempt: true
# 2026-11-08 cartoon redo: the narration is re-voiced with the current voice settings (≈ $0.28); standard per-episode cap.
budget:
  max_paid_usd: 1.00
