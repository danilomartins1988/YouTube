# Hand-curated claims. Values below were located via web search on 2026-11-03 and have
# NOT yet been confirmed by a person reading the primary document - hence source_located.
claims:
  - id: geo_landlocked
    text: Switzerland is landlocked (it has no sea coast).
    source_ids: [natural_earth]
    status: source_located
    verification_note: Visible in the Natural Earth boundaries used for the map; a reviewer only needs to confirm and sign off. ('Mountainous' was cut from the script because it had no citation.)
  - id: neutrality_1815
    text: Europe's great powers formally recognised Swiss neutrality in 1815 (Congress of Vienna and the Second Treaty of Paris).
    spoken: In 1815
    display: "1815"
    value: 1815
    source_ids: [admin_neutrality, eda_neutrality]
    status: source_located
    verification_note: admin.ch dates the recognition to 1815 via the Congress of Vienna and the Treaty of Paris. Check exact wording on both pages.
  - id: pharma_share_2024
    text: Chemical and pharmaceutical products accounted for 52.7% of Swiss (goods) exports in 2024 (CHF 149,058 million).
    spoken: more than half
    display: "52.7%"
    value: 52.7
    fields: {year: 2024, spoken_exact: "52.7 percent"}
    source_ids: [bazg_trade_2024, kmu_pharma_exports]
    status: source_located
    verification_note: Figure taken from a search summary of the FOCBS 2024 annual report. Confirm the 52.7% and which export total it refers to (FOCBS 'Total 1' business-cycle total excludes gold and other precious metals) and word the on-screen label accordingly.
  - id: vet_share
    text: About two-thirds of young people in Switzerland enter vocational education and training (VET); the most common form is dual-track VET combining classroom instruction with workplace training.
    spoken: About two thirds
    display: "2 in 3"
    value: 0.6667
    source_ids: [seri_vet]
    status: source_located
    verification_note: SERI states that two-thirds of young people benefit from VET. Confirm exact phrasing; do not conflate with annual 'Transition Barometer' interest percentages.
  - id: gii_2025_rank
    text: In the Global Innovation Index 2025, WIPO ranked Switzerland first of 139 economies.
    spoken: In 2025, the World Intellectual Property Organization ranked Switzerland first out of 139 economies
    display: "#1 of 139"
    value: 1
    fields: {year: 2025, economies: 139}
    source_ids: [wipo_gii_2025, ige_gii_2025]
    status: source_located
    verification_note: Confirm 139 economies and rank in WIPO's press release. Secondary sources disagree on the length of the streak (14th vs 15th year), so the script deliberately does not mention it.
  - id: gii_2025_top5
    text: "GII 2025 top five: Switzerland, Sweden, United States, Republic of Korea, Singapore."
    value: [Switzerland, Sweden, United States, "Rep. of Korea", Singapore]
    source_ids: [wipo_gii_2025]
    status: source_located
    verification_note: Confirm order in WIPO's ranking table.

  - id: constitution_1848
    text: The Federal Constitution of 12 September 1848 established the Swiss federal state, turning a group of cantons into a federal state with new federal authorities.
    spoken: In 1848
    display: "1848"
    value: 1848
    source_ids: [parlament_constitution, bar_new_authorities]
    status: source_located
    verification_note: parlament.ch reportedly says the present constitution's basis is the Constitution of 12 September 1848, which established the Swiss federal state. Confirm wording.
  - id: eu_bilateral
    text: Switzerland is not a member of the European Union; it pursues its European policy through bilateral sectoral agreements.
    source_ids: [eda_bilateral]
    status: source_located
    verification_note: Confirm on the FDFA 'bilateral path' page.
  - id: banking_act_1934
    text: The 1934 Federal Act on Banks and Savings Banks (in force 1 March 1935) made breaching banking secrecy a criminal offence (Article 47); before that, banking secrecy was protected by civil law.
    spoken: In 1934
    display: "1934"
    value: 1934
    source_ids: [iheid_banking_secrecy, goldblum_secrecy]
    status: source_located
    verification_note: Secondary sources (academic chapter + law firm). Ideally confirm against the Act's text on fedlex.admin.ch (Article 47) and cite it.
  - id: aeoi_2018
    text: In 2018 Switzerland exchanged financial account information automatically with partner states for the first time, covering around 2 million financial accounts (FTA release, 5 October 2018), under the global AEOI standard.
    spoken: around two million
    display: "~2 million"
    value: 2000000
    fields: {year: 2018}
    source_ids: [fta_aeoi_2018]
    status: source_located
    verification_note: Title of the FTA release says 'around 2 million financial accounts'. Partner count differs between sources (36 vs 38) - deliberately not used.
  - id: snb_floor_2011
    text: On 6 September 2011 the Swiss National Bank set a minimum exchange rate of CHF 1.20 per euro, saying it would no longer tolerate a EUR/CHF rate below it.
    spoken: one franc twenty
    display: "1.20"
    value: 1.20
    fields: {date_spoken: "September 6th, 2011", year: 2011}
    source_ids: [ecb_snb_2011, bis_jordan_2015]
    status: source_located
    verification_note: The ECB statement of 6 Sep 2011 quotes the SNB decision. Locate and cite the SNB's own press release of that date if possible.
  - id: snb_floor_end_2015
    text: On 15 January 2015 the Swiss National Bank discontinued the minimum exchange rate of CHF 1.20 per euro with immediate effect and ceased the associated foreign currency purchases; the franc appreciated sharply and markets were surprised.
    fields: {date_spoken: "January 15th, 2015", year: 2015}
    source_ids: [bis_jordan_2015, swissinfo_floor_2015]
    status: source_located
    verification_note: Decision wording from SNB press-conference text (BIS). 'Appreciated sharply / surprise' is press coverage - keep it qualitative, no magnitude.
  - id: snb_floor_interventions
    text: According to the SNB (April 2015), the minimum exchange rate could only have been enforced through permanent currency interventions of rapidly increasing magnitude.
    source_ids: [snb_speech_2015_04]
    status: source_located
    verification_note: Confirm wording in the SNB speech of 24 April 2015.
  - id: cs_ubs_2023
    text: On 19 March 2023 FINMA approved the takeover of Credit Suisse by UBS; the Swiss Confederation and the SNB supported the deal (federal guarantee for additional SNB liquidity assistance, emergency law).
    fields: {month_spoken: "March 2023"}
    source_ids: [finma_cs_ubs, efd_cs_timeline]
    status: source_located
    verification_note: Confirm on FINMA release and the Federal Department of Finance timeline.
  - id: price_level_2024
    text: In 2024 Switzerland had the highest price level among the countries compared by Eurostat, with a price level index of 158.8 (EU = 100) at GDP level.
    spoken: almost 60 percent above the EU average
    display: "158.8"
    value: 158.8
    fields: {year: 2024}
    source_ids: [eurostat_price_levels, bluewin_price_2024]
    status: source_located
    verification_note: 158.8 comes from press reports of Eurostat data (GDP-level price index). Confirm in Eurostat dataset prc_ppp_ind and which aggregate (GDP vs household consumption) before publishing; adjust the on-screen label.
  - id: pharma_hq_basel
    text: Roche and Novartis both have their global headquarters in Basel.
    source_ids: [swissinfo_roche_hq, swissinfo_roche_rd]
    status: source_located
    verification_note: Sources are news articles; confirm on roche.com and novartis.com (Novartis HQ is only implied by the found sources).

open_questions:
  - For the full documentary - role of banking secrecy and its erosion (1934 Banking Act, automatic exchange of information). Needs primary legal sources.
  - Swiss franc and the Swiss National Bank's balance sheet - SNB annual reports.
  - Counterpoints - cost of living, inequality measures, dependence on a few large firms. Needs balanced sources.
  - Is GDP per capita the right lens? Compare GNI per capita and PPP-adjusted measures (World Bank NY.GNP.PCAP.CD, NY.GDP.PCAP.PP.CD).
