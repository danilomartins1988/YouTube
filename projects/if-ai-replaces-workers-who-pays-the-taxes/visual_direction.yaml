requirements:
- No company logos or brand names; the warehouse is generic
- Every number on screen carries a claim pill (FACT / PROJECTION / OUR CALC / FINDING / ANALYSIS / STORY / SCENARIO / LIBRARY)
- No real person drawn; Rosa, Stub and Rivet are fictional; no politicians as characters; countries never shown as flags
- Day scenes, human characters, neutral tone (one good reason and one catch per proposal); USD only
