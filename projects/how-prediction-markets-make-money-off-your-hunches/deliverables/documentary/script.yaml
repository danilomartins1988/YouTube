# Documentary (target 11-13 min). Five parts as an INTERNAL structure only (never narrated or shown as missions).
# Hook rules (docs/ANALYSIS_HOOKS_THUMBS_VISUALS.md): cold open on the number, four short beats, explicit promise,
# no "What if", channel intro after part 1, no separate part-question scenes.
# Numbers come from sources.yaml via {{placeholders}}; company claims, third-party analyses and pending cases said as such.
logline: Americans traded twenty-five billion dollars of event contracts in a single month. The platforms do not care who
  wins. They charge a small toll on every trade. How a yes-or-no contract became a business, and why the courts are split.
title: How Prediction Markets Make Money Off Your Hunches
segments:
- id: h_open
  chapter: Twenty-five billion dollars
  narration: Twenty-five billion dollars. That is how much was traded on event contracts in America in March twenty twenty-six,
    according to the federal regulator. Contracts on elections, on interest rates, and above all, on sports games.
  claims:
  - size
- id: h_twist
  chapter: Twenty-five billion dollars
  narration: Here is the twist. The platforms that run these markets say they are not betting against you at all. They do
    not need you to lose. They just need you to trade.
  claims:
  - fee
- id: h_question
  chapter: Twenty-five billion dollars
  narration: So how does a market for hunches make money? And is it finance, or is it gambling?
  claims: []
  analysis: true
  source_note: Hook question built from the sourced facts.
- id: h_promise
  chapter: Twenty-five billion dollars
  narration: By the end of this video, you will know how a yes-or-no contract works, where the fee hides, why most of the
    money is on sports, and why the courts cannot agree on what these markets are.
  claims: []
  analysis: true
  source_note: Promise of the episode (hook rule).
- id: m1_card
  chapter: The contract
  narration: ''
  claims: []
- id: m1_how
  chapter: The contract
  narration: Start with the product. An event contract is a simple question with a yes or no answer. Will this team win tonight?
    Will the central bank cut rates next month? If the answer is yes, a yes contract pays one dollar. If the answer is no, it
    pays nothing.
  claims:
  - fee
  analysis: true
  source_note: Explanation of a binary event contract (commentary on the exchanges' descriptions).
- id: m1_price
  chapter: The contract
  narration: Before the event, people trade these contracts at prices between zero and one dollar. If a yes contract trades
    at sixty-five cents, the crowd is saying, roughly, that the event has a sixty-five percent chance of happening. The price
    is the prediction.
  claims:
  - fee
  analysis: true
  source_note: Explanation of contract prices as implied probabilities (commentary).
- id: m1_member
  chapter: The contract
  narration: And here is the key difference from a sportsbook. Kalshi, the largest of these platforms, says that you are always
    trading against another member of the platform, not the exchange itself. Someone buys yes. Someone else buys no. The exchange
    matches them in the middle.
  claims:
  - fee
- id: m1_regulated
  chapter: The contract
  narration: That is why Kalshi calls itself an exchange, not a bookmaker. In twenty twenty, the Commodity Futures Trading Commission,
    the regulator that oversees futures markets, designated it as a contract market. The same kind of license that big futures
    exchanges hold.
  claims:
  - rules
- id: m1_draw
  chapter: The contract
  narration: Let me draw one contract. Here is the question. On the left, a buyer of yes, paying sixty-five cents. On the right,
    a buyer of no, paying thirty-five cents. Together, they put in one dollar. When the answer comes, one side takes the whole
    dollar. The exchange simply holds the money in between.
  claims:
  - fee
  analysis: true
  source_note: Illustrative diagram of a matched yes and no contract (hypothetical prices).
- id: m1_transition
  chapter: The contract
  narration: So if the exchange never takes a side, where does its money come from?
  claims:
  - fee
- id: m2_card
  chapter: The toll
  narration: ''
  claims: []
- id: m2_fee
  chapter: The toll
  narration: The answer is a toll. In its own words, Kalshi makes money by charging a transaction fee on the expected earnings
    on the contract. Not on who wins. On every trade, win or lose.
  claims:
  - fee
- id: m2_formula
  chapter: The toll
  narration: The formula it filed with the regulator in twenty twenty-two looks like this. Seven percent, times the number of
    contracts, times the price, times one minus the price. At a price of fifty cents, that works out to about {{fee}} per contract,
    rounded up to the next cent. There is no fee when the contract settles.
  claims:
  - fee
- id: m2_shape
  chapter: The toll
  narration: Notice the shape of that formula. The fee is biggest when the price is fifty cents, when the outcome looks like
    a coin flip. It shrinks near zero and near one dollar, when the result is almost certain. The platform earns the most on the
    questions people are least sure about.
  claims:
  - fee
  analysis: true
  source_note: Commentary on the filed fee formula.
- id: m2_poly
  chapter: The toll
  narration: Polymarket, its biggest rival, uses the same kind of formula for its American exchange. In a filing with the regulator,
    its rate for traders who take an existing offer rises to almost seven percent of the same price term. And traders who post
    offers and wait get a small rebate. Both platforms pay people to keep the market full.
  claims:
  - fee
- id: m2_spread
  chapter: The toll
  narration: Those people are called market makers. They post prices on both sides and, as Kalshi puts it, make money by collecting
    the spread. And Kalshi has said that one of its own affiliates trades on the exchange too, mainly as a spread trader. So the
    exchange itself is not your opponent, but the other side of your trade may be a professional.
  claims:
  - fee
- id: m2_draw
  chapter: The toll
  narration: Let me draw the toll curve. Along the bottom, the price, from zero to one dollar. Up the side, the fee. It starts
    near zero, climbs to its peak at fifty cents, and falls again. A hill, with the toll booth at the top, right where the
    hunches are most uncertain.
  claims:
  - fee
  analysis: true
  source_note: Diagram of the filed fee formula 0.07 x P x (1 - P).
- id: m2_transition
  chapter: The toll
  narration: A small toll on a huge number of trades adds up. And the biggest source of those trades is not politics.
  claims:
  - sports
- id: m3_card
  chapter: Mostly sports
  narration: ''
  claims: []
- id: m3_share
  chapter: Mostly sports
  narration: The platforms do not publish an official split. But the Pew Research Center analyzed data compiled by a crypto news
    site, The Block. In July twenty twenty-six, sports were the most traded topic on both platforms, by a large margin. By our
    calculation from that table, {{sports}} dollars traded were on sports.
  claims:
  - sports
- id: m3_growth
  chapter: Mostly sports
  narration: The growth claims are enormous, but they are claims. In October, Kalshi said its annualized trading volume now exceeds
    one trillion dollars, and that it handles over seventy-five percent of prediction market trading. It raised one billion dollars
    at a forty billion dollar valuation. None of those numbers is an audited figure.
  claims:
  - size
- id: m3_ice
  chapter: Mostly sports
  narration: Wall Street noticed. The company that owns the New York Stock Exchange, Intercontinental Exchange, said it would
    invest {{rules.ice_spoken}} in Polymarket, at a valuation of about eight billion dollars before the investment.
  claims:
  - rules
- id: m3_books
  chapter: Mostly sports
  narration: And the sportsbooks joined in. DraftKings launched its own prediction product in December twenty twenty-five, with
    its own exchange and its own market maker. FanDuel launched one with CME Group, the giant futures exchange, in states where
    regular sports betting is not legal. The NBA named Kalshi and Polymarket its preferred prediction market exchanges.
  claims:
  - sports
- id: m3_draw
  chapter: Mostly sports
  narration: Let me draw where the money goes. Here is one big circle, all the trading in July. Now cut it. A thin slice for
    politics, economics and everything else. And the rest, about four fifths, is sports. A market for hunches, mostly about who
    wins the game.
  claims:
  - sports
  analysis: true
  source_note: Pie diagram of the third-party sports share (rounded).
- id: m3_transition
  chapter: Mostly sports
  narration: Which raises the obvious question. If it looks like sports betting, why is it not regulated like sports betting?
  claims:
  - courts
- id: m4_card
  chapter: The fight
  narration: ''
  claims: []
- id: m4_past
  chapter: The fight
  narration: The rules have not always been friendly. In twenty twenty-two, the regulator ordered Polymarket to pay a {{rules}}
    penalty for running what it called an illegal unregistered facility. Then the climate changed. In July twenty twenty-five,
    the company that now operates as Polymarket US was designated as a regulated exchange.
  claims:
  - rules
- id: m4_states
  chapter: The fight
  narration: Then the states pushed back. Sports betting in America is regulated by each state, with its own licenses and taxes.
    Several states told the platforms that their sports contracts were simply illegal bets. The platforms answered that they are
    federally regulated exchanges, and that states have no say.
  claims:
  - courts
- id: m4_split
  chapter: The fight
  narration: The courts split. In April twenty twenty-six, a federal appeals court in the Third Circuit sided with Kalshi, {{courts}},
    at an early stage of the case. It said the sports contracts are swaps traded on a licensed exchange, under the federal regulator's
    exclusive control. One judge disagreed, and called that position a performative sleight.
  claims:
  - courts
- id: m4_ninth
  chapter: The fight
  narration: Then in August, the Ninth Circuit, in a case from Nevada, went the other way. It said the contracts were not swaps,
    because they were sports bets. Two appeals courts, two opposite answers.
  claims:
  - courts
- id: m4_supreme
  chapter: The fight
  narration: Now the question is knocking at the Supreme Court. New Jersey has asked the justices to take the case. As of today,
    they have not decided whether to hear it. Meanwhile, the federal regulator has taken the platforms' side. It dropped a plan
    to ban sports and political contracts, and it has sued several states.
  claims:
  - courts
- id: m4_draw
  chapter: The fight
  narration: Let me draw the tug of war. On one side, the platforms and the federal regulator, pulling toward finance. On the
    other side, the states and their gaming regulators, pulling toward betting. In the middle, the rope, a yes or no
    contract on tonight's game. And the referee has not blown the whistle yet.
  claims:
  - courts
  analysis: true
  source_note: Diagram of the legal dispute (commentary; cases pending).
- id: m4_transition
  chapter: The fight
  narration: So whatever the courts decide, one part of this business is already clear.
  claims:
  - fee
- id: m5_card
  chapter: The house always gets paid
  narration: ''
  claims: []
- id: m5_math
  chapter: The house always gets paid
  narration: Do the math on a single trade. You buy one hundred contracts at fifty cents, fifty dollars in total. Under the formula
    Kalshi filed, the fee is about one dollar and seventy-five cents. If you win, you collect one hundred dollars. If you lose,
    you get nothing. Either way, the toll was paid at the start.
  claims:
  - fee
  analysis: true
  source_note: Worked example using the filed fee formula (hypothetical trade).
- id: m5_tiny
  chapter: The house always gets paid
  narration: For the whole market, the regulator put the numbers in perspective. Twenty-five billion dollars of event contracts
    in a month sounds huge. But it is {{size.share_spoken}} of all the futures trading the commission oversees. Small for Wall
    Street, enormous for a product that barely existed a few years ago.
  claims:
  - size
- id: m5_draw
  chapter: The house always gets paid
  narration: Let me draw the business model. On one side, thousands of traders with hunches. In the middle, the exchange, taking
    a small toll on every match. On the other side, the market makers, earning the spread. The traders win and lose against each
    other. The toll booth is the only one that collects on every single trade.
  claims:
  - fee
  analysis: true
  source_note: Diagram summarizing the sourced revenue model (commentary).
- id: payoff
  chapter: The lesson
  narration: So how do prediction markets make money off your hunches? Not by betting against you. By charging a small fee every
    time you trade, most of all when nobody is sure what will happen. Whether that makes them a financial market or a casino is
    a question the courts are still fighting over. But the toll booth gets paid either way.
  claims:
  - fee
  - courts
  analysis: true
  source_note: Conclusion drawn from the sourced parts.
- id: teaser
  chapter: The lesson
  narration: Next time on The Hidden Economics, we follow the money behind another hidden link of the world economy. This
    is The Hidden Economics.
  claims: []
  analysis: true
  source_note: Generic teaser (channel rule).
