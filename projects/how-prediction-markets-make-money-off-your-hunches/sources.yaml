claims:
  - id: size
    text: "CFTC proposed rule (91 FR 35806, Jun 12, 2026): event-contract activity grew 'especially since October 2025, reaching $25 billion in March 2026'; '$25 billion in event contracts is approximately 0.08% of the $31 trillion total notional value in futures contracts regulated by the Commission'. Kalshi claims (Oct 29, 2026): 'annualized trading volume now exceeds $1 trillion'; 'over 75% of prediction market trading volume'; $1B raise at a $40B valuation (company claims)."
    spoken: twenty-five billion dollars
    display: "$25bn of event contracts in March 2026 (CFTC)"
    fields: {share_spoken: about zero point zero eight percent}
    source_ids: [cftc, kalshi]
    status: source_located
    verification_note: Kalshi figures are company claims (said).

  - id: fee
    text: "Kalshi: 'Kalshi makes money by charging a transaction fee on the expected earnings on the contract'; 'you are always trading against another member of the platform, not the exchange itself'; market makers 'make money by collecting the spread'. Fee formula filed with the CFTC (Sep 2022): 'fees = round up(0.07 x C x P x (1-P))', 'no settlement fee'; 1.75 cents per contract at 50 cents. Polymarket US filing: 'Fee = Θ × C × p × (1 − p)', taker Θ from 0.06 to 0.0695 (Sep 17, 2026), maker rebate Θ = −0.0125. Kalshi affiliate Kalshi Trading LLC trades on the exchange (2021 notice)."
    spoken: one point seven five cents
    display: "Fee ≈ 1.75¢ per contract at 50¢ (Kalshi formula filed 2022)"
    fields: {}
    source_ids: [kalshi, poly]
    status: source_located
    verification_note: Current Kalshi rate not verified (said as the filed formula).

  - id: rules
    text: "CFTC designated KalshiEX as a contract market Nov 4, 2020. CFTC (Jan 3, 2022): Polymarket to pay a $1.4 million penalty for operating 'an illegal unregistered or non-designated facility'. QCX LLC (Polymarket US) designated July 9, 2025. ICE 8-K (Oct 7, 2025): 'ICE will invest up to $2 billion in Polymarket, reflecting a valuation of approximately $8 billion pre-investment'; trades 'matched peer-to-peer'."
    spoken: one point four million dollars
    display: "Polymarket fined $1.4M by the CFTC (2022)"
    fields: {ice_spoken: up to two billion dollars}
    source_ids: [cftc, poly]
    status: source_located
    verification_note: Designations and orders as published.

  - id: sports
    text: "Pew Research Center analysis of The Block data: sports 'the most traded topic on both platforms by a large margin'; July 2026 sports ≈ $31.4bn of ≈ $40.1bn on Kalshi (≈ 78%) and ≈ $10.6bn of ≈ $12.9bn on Polymarket (≈ 82%) - shares our calculation. NBA (Oct 26, 2026): Kalshi and Polymarket 'Preferred Prediction Market Exchanges', 'limitations on permissible markets'. DraftKings 10-Q: DraftKings Predictions launched Dec 2025; revenue includes fees of its exchange DKeX and its market maker GUS CAP LLC. Flutter 10-Q: FanDuel Predicts launched Dec 2025 with CME."
    spoken: about four out of five
    display: "≈ 4 in 5 dollars traded on sports (Pew analysis, July 2026)"
    fields: {}
    source_ids: [pew, books]
    status: source_located
    verification_note: Third-party analysis; shares our calculation.

  - id: courts
    text: "Third Circuit (Apr 6, 2026), 2-1, preliminary-injunction stage: sports contracts 'are swaps traded on a CFTC-licensed DCM, so the CFTC has exclusive jurisdiction'; dissent: 'a performative sleight'. Ninth Circuit (Aug 28, 2026): the contracts 'were not swaps because they were sports bets'. Supreme Court: New Jersey petition No. 26-299 filed Sep 2, 2026; response due Dec 7, 2026 (pending). CFTC (2026): withdrew 2024 proposal to ban political and sports contracts (Feb 4); sued nine states; Oct 9 proposal to define event contracts as swaps."
    spoken: two to one
    display: "Courts split: 3rd Cir. for Kalshi, 9th Cir. against"
    fields: {}
    source_ids: [courts, cftc]
    status: source_located
    verification_note: Cases pending (said).
