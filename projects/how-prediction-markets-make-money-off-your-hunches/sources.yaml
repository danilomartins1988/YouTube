# Sources and claims for "How Prediction Markets Make Money Off Your Hunches" (Episode 45, new topics N5).
# Every claim was read on its primary page/file on 2026-11-10 (notes: docs/episodes/45-prediction-markets/RESEARCH_NOTES.md).
# Status stays source_located until a named human reviewer signs off. US dollars.
# RULES: Kalshi fee = the 2022 formula filed with the CFTC (current rate not verified - said as "the formula it filed");
# company volume claims attributed and called claims; sports share is a third-party analysis (Pew/The Block);
# "the exchange isn't your counterparty" (not "never bets"); court cases pending (said); no gambling advice.
