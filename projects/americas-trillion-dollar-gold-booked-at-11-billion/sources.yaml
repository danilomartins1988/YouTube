claims:
  - id: book
    text: "Treasury Fiscal Data, Oct 31, 2026: 261,498,926.241 fine troy oz; book value $11,041,059,957.90 (sum of line items); 'established by law ($42.222), set in 1973.' Fort Knox 147,341,858 oz (56.3%), West Point 54,067,331 (20.7%), Denver 43,853,707 (16.8%), Federal Reserve Banks 13,452,811 (5.1%, NY Fed holds 99.98% of it per OIG), Mint working stock 2,783,219 (1.1%). ≈ 8,133 metric tonnes (our calc). GAO: 261,498,900 oz as of Sept 30, 2010 (unchanged)."
    spoken: eleven billion dollars
    display: "Book value $11.04bn (Oct 31, 2026, Treasury)"
    fields: {oz_spoken: two hundred and sixty-one million ounces, tons_spoken: about eight thousand one hundred tonnes}
    source_ids: [fiscal, gao, oig]
    status: source_located
    verification_note: Shares and tonnage our calculation.

  - id: market
    text: "Treasury OIG (OIG-26-002, OIG-26-004): 'At September 30, 2025 and 2024, the market values of gold per the LBMA Gold Price (PM) were $3,825.30 and $2,629.95 per FTO'; deep storage market value $938.2bn; FRB-held gold market value $51,461,036,128. Total 261.5m oz × $3,825.30 ≈ $1.0003 trillion (our calc); ≈ 90x book value (our calc). CRS: 'over $900 billion as of September 11, 2025.'"
    spoken: about one trillion dollars
    display: "≈ $1.0tn at the Sept 30, 2025 gold price (our calc, OIG price)"
    fields: {price_spoken: three thousand eight hundred and twenty-five dollars, ratio_spoken: about ninety times}
    source_ids: [oig, crs]
    status: source_located
    verification_note: Valuation date stated (Sept 30, 2025).

  - id: price
    text: "31 U.S.C. 5117(b): certificates up to 'the value ... of 42 and two-ninths dollars a fine troy ounce'. Pub. L. 93-110 (Sept 21, 1973): 'forty-two and two-ninths dollars per fine troy ounce'. Pub. L. 92-268 (Mar 31, 1972): '$1 equals one thirty-eighth of a fine troy ounce of gold.' Fed History: 1934 'currency at a rate of $35 per ounce of gold ... the Gold Act of 1900, which equaled $20.67 per ounce.' The 1973 act also began ending the ban on private gold ownership."
    spoken: forty-two dollars and twenty-two cents
    display: "Statutory price $42.22/oz (1973 law)"
    source_ids: [usc, fedhist]
    status: source_located
    verification_note: Price history as read in the statutes and Fed History.

  - id: certs
    text: "Fed FAQ: 'The Federal Reserve does not own gold.' The Gold Reserve Act of 1934 required the Fed to transfer its gold to Treasury in exchange for gold certificates, 'denominated in U.S. dollars' and not redeemable in gold. CRS: Treasury 'monetized the gold by issuing gold certificates to the Fed', which 'credited the Treasury's General Account'; certificates must be less than or equal to book value. H.4.1 (Nov 5, 2026): gold stock $11,041 million; gold certificate account $11,037 million."
    spoken: eleven point oh three seven billion dollars
    display: "Fed gold certificate account $11.037bn (H.4.1)"
    source_ids: [h41, crs, fedhist]
    status: source_located
    verification_note: Read on Fed and CRS pages.

  - id: audits
    text: "GAO-11-768T: 1974 GAO assisted in the planning of an audit; 3 of 13 Fort Knox compartments audited, no differences; 1975 'Committee for Continuing Audits of United States Government-owned Gold'; 'about 92 percent' audited by Sept 30, 1986; since 1995 'the Treasury OIG has annually audited the deep storage gold reserves'; joint seals on all 42 compartments inspected. OIG-26-002 (Dec 12, 2025): schedules 'presented fairly, in all material respects'. OIG memo (Oct 4, 2017): Secretary Mnuchin's Aug 21, 2017 trip to 'Mint's Bullion Depository at Ft. Knox' with Senate Majority Leader McConnell; 'There is no indication that the date was chosen to coincide with the solar eclipse'; aircraft cost $26,900.25."
    spoken: three of the thirteen
    display: "1974: 3 of 13 Fort Knox compartments audited (GAO)"
    fields: {pct_spoken: about ninety-two percent, cost_spoken: twenty-six thousand nine hundred dollars}
    source_ids: [gao, oig]
    status: source_located
    verification_note: Read in GAO testimony and OIG documents.

  - id: reval
    text: "CRS IF13109: changing the statutory value would monetize or demonetize gold through the certificate account. S. 954 BITCOIN Act of 2025 (introduced Mar 11, 2025, PROPOSAL): Reserve Banks would tender gold certificates and the Secretary would 'issue new gold certificates ... that reflect the fair market value price' to help fund a Bitcoin reserve. H.R. 3795 Gold Reserve Transparency Act of 2025 (introduced June 6, 2025, PROPOSAL): independent 'full assay, inventory, and audit' every five years; no revaluation. CRS (Sept 2025): both referred to committee; neither enacted as far as the record checked."
    spoken: fair market value
    display: "Revaluation and audit bills: proposals, not law"
    source_ids: [crs, bills]
    status: source_located
    verification_note: Status as of the official record we could check (said).

  - id: world
    text: "World Gold Council (IMF data, to Aug 31, 2026): China 'around 2,387t'; Russia '2,271t'; Poland bought 98t year to date; central banks bought about 170t year to date. Mint deep storage 'not used ... to produce coins in fiscal years 2025 and 2024' (OIG-26-002); FRB-held gold 13,452,810 oz, market value $51.46bn at Sept 30, 2025 (OIG-26-004). U.S. ≈ 8,133t (Treasury data, our calc) ≈ 3.4x China (our calc)."
    spoken: about three point four times
    display: "US ≈ 8,133t vs China ≈ 2,387t (WGC/IMF; our ratio)"
    source_ids: [wgc, fiscal]
    status: source_located
    verification_note: Germany/Italy/France not verified; not used.
