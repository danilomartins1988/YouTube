  after_segment: co_hook
tts_overrides:
  openai:
    voice: ash
    tempo: 1.0
    instructions: >-
      Voice: the narrator of a premium American documentary about money and power: curious, clear and quietly confident, with a light
      touch of wit and warmth for the main character, June. Strictly neutral and fair: never promotional, never alarmist, no hype; give
      the optimists and the critics the same calm weight. Pacing: brisk but unhurried; slow slightly to land every number; a short beat
      after a surprising figure and before each verdict. Natural American English, conversational, never an announcer, never salesy.
      Pronounce: Anthropic (an-THROP-ik), Amodei (ah-moh-DAY), Dario (DAH-ree-oh), Daniela (dah-nee-EL-ah), Claude (KLAWD),
      Nasdaq (NAZ-dak), A-N-T as three letters, TSMC as letters, AMD as letters, Nvidia (en-VID-ee-ah), Micron (MY-kron).
