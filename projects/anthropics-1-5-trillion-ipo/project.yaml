title: "Anthropic's $1.5 Trillion IPO: The AI Gold Rush or the Next Bubble?"
slug: anthropics-1-5-trillion-ipo
language: en
# Episode 72 (owner brief docs/episodes/72-anthropic-ipo/PRODUCTION_PROMPT.md, received 2026-11-20). Runtime 12-14 min (owner override).
# Central question: did investors buy the next great technology company, or pay an extraordinary price for a future that has not
# happened yet? NEUTRALITY (critical): Anthropic makes the AI model used in this production. The film uses only SEC filings
# (S-1/A, 424B4, pricing FWP; Amazon and Alphabet 10-Qs) and named press reports; no insider framing; the bear case and the
# "circular financing" criticism get full weight; no investment advice.
# Story over statistics: one protagonist, JUNE (a fictional nurse from Ohio who gets ONE SHARE at the $83 offer price) and the share
# itself (a golden ticket); 14 spoken figures, at most one per segment; every other figure on screen with a claim pill or in the
# description. Public figures (Dario and Daniela Amodei, Andy Jassy, Sundar Pichai) only as respectful caricatures with name tags,
# doing only what the narration documents. No logos (the ticker ANT is used instead). Day scenes, bespoke worlds
# (CartoonStage/antipo.tsx). USD only (all source figures are in USD).
renderer: remotion
