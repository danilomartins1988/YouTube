# Sources and claims for "Anthropic's $1.5 Trillion IPO: The AI Gold Rush or the Next Bubble?" (Episode 72).
# Read on 2026-11-20. Primary documents first: Anthropic's final prospectus (424B4, filed 2026-11-19), the pricing free writing
# prospectus (FWP, 2026-11-18/19) and the S-1 history on SEC EDGAR; Amazon's Q3 2026 10-Q; Alphabet's Q3 2026 10-Q (which does not
# name Anthropic). Market data (open, high, close, first-day valuations) from named press reports (CNBC, The National, Forbes,
# TechRepublic, Fast Company); exchange data were not reachable programmatically. NEUTRALITY: Anthropic makes the AI model used in this
# production; the film uses only these public documents and reports, no insider information. OUR CALCULATION is labelled;
# REPORTED marks press reports; HYPOTHETICAL marks the illustrative investor. Status stays source_located / data_derived until a named
# human reviewer signs off. All figures are in US dollars.
sources:
  - id: ant_424b4
    title: "Anthropic, PBC: Prospectus (Form 424B4), 980,000,000 shares of Class A common stock"
    publisher: Anthropic, PBC via SEC EDGAR (CIK 0002130357, File No. 333-299633)
    url: https://www.sec.gov/Archives/edgar/data/2130357/000162828026074944/anthropicpbc-424b4.htm
    published: "2026-11-19"
    accessed: "2026-11-20"
    kind: primary
    credit: "Anthropic, PBC, final prospectus (SEC Form 424B4)"
    notes: >-
      The Offering: 956,351,354 Class A shares offered by the company + 23,648,646 by selling stockholders (the seven co-founders,
      3,378,378 each); underwriters' option 147,000,000 (100% primary). Concurrent private placement: $26.0bn of Class N at the IPO
      price (Google 120,481,927 sh ≈ $10.0bn; NVIDIA 120,481,927 ≈ $10.0bn; AMD 30,120,481 ≈ $2.5bn; Broadcom, Micron, Microsoft
      12,048,192 each ≈ $1.0bn; TSMC 6,024,096 ≈ $0.5bn); not locked up but restricted securities. Outstanding after offering + placement:
      13,219,642,276 shares (7,583,103,996 Class A + 5,636,538,278 Class N + Class T and F single shares), incl. 846,840,960 Class N
      shares of the Initial Public Benefit Issuance (legally outstanding, not for accounting). Excluded: 1,774,342,693 options (wtd avg
      exercise $2.91), 1,026,660,010 unvested RSUs, 47,041,287 RSUs granted after Sep 30, 2026 plan reserves; Amazon Notes beyond the
      cap. Net proceeds to the company ≈ $104.8bn (IPO primary + placement). Lock-up: up to 180 days; co-founders and holders of >0.5%
      of fully diluted shares up to 365 days; up to 10% of lock-up shares of non-founder directors, officers, employees may be sold from
      the first trading day; ≈3.7bn shares may become eligible before 180 days. Voting: Class F (Founder LLC) = 50.1% of votes.
      Financials: revenue 2023 $41m, 2024 $386m, 2025 $4,585m; 9M 2025 $2,545m; 9M 2026 $33,242m (Q3 2026 $17.0bn). Compute and
      infrastructure expense 2025 $7,326m, 9M 2026 $18,808m. Operating loss 2025 $(8,060)m; 9M 2026 $(1,260)m; Q3 2026 $(567)m
      (incl. $5.0bn short-term compute and $2.0bn non-cash donation-matching charges). Net loss 2025 $(41,965)m; 9M 2026 $(104,039)m,
      incl. $(94,324)m change in fair value of convertible notes, derivative liabilities and SAFEs. Net cash from operating activities
      9M 2026 +$6,569m (9M 2025 −$2,024m); purchases of property and equipment $925m and prepayments for leased assets $1,955m.
      Cash and equivalents $95.6bn + short-term investments $36.3bn (Sep 30, 2026); total indebtedness $6.2bn (Amazon Notes).
      Run-Rate Revenue ≈ $81bn at Oct 31, 2026 (up $10bn from Sep 30). Consumption-based revenue 79% of 9M 2026 revenue,
      subscriptions 21%. Revenue through CSP marketplaces 47% (2025), 44% (9M 2026); recognised on a gross basis (company is principal).
      Commitments: purchase commitments and leases ≈ $900.9bn aggregate (≈$451.6bn before end-2030; rest 2031-2045; ≈$70.7bn due in the
      12 months after Sep 30, 2026). Microsoft ≥$47.2bn (Nov 2026-Jun 2033); Google ≥≈$121.3bn (Apr 2026-Jul 2033) plus est. $125-150bn
      TPU compute not in the table; Amazon ≥$110.0bn (May 2026-Apr 2036) "regardless of actual usage"; SpaceXAI up to $120.5bn into 2029;
      AMD >$20bn expected; Nscale up to ≈$44.6bn; Lambda ≈$41.3bn. Ownership after offering: Amazon 1,936,452,353 Class N (14.6% of
      outstanding capital stock; 23.6% if Amazon Notes fully converted without the cap); Google 1,774,959,745 Class N (13.4%).
      Series A preferred original issue price $2.57 (post 10-for-1 split of Sep 17, 2026; preferred converts at ≈10 common each).
      Risk factor: reliance on a limited number of CSPs and suppliers "some of which have strategic and investment relationships with us
      and are our customers, creates complex dynamics that could give rise to conflicts of interest". Founded January 2021; co-founders
      Dario Amodei (CEO; previously VP of Research at OpenAI) and Daniela Amodei (President, Chair) and five others; public benefit
      corporation; co-founders pledged 80% of personal equity to philanthropy; Public Benefit Issuances of up to 2% more shares each time
      the price rises 50% above the prior milestone.
