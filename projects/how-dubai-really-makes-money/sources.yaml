claims:
  # ---------------------------------------------------------------- the puzzle
  - id: non_oil_share
    text: The Government of Dubai states that over 95% of Dubai's GDP is non-oil based.
    spoken: more than 95 percent
    display: "95%+"
    value: 95
    source_ids: [dubai_ae_economy]
    status: source_located
    verification_note: Confirm the exact wording and page on dubai.ae. Do not upgrade to "under 1% oil" without a primary statistical table.
  - id: pop_dubai_2025
    text: Dubai's population was about 4.58 million at the end of 2025 (DDSE estimate, revised methodology).
    spoken: about 4.6 million
    display: "4.58m"
    value: 4.58
    fields: {year: 2025}
    source_ids: [wam_population_2025]
    status: source_located
    verification_note: DDSE changed method in 2026; the older population clock showed ~4.0m. Confirm the WAM article and wording.
  - id: dxb_pax_2025
    text: Dubai International Airport (DXB) handled 95.2 million passengers in 2025.
    spoken: 95.2 million
    display: "95.2m"
    value: 95.2
    fields: {year: 2025}
    source_ids: [dmo_dxb_2025]
    status: source_located
  - id: dxb_intl_rank_2025
    text: In ACI World's preliminary 2025 ranking, DXB was the world's busiest airport for international passengers.
    spoken: the busiest airport in the world for international passengers
    display: "#1"
    value: 1
    fields: {year: 2025}
    source_ids: [aci_2025]
    status: source_located
    verification_note: Preliminary ranking, to be confirmed by ACI in July 2026. Check final status.
  - id: uae_seven
    text: The United Arab Emirates is a federation of seven emirates, of which Dubai is one; Abu Dhabi is the federal capital.
    spoken: seven
    display: "7"
    value: 7
    source_ids: [uae_constitution]
    status: source_located
  - id: art23_resources
    text: Under Article 23 of the UAE Constitution, the natural resources and wealth in each emirate are the public property of that emirate.
    source_ids: [uae_constitution]
    status: source_located
  - id: reserves_split
    text: Abu Dhabi holds about 94% of the UAE's oil reserves and Dubai about 4% (US ITA citing the 2019 UAE State of Energy Report).
    spoken: about 94 percent
    display: "94%"
    value: 94
    fields: {dubai_spoken: about 4 percent, dubai_display: "~4%", dubai_value: 4}
    source_ids: [trade_gov_uae_energy]
    status: source_located
    verification_note: Secondary (US government) citing a 2019 UAE report. Look for a current UAE primary source.

  # ---------------------------------------------------------------- before oil
  - id: pearl_collapse
    text: The Gulf pearling industry declined after Japan developed cultured pearls from 1916 onward, compounded by the 1929 financial crash, from which it never fully recovered.
    spoken: cultured pearls
    fields: {cultured_year: 1916, crash_year: 1929}
    source_ids: [qdl_pearls]
    status: source_located
  - id: lingah_shift
    text: According to Lorimer's Gazetteer, Dubai grew rapidly after 1902, helped by the decline of Lingeh, and became the chief commercial emporium of the Trucial Coast.
    spoken: after 1902
    display: "1902"
    value: 1902
    source_ids: [qdl_lorimer]
    status: source_located
    verification_note: Phrase found in a QDL extract volume (IOR/R/15/1/729). Confirm in the Gazetteer's Dibai entry. Do not state the exact duty decree date (sources conflict 1894-1904).
  - id: creek_dredging
    text: Dubai Creek was dredged from 1959, financed largely by a loan from Kuwait together with local 'creek bonds'.
    spoken: In 1959
    display: "1959"
    value: 1959
    source_ids: [gulfnews_creek]
    status: source_located
    verification_note: Loan amount varies across sources (GBP 400k-600k); the script does not state it.

