# Sources and claims for "How Dubai Really Makes Money" (Episode 02).
#
# Status meanings (see hiddeneco/models.py):
#   data_derived       computed by the pipeline from a cited dataset (never typed by hand)
#   human_verified     a named person read the primary source and confirmed it (set verified_by)
#   source_located     a plausible source was located via web search; NOT yet read in full by a human
#   needs_verification no adequate source yet
#
# Every claim below is source_located: found by web research on 2026-11-03, several primary pages
# returned 403 to automated access. Publishing is blocked until each is human_verified.
#
# Editorial rules for this episode (see docs/episodes/02-dubai/plan.md):
#  * Dubai GDP: only the 2026-revised series (DDSE). Never mix with the pre-2026 series.
#  * Dubai-only and UAE-wide trade totals are counted differently: never shown side by side.
#  * Oil: "low single-digit share" / "over 95% non-oil" (government wording). No "under 1%".

