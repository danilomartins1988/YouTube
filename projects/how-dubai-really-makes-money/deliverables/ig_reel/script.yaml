# Instagram Reel (30-45 s). Own story: the rulebook as a product.
title: How Dubai Became a Global Business Hub
logline: From 19 companies to more than 11,000 - how Dubai sells rules, not resources.
segments:
  - id: hook
    chapter: ""
    narration: >-
      In {{jafza_firms.year_founded}}, this Dubai free zone had {{jafza_firms.start_spoken}} companies.
      Today it has {{jafza_firms}}.
    claims: [jafza_firms]
  - id: rules
    chapter: ""
    narration: >-
      The trick was rules. Free zones offered full foreign ownership, and {{onshore_ownership}}, so does most
      of the mainland.
    claims: [onshore_ownership, free_zones]
    source_note: '"Most of the mainland": most onshore activities, per the 2021 Commercial Companies Law amendment.'
  - id: courts
    chapter: ""
    narration: >-
      For finance, Dubai built a zone with its own common-law courts. The DIFC now has {{difc_2025}} active
      companies.
    claims: [difc_courts, difc_2025]
  - id: tax
    chapter: ""
    narration: >-
      It isn't tax-free any more. Most firms pay {{ct_rate}} corporate tax, but qualifying free-zone income can
      still pay {{qfzp}}.
    claims: [ct_rate, qfzp]
  - id: outro
    chapter: ""
    narration: >-
      Dubai turned its rulebook into a product.
    claims: []
    analysis: true
    source_note: Channel conclusion.
