# YouTube Short (30-45 s). Own story: Dubai is not an oil economy - here's what it is.
title: "Dubai Doesn't Make Its Money the Way You Think"
logline: Dubai's own government says more than 95% of its economy is not oil. So what is it?
segments:
  - id: hook
    chapter: ""
    narration: >-
      Dubai runs on oil, right? Its own government says {{non_oil_share}} of its economy is not oil at all.
    claims: [non_oil_share]
  - id: why
    chapter: ""
    narration: >-
      The oil is next door. Abu Dhabi holds {{reserves_split}} of the UAE's reserves. Dubai had to sell
      something else.
    claims: [reserves_split]
  - id: reveal
    chapter: ""
    narration: >-
      So what pays the bills? Trade is the biggest slice, {{sectors_h1_2026.trade_spoken}} of output. Then
      finance, real estate and transport.
    claims: [sectors_h1_2026]
  - id: proof
    chapter: ""
    narration: >-
      And people. {{dxb_pax_2025|cap}} passengers passed through its airport in {{dxb_pax_2025.year}}.
    claims: [dxb_pax_2025]
  - id: outro
    chapter: ""
    narration: >-
      Dubai doesn't sell oil. It sells a place to meet. More on The Hidden Economics.
    claims: []
    analysis: true
