# TikTok (65-90 s). Own story: the skyline as a business - builders, buyers, the 2009 bust, the IMF warning.
title: "The Real Business Behind Dubai's Skyscrapers"
logline: Who builds Dubai's towers, who pays for them, and what happened the last time the music stopped.
segments:
  - id: hook
    chapter: ""
    narration: >-
      In {{re_2025.year}}, {{re_2025}} worth of property deals were done in Dubai. That isn't just a
      skyline. It's a business.
    claims: [re_2025]
  - id: builders
    chapter: ""
    narration: >-
      Who builds it? Companies close to the state. Emaar, the city's best-known developer, now has a
      government-owned group, Dubai Holding, as its largest shareholder.
    claims: [emaar_owner]
    source_note: '"Best-known" is editorial framing; ownership is sourced.'
  - id: buyers
    chapter: ""
    narration: >-
      Who buys? Mostly cash buyers. The IMF says {{imf_prices.cash_spoken}} of home purchases in
      {{imf_prices.cash_year}} used no mortgage. And villa prices {{imf_prices}} {{imf_prices.period_spoken}}.
    claims: [imf_prices]
  - id: crash
    chapter: ""
    narration: >-
      It has happened before. When the global financial crisis hit, Dubai property prices fell by
      {{crash_2009}}. In {{standstill_2009.year}}, the state conglomerate Dubai World asked to pause
      {{standstill_2009}} of debt.
    claims: [crash_2009, standstill_2009]
  - id: bailout
    chapter: ""
    narration: >-
      Abu Dhabi provided {{bailout_2009}}. Weeks later, the world's tallest tower opened, and Burj Dubai became
      Burj Khalifa, named after Abu Dhabi's ruler.
    claims: [bailout_2009, burj_renamed]
  - id: warning
    chapter: ""
    narration: >-
      Today the IMF warns that if capital flows reverse, or investors change their minds, prices could face an
      unexpected correction.
    claims: [imf_correction_risk]
  - id: outro
    chapter: ""
    narration: >-
      The skyline is a business. And businesses have cycles.
    claims: []
    analysis: true
    source_note: Channel conclusion.
