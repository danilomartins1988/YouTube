metadata:
  titles:
    - How Dubai Really Makes Money
    - "Dubai Isn't Rich Because of Oil. Here's What Pays the Bills"
    - "Ports, Planes and Property: The Real Dubai Economy"
    - Why Dubai Doesn't Need Oil (And What Could Break It)
  description_intro: >-
    Dubai has almost no oil of its own - so how did a small trading town on a creek become a global hub?
    Pearls and open trade, oil as seed money, Jebel Ali and DP World, Emirates and the airport, tourism and
    property, free zones, the DIFC and the new corporate tax - and the costs: migrant labour, debt, property
    cycles and the 2026 shock. Every figure is sourced below.
  tags: [Dubai, Dubai economy, how Dubai makes money, UAE economy, Abu Dhabi, Jebel Ali, DP World, Emirates airline,
         Dubai real estate, DIFC, free zones, UAE corporate tax, economics documentary, The Hidden Economics]
  hashtags: ["#economics", "#dubai", "#documentary"]
