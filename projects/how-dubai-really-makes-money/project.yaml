title: How Dubai Really Makes Money
slug: how-dubai-really-makes-money
language: en
# Episode 02. Per-video visual identity: Gulf night palette (deep navy, sunset orange, Gulf turquoise),
# original code-drawn illustrations instead of photos. QC compares scene grammar against Episode 01.
# Made before the US-dollar rule (2026-11-05); keeps its local-currency figures.
currency_exempt: false   # 2026-11-08: all amounts converted to US dollars (user rule)
# 2026-11-08 cartoon redo: animated with the Remotion engine (CartoonStage worlds), like Episodes 03-12.
renderer: remotion
remotion_geo: [world]
style:
  name: gulf-nocturne
  palette:            # bright cartoon day with sunset orange + Gulf turquoise (2026-11-08 cartoon redo)
    bg: "#BFE8FA"
    bg2: "#EAF8FF"
    ink: "#10213A"
    muted: "#4F6B80"
    land: "#F2D29B"
    border: "#2E5A73"
    accent: "#F08A3C"      # sunset orange
    accent2: "#1E9C95"     # Gulf turquoise (darker for contrast on light)
    accent3: "#23995A"
    risk: "#E53935"
  fonts:
    display: InterDisplay-Bold
    heading: InterDisplay-SemiBold
    body: Inter-Regular
    body_bold: Inter-SemiBold
  motifs: [chapter-tags, film-grain]
# Editor-approved cap for paid narration on this episode (overrides config budget.max_paid_usd_per_topic).
budget:
  max_paid_usd: 0.60
youtube:
  category: Education
  default_language: en
  made_for_kids: false

# Published before the channel-intro and presenter standards (2026-11-05): kept exactly as released.
# For a future re-edit, set intro.enabled: true (and add presenter scenes or keep presenter_exempt).
intro: {enabled: false}
presenter_exempt: true
