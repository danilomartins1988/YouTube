# Sources and claims for "Alaska: The State That Pays You to Live There" (Episode 48, new topics N8).
# Every claim was read on its primary page/file on 2026-11-10 (notes: docs/episodes/48-alaska-dividend/RESEARCH_NOTES.md).
# Status stays source_located until a named human reviewer signs off. US dollars, nominal.
# RULES: 2022 = "largest ever in dollar terms" ($3,284 incl. $662 energy relief); 2026 totals not posted (appropriation
# estimates said as such); shares of the budget are our calculation; research findings labelled as research.
