claims:
  - id: amounts
    text: "PFD Division: first dividend 1982 $1,000.00 ($470,897,000 disbursed); 2015 $2,072 (highest dividend-only); 2016 $1,022; 2022 $3,284 incl. $662 energy relief, 'the highest PFD payment in program history'; 2024 $1,702 ($1,403.83 + $298.17 energy relief); 2025 $1,000; 2026 $1,200 incl. $200 energy relief. Sum of per-person amounts 1982-2025 $52,831.41; total disbursed $31,286,201,699.43."
    spoken: twelve hundred dollars
    display: "2026 PFD: $1,200 (incl. $200 energy relief)"
    fields: {first_spoken: one thousand dollars, rec_spoken: three thousand two hundred and eighty-four dollars, total_spoken: about thirty-one point three billion dollars, sum_spoken: about fifty-two thousand eight hundred dollars}
    source_ids: [pfd]
    status: source_located
    verification_note: Nominal dollars; 2022 'largest in dollar terms'.

  - id: who
    text: "Eligibility: resident 'during all of calendar year 2025', 'the intent to remain an Alaska resident indefinitely', at least 72 consecutive hours in Alaska during 2024 or 2025 (AS 43.23.005). 2025: 665,327 applied, 618,863 paid; population 738,737."
    spoken: six hundred and eighteen thousand
    display: "2025: 618,863 people paid (PFD Division)"
    fields: {}
    source_ids: [pfd]
    status: source_located
    verification_note: 2025 counts.

  - id: fund
    text: "HJR 39 (1976): 'At least twenty-five per cent of all mineral lease rentals, royalties...' into a permanent fund; AS 37.13.010: 50% for leases after Dec 1, 1979. APFC (Sep 2, 2026): total $91.9bn at June 30, 2026, principal $59.4bn; earnings reserve: $4.0bn committed to the FY27 draw, $10.6bn realized earnings, $3.5bn unrealized; ERA spendable by appropriation; FY26 return 12.42%; FY26 draw $3.8bn; royalty deposits $535M; no $1.5bn inflation-proofing transfer 'given the lack of appropriation'."
    spoken: ninety-one point nine billion dollars
    display: "Permanent Fund ≈ $91.9bn (June 30, 2026)"
    fields: {}
    source_ids: [law, apfc]
    status: source_located
    verification_note: Audited June 30, 2026 value.

  - id: draw
    text: "SB 26 (Ch. 16 SLA 18, signed Jun 13, 2018): AS 37.13.140(b) draw 'five percent of the average market value of the fund for the first five of the preceding six fiscal years'. Revenue forecast: FY2025 Permanent Fund $3,657.3M of $6,342.5M unrestricted general fund revenue (≈ 57.7%, our calculation); oil $1,910.5M (≈ 30.1%)."
    spoken: five percent
    display: "Fund ≈ 58% of state general revenue, oil ≈ 30% (FY2025, our calc.)"
    fields: {}
    source_ids: [law, rev]
    status: source_located
    verification_note: Shares our calculation.

  - id: cut
    text: "Wielechowski v. State (Aug 25, 2017): Gov. Walker cut the $1.362bn transfer to $695.65M, which 'resulted in 2016 Permanent Fund dividend payments of $1,022'; 'Absent another constitutional amendment, the Permanent Fund dividend program must compete for annual legislative funding just as other state programs.' Governor's FY27 budget: 'Full statutory Permanent Fund Dividend ($3,650 per Alaskan)'. HB 263: $1,000 dividend (≈ $674M est.), $200 energy relief (≈ $127M est., conditional on FY26 revenue > $6.3bn), ERA draw ≈ $4.0bn."
    spoken: three thousand six hundred and fifty dollars
    display: "Formula: $3,650 · Paid: $1,200 (2026)"
    fields: {}
    source_ids: [court, law]
    status: source_located
    verification_note: Appropriation estimates (said).

  - id: effects
    text: "Jones & Marinescu: 'no effect on employment, and increased part-time work by 1.8 percentage points (17%)'. Kueng (QJE 2018): about 25% spent on nondurables and services within a quarter. Watson, Guettabi & Reimer (REStat 2020): substance-abuse incidents +14% the day after payment, property crime -8%, no change in violent crime. Chung, Ha & Kim (2016): an extra $1,000 linked to 17.7 g higher birth weight."
    spoken: no effect on employment
    display: "Research: no drop in employment (Jones & Marinescu)"
    fields: {}
    source_ids: [research]
    status: source_located
    verification_note: Research findings (said).
