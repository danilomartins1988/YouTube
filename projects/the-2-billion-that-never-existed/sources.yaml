claims:
  - id: founded
    text: "Quartr: Wirecard was founded in 1999, based in the Munich suburb of Aschheim; it processed payments for high-risk online merchants such as adult content and online gambling; in 2005 it merged into InfoGenie Europe AG, listed in Frankfurt."
    spoken: In 1999
    display: "1999"
    value: 1999
    fields: {listing_spoken: In 2005}
    source_ids: [quartr]
    status: source_located
    verification_note: Read on 2026-11-07 (AI fact-check; needs a named human reviewer).

  - id: asia
    text: "Quartr: by early 2016 the stock was up roughly 800% since 2005 and about 40% of Wirecard's revenue came from Southeast Asia and the Middle East; in 2017 it posted revenue of over €1 billion for the first time (about US$1.13bn at the 2017 average of 1.1297)."
    spoken: 40 percent
    display: "40%"
    value: 40
    fields: {rev_spoken: more than 1.1 billion dollars, rev_display: "> $1.1bn"}
    source_ids: [quartr, bbk_rates]
    status: source_located
    verification_note: Read on 2026-11-07. Revenue conversion is ours at the official 2017 average.

  - id: dax
    text: "Reuters (Sept 2018): Commerzbank was expelled from the DAX to make room for Wirecard, effective Sept. 24; Wirecard's market value was double Commerzbank's (€10.6bn); Wirecard had a staff of less than 5,000, one tenth that of Commerzbank."
    spoken: September 2018
    display: "Sept 2018"
    fields: {staff_spoken: "fewer than 5,000", staff_display: "< 5,000"}
    source_ids: [reuters_dax]
    status: source_located
    verification_note: Read on 2026-11-07. Narration says "September twenty eighteen".

  - id: peak
    text: "Reuters (June 2020): Wirecard was worth US$28 billion at its peak; Quartr: its market capitalisation briefly topped €24 billion around its DAX entry (≈ US$28bn at the 2018 average of 1.1810)."
    spoken: 28 billion dollars
    display: "$28bn"
    value: 28
    source_ids: [reuters_insolvency, quartr, bbk_rates]
    status: source_located
    verification_note: Reuters gives US$28bn directly; the euro figure converts to the same.

  - id: ft_2015
    text: "Quartr: Financial Times journalist Dan McCrum wrote in 2015 an article raising questions about Wirecard's acquisitions and accounting; in January 2019 the FT (McCrum and Stefania Palma) reported suspicions raised by a whistleblower, the former head of legal for Wirecard Asia, in Singapore."
    spoken: In 2015
    display: "2015"
    value: 2015
    source_ids: [quartr]
    status: source_located
    verification_note: Read on 2026-11-07 (secondary account of the FT's reporting).

  - id: short_ban
    text: "Reuters (18 Feb 2019): BaFin banned the taking or increasing of short positions in Wirecard until April 18, a first for an individual stock; Munich prosecutors said they were investigating a Financial Times journalist in response to a criminal complaint; the FT rejected allegations as 'baseless and false'. Irish Times (2021): the regulator also filed complaints against two FT journalists."
    spoken: two months
    display: "Feb 2019"
    source_ids: [reuters_short, irish_2021]
    status: source_located
    verification_note: Read on 2026-11-07. "Two months" = 18 February to 18 April.

  - id: kpmg
    text: "Wirecard release (28 April 2020): KPMG's special investigation found that not all data could be obtained that would have been required to prove the revenues of the third-party acquiring business, because the data were primarily in the control of third parties; the company said incriminating evidence for the allegations of balance sheet forgery had not been identified."
    spoken: KPMG
    display: "KPMG, April 2020"
    source_ids: [wirecard_kpmg]
    status: source_located
    verification_note: The company's own release; the film describes it as such.

  - id: missing
    text: "Irish Times (18 June 2020): EY refused to sign Wirecard's annual accounts due to a missing €1.9 billion; shares plunged as much as 71 per cent; a trustee had sought to 'deceive the auditor'. Al Jazeera (22 June 2020): €1.9bn ($2.13bn), about a quarter of its assets; the board said there was a 'prevailing likelihood' that the trust account balances 'do not exist'; BPI and BDO said the documents were false and Wirecard was not a client; the Philippine central bank said the money did not appear to have entered the country; CEO Markus Braun quit on Friday 19 June."
    spoken: about 2.2 billion dollars
    display: "$2.2bn"
    value: 2.2
    fields: {eur_note: "€1.9bn", drop_spoken: 71 percent, drop_display: "-71%", assets_spoken: about a quarter}
    source_ids: [irish_2020, aljazeera_2020, bbk_rates]
    status: source_located
    verification_note: "€1.9bn × 1.1422 (2020 average) = US$2.17bn; Al Jazeera's own conversion was $2.13bn. The title rounds to $2 billion."

  - id: insolvency
    text: "Reuters (25 June 2020): Wirecard collapsed, becoming the first DAX company to go out of business, leaving creditors owed nearly US$4 billion."
    spoken: nearly 4 billion dollars
    display: "≈ $4bn"
    value: 4
    source_ids: [reuters_insolvency]
    status: source_located
    verification_note: Read on 2026-11-07. Narration gives the date as June twenty-fifth, twenty twenty.

  - id: marsalek
    text: "Reuters (Mar 2025): former COO Jan Marsalek, an Austrian national, is wanted by German authorities; his whereabouts are unknown but he is believed to be in Russia; three Bulgarians were convicted in London of spying for Russia in a unit run by Marsalek. CPS: between August 2020 and February 2023 the group gathered information about individuals and locations of interest to the Russian state; Orlin Roussev reported to Marsalek and was jailed for 10 years and eight months on 12 May 2025."
    spoken: believed to be in Russia
    display: "wanted"
    source_ids: [reuters_spies, cps_spies]
    status: source_located
    verification_note: Marsalek has not been tried; the film says "wanted" and "believed".

  - id: hufeld
    text: "Irish Times (29 Jan 2021): BaFin president Felix Hufeld departed; finance minister Olaf Scholz called it a mutual decision to allow a fresh start at an organisation that 'overlooked Germany's greatest postwar accounting fraud'; deputy Elisabeth Roegele (securities supervision) also left."
    spoken: January 2021
    display: "Jan 2021"
    source_ids: [irish_2021]
    status: source_located
    verification_note: Read on 2026-11-07.

  - id: ey_ban
    text: "Irish Times / FT (3 April 2023): EY was banned from taking on listed companies as new audit clients in Germany for two years; the firm and five current and former employees were fined up to €500,000 each; Wirecard had received unqualified audits from EY for more than a decade."
    spoken: two years
    display: "2-year ban"
    fields: {decade_spoken: more than a decade}
    source_ids: [irish_2023]
    status: source_located
    verification_note: Read on 2026-11-07. "According to people familiar with the matter" in the source; regulator APAS did not name EY.

  - id: trial
    text: "LTO (Aug 2025): the criminal trial of Markus Braun began on 8 December 2022 at the Munich Regional Court, on charges of commercial gang fraud, false accounting and breach of trust, with up to 15 years in prison if convicted. eNCA/AFP (Feb 2023): Braun said 'I reject all the charges' and blamed Marsalek. Bavarian judiciary (May 2026): further hearing dates were set up to 23 December 2026, with no conclusion about the end of the trial."
    spoken: December 2022
    display: "since Dec 2022"
    fields: {max_spoken: up to 15 years}
    source_ids: [lto_2025, enca_2023, bavaria_2026]
    status: source_located
    verification_note: No verdict was found in the sources read (the latest is from May 2026). The narration states the trial was still going on.
