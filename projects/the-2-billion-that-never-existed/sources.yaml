# Sources and claims for "The $2 Billion That Never Existed" (Episode 12: Wirecard).
# Every claim was read in its source on 2026-11-07 by an AI fact-check (quotes in docs/episodes/12-wirecard/FACT_CHECK.md).
# Status stays source_located: the channel rule requires a named human reviewer before publishing.
# LEGAL CARE: the criminal trial of former CEO Markus Braun is ongoing with no verdict (as of the sources read);
# he denies all charges. Jan Marsalek has not been tried; he is wanted. The film says "accused" / "denies" / "wanted".
# MONEY: Wirecard reported in euros. Converted at the ECB annual average for the year of the figure, as published by
# the Deutsche Bundesbank (2017: 1.1297, 2018: 1.1810, 2020: 1.1422), or the source's own US$ figure.
