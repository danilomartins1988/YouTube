# Sources and claims for "How Three Banks Nearly Destroyed an Entire Country" (Episode 22, top-10 #5: Iceland 2008).
# Every claim was read on its source page on 2026-11-09 (AI fact-check; quotes in docs/episodes/22-iceland/FACT_CHECK.md).
# Status stays source_located until a named human reviewer signs off.
# MONEY: all amounts in US dollars. Pounds converted at the Federal Reserve H.10 rate (FRED DEXUSUK) on the date named.
# The krona is not on H.10: its fall is shown with the OECD monthly ISK-per-USD series on FRED (CCUSMA02ISM618N) and the
# IMF's own wording. Bank sizes are said as the sources state them ("almost 900 percent of GDP", "over nine times GDP").
# Real people are named in text only; no bank logos, no flags.
