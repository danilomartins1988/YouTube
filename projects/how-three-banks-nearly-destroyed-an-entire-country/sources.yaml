claims:
  - id: size
    text: "IMF (19 Nov 2008): 'Banking sector accumulated assets amounting to almost 900 percent of GDP by end-2007'; IMF call summary (20 Nov 2008): 'almost 1,000 percent of GDP'. Cambridge: shortly before the collapse the consolidated financial assets of Glitnir, Kaupthing and Landsbanki were 'over nine times the size of Iceland's GDP'."
    spoken: almost nine times
    display: "≈ 9× GDP"
    source_ids: [imf_pr, imf_tr, cambridge]
    status: source_located
    verification_note: Different dates and measures; the film says 'almost nine times' (IMF end-2007) and attributes it.

  - id: growth
    text: "Cambridge: Iceland had depended on fishing and aluminium; the banks were privatised (completed 1999-2002, 'arbitrary and opaque procedures'); 'By 2003, Icelandic banking began to grow at an extraordinary fast rate, aided by low world interest rates and free capital mobility'; the owners of all three banks 'also became the major borrowers from the banks'."
    spoken: fishing and aluminium
    display: "fish + aluminium → banks"
    source_ids: [cambridge]
    status: source_located
    verification_note: Read on 2026-11-09.

  - id: icesave
    text: "Cambridge: Landsbanki set up the internet bank Icesave in the UK in October 2006; it 'paid the best interest rates available to UK savers… and the deposits flooded in'. Irish Times (Mar 2010): around 340,000 British and Dutch savers had Icesave accounts."
    spoken: Icesave
    display: "Icesave"
    fields: {savers_spoken: around three hundred and forty thousand}
    source_ids: [cambridge, irish_2010]
    status: source_located
    verification_note: Read on 2026-11-09.

  - id: collapse
    text: "IMF: the three main banks (Glitnir, Landsbanki and Kaupthing) 'collapsed within less than one week'; 'they accounted for about 85 percent of the banking system'; 'króna depreciated by more than 70 percent in the off-shore market'; 'equity market fell by 80 percent'. Cambridge: the banks collapsed on 8 and 9 October; the bankruptcy of the three banks is the third largest in the world, after Lehman Brothers and Washington Mutual."
    spoken: less than one week
    display: "< 1 week"
    fields: {share_spoken: about eighty-five percent, krona_spoken: more than seventy percent, stocks_spoken: eighty percent}
    source_ids: [imf_pr, cambridge]
    status: source_located
    verification_note: Read on 2026-11-09.

  - id: speech
    text: "Haarde, Address to the Nation (6 Oct 2008): 'There is a very real danger, fellow citizens, that the Icelandic economy, in the worst case, could be sucked with the banks into the whirlpool and the result could be national bankruptcy'; he would present a bill to parliament the same day; closing words: 'God bless Iceland.'"
    spoken: national bankruptcy
    display: "'national bankruptcy'"
    source_ids: [haarde]
    status: source_located
    verification_note: Quotes read on the government page.

  - id: freeze
    text: "The Landsbanki Freezing Order 2008 was made at 10.00 a.m. on 8 October 2008 by the UK Treasury under the Anti-terrorism, Crime and Security Act 2001, and came into force at 10.10 a.m."
    spoken: anti-terrorism
    display: "Anti-terrorism Act 2001"
    source_ids: [freeze]
    status: source_located
    verification_note: Read on the legislation page.

  - id: krona
    text: "OECD/FRED monthly average: about 60.7 krónur per US dollar in October 2007 and about 135.3 in November 2008, i.e. the krona lost more than half its dollar value onshore. Cambridge: inflation increased to over 18 per cent in 2009, largely because of the depreciation."
    spoken: more than half
    display: "60.7 → 135.3 ISK/$"
    fields: {inflation_spoken: over eighteen percent}
    source_ids: [fred_isk, cambridge]
    status: source_located
    verification_note: Monthly averages computed from the FRED file on 2026-11-09.

  - id: imf
    text: "IMF (19 Nov 2008): the Executive Board approved a two-year SDR 1.4 billion (about US$2.1 billion) Stand-By Arrangement for Iceland, expected to fill about 42 percent of the 2008-2010 financing gap, the rest from official bilateral creditors."
    spoken: two point one billion dollars
    display: "$2.1bn"
    source_ids: [imf_pr]
    status: source_located
    verification_note: Read on 2026-11-09.

  - id: votes
    text: "Irish Times (7 Mar 2010): 'just over 93 per cent of voters said No' to a €3.8 billion plan to repay Britain and the Netherlands; compensation of £2.3bn to Britain and £1.1bn to the Netherlands paid to around 340,000 savers. Fondation Robert Schuman (Apr 2011): the new Icesave law was rejected by 58.9% No to 39.7% Yes."
    spoken: just over ninety-three percent
    display: "93% No (2010)"
    fields: {second_spoken: almost fifty-nine percent}
    source_ids: [irish_2010, schuman_2011]
    status: source_located
    verification_note: Read on 2026-11-09.

  - id: efta
    text: "EFTA Court, Case E-16/11 (28 Jan 2013): 'On those grounds, THE COURT hereby: 1. Dismisses the application.' Iceland had not failed to comply with the deposit-guarantee directive."
    spoken: dismissed
    display: "EFTA Court, 28 Jan 2013"
    source_ids: [efta]
    status: source_located
    verification_note: Read in the judgment.

  - id: repaid
    text: "HM Treasury (15 Jan 2016): 'Taxpayers paid £4.5 billion to UK depositors in Icesave'; the government received the final payment of £740 million from the Landsbanki estate and 'has now received £4.6 billion from the Landsbanki estate and litigation cases'. At the H.10 rate of 8 Oct 2008 (1.7310 $/£), £4.5bn ≈ $7.8bn."
    spoken: about seven point eight billion dollars
    display: "≈ $7.8bn (£4.5bn)"
    source_ids: [ukgov_2016, fred_gbp]
    status: source_located
    verification_note: Pound converted at H.10 on 8 Oct 2008.

  - id: courts
    text: "CBC/AP (23 Apr 2012): former prime minister Geir Haarde was convicted of one criminal charge, cleared on four others and faces no punishment; the first government leader to face criminal prosecution over the global banking crisis. Fox/AP (12 Feb 2015): Iceland's Supreme Court gave former Kaupthing CEO Hreidar Mar Sigurdsson 5½ years and former chairman Sigurdur Einarsson 4 years for market manipulation linked to a Qatari investor's purchase of 5.1 percent of Kaupthing shortly before its collapse."
    spoken: five and a half years
    display: "5½ years"
    source_ids: [cbc_2012, fox_2015]
    status: source_located
    verification_note: Read on 2026-11-09.
