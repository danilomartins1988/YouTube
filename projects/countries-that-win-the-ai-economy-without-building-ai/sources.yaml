# Sources and claims for "The Countries That Could Win the AI Economy Without Building AI" (Episode 68; series
# docs/series/AI_WINNERS_LOSERS.md #6). Read on 2026-11-18 on the primary page or document, or (where the primary page blocked automated
# access, noted per source) via named coverage of it (notes: docs/episodes/68-picks-shovels/RESEARCH_NOTES.md). Status stays
# source_located until a named human reviewer signs off. US dollars only: TWD and KRW converted at the Federal Reserve G.5A 2025 annual
# averages (31.1663 TWD and 1,421.3963 KRW per USD; release of Jan 5, 2026), EUR at the ECB 2025 average 1.13 (same as Ep 08), shown as
# "≈". OUR CALCULATION is labelled wherever we derive a number. Forecasts are FORECAST, announced plans are PLAN.
# Cross-episode consistency: ASML price ($250m, Reuters Jan 2026) and 2025 sales as in Ep 08 FACT_CHECK; Taiwan 2025 exports
# (US$640.75bn, MOF) as in Ep 07 v2 FACT_CHECK; Ep 14 memory figures not repeated.
