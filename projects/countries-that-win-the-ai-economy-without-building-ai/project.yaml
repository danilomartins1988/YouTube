title: "The Countries That Could Win the AI Economy Without Building AI"
slug: countries-that-win-the-ai-economy-without-building-ai
language: en
# Episode 68 (series docs/series/AI_WINNERS_LOSERS.md #6). Owner: "Pode produzir direto sem precisar aprovar".
# Flip: picks-and-shovels for nations. In a gold rush the steadiest fortunes went to the people selling the shovels; in the AI rush
# some countries win without building chatbots: Taiwan (the foundry), the Netherlands (the lithography machine), South Korea (HBM
# memory), Japan (tools and chemicals), the Gulf (capital and cheap energy), Chile and Australia (copper, lithium). Twist: shovel
# sellers ride the rush down as well as up; the shovel that lasts is the one with no second shop.
# Overlaps (library, linked by title only, their figures not repeated beyond a one-line callback): Ep 07 Taiwan, Ep 08/15 ASML,
# Ep 14 memory, Ep 18 chip chemicals, Ep 63 Europe, Ep 66 Japan, Ep 67 power.
# Owner standing direction: prime-time TV-cartoon energy at GENRE level only; original cast (HATTIE, a gold-country hardware-store
# owner, and NUGGET, a talking AI chip with a passport; both fictional) and sets, human characters, day scenes. Bespoke kit:
# remotion/src/animation-engine/CartoonStage/shovels.tsx. No public figure drawn (Sam Brannan, a 19th-century merchant, is named
# in narration only); companies named in narration only, shown as generic buildings; no logos, no flags. USD only: TWD and KRW at the
# Fed G.5A 2025 averages (31.1663 TWD, 1,421.3963 KRW per USD; release of Jan 5, 2026), EUR at the ECB 2025 average 1.13 (as Ep 08).
renderer: remotion
remotion_geo: [world]
style:
  name: cartoon-day
  palette:
    bg: "#FBF6EC"
    bg2: "#FFFFFF"
    ink: "#1E2233"
    muted: "#6B6F85"
    land: "#B9D98F"
    border: "#2B3F6E"
    accent: "#E8A317"
    accent2: "#2F7DE1"
    accent3: "#2E9E6B"
    risk: "#E5483B"
  fonts:
    display: InterDisplay-Bold
    heading: InterDisplay-SemiBold
    body: Inter-Regular
    body_bold: Inter-SemiBold
  web_fonts:
    display: "Inter Display, Inter, sans-serif"
    body: "Inter, sans-serif"
  transition: scan
  background: grid
  motifs: [chapter-tags]
budget:
  max_paid_usd: 1.00
presenter_min: 3
intro:
  after_segment: co_hook
tts_overrides:
  openai:
    voice: ash
    tempo: 1.0
    instructions: >-
      Voice: the narrator of a premium American documentary about money and power, warm, playful and quietly confident, like a
      storyteller at a frontier general store, with real affection for the characters. Clear, fair and credible on facts; neutral and
      respectful toward every country. Pacing: brisk but unhurried; slow slightly to land every number; a short beat after a surprising
      figure and before each verdict. Natural American English, conversational, never an announcer, never salesy. Pronounce names
      simply: Hattie (HAT-ee), Nugget (NUG-it), Sam Brannan (BRAN-un), TSMC (T-S-M-C), ASML (A-S-M-L), SK hynix (S-K HIGH-nix),
      HBM (H-B-M), MGX (M-G-X), HUMAIN (hew-MAIN), Tokyo Electron (TOH-kyoh ee-LEK-tron).
