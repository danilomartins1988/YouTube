- Every number on screen carries a claim pill (FACT / FORECAST / PLAN / OUR CALC / COMPANY / FINDING / ANALYSIS / STORY / LIBRARY)
- No real person drawn; Hattie and Nugget are fictional; countries drawn as landscapes, never flags or stereotypes
- Day scenes, human characters, neutral tone; USD only (TWD, KRW, EUR at dated rates)
