title: "Why Taiwan Matters So Much to the Global Economy"
slug: why-taiwan-matters
language: en
# Episode 07. Mission-based storytelling (docs/PRODUCTION_STANDARD.md, "Mission model").
# Remotion engine, technology-economics scene library + presenter. Money in US dollars.
renderer: remotion
remotion_geo: [world]
style:
  name: island-ledger
  palette:            # navy/charcoal base, metallic gold = value/Taiwan, subtle blue = technology, red = risk
    bg: "#0B1324"
    bg2: "#141C2C"
    ink: "#F3F5F8"
    muted: "#8E99AC"
    land: "#1A2439"
    border: "#2C3A55"
    accent: "#D9B45A"     # metallic gold: Taiwan, value
    accent2: "#5EA8E6"    # subtle blue: technology, other countries
    accent3: "#9FD1C5"    # soft teal: customers, demand
    risk: "#FF5A5F"       # red: risk, disruption (hypothetical scenes only)
  fonts:
    display: InterDisplay-Bold
    heading: InterDisplay-SemiBold
    body: Inter-Regular
    body_bold: Inter-SemiBold
  web_fonts:
    display: "Inter Display, Inter, sans-serif"
    body: "Inter, sans-serif"
  transition: scan
  background: grid
  motifs: [chapter-tags]
# Editor instruction (Episode 07 brief): hard cap for ALL OpenAI voice work, retries included.
budget:
  max_paid_usd: 1.00
presenter_min: 4   # Episode 07 brief: at least four presenter sequences
