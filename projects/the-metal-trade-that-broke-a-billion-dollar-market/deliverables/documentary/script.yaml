- id: m4_claims
  chapter: The court
  narration: The American hedge fund Elliott said the cancellation had cost it {{court}} in profits. The trading firm Jane
    Street put its loss at {{court.js_spoken}}. They argued that the market had not been disorderly at all, that the price
    was simply the result of a squeeze on traders like Tsingshan, and that the exchange had acted unlawfully.
  claims:
  - court
  - blind
- id: m4_rulings
  chapter: The court
  narration: In November twenty twenty-three, the High Court in London disagreed, and dismissed the case. The traders had
    signed up to the exchange's rules, and those rules gave it the power to cancel trades. In October twenty twenty-four,
    the Court of Appeal upheld that decision. The cancellation, the courts found, had been lawful.
  claims:
  - court
- id: m4_draw
  chapter: The court
  narration: Let me draw the dilemma the exchange faced. Option one, let the trades stand. Then several members might default,
    and the damage could spread through the whole clearing system. Option two, cancel the trades. The system survives, but
    some traders lose money that they had fairly won. The arrow from each option leads to a loser. The exchange chose the
    loser it thought the market could survive.
  claims:
  - margin
  - cancel
  analysis: true
  source_note: Diagram of the trade-off described in the FCA notice and the judgment.
