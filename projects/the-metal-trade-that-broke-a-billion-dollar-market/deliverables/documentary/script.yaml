# Documentary (target 11-13 min). Five parts as an INTERNAL structure only (never narrated or shown as missions).
# Every number comes from sources.yaml via {{placeholders}} or is spelled out from a cited claim; years in words;
# legal wording as in the FCA notice and the court judgments (cancellation found lawful). Generic teaser.
logline: On the morning of March eighth, twenty twenty-two, the price of nickel on the London Metal Exchange doubled in a
  few hours and passed one hundred thousand dollars a tonne. The exchange stopped trading and erased thirteen billion dollars
  of deals. What happened that night, why the exchange tore up the trades, and who paid for it.
title: The Metal Trade That Broke a Billion-Dollar Market
segments:
- id: h_question
  chapter: The night nickel went crazy
  narration: What happens when the price of a metal doubles in a single morning, and the market where it trades decides that
    none of it happened?
  claims:
  - spike
  - cancel
  analysis: true
  source_note: Hook question built from the sourced spike and cancellation.
- id: h_stakes
  chapter: The night nickel went crazy
  narration: In March twenty twenty-two, it happened in London. The price of nickel, a metal used in stainless steel and batteries,
    shot past {{spike}} a tonne. The London Metal Exchange suspended trading. Then it cancelled every trade made that morning,
    worth {{cancel}}. Some traders lost fortunes they thought they had made. Others were saved from ruin.
  claims:
  - spike
  - cancel
- id: m1_card
  chapter: A market that never sleeps
  narration: ''
  claims: []
- id: m1_question
  chapter: A market that never sleeps
  narration: Who sets the price of the world's metals?
  claims: []
  analysis: true
