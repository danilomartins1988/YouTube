- id: m1_lme
  chapter: A market that never sleeps
  narration: For most of the metals in your phone, your car or your kitchen sink, a key price is set in London. The London
    Metal Exchange trades contracts to deliver copper, aluminium, nickel and other metals, usually three months ahead. Miners,
    factories and traders use those contracts to protect themselves against price swings. And the market runs almost around
    the clock, with {{blind}} trading hours handled overnight from Hong Kong.
  claims:
  - blind
- id: m1_draw
  chapter: A market that never sleeps
  narration: Let me draw how a short position works. A company that will sell nickel in the future agrees today to deliver
    it at a fixed price. That is a short. If the price falls, it wins. If the price rises, it loses, and the exchange asks
    it to put up more cash every day to cover the loss. That cash is called margin. And if the price rises fast enough, the
    margin calls can grow faster than anyone can pay.
  claims:
  - margin
  analysis: true
  source_note: Explanation of short positions and margin calls as described in the FCA notice.
- id: m1_short
  chapter: A market that never sleeps
  narration: In early twenty twenty-two, there was a very large short in nickel. According to the claimants in the later court
    case, it was built up by companies within Tsingshan, a Chinese industrial user of nickel. And much of it was held not
    on the exchange itself, but in private deals between banks and traders, called the over the counter market. The exchange
    could not see it.
  claims:
  - blind
- id: m1_transition
  chapter: A market that never sleeps
  narration: Then, at the end of February, Russia invaded Ukraine. And as one of the exchange's own board members would note,
    Russia is a large global producer of nickel.
  claims:
  - emails
- id: m2_card
  chapter: The squeeze
  narration: ''
  claims: []
- id: m2_question
  chapter: The squeeze
  narration: What happens when everyone who bet on a fall has to buy at once?
  claims: []
  analysis: true
  source_note: Part question.
- id: m2_friday
  chapter: The squeeze
  narration: The pressure built over a few days. On Friday, March fourth, the exchange's clearing house asked its members
    for a record {{margin.friday_spoken}} in extra margin. On Monday morning, it asked for another {{margin.monday_spoken}},
    a new record. By the end of Monday, nickel had jumped by sixty-six percent in a single day, to {{spike.close_spoken}}
    a tonne.
  claims:
  - margin
  - spike
- id: m2_monday
  chapter: The squeeze
  narration: Inside the exchange, people were alarmed. By two in the afternoon on Monday, the clearing house had called {{emails.intraday_spoken}}
    from its members that day, and one manager warned in an email that the calls were adding to the stress. A board member
    wrote that they did not understand why nickel was up sixty-six percent while aluminium was down three, when Russia produced
    both. Another described the metals markets to the British Treasury as in {{emails}}.
  claims:
  - emails
- id: m2_night
  chapter: The squeeze
  narration: Then came the night. Trading reopened in the early hours of Tuesday, London time, run from Hong Kong. The exchange
    had automatic limits, called price bands, to stop prices moving too fast. But at four forty-nine in the morning, they
    were switched off. For more than three hours, there was no automatic brake at all.
  claims:
  - spike
  - blind
- id: m2_peak
  chapter: The squeeze
  narration: Without the brake, the price ran. From sixty thousand to seventy thousand dollars in under an hour. Then, in
    just {{spike.minutes_spoken}}, from seventy thousand to {{spike}}. The price had doubled since the close of the day before.
    In London, a board member of the exchange woke up around half past five, checked the prices, and saw the numbers.
  claims:
  - spike
- id: m2_draw
  chapter: The squeeze
  narration: Let me draw the morning of March eighth. Here is the price on Friday. Here is Monday's close, sixty-six percent
    higher. And here is the early hours of Tuesday, climbing to more than one hundred thousand dollars. Now look at the bars
    underneath. The margin calls. Three and a half billion on Friday. Five billion on Monday. And on Tuesday morning, almost
    twenty billion.
  claims:
  - spike
  - margin
  analysis: true
  source_note: Chart of the FCA figures.
- id: m2_transition
  chapter: The squeeze
  narration: At seven thirty in the morning, the exchange's managers met. They had less than an hour to decide.
  claims: []
