- id: m3_calls
  chapter: Tearing up the trades
  narration: The numbers on the table were frightening. That morning's margin calls on nickel totalled {{margin}}. According
    to the regulator, calls on that scale were likely to push several members of the exchange into default. And when a member
    defaults, the losses can spread through the clearing house to everyone else.
  claims:
  - margin
- id: m3_suspend
  chapter: Tearing up the trades
  narration: At eight fifteen, the exchange suspended nickel trading. Later that day, it went further. It cancelled every
    nickel trade made since midnight, worth {{cancel}}. The market stayed shut for more than a week, and reopened on March
    sixteenth. Night trading from Asia did not return for a whole year.
  claims:
  - cancel
- id: m3_rewind
  chapter: Tearing up the trades
  narration: The exchange chose midnight as the cut-off, not the moment the brakes came off. Everything traded from the start
    of the day was wiped out, as if the morning had never happened. And the billions in margin that the morning's prices had
    created simply disappeared with it.
  claims:
  - cancel
  - spike
  analysis: true
  source_note: Cut-off from the FCA notice (trades on or after 00:00 UK time on 8 March); the rest is explanation of its effect.
- id: m3_winners
  chapter: Tearing up the trades
  narration: Think about what that meant. A trader who had sold nickel at one hundred thousand dollars that morning suddenly
    had no trade at all. And a company caught short, facing billions in losses, was suddenly spared the worst prices of the
    day. The cancellation saved the market from a chain of defaults. But it also took real profits away from people who had
    done nothing wrong.
  claims:
  - cancel
  analysis: true
  source_note: Analysis of the effects of the cancellation described in the FCA notice and the judgment.
- id: m3_transition
  chapter: Tearing up the trades
  narration: Some of those people went to court.
