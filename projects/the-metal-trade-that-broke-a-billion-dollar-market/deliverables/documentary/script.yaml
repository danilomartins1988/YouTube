- id: m5_fca
  chapter: The verdict
  narration: In March twenty twenty-five, Britain's Financial Conduct Authority fined the London Metal Exchange {{fine}}.
    It found that the exchange's policies, controls and training had not prepared it for extreme volatility.
  claims:
  - fine
- id: m5_philosophy
  chapter: The verdict
  narration: The regulator also described the culture behind the decisions. The prevailing philosophy at the exchange, it
    said, was that trading should not be restricted even in times of extreme volatility, unless the market became disorderly.
    Its price bands had been designed mainly to catch mistakes, a fat finger on a keyboard or a rogue computer program. Not
    a real squeeze, in the middle of the night, with billions at stake.
  claims:
  - emails
- id: m5_failures
  chapter: The verdict
  narration: The notice describes an exchange that could not see the risk building. Its overnight team in Hong Kong had switched
    off the price bands without consulting senior management, and had never been trained to escalate such a decision. And
    it could not see the private positions that, it later found, were a material cause of the price rise.
  claims:
  - blind
- id: payoff
  chapter: The lesson
  narration: So what does the nickel crisis teach about markets? That a price is only as real as the system behind it. When
    enough people bet one way, and the bets are hidden from view, a market can break in a few hours. The exchange saved itself
    by rewriting the morning. That kept the system standing. But it also showed that, in a real crisis, the rules of the market
    can change while the game is being played. And the people who paid for that were not always the ones who made
    the bet.
  claims:
  - cancel
  - blind
  analysis: true
  source_note: Conclusion drawn from the sourced parts.
