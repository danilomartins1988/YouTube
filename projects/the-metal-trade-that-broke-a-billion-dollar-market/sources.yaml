# Sources and claims for "The Metal Trade That Broke a Billion-Dollar Market" (Episode 25, top-10 #8: LME nickel, March 2022).
# Every claim was read on its source page on 2026-11-09 (AI fact-check; quotes in docs/episodes/25-nickel/FACT_CHECK.md).
# Status stays source_located until a named human reviewer signs off.
# MONEY: US dollars as published; the FCA fine in pounds converted at the Federal Reserve H.10 rate on 19 Mar 2025
# (1.2969 $/£). Legal wording follows the court and FCA documents: the cancellation was found lawful; Tsingshan's role is
# what the claimants argued and what the court summarised, not a finding of wrongdoing. No logos; names in text only.
sources:
  - id: fca
    title: "Final Notice: The London Metal Exchange (19 March 2025)"
    publisher: UK Financial Conduct Authority
    url: https://www.fca.org.uk/publication/final-notices/london-metal-exchange-2025.pdf
    published: "2025-03-19"
    accessed: "2026-11-09"
    credit: "FCA Final Notice"
  - id: highcourt
    title: "Elliott Associates L.P. and others and Jane Street Global Trading v The London Metal Exchange and LME Clear (Final Judgment)"
    publisher: High Court of England and Wales, Administrative Court (via Brick Court Chambers)
    url: https://www.brickcourt.co.uk/images/uploads/documents/CO-1995-2022_AC-2022-LON-000890_CO-2007-2022_AC-2022-LON-000901_Final_Judgment_29.11.23.pdf
    published: "2023-11-29"
    accessed: "2026-11-09"
    credit: "High Court judgment"
  - id: freshfields
    title: "The English Court of Appeal upholds dismissal of LME nickel crisis claims"
    publisher: Freshfields (Risk and Compliance blog)
    url: https://riskandcompliance.freshfields.com/post/102jm2t/the-english-court-of-appeal-upholds-dismissal-of-lme-nickel-crisis-claims
    published: "2024-10-18"
    accessed: "2026-11-09"
    credit: "Freshfields"
  - id: fred_gbp
    title: "U.S. Dollars to U.K. Pound Sterling Spot Exchange Rate (DEXUSUK, H.10)"
    publisher: Federal Reserve via FRED
    url: https://fred.stlouisfed.org/series/DEXUSUK
    published: "daily"
    accessed: "2026-11-09"
    credit: "Federal Reserve H.10"

claims:
  - id: spike
    text: "FCA: 'Between Friday 4 and Tuesday 8 March 2022, LME's 3M nickel contract more than trebled in price'; on 7 March the 3M nickel closing price was up 66% to $48,075; on 8 March, 'In the first 55 minutes of price band suspension, to 5.44am, the price rose from $60,000 to $70,000. Between 5.44am and 6.08am, it rose from $70,000 to $101,365, an increase of 44% in 24 minutes. The price had now doubled since market close on 7 March'; the price bands were suspended from 4.49am to 8.15am."
    spoken: one hundred and one thousand three hundred and sixty-five dollars
    display: "$101,365 / tonne"
    fields: {close_spoken: forty-eight thousand and seventy-five dollars, minutes_spoken: twenty-four minutes}
    source_ids: [fca]
    status: source_located
    verification_note: Read in the Final Notice.

  - id: margin
    text: "FCA: total margin calls on Friday 4 March were $3.5bn, a record; the Monday 7 March morning call set a new record of $5.1bn; by 2.00pm on 7 March LME Clear had called more than $7.4bn; on 8 March the morning's additional variation margin calls for 3M nickel 'totalled $19.7bn'; 'Had margin calls been made… based on the $80,000 figure, they would have totalled some $20bn and been likely to trigger multiple LME Member defaults'."
    spoken: nineteen point seven billion dollars
    display: "$19.7bn"
    fields: {friday_spoken: three point five billion dollars, monday_spoken: five point one billion dollars}
    source_ids: [fca]
    status: source_located
    verification_note: Read in the Final Notice.

  - id: cancel
    text: "FCA: the nickel market was suspended from 8.15am on 8 March to 8.00am on 16 March 2022; the LME cancelled all trades executed on or after 00:00 UK time on 8 March 2022; 'The notional value of the cancelled trades was $13.373bn'; nickel did not re-open in Asian trading hours until March 2023."
    spoken: about thirteen point four billion dollars
    display: "$13.4bn cancelled"
    source_ids: [fca]
    status: source_located
    verification_note: Read in the Final Notice.

  - id: blind
    text: "FCA: 'seven of LME's nineteen daily trading hours were managed overnight in Hong Kong'; 'The LME, at that stage, could not see certain positions in the OTC market that it later found were a material cause of the prices rises'; staff speculated the rise was short covering. High Court: the claimants argued 'the major factor was the short positions built up by entities within the Tsingshan Holding Group… a Chinese industrial user of nickel', acquired 'not on the LME but on the over-the-counter (OTC) market, making it less visible to the LME'."
    spoken: seven of its nineteen
    display: "7 of 19 hours overnight"
    source_ids: [fca, highcourt]
    status: source_located
    verification_note: Tsingshan's role is the claimants' argument as summarised by the court.

  - id: court
    text: "High Court (29 Nov 2023): the Elliott claimants said the cancellation cost them net profits of about US$456 million; Jane Street about US$15 million; the judicial review was dismissed. Freshfields (18 Oct 2024): the Court of Appeal dismissed the appeal and upheld that the cancellation was lawful."
    spoken: about four hundred and fifty-six million dollars
    display: "≈ $456M claimed"
    fields: {js_spoken: about fifteen million dollars}
    source_ids: [highcourt, freshfields]
    status: source_located
    verification_note: Claimed losses, said as claims.

  - id: fine
    text: "FCA Final Notice (19 Mar 2025): a financial penalty of £9,245,900 on the LME, after a 30% settlement discount; the LME's policies, controls and training 'had not sufficiently catered for the risks to market orderliness presented by extreme volatility'. At the H.10 rate of 19 Mar 2025 (1.2969 $/£), ≈ $12.0 million."
    spoken: about twelve million dollars
    display: "≈ $12M fine"
    source_ids: [fca, fred_gbp]
    status: source_located
    verification_note: Pound converted at H.10.

  - id: emails
    text: "FCA: at 5.10pm on 7 March, LME Board Member B, seeing nickel up 66% and aluminium down 3%, wrote: 'I don't understand why AH [aluminium] is down 3% and NI [nickel is] up 66%. Russia is a large global producer of both'; an LME Clear manager wrote at 1.25pm: 'our [intra-day] call process is going to add to the market stress. We have called $7bn already today'; LME Clear suspended intra-day calls by 2.00pm after calling more than $7.4bn; a board member described the metals markets to HM Treasury as in 'total disarray'; 'The prevailing philosophy at the LME was that trading and price discovery should not be restricted even in times of extreme volatility, unless the market became disorderly'; price bands were seen mainly as protection against 'a fat finger error or a rogue algorithm'."
    spoken: total disarray
    display: "'total disarray'"
    fields: {intraday_spoken: more than seven point four billion dollars}
    source_ids: [fca]
    status: source_located
    verification_note: Quotes read in the Final Notice.
