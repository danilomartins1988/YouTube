turning_points: []
thumbnail:
  tone: spectacle
  headline: []
  idea: a generic driverless pod on a glowing road; TESLA about 466x its yearly profit (our calc.)
requirements:
- No company logos; generic pods, factory, batteries and a boxy robot only (no real vehicle or robot designs); no likeness of real people
- Reverse calc. shown only to say it breaks; sales/steady-state framing; company plans attributed; pay milestones are pay terms, not forecasts
- Share-count method said (cover count vs diluted); Tesla reports only segment gross profit
- Edition stamp on screen (data as of the Nov 10, 2026 close); our calculations labelled; proxy base labelled as a proxy
- Never fair value, cheap/expensive, buy/sell; disclaimer after the hook
