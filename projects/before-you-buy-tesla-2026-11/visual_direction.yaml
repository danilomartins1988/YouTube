# Visual direction for before-you-buy-tesla-2026-11 (APPLIED by the pipeline; see hiddeneco/visual_direction.py).
# SERIES LOOK (owner, 2026-11-11): as animated as possible, retro-futurist sci-fi cartoon comedy inspired at GENRE level
# only (thick outlines, flat saturated colours, squash and stretch, deadpan sight gags, joke signs, chrome + neon, tubes,
# flying cars). Never copy any existing show's characters, designs, logos, fonts, catchphrases or music. Original only.
# Series kit (CartoonStage): `moneymachine` set, `pricedin`, `riskscale`, `editionstamp`, `scorecard` items.
# Tesla: own world (new `voltvalley` set: a car-factory roof, a highway of generic driverless pods, battery cabinets with
# charge bars, solar canopies, a generic boxy helper robot); no logos; no real people drawn (Musk named in text only).
