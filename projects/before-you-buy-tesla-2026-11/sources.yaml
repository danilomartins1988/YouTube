# Sources and claims for "Before You Buy Tesla Stock, Watch This (Nov 2026)" (series Before You Buy, Tesla, 2026-11 edition).
# Facts read 2026-11-11 (notes: docs/series/research/tesla_2026-11.md). DATA AS OF the 2026-11-10 close.
# QUARTERLY REFRESH: update text/spoken/display/fields from the new update deck, 10-Q/10-K and close; the script reads every
# number through {{placeholders}}. Status stays source_located until a named human reviewer signs off. US dollars.
# RULES: market cap on the 10-Q cover count (includes ~710M restricted/unearned CEO shares; the diluted figure is said too).
# The reverse calculation BREAKS at a 0.2% FCF yield: shown only to say so; the episode uses sales and scenario framing.
# Robotaxi, Optimus and energy plans are the COMPANY's words (attributed); no forecasts of ours. Tesla reports only segment
# gross profit. Pay-package market-cap milestones are compensation terms, not forecasts. Musk named in text only.
