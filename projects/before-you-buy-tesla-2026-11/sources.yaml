claims:
  - id: cap
    text: "Close Nov 10, 2026: $379.78 (Yahoo Finance). 10-Q cover: 'As of October 15, 2026, there were 3,952,757,946 shares of the registrant's common stock outstanding.' OUR calculation: market value about $1,501bn. The cover count includes about 423.7M unearned 2025 CEO award shares and about 286.5M restricted shares from the 2018 award; on Q3 diluted weighted shares (3,541M) the value is about $1,345bn."
    spoken: about one point five trillion dollars
    display: "≈ $1.50tn market value (close Nov 10, 2026 × 3.95bn cover shares; ≈ $1.35tn on diluted shares; our calc.)"
    fields: {price_spoken: three hundred and seventy-nine dollars and seventy-eight cents, shares_spoken: about three point nine five billion, date_spoken: "November tenth, twenty twenty-six", diluted_spoken: about one point three five trillion dollars}
    source_ids: [px, tenq]
    status: source_located
    verification_note: Our calculation; share-count method said on air.

  - id: lenses
    text: "Update deck (TTM, Q4 2025 to Q3 2026): revenue $103.6bn; income from operations $3.47bn (3.3% margin); net income attributable to common $3.22bn; operating cash flow $18.7bn; capex $15.4bn; free cash flow $3.3bn. OUR calculations: market cap / TTM net income 466x; price / TTM free cash flow 454x (FCF yield 0.22%); price / TTM sales 14.5x."
    spoken: about four hundred and sixty-six times
    display: "P/E ≈ 466x · FCF yield 0.2% · price/sales 14.5x (TTM; our calc.)"
    fields: {rev_spoken: about one hundred and four billion dollars, oi_spoken: about three and a half billion dollars, ni_spoken: about three point two billion dollars, ocf_spoken: about eighteen point seven billion dollars, capex_spoken: about fifteen point four billion dollars, fcf_spoken: about three point three billion dollars, fcfy_spoken: about zero point two percent, ps_spoken: fourteen and a half times, margin_spoken: about three percent}
    source_ids: [deck, px]
    status: source_located
    verification_note: Our calculation.

  - id: rdcf
    text: "OUR illustration (not a valuation), shown to make a point: market cap $1,501bn = 10 years of free cash flow growing at g plus a terminal value at 3%, discounted at r. On TTM FCF $3.30bn: g about 44.7% a year (8%) or 51.8% (10%), year-10 FCF about $133bn-$214bn. At a 0.2% FCF yield the result swings with tiny input changes, so the method breaks. Steady-state lens: for the price to work as a business growing 3% a year from now, free cash flow would need to be about $73bn (8%) to $102bn (10%) a year: 22 to 31 times today's $3.3bn, or about 70% to 98% of today's entire revenue."
    spoken: about forty-five percent a year
    display: "Reverse calc. breaks: ≈ 45-52% a year; steady-state FCF needed ≈ $73-102bn (our illustration)"
    fields: {high_spoken: about fifty-two percent, need_low_spoken: about seventy-three billion dollars, need_high_spoken: about one hundred and two billion dollars, mult_low_spoken: twenty-two, mult_high_spoken: thirty-one, revshare_low_spoken: seventy percent, revshare_high_spoken: ninety-eight percent}
    source_ids: [deck, px]
    status: source_located
    verification_note: Our illustration; 8% and 10% discount rates, 3% terminal growth, 10 years, on screen; not a forecast.

  - id: seg
    text: "10-K FY2025: total revenue $94.8bn; automotive sales $65.8bn (from $78.5bn in 2023); energy generation and storage $12.8bn (from $6.0bn in 2023), gross margin 29.8% (our calc.). Tesla reports only segment gross profit. Update deck TTM: automotive sales $72.3bn; services and other $16.3bn; energy $12.3bn with gross profit $3.6bn (29.7%); deliveries 1,742,908. Model 3/Y were about 98% of Q3 deliveries (our calc.). Deliveries: about 1.79M (2024), about 1.64M (2025)."
    spoken: about ninety-five billion dollars
    display: "FY2025 revenue $94.8bn: cars $65.8bn, energy $12.8bn (10-K)"
    fields: {auto_from_spoken: about seventy-eight and a half billion dollars, auto_spoken: about sixty-six billion dollars, energy_from_spoken: about six billion dollars, energy_spoken: about thirteen billion dollars, energy_margin_spoken: about thirty percent, deliv_spoken: about one point seven four million, my_spoken: about ninety-eight percent, deliv25_spoken: about one point six four million, deliv24_spoken: about one point seven nine million}
    source_ids: [tenq, deck]
    status: source_located

