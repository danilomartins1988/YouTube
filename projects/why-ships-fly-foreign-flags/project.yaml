title: "Why Almost Half the World's Ships Fly Three Small Flags"
slug: why-ships-fly-foreign-flags
language: en
# Episode 11 (flags of convenience). Cartoon-first: bright palette for every scene + engine_cartoon worlds. Five-part structure internal only.
# Money: all amounts in the sources are already in US dollars.
renderer: remotion
remotion_geo: [world]
style:
  name: cartoon-day
  palette:            # bright cartoon day: sky base, gold = money, blue = internet, green = growth, red = risk
    bg: "#BFE8FA"
    bg2: "#EAF8FF"
    ink: "#10213A"
    muted: "#4F6B80"
    land: "#8BD47A"
    border: "#2E5A73"
    accent: "#E89A00"
    accent2: "#1E7FD8"
    accent3: "#23995A"
    risk: "#E53935"
  fonts:
    display: InterDisplay-Bold
    heading: InterDisplay-SemiBold
    body: Inter-Regular
    body_bold: Inter-SemiBold
  web_fonts:
    display: "Inter Display, Inter, sans-serif"
    body: "Inter, sans-serif"
  transition: scan
  background: grid
  motifs: [chapter-tags]
budget:
  max_paid_usd: 1.00
presenter_min: 4
