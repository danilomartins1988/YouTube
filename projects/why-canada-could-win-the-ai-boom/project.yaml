title: "Why Canada Could Be the Biggest Winner of the AI Boom"
slug: why-canada-could-win-the-ai-boom
language: en
# Episode 70 (series docs/series/AI_WINNERS_LOSERS.md #8). Owner: "Pode produzir direto sem precisar aprovar".
# Flip: "Canada's economy is crashing" vs the assets the AI boom wants: hydro power, a cold climate that cuts cooling, critical minerals
# and AI research talent (Toronto, Montreal). Obstacles: tariffs and US dependence, startups and talent moving south, slow mines and
# permits, power that now has to be built (Quebec's proposed data-center rate, BC's competitive allocation).
# Overlap: Ep 67 "Could Cheap Electricity Become the New Oil?" (Quebec power): figures reused unchanged, linked by title only.
# Owner standing direction: prime-time TV-cartoon energy at GENRE level only; original cast (MAYA, a young Montreal AI researcher; WHIRR,
# a walking data center; LUC, her dad, a Sudbury miner; all fictional) and sets, human characters, day scenes. Bespoke kit:
# remotion/src/animation-engine/CartoonStage/canada.tsx. Real people (Hinton, Bengio) named in narration only, never drawn; no logos,
# no flags, no maple-leaf symbols. USD only (CAD at Fed G.5A 2025 average 1.3973, same as Ep 67).
renderer: remotion
style:
  name: cartoon-day
  palette:
    bg: "#F4F7F2"
    bg2: "#FFFFFF"
    ink: "#1A2238"
    muted: "#5E6B85"
    land: "#A6D08A"
    border: "#23407A"
    accent: "#F5B700"
    accent2: "#1E88E5"
    accent3: "#2E9E6B"
    risk: "#E5483B"
  fonts:
    display: InterDisplay-Bold
    heading: InterDisplay-SemiBold
    body: Inter-Regular
    body_bold: Inter-SemiBold
  web_fonts:
    display: "Inter Display, Inter, sans-serif"
    body: "Inter, sans-serif"
  transition: scan
  background: grid
  motifs: [chapter-tags]
budget:
  max_paid_usd: 1.00
presenter_min: 3
intro:
  after_segment: co_hook
tts_overrides:
  openai:
    voice: ash
    tempo: 1.0
    instructions: >-
      Voice: the narrator of a premium American documentary about money and power, warm, curious and quietly confident, with a
      light touch of wit and real affection for the characters. Clear, fair and strictly neutral. Pacing: brisk but
      unhurried; slow slightly to land every number; a short beat after a surprising figure and before each verdict. Natural
      American English, conversational, never an announcer, never salesy. Read the short character lines with a little playful
      character. Pronounce names simply: Maya (MY-ah), Whirr (WURR), Luc (LOOK), Sudbury (SUD-bury), Kamloops (KAM-loops), Mila (MEE-lah), Hydro-Québec (HY-dro kay-BEK), Yoshua Bengio (YOSH-oo-ah BEN-jee-oh).
