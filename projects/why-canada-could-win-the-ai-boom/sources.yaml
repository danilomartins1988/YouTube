# Sources and claims for "Why Canada Could Be the Biggest Winner of the AI Boom" (Episode 70; series docs/series/AI_WINNERS_LOSERS.md #8).
# Read on 2026-11-18 on the primary page or document; where the primary host blocked automated access (NRCan returned an outage page,
# some canada.ca pages reset the connection), the note says how the figure was confirmed (docs/episodes/70-canada-ai/RESEARCH_NOTES.md).
# Status stays source_located until a named human reviewer signs off. US dollars only: CAD converted at the Federal Reserve G.5A 2025 annual
# average, 1.3973 CAD per USD (release of Jan 5, 2026), the same rate Ep 67 uses; shown as "≈". OUR CALCULATION is labelled; forecasts
# are FORECAST, company plans PLAN, proposals PROPOSED, company statements CLAIM.
# Overlap rule: Ep 67 "Could Cheap Electricity Become the New Oil?" already tells Quebec's power story; this film reuses its two Quebec
# figures unchanged (hq_boston "less than a quarter", hq_cd "more than double", 5 MW authorization) and links it by title only.
sources:
  - id: cer_can
    title: "Provincial and Territorial Energy Profiles: Canada"
    publisher: Canada Energy Regulator
    url: https://www.cer-rec.gc.ca/en/data-analysis/energy-markets/provincial-territorial-energy-profiles/provincial-territorial-energy-profiles-canada.html
    published: "2025"
    accessed: "2026-11-18"
    kind: primary
    credit: "Canada Energy Regulator"
    notes: "'More than half of the electricity in Canada (60%) is generated from hydroelectricity.' 'In 2023, Canada was the third largest generator of hydroelectricity in the world.' Manitoba, Quebec, BC and Newfoundland and Labrador typically generate over 85% from hydro. 'Canada is the world's second largest producer of uranium, accounting for roughly 15% of global production in 2022'; about 85% of output exported."
  - id: hq_cmp25
    title: "Comparison of Electricity Prices in Major North American Cities, rates in effect April 1, 2025"
    publisher: Hydro-Québec
    url: https://pannes.hydroquebec.com/data/documents-donnees/pdf/comparaison-prix-2025-en.pdf
    published: "2025"
    accessed: "2026-11-18"
    kind: dataset
    credit: "Hydro-Québec (2025 comparison)"
    notes: "Large-power customer (50,000 kW, 30.6 GWh/month, 85% load factor), monthly bill excluding taxes, index Hydro-Québec = 100: Winnipeg 92, Vancouver 122, Houston 234, New York 414, San Francisco 432, Boston 445. Montréal average price 5.52 CAD cents/kWh at that level. Produced by an interested party (Hydro-Québec); methodology and exchange rate (C$1 = US$0.6970, Apr 1, 2025) stated in the PDF."
  - id: hq_rcd26
    title: "Demande du Distributeur relative à la fixation des tarifs CD et CB (R-4333-2026) and proposed text of Rate CD (HQD-2, Document 1.3)"
    publisher: Hydro-Québec, filed with the Régie de l'énergie du Québec
    url: https://www.regie-energie.qc.ca/fr/participants/dossiers/R-4333-2026/doc/R-4333-2026-B-0002-Dem-Dem-2026_02_19.pdf
    published: "2026-02-19"
    accessed: "2026-11-18"
    kind: primary
    credit: "Hydro-Québec filing R-4333-2026"
    notes: "Request cites 'la fin des surplus d'électricité' and the 'arrivée massive de clientèles énergivores'; proposes a new data-centre class and Rate CD for authorized demand of 5,000 kW or more. Proposed Rate CD text (filed 2026-06-29, R-4333-2026-B-0053): $32.704 per kW of billing demand plus 8.710 cents per kWh (plus 17.42 cents for over-ramp consumption). PROPOSED, not approved; Régie decision pending."
  - id: blg_qc26
    title: "Data centre regulation in Québec: from honeyed promise to iron control"
    publisher: Borden Ladner Gervais (BLG)
    url: https://www.blg.com/en/insights/2026/07/data-centre-regulation-in-quebec-from-honeyed-promise-to-iron-control
    published: "2026-07-08"
    accessed: "2026-11-18"
    kind: secondary
    credit: "BLG"
    notes: "Ministerial authorization required for loads of 5 MW or more (introduced 2023; applied to data-centre supply since 2025); proposed Rate CD averages about 13 cents/kWh, 'roughly double the current large-power rate'; requested effective date Nov 1, 2026; Régie hearing fall 2026."
  - id: bc_iaf
    title: "Industrial Electricity Allocation Framework"
    publisher: Government of British Columbia, Ministry of Energy and Climate Solutions
    url: https://www2.gov.bc.ca/gov/content/industry/electricity-alternative-energy/electricity/industrial-electricity-allocation-framework
    published: "2026"
    accessed: "2026-11-18"
    kind: primary
    credit: "Government of British Columbia"
    notes: "Under the Framework (enabled by Bill 31) BC Hydro must use a competitive selection process to assess AI, data centre and hydrogen-for-export projects of 10 MW or larger; 'the scale and timing of potential electricity service requests from these emerging industries will challenge BC Hydro's ability to supply all the requested loads'. Two-year call: 300 MW for AI, 100 MW for data centres (framework page)."
  - id: bc_news26
    title: "Province, BC Hydro launching competitive process for clean power in high-demand sectors"
    publisher: Government of British Columbia (news release 2026ECS0005-000095)
    url: https://news.gov.bc.ca/releases/2026ECS0005-000095
    published: "2026-01-29"
    accessed: "2026-11-18"
    kind: primary
    credit: "BC government news release"
    notes: "Competitive process for AI and data centres opens Jan. 30, 2026; successful applicants expected to be notified in September 2026; 'allocation targets include as much as 400 megawatts for AI and data centres' for the first two years. Outcome of the call not verified."
