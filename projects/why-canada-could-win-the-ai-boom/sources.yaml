    notes: "Copper-zinc mine in Saskatchewan referred to the MPO Sept 11, 2025; first copper concentrate June 2026; ramping up Sept 2026. The MPO 'coordinates across federal departments and supports timely regulatory processes'. Its two-year federal approval target (Building Canada Act, 2025) is reported by secondary sources (Northern Miner) and not spoken."
  - id: iea_crit21
    title: "The Role of Critical Minerals in Clean Energy Transitions: Reliable supply of minerals"
