# Sources and claims for "The Business Behind America's Student Debt" (Episode 33, US batch #06).
# Every claim was read on its primary page or data file on 2026-11-10 (notes: docs/episodes/33-student-debt/RESEARCH_NOTES.md).
# Status stays source_located until a named human reviewer signs off. US dollars as published.
# RULES: NY Fed 2026:Q2 is the latest quarter (Q3 not yet posted on the access date); College Board inflation-adjusted prices are in
# 2026 dollars; CPI ratios and the growth multiple are OUR calculation; GAO-16-523 servicer fees are the pre-2024 contract rates
# (said as such); CBO figures, Education Department press-release totals and the 2026 collections restart are NOT used (ed.gov /
# cbo.gov not readable). No logos of real companies; servicer names in text only.
