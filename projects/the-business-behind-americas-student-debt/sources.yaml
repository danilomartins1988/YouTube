claims:
  - id: total
    text: "NY Fed (2026:Q2): 'Outstanding student loan debt stood at $1.65 trillion in 2026Q2.' Workbook: $0.2407 trillion in 2003:Q1 (our multiple: ≈ 6.9×). FSA: federal portfolio $1,724.5bn, 42.3 million unduplicated recipients (FY2026 Q3). G.19: federal government holds $1,632.9bn of $1,884.6bn student loans (Q3 2026). Same NY Fed workbook: credit card balances $1.263 trillion (2026:Q2)."
    spoken: one point six five trillion dollars
    display: "$1.65tn student debt (Q2 2026)"
    fields: {y2003_spoken: about two hundred and forty billion dollars, people_spoken: about forty-two million}
    source_ids: [nyfed, fsa, g19]
    status: source_located
    verification_note: Growth multiple is our calculation.

  - id: delinq
    text: "NY Fed workbook: share of student loan balances 90+ days delinquent 0.53% (2024:Q4), 7.74% (2025:Q1), 10.6% (2026:Q2). Liberty Street (May 2025): 'more than 2.2 million student loan borrowers who became newly delinquent saw their credit scores drop more than 100 points'."
    spoken: ten point six percent
    display: "10.6% of balances 90+ days late"
    fields: {before_spoken: about half a percent, after_spoken: almost eight percent}
    source_ids: [nyfed, lse25]
    status: source_located
    verification_note: Read in the NY Fed report, workbook and blog.

  - id: tuition
    text: "College Board 2026: 'Between 1996-97 and 2026-27, the average published tuition and fees increased ... from $6,320 to $12,290 for public four-year in-state students, and from $27,530 to $46,350 for private nonprofit four-year students, after adjusting for inflation.' 'Over the decade between 2016-17 and 2026-27 ... declined by 8% for public four-year in-state students'. Net tuition public four-year 'peaked in 2012-13 at $4,600 (in 2026 dollars) and declined to an estimated $1,920 in 2026-27.' BLS CPI Sep 1996 → Sep 2026: college tuition 287.8 → 1003.724 (≈ +249%), all items 157.8 → 336.940 (≈ +114%), our calculation."
    spoken: twelve thousand two hundred and ninety dollars
    display: "Public 4-yr tuition $12,290 (2026-27)"
    fields: {y1996_spoken: six thousand three hundred and twenty dollars}
    source_ids: [cb, bls]
    status: source_located
    verification_note: Inflation-adjusted, 2026 dollars; CPI ratios our calculation.

  - id: grads
    text: "College Board 2026: 'Among 2024-25 bachelor's degree recipients from public and private nonprofit four-year institutions, 47% graduated with debt and the average debt among borrowers was $30,220.'"
    spoken: thirty thousand two hundred and twenty dollars
    display: "Avg debt $30,220; 47% borrowed"
    source_ids: [cb]
    status: source_located
    verification_note: Read in the College Board report.

  - id: govcost
    text: "GAO-22-105365 (Jul 2022): estimate for loans made 1997–2021 went from 'generating $114 billion in income for the government to costing $197 billion'; 'This swing of $311 billion'; 'The largest estimated cost increases—$102 billion in total—stemmed from emergency relief'."
    spoken: one hundred and fourteen billion dollars
    display: "+$114bn → −$197bn (GAO)"
    fields: {cost_spoken: one hundred and ninety-seven billion dollars}
    source_ids: [gao22]
    status: source_located
    verification_note: GAO product page.

  - id: servicers
    text: "GAO-26-107780, Table 1 (Sep 2025, non-defaulted loans): Nelnet $506.4bn / 12.4M borrowers; Aidvantage $383.5bn / 9.8M; MOHELA $323.6bn / 6.5M; EdFinancial $225.1bn / 6.8M; Central Research $52.0bn / 2.8M. GAO-16-523: servicers 'receive monthly payments from Education for each borrower they service'; $2.85 per borrower per month in repayment, $1.05 in school or forbearance, $0.45 more than 270 days delinquent (pre-2024 contracts). GAO-26-108534: new contracts let FSA 'withhold up to 5 percent payment per metric ... with an overall cap of a 20 percent penalty'; FSA staff 'dropped from 1,433 to 777' in 2025."
    spoken: two dollars and eighty-five cents
    display: "$2.85 per borrower per month (old contracts)"
    source_ids: [gao26, gao16, gao26b]
    status: source_located
    verification_note: Fee rates are from the pre-2024 contracts and said as such.

  - id: private
    text: "College Board 2026: 'Nonfederal education loans fell from $34.7 billion (in 2025 dollars) in 2007-08 to $11.4 billion in 2010-11, before increasing by 35% to about $15.4 billion in 2025-26.'"
    spoken: about fifteen point four billion dollars
    display: "Private loans ≈ $15.4bn a year"
    source_ids: [cb]
    status: source_located
    verification_note: Annual new nonfederal lending, not the outstanding stock.

  - id: defaults
    text: "Liberty Street (May 2026): 'roughly 1 million federal student loan borrowers defaulted during 2025:Q4, with an additional 2.6 million borrowers defaulting during 2026:Q1'; 'credit scores for defaulted borrowers dropped 91 points'; 'collection efforts for defaulted federal student loan borrowers are currently suspended with no clear timeline for resumption.' FSA: Direct Loans cumulative in default $82.6bn (FY2025 Q3) → $187.8bn (FY2026 Q3)."
    spoken: two point six million
    display: "Defaulted Direct Loans $82.6bn → $187.8bn"
    fields: {before_spoken: eighty-two point six billion dollars, after_spoken: one hundred and eighty-seven point eight billion dollars}
    source_ids: [lse26, fsa]
    status: source_located
    verification_note: Collections status is as of May 2026 and said so.

  - id: newrules
    text: "FSA GEN-25-04: 'On July 4, 2025, President Trump signed the One Big Beautiful Bill Act (P.L. 119-21)'; 'The RAP ... will be in effect no later than July 1, 2026.' Federal Update (Mar 2026): 'Grad PLUS is eliminated'; graduate '$20,500 annually; $100,000 aggregate'; professional '$50,000 annually; $200,000 aggregate'; Parent PLUS '$20,000 annually or $65,000 lifetime'. GAO-26-107780: 'about 8 million borrowers who were enrolled in SAVE were placed in an administrative forbearance'; 'On March 10, 2026, a federal court order ... vacated the SAVE plan.'"
    spoken: one hundred thousand dollars
    display: "Grad PLUS ended; caps from July 2026"
    source_ids: [obbb, gao26]
    status: source_located
    verification_note: Read in FSA documents and GAO.
