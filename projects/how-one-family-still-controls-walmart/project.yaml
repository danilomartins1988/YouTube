title: "How One Family Still Controls Walmart"
slug: how-one-family-still-controls-walmart
language: en
# Episode 55 (owner request, 2026-11-13). Visual direction: visual_direction.yaml.
# Five-part structure internal only. Money: all amounts in US dollars as reported in Walmart's SEC filings.
# Walmart's fiscal year ends January 31 (fiscal 2026 = Feb 1, 2025 - Jan 31, 2026): always say "fiscal year".
renderer: remotion
remotion_geo: [world]
style:
  name: cartoon-day
  palette:
    bg: "#FFF4DE"
    bg2: "#FFFBF2"
    ink: "#1B2433"
    muted: "#6B7385"
    land: "#9CCB7A"
    border: "#2E4A66"
    accent: "#F2A900"
    accent2: "#1E6FD9"
    accent3: "#2E9E5B"
    risk: "#D84343"
  fonts:
    display: InterDisplay-Bold
    heading: InterDisplay-SemiBold
    body: Inter-Regular
    body_bold: Inter-SemiBold
  web_fonts:
    display: "Inter Display, Inter, sans-serif"
    body: "Inter, sans-serif"
  transition: scan
  background: grid
  motifs: [chapter-tags]
budget:
  max_paid_usd: 1.00
presenter_min: 4
# Hook rules (docs/ANALYSIS_HOOKS_THUMBS_VISUALS.md): the channel intro plays after part 1, never inside the hook.
intro:
  after_segment: m1_transition
