    text: "OUR calculation: Walton Enterprises 3,002,673,393 shares (proxy, 13D/A) + Walton Family Holdings Trust 499,835,752 shares (Form 4, after June 24, 2026) = 3,502,509,145 shares × $126.19 (close Nov 12, 2026) ≈ $442.0bn. Walmart: 7,933,746,241 shares outstanding (10-Q, Aug 26, 2026) × $126.19 ≈ $1.00 trillion."
    spoken: about four hundred and forty billion dollars
    display: "≈ $442bn at $126.19 (Nov 12, 2026; OUR CALCULATION)"
