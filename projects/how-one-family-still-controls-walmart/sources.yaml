claims:
  - id: crown
    text: "Fortune (June 3, 2026): 'Amazon has dethroned Walmart as No. 1 on the Fortune 500, ending the retailer's 13-year reign atop the list.' Fortune Global 500 (July 28, 2026): Amazon No. 1, Walmart No. 2, 'ending Walmart's 12-year run'. Amazon 2025 net sales $716,924M (10-K); Walmart fiscal 2026 total revenues $713,163M (10-K). Gap ≈ $3.8bn (OUR calculation; different fiscal periods)."
    spoken: thirteen years
    display: "Fortune 500, 2026: Amazon No. 1, Walmart No. 2"
    fields: {gap_spoken: less than four billion dollars}
    source_ids: [fortune, amzn, tenk]
    status: source_located
    verification_note: Periods differ (Amazon calendar 2025; Walmart fiscal year ended Jan 31, 2026); say "about".

  - id: index
    text: "2025 EY and University of St.Gallen Global 500 Family Business Index, ranked by revenue: 1 Walmart (Walton family) $648.13bn; 2 Volkswagen (Porsche/Piëch) $356.71bn; 3 Schwarz Group $179.09bn; 4 Cargill $177.00bn. Inclusion: for listed companies, 'family voting control of at least 32%'. Walmart ≈ 1.8x Volkswagen (OUR calculation)."
    spoken: number one
    display: "No. 1 in the 2025 EY / St. Gallen family business index"
    fields: {wmt_spoken: six hundred and forty-eight billion dollars, vw_spoken: three hundred and fifty-seven billion dollars, threshold_spoken: thirty-two percent}
    source_ids: [ey]
    status: source_located
    verification_note: Index revenues are the latest available when compiled (Walmart's = fiscal 2024); say so on screen.

  - id: rev
    text: "10-K fiscal 2026 (year ended Jan 31, 2026): total revenues $713,163M; net sales $706,413M; operating income $29,825M = 4.2% of net sales; consolidated net income attributable to Walmart $21,893M; retail units 10,955; 'approximately 2.1 million associates'."
    spoken: seven hundred and thirteen billion dollars
    display: "Fiscal 2026 revenue $713.2bn (10-K)"
    fields: {units_spoken: ten thousand nine hundred and fifty-five, staff_spoken: two point one million, op_spoken: twenty-nine point eight billion dollars, margin_spoken: four point two cents, net_spoken: twenty-one point nine billion dollars}
    source_ids: [tenk]
    status: source_located

  - id: hist
    text: "Walmart: 'In 1950, the Waltons left Newport for Bentonville, where Sam opened Walton's 5&10 on the downtown square.' 'Sam opened the first Walmart in 1962 at the age of 44 in Rogers, Arkansas.' 1970: 'Walmart becomes a publicly traded company. The first stock is sold at $16.50 per share.' 'The company went public in 1970, and the proceeds financed a steady expansion of the business.' 1972 NYSE; 1983 first Sam's Club; Sam Walton died 1992; 1992 'Rob Walton becomes chairman'; 2015 'Greg Penner succeeds Rob Walton as chairman'. 10-K: business began in 1945 with a Ben Franklin variety store in Newport, Arkansas."
    spoken: sixteen dollars and fifty cents
    display: "1970: first shares sold at $16.50 (Walmart)"
    fields: {}
    source_ids: [hist, tenk]
    status: source_located

  - id: gift
    text: "Bloomberg (2013), citing Sam Walton's autobiography 'Made in America': he began arranging his affairs to avoid a potential estate tax bill in 1953, when the business was in its infancy and his oldest child was 9; he gave each child a 20% stake in the family business and kept 20% for himself and his wife; quote: 'The best way to reduce paying estate taxes is to give your assets away before they appreciate.' The Waltons have held their stake in a family partnership or similar structure since 1953."
    spoken: twenty percent
    display: "1953: each of four children 20%; Sam and Helen 20% (Bloomberg, citing his autobiography)"
    fields: {age_spoken: nine}
    source_ids: [bbg]
    status: source_located
    verification_note: Secondary source quoting the autobiography; attribute on screen ("as reported by Bloomberg").

  - id: rob
    text: "2024 proxy, Chairman Greg Penner's letter: 'Rob Walton, my father-in-law, who recently shared his decision not to seek re-election'; 'Sam would later remember that Rob did \"most of the work to take us public\" in 1970'; Board member since 1978; 'Chairman from 1992-2015, during which time Walmart grew from approximately $44 billion in sales to $482 billion'. Rob retired from the Board at the June 5, 2024 meeting."
    spoken: forty-four billion dollars
    display: "Rob Walton chairman 1992-2015: sales ≈ $44bn → $482bn (proxy 2024)"
    fields: {end_spoken: four hundred and eighty-two billion dollars}
    source_ids: [proxy24, hist]
    status: source_located

