# Sources and claims for "How One Family Still Controls Walmart" (Episode 55, owner request 2026-11-13).
# Every claim was read on its primary page on 2026-11-13 (notes: docs/episodes/55-walmart-walton/RESEARCH_NOTES.md).
# Status stays source_located until a named human reviewer signs off. US dollars as reported.
# RULES: Walmart's fiscal year ends January 31 (always say "fiscal year"); "largest family business" is said ONLY as the
# EY / University of St. Gallen 2025 index ranking (by revenue); the family's stake is the two family entities named in
# the proxy (Walton Enterprises, LLC and the Walton Family Holdings Trust), never "the Waltons own"; dividend income,
# stake value, vote share and share-sale totals are OUR calculations and are labelled so; Bloomberg 2013 reporting is
# attributed; private individuals are never drawn (Audrey Walton appears as a document only).
