# Visual direction for how-one-family-still-controls-walmart (APPLIED by the pipeline; see hiddeneco/visual_direction.py).
# Director's edit (Ep 55). One bespoke world per part, all DAY scenes unless the story turns serious:
#   hook: a ranking podium in a daylit hall of fame + the family vault glimpse;
#   part 1 (1950s Bentonville): `fivedime` set, a sunny small-town square with a variety store, awning, Model-era cars;
#   part 2 (going public): the 1970 trading floor (`exchange`) + the store that grows into a chain (`fivedime` grown);
#   part 3 (the family vault): `trustroom`, a wood-panelled family vault room with a ledger wall and a proxy lever;
#   part 4 (the money machine): `dccity`, a giant distribution-center city at midday, trucks, conveyors, a big box store;
#   part 5 (the next generation): the trustroom with fewer shares + boardroom (`office`) + court for the GRAT case.
# Caricatures (respectful, only named public figures): Sam Walton, Rob Walton, Greg Penner, Steuart Walton, John Furner.
# Private individuals (Audrey Walton, trust beneficiaries) are never drawn: documents or silhouettes only.
