# Visual direction for who-actually-owns-americas-debt (APPLIED by the pipeline; see hiddeneco/visual_direction.py).
# Director's edit (Ep 59). OWNER DIRECTION: as animated as possible, like a prime-time TV cartoon sitcom (genre level only:
# every character, design, name, title card, caption and sound is original). Craft: cold open in the IOU vault -> channel
# intro (the "theme") -> show title card with a typed joke subtitle -> five acts, each opened by a bumper with a rotating
# joke caption -> button joke after the end card. RUNNING GAG: OWEN, an original living IOU note who grows every act
# ($38T -> $39T -> $40T -> $40.6T -> "+ INTEREST") until, in the button, he no longer fits through the door.
# Recurring cast (original, generic humans): TED (a worried taxpayer: glasses, green sweater), RUTH (a retiree: grey bun,
# purple cardigan), the AUCTIONEER (generic Treasury auction clerk), dinner guests labelled only by place cards (no flags,
# no national stereotypes, every guest polite and dressed alike). No public figure is central: none is drawn.
# Bespoke sets (new file CartoonStage/debt.tsx, day scenes): iouvault (giant IOU vault with the debt odometer),
# auctionhouse (Treasury auction hall: podium, paddles, yield board), dinnerparty (global holders' dinner table, plates sized
# by holdings), mainstreet (holders' street: fund, bank, pension, insurer, city hall, a house), fedwarehouse (the Fed's
# balance-sheet warehouse: shelves of bond crates that thin out and refill), trustcabinet (Social Security trust fund filing
# cabinet room), metervsscale (interest meter vs a defense balance scale), plus debttitle (show title card) and debtbumper.
