  - id: bills
    text: "MSPD Oct 31, 2026: marketable debt held by the public $32,129.4bn, of which bills $7,381.3bn (23%, our calc.); notes $16,333.5bn; bonds $5,549.9bn; TIPS $2,156.8bn; FRNs $707.9bn."
    spoken: almost a quarter
    display: "Bills: $7.38T of $32.13T marketable (MSPD, Oct 31, 2026)"
    source_ids: [mspd]
    status: source_located
  - id: trust
    text: "CRS IF13256 (Jun 25, 2026), from the 2026 Trustees Report: combined OASI and DI trust fund reserves $2,721.5bn at start of 2025, $2,561.3bn at end of 2025 (change -$160.2bn; revenue $1,449.3bn, costs $1,609.5bn); 'In 2025, total costs exceeded total revenues'; OASI reserves projected depleted in Q4 2032; combined OASDI in Q3 2034, after which tax revenue covers about 83% of scheduled benefits. OUR CALCULATION: $2,561.3bn / intragovernmental holdings on Dec 31, 2025 ($7,667.3bn) = 33%."
    spoken: two point five six trillion dollars
    display: "OASDI trust funds: $2.56T at end of 2025 (Trustees via CRS)"
    fields: {drop_spoken: one hundred and sixty billion dollars, pay_spoken: eighty-three percent, share_spoken: about a third}
    source_ids: [crs_ss, dtp]
    status: source_located
  - id: mts
    text: "MTS Table 9, fiscal year 2026 (through Sep 30, 2026): net interest $1,051.8bn (FY2025 $970.4bn); national defense $965.2bn (FY2025 $916.6bn); Medicare $1,072.6bn; Social Security $1,667.1bn; total outlays $7,395.8bn; total receipts $5,403.3bn. OUR CALCULATIONS: net interest = 14.2% of outlays; ≈ $2.9bn per day; deficit ≈ $1.99T."
    spoken: one point zero five trillion dollars
    display: "FY2026 net interest: $1.05T vs national defense: $965bn (MTS)"
    fields: {def_spoken: nine hundred and sixty-five billion dollars, int25_spoken: nine hundred and seventy billion dollars, def25_spoken: nine hundred and seventeen billion dollars, day_spoken: two point nine billion dollars, share_spoken: about fourteen cents of every federal dollar spent}
    source_ids: [mts]
    status: source_located
    verification_note: "'National defense' is budget function 050 in the MTS (includes DoD military and some other defense activities). Net interest is net of interest received (budget function 900)."
  - id: rates
