    spoken: about a quarter
    display: "Rough split (our calc.): foreign ≈23% · Fed ≈11% · gov't funds ≈19% · other U.S. ≈47%"
    fields: {fed_spoken: about a ninth, intra_spoken: almost a fifth, us_spoken: close to half, dom_spoken: roughly three quarters}
