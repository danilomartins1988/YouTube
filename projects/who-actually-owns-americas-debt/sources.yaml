# Sources and claims for "Who Actually Owns America's $40 Trillion in Debt?" (Episode 59, owner request 2026-11-17).
# Every figure was read on its primary page or official dataset/API on 2026-11-17 (notes: docs/episodes/59-us-debt/RESEARCH_NOTES.md).
# Status stays source_located until a named human reviewer signs off. US dollars only.
# RULES: Debt to the Penny = daily Treasury total (date every figure); TIC country figures follow CUSTODY, not always the
# beneficial owner (Treasury's own caveat: say so); Z.1 holder figures are market values for marketable Treasuries held
# outside the federal government (end of Q2 2026); Fed H.4.1 = face value incl. inflation compensation, Wednesday level;
# MTS fiscal year 2026 = Oct 1, 2025 - Sep 30, 2026 ("fiscal"); CBO numbers are PROJECTIONS (February 2026 baseline, read
# via CRS because cbo.gov refused automated access); shares, per-day figures and the rough ownership split are OUR
# CALCULATIONS (labelled). No flags, no logos, no real people drawn.
