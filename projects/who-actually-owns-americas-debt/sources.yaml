claims:
  - id: dtp
    text: "Debt to the Penny, Nov 13, 2026: total public debt outstanding $40,616,678,827,092.07; debt held by the public $32,825,322,014,326.67; intragovernmental holdings $7,791,356,812,765.40."
    spoken: forty point six trillion dollars
    display: "$40.6 trillion total public debt (Nov 13, 2026)"
    value: 40.62
    fields: {date_spoken: November thirteenth, public_spoken: thirty-two point eight trillion dollars, intra_spoken: seven point eight trillion dollars}
    source_ids: [dtp]
    status: source_located
  - id: growth
    text: "Debt to the Penny: total was $38,150,716,416,656.92 on Nov 13, 2025 and $40,616,678,827,092.07 on Nov 13, 2026, an increase of about $2.47 trillion; OUR CALCULATION: about $6.8 billion per day on average. Milestones (first record at or above): $38T on Oct 21, 2025; $39T on Mar 17, 2026; $40T on Aug 18, 2026."
    spoken: two and a half trillion dollars
    display: "+$2.47T in 12 months (Nov 13, 2025 to Nov 13, 2026)"
    fields: {prev_spoken: thirty-eight point two trillion dollars, day_spoken: six point eight billion dollars, milestones_spoken: 'thirty-eight trillion in October twenty twenty-five, thirty-nine trillion in March, and forty trillion on August eighteenth'}
    source_ids: [dtp]
    status: source_located
    verification_note: "Rounded: 2.466T -> 'about two and a half trillion'; per day = 2.466T / 365 (our calculation)."
  - id: auctions
    text: "Treasury auction results dated Oct 1, 2025 - Sep 30, 2026: 436 auctions (328 bills, 82 notes, 26 bonds); total accepted about $32.9 trillion (OUR SUM; includes Federal Reserve rollover add-ons; mostly short-term bills that roll over)."
    spoken: four hundred and thirty-six auctions
    display: "FY2026: 436 auctions, ≈ $32.9T sold (our sum, incl. Fed rollovers)"
    fields: {total_spoken: nearly thirty-three trillion dollars}
    source_ids: [auct]
    status: source_located
  - id: tenyear
    text: "10-year note auction of Aug 12, 2026 (CUSIP 91282CRF0): offering $42.0bn; competitive tenders $106.2bn, accepted $41.8bn; bid-to-cover 2.53; high yield 4.683%; accepted: indirect bidders $32.1bn (76.7% of competitive accepted, our calc.), direct bidders $6.1bn (14.7%), primary dealers $3.6bn (8.6%)."
    spoken: forty-two billion dollars
    display: "10-yr note, Aug 12, 2026: $42bn offered · bid-to-cover 2.53"
    fields: {ind_spoken: about three quarters, dir_spoken: about fifteen percent}
    source_ids: [auct]
    status: source_located
    verification_note: "Indirect bidders bid through a dealer and include foreign central banks among others (not only foreigners); said so."
  - id: tic
    text: "TIC Table 5, August 2026 (billions): Japan 1,068.3; United Kingdom 1,009.5; China, Mainland 590.7; Belgium 490.5; Canada 464.6; Cayman Islands 463.0; Luxembourg 448.2; Grand total 9,331.7; of which foreign official 3,755.6. OUR CALCULATION: foreign total = 23.2% of total public debt on Aug 31, 2026 ($40,175.6bn). Treasury note: data are collected from custodians; securities held in overseas custody 'may not be attributed to the actual owners'."
    spoken: five hundred and ninety-one billion dollars
    display: "China: $590.7bn (TIC, Aug 2026)"
    fields: {total_spoken: nine point three trillion dollars, japan_spoken: one point zero seven trillion dollars, uk_spoken: one point zero one trillion dollars, share_spoken: twenty-three percent, official_spoken: three point eight trillion dollars}
    source_ids: [tic]
    status: source_located
  - id: china_peak
    text: "TIC historical: China, Mainland held $1,316.7bn in November 2013 (its highest month-end in the series); $590.7bn in August 2026 is less than half (our comparison)."
