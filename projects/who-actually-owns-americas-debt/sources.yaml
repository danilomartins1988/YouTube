    text: "OUR CALCULATION: China's TIC holdings in August 2026 ($590.7bn) / total public debt on Aug 31, 2026 ($40,175.6bn) = 1.47%; / debt held by the public ($32,415.0bn) = 1.8%."
    spoken: about one and a half percent
