# Sources and claims for "Before You Buy Microsoft Stock, Watch This (Nov 2026)" (series Before You Buy, Microsoft, 2026-11 edition).
# Facts read 2026-11-11 (notes: docs/series/research/microsoft_2026-11.md, incl. the depreciation addendum). DATA AS OF the 2026-11-10 close.
# QUARTERLY REFRESH: update text/spoken/display/fields below from the new 10-Q/10-K, transcript and close; the script reads
# every number through {{placeholders}}. Status stays source_located until a named human reviewer signs off. US dollars.
# RULES: segments are the NEW recast ones (Agents and Infra / Devices and Consumer); never compare with old "Intelligent
# Cloud" figures. Capex: say which figure (cash $39.4bn vs $45.2bn incl. finance leases). OpenAI share is QUARTERLY
# (about 11% last quarter), not an annual >10% customer. Guidance only verbatim from the CFO's call remarks, attributed.
# Ratios, the proxy base and the reverse calculation are OUR calculations (illustration, inputs on screen); never fair
# value, cheap/expensive, buy/sell. No analyst consensus (none verified).
