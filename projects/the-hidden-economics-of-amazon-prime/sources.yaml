# Sources and claims for "The Hidden Economics of Amazon Prime" (Episode 37, US batch #11).
# Every claim was read on its primary page/filing on 2026-11-10 (notes: docs/episodes/37-amazon-prime/RESEARCH_NOTES.md).
# Status stays source_located until a named human reviewer signs off. US dollars as published.
# RULES: "subscription services" includes Prime fees AND other subscriptions (said); shipping/fulfillment costs cover ALL customers,
# not only Prime (said); ratios are OUR calculation; FTC claims are allegations, Amazon did not admit wrongdoing (said); last
# official member count is "more than 200 million" (April 2021, said with its date); CIRP and Adobe estimates NOT used.
# No Amazon logos or real interface designs; names in text only.
