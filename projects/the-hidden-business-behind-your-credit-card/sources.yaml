# Sources and claims for "The Hidden Business Behind Your Credit Card" (Episode 30, US batch #02).
# Every claim was read on its source page on 2026-11-10 (AI fact-check; quotes in docs/episodes/30-credit-cards/RESEARCH_NOTES.md).
# Status stays source_located until a named human reviewer signs off. US dollars as published.
# RULES: the CFPB APR-margin figures from two datasets (14.3% blog, 16.4% 2024 report) are never chained as one series;
# swipe-fee total ($160bn, 2022) is a CRS-cited estimate covering credit AND debit, said as such; Visa's margin is our
# calculation; the "revolvers fund rewards" framing is the CFPB's and is said as the CFPB's, with the debate noted.
# NY Fed figures are Q2 2026 (Q3 due 10 Nov 2026). No logos or card designs of real brands; names in text only.
