claims:
  - id: interest
    text: "CFPB (Dec 2025): 'In 2024, consumers were assessed $160 billion in interest charges, up from $105 billion in 2022.'"
    spoken: one hundred and sixty billion dollars
    display: "$160bn interest (2024)"
    fields: {before_spoken: one hundred and five billion dollars}
    source_ids: [cfpb_2025]
    status: source_located
    verification_note: Read in the CFPB report.

  - id: balances
    text: "NY Fed (Q2 2026): 'Credit card balances rose by $21 billion and stood at $1.26 trillion.' Flow into serious delinquency 6.97%."
    spoken: one point two six trillion dollars
    display: "$1.26tn card balances"
    source_ids: [nyfed]
    status: source_located
    verification_note: Q2 2026, the latest at the time of writing.

  - id: apr
    text: "Fed G.19: average interest rate on commercial bank credit card plans, accounts assessed interest, 22.36% (Q3 2026, preliminary); annual averages 16.45% (2021) and 22.89% (2024); 'the annualized ratio of total finance charges ... to the total average daily balances against which the finance charges were assessed.'"
    spoken: twenty-two point three six percent
    display: "APR 22.36%"
    fields: {y2021_spoken: sixteen point four five percent}
    source_ids: [g19]
    status: source_located
    verification_note: Read on the G.19 release page.

  - id: margin
    text: "CFPB (Feb 2024): APR margin, 'the difference between the average APR and the prime rate', 'is now at 14.3 percent, the highest point in recent history'; 'The average APR margin increased 4.3 percentage points from 2013 to 2023'; 'Major credit card companies earned an estimated $25 billion in additional interest revenue by raising APR margin.'"
    spoken: twenty-five billion dollars
    display: "+$25bn from wider margins"
    source_ids: [cfpb_margin]
    status: source_located
    verification_note: Not chained with the 2024 report's 16.4% (different dataset).

  - id: revolve
    text: "Fed SHED 2025: 'Eighty-two percent of adults had a credit card in 2025'; 'In 2025, 45 percent of credit card owners said they carried a balance at least once during the prior 12 months, down 12 percentage points over the past decade.'"
    spoken: forty-five percent
    display: "45% carried a balance"
    fields: {own_spoken: eighty-two percent}
    source_ids: [shed]
    status: source_located
    verification_note: People who carried a balance at least once in a year (not accounts).

  - id: swipe
    text: "CRS (Oct 2024): 'recent data suggests that in 2022, \"swipe fees\" were around $160 billion, with credit card transactions comprising the majority of fees paid'; the merchant discount rate 'is typically around 1%-3% of the total amount of the transaction'; 'The interchange fee is paid to the consumer's bank and represents the largest share ... While the fee goes to the consumer's bank, its level is set by the card network'; network fee 'around 0.1%-0.2%'; 'if a consumer pays $100 for a product and the MDR is 3%, the merchant would receive $97'."
    spoken: around one hundred and sixty billion dollars
    display: "≈ $160bn swipe fees (2022, est.)"
    source_ids: [crs]
    status: source_located
    verification_note: CRS-cited estimate covering credit and debit; said as an estimate.

  - id: rewards
    text: "CFPB (Oct 2023): 'Issuers typically fund rewards through interchange revenue. For issuers in the Y-14+, the average interchange rate on general purpose cards was 1.8 percent, with rewards representing almost nine-tenths of interchange revenue.' CFPB (May 2024): 'Consumers earned more than $40 billion in rewards on major issuers' general purpose credit cards in 2022'; 'cardholders who revolve debt from one cycle to the next pay 94 percent of total interest and fees, but gain less than 30 percent of rewards benefits.' CFPB (Dec 2025): '92 percent of general purpose card spending was accounted for by rewards cards in 2023 and 2024.'"
    spoken: more than forty billion dollars
    display: "> $40bn rewards (2022)"
    fields: {rate_spoken: one point eight percent, pay_spoken: ninety-four percent}
    source_ids: [cfpb_2023, cfpb_rewards, cfpb_2025]
    status: source_located
    verification_note: The CFPB's framing; a Federal Reserve staff paper disputes it, and the film says there is a debate.

  - id: networks
    text: "Visa 10-K (FY to 30 Sep 2026): net revenue $45,903M, operating income $28,110M (≈ 61% margin, computed), net income $23,504M. Mastercard 10-K (FY2025): net revenue $32,791M, 'Operating margin 57.6 %', net income $14,968M. Visa cash-flow statement: 'Client incentives 18,317' ($ millions)."
    spoken: about forty-six billion dollars
    display: "Visa revenue $45.9bn"
    fields: {net_spoken: twenty-three point five billion dollars, ma_spoken: fifty-seven point six percent}
    source_ids: [visa, mastercard]
    status: source_located
    verification_note: Visa's margin is our calculation (28,110 / 45,903).

  - id: late
    text: "CFPB (Dec 2025): 'Issuers in the Y-14+ charged $17.0 billion in late fees in 2024, up 17 percent since 2022.' CFPB (Mar 2024): rule 'reducing the typical fee from $32 to $8'. CFPB compliance page: 'On April 15, 2025, the Credit Card Penalty Fees Final Rule was vacated pursuant to a court order' (Chamber of Commerce v. CFPB, N.D. Tex.)."
    spoken: seventeen billion dollars
    display: "$17.0bn late fees (2024)"
    source_ids: [cfpb_2025, cfpb_late, cfpb_vacated]
    status: source_located
    verification_note: Read on 2026-11-10.

  - id: distress
    text: "NY Fed Liberty Street (Aug 2026): 'the percentage of credit card balances 90+ days delinquent rose from 7.6 percent to 12.8 percent' (2022:Q3 to 2026:Q1); 'the more than 23 million Americans still carrying charged-off credit card balances on their credit reports'."
    spoken: more than twenty-three million
    display: "23M+ with charged-off balances"
    source_ids: [libst]
    status: source_located
    verification_note: Read on 2026-11-10.

  - id: amexrw
    text: "American Express 10-K (FY2025, worldwide, $ millions): 'Card Member rewards $ 18,409'; 'Discount revenue $ 37,401' (the merchant fees American Express collects)."
    spoken: eighteen point four billion dollars
    display: "Amex rewards $18.4bn vs merchant fees $37.4bn"
    fields: {disc_spoken: thirty-seven point four billion dollars}
    source_ids: [amex]
    status: source_located
    verification_note: Worldwide figures, said as such.
