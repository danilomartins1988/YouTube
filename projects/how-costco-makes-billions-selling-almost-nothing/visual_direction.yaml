requirements:
- No Costco logo, store design, typeface or trademarked art; names appear in plain text only; the card is a generic member card
- No character, design, name, catchphrase, location, title text or music borrowed from any existing show
- Jokes never change a number; our calculations, company statements and the reported hot-dog date labelled on screen
- Day scenes, many generic human characters; real people only as respectful caricatures (Vachris, Sinegal) with a name label
