# Sources and claims for "Before You Buy Apple Stock, Watch This (Nov 2026)" (series Before You Buy, Apple, 2026-11 edition).
# Facts read 2026-11-11 (notes: docs/series/research/apple_2026-11.md). DATA AS OF the 2026-11-10 close.
# QUARTERLY REFRESH: update text/spoken/display/fields below from the new 10-Q/10-K and the new close; the script reads
# every number through {{placeholders}}. Status stays source_located until a named human reviewer signs off. US dollars.
# RULES: December-quarter call guidance is NOT used (secondary source only); tariff refunds always mentioned with the
# FY2026 margin; Google licensing never given a dollar figure; the EU DMA 10% is a legal MAXIMUM; ratios and the reverse
# calculation are OUR calculations (illustration, inputs on screen); never fair value, cheap/expensive, buy/sell.
