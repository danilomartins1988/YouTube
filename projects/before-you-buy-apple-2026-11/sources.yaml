  - id: risks
    text: "10-K risk factors: Google licensing: a reversal on appeal 'could result in the imposition of certain remedies initially proposed by the DOJ, such as those prohibiting Google from offering the Company commercial terms for search distribution', which 'could materially adversely affect' that revenue (no amount disclosed). U.S. App Store: court-ordered injunction on link-out commissions; Supreme Court granted review on June 30, 2026. EU DMA: a 2025 fine under appeal; in the open investigation the Commission 'may impose fines up to 10% of the Company's annual worldwide net sales' (a legal maximum; ≈ $47.9bn on FY2026 sales, our calc.). DOJ antitrust suit filed March 2024. Tariffs: 'can have a material adverse impact'; refunds may not repeat. AI: 'Failure to successfully develop, deploy or differentiate artificial intelligence capabilities ... could result in loss of market share'."
    spoken: up to ten percent of worldwide sales
    display: "10-K risk factors (Apple)"
    fields: {dma_spoken: about forty-eight billion dollars}
    source_ids: [tenk]
    status: source_located
    verification_note: Google payments never quantified; DMA 10% is a ceiling, not an estimate.

