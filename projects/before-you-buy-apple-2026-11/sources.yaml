claims:
  - id: cap
    text: "Close Nov 10, 2026: $348.51 (Yahoo Finance). 10-K cover: '14,532,182,000 shares of common stock were issued and outstanding as of October 23, 2026.' OUR calculation: market value ≈ $5,064.6bn (≈ $5.06tn). Net cash ≈ $56.8bn (cash and marketable securities $136.9bn minus debt $80.1bn, our calc.), so enterprise value ≈ $5.01tn: net cash is about 1% of the price, so market cap is used."
    spoken: about five point oh six trillion dollars
    display: "≈ $5.06tn market value (close Nov 10, 2026 × 14.53bn shares; our calc.)"
    fields: {price_spoken: three hundred and forty-eight dollars and fifty-one cents, shares_spoken: about fourteen and a half billion, date_spoken: "November tenth, twenty twenty-six", netcash_spoken: about fifty-seven billion dollars}
    source_ids: [px, tenk]
    status: source_located
    verification_note: Our calculation; date on screen.

  - id: lenses
    text: "OUR calculations: trailing P/E 38.3x ($5,064.6bn / FY2026 net income $132.175bn); FCF $136.056bn = operating cash flow $145.097bn minus capex $9.041bn (10-K cash-flow statement), FCF yield 2.7%; operating cash flow yield 2.9%; capex is about 6% of operating cash flow (steady), so FCF is the gauge base."
    spoken: about thirty-eight times
    display: "P/E 38.3x · FCF yield 2.7% · OCF yield 2.9% (our calc., FY2026)"
    fields: {ni_spoken: one hundred and thirty-two billion dollars, fcf_spoken: one hundred and thirty-six billion dollars, fcfy_spoken: about two point seven percent, ocfy_spoken: about two point nine percent, ocf_spoken: one hundred and forty-five billion dollars, capex_spoken: about nine billion dollars, capexshare_spoken: about six percent}
    source_ids: [tenk, px]
    status: source_located
    verification_note: Our calculation.

  - id: rdcf
    text: "OUR illustration (not a valuation): market cap $5,064.6bn = sum of 10 years of FCF growing at g from FY2026 FCF $136.056bn, plus a terminal value at 3% growth, discounted at r. Solved: r = 8% gives g ≈ 10.5% a year (year-10 FCF ≈ $369bn); r = 10% gives g ≈ 15.5% (≈ $576bn). With zero growth the same model gives ≈ $2.21tn (8%) or ≈ $1.61tn (10%). Net cash ignored for simplicity."
    spoken: about ten and a half percent a year
    display: "Implied FCF growth ≈ 10.5%-15.5% a year for 10 years (our illustration)"
    fields: {high_spoken: about fifteen and a half percent, z8_spoken: about two point two trillion dollars, z10_spoken: about one point six trillion dollars, y10_spoken: about three hundred and seventy billion dollars}
    source_ids: [tenk, px]
    status: source_located
    verification_note: Our illustration; assumptions on screen (8% and 10% discount rates, 3% terminal growth, 10 years).

  - id: rev
    text: "10-K: net sales FY2024 $391,035M, FY2025 $416,161M, FY2026 $478,834M (+15%; FY2025 +6%). iPhone FY2026 $254,098M (+21%, 53.1% of sales, our calc.); Mac $37,929M; iPad $27,929M; Wearables, Home and Accessories $35,577M; Services $123,301M (+13%, 25.8%)."
    spoken: about four hundred and seventy-nine billion dollars
    display: "FY2026 net sales $478.8bn (+15%) (10-K)"
    fields: {growth_spoken: fifteen percent, prior_spoken: six percent, iphone_spoken: about two hundred and fifty-four billion dollars, iphone_share_spoken: fifty-three percent, iphone_growth_spoken: twenty-one percent, services_spoken: about one hundred and twenty-three billion dollars, services_share_spoken: about a quarter}
    source_ids: [tenk]
    status: source_located

  - id: services
    text: "10-K FY2026 gross margin: Products 39.3%, Services 76.2%, total 48.8%. Services gross profit $93,943M = 40.2% of total gross profit from 25.8% of revenue (our calc.). 10-K: Services growth 'primarily due to higher net sales from advertising and cloud services'. Services growth y/y by quarter (our calc. from 10-Qs): +14%, +16%, +12%, +9.8% (Q4 FY2026)."
    spoken: seventy-six percent
    display: "Services: 26% of sales, 40% of gross profit, 76% margin (10-K; our calc.)"
    fields: {gp_share_spoken: forty percent, products_spoken: thirty-nine percent, q4_spoken: nine point eight percent}
    source_ids: [tenk, q4]
    status: source_located

  - id: margin
    text: "Q4 release: 'Company gross margin was 47.9 percent, including a favorable impact of approximately 1 percentage point from tariff refunds.' 10-K: FY2026 products margin rose 'primarily due to product mix and tariff refunds, partially offset by higher costs, including memory'; 'gross margins will be subject to volatility and downward pressure'; supply constraints and rising costs for memory and storage, 'The Company expects these trends to intensify'."
    spoken: forty-seven point nine percent
    display: "Q4 gross margin 47.9%, incl. ≈ 1 pt from tariff refunds (Apple)"
    fields: {fy_spoken: forty-eight point eight percent}
    source_ids: [q4, tenk]
