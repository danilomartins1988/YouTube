# Sources and claims for "The Hidden Business Behind America's Grocery Prices" (Episode 40, US batch #20).
# Every claim was read on its primary page/file on 2026-11-10 (notes: docs/episodes/40-grocery/RESEARCH_NOTES.md).
# Status stays source_located until a named human reviewer signs off. US dollars as published (nominal).
# RULES: no assumption of abnormal profits; FTC (revenue over total costs, Census data) and FMI (net margin) are different
# measures, both attributed, neither "debunks" the other. Food dollar = all food spending (stores AND restaurants), 2024 data
# (2025 update due Nov 17, 2026). Latest CPI = September 2026 (October release due Nov 10, 2026). Cumulative food-at-home rise
# since Jan 2020 is OUR calculation from the BLS index. Kroger/Albertsons latest margins include one-time charges (said).
# Meatpacking 85% = share of steer and heifer purchases (said). Slotting range = 2003 FTC case studies (said). No store logos.
