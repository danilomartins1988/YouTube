claims:
  - id: farm
    text: "USDA ERS Food Dollar (2024): farm share 11.8 cents per food dollar; marketing share 88.2 cents. Industry group bill, cents per domestic food dollar (all channels): food services 38.6; food processing 16.1; food retail 13.8; food wholesale 6.3; finance and insurance 4.7; transportation and storage 4.1; energy 3.1; advertising 2.2. The food dollar covers food bought at stores and restaurants. 2023 farm share 12.1. 2025 data due Nov 17, 2026."
    spoken: eleven point eight cents
    display: "Farm share: 11.8¢ of each food dollar (2024)"
    fields: {retail_spoken: thirteen point eight cents, proc_spoken: sixteen point one cents, serv_spoken: thirty-eight point six cents, whole_spoken: six point three cents, trans_spoken: four point one cents, energy_spoken: three point one cents, ad_spoken: two point two cents}
    source_ids: [ersfd]
    status: source_located
    verification_note: All food spending, stores and restaurants (said).

  - id: cpi
    text: "BLS CPI September 2026 (Oct 14, 2026): 'The food at home index rose 1.8 percent over the 12 months ending in September.' BLS CPI-U food at home (CUUR0000SAF11): Jan 2020 243.110; Sep 2026 321.758 → about +32.4% (our calc). ERS Food Price Outlook (Oct 23, 2026): 'In 2026, food-at-home prices are forecast to increase 2.3 percent'; 'Food-at-home prices increased by an average of 2.6 percent per year between 2006 and 2025.' ERS: 'The largest change in this index's average annual value occurred in 2022, when the price of food rose by 9.9 percent.'"
    spoken: about thirty-two percent
    display: "Food at home ≈ +32% since Jan 2020 (our calc, BLS)"
    fields: {latest_spoken: one point eight percent, fcst_spoken: two point three percent, avg_spoken: two point six percent}
    source_ids: [blscpi, ersfpo]
    status: source_located
    verification_note: Cumulative figure our calculation; latest month September 2026 (said).

  - id: eggs
    text: "BLS average price, Grade A large eggs per dozen (APU0000708111): Jan 2020 $1.461; Mar 2025 $6.227; Sep 2026 $2.272. ERS: 'Retail egg prices increased 32.2 percent in 2022, 1.4 percent in 2023, 8.5 percent in 2024, and 21.9 percent in 2025'; 'An ongoing outbreak of Highly Pathogenic Avian Influenza (HPAI) that began in 2022'. BLS ground beef 100% beef per lb (APU0000703112): Jan 2020 $3.89; Aug 2026 $6.92. ERS: 'Beef and veal prices are forecast to increase 8.7 percent in 2026.'"
    spoken: six dollars and twenty-three cents
    display: "Eggs: $1.46 (Jan 2020) → $6.23 (Mar 2025) → $2.27 (Sep 2026)"
    fields: {egg20_spoken: about a dollar forty-six, egg26_spoken: about two dollars and twenty-seven cents, beef20_spoken: three dollars and eighty-nine cents, beef26_spoken: six dollars and ninety-two cents}
    source_ids: [blscpi, ersfpo]
    status: source_located
    verification_note: Nominal prices; not called a record.

  - id: margins
    text: "Kroger 10-K (FY ended Jan 31, 2026): net earnings attributable $1,016M (2025) and $2,665M (2024) on sales of $147,642M and $147,123M → ≈ 0.7% and ≈ 1.8% (our calc); 2025 includes a $2.5bn impairment of its fulfillment network. Albertsons 10-K FY2025: net income 0.3% of sales vs 1.2% in fiscal 2024 (stated); FY2025 includes a $599.8M after-tax opioid settlement charge. Walmart U.S. FY2026: grocery net sales $285.5bn of $483.0bn segment sales; segment operating margin 5.2% (no grocery-only margin reported). FMI: 'The average net profit for food retailers in 2025 is 2.1%.'"
    spoken: about one point eight cents
    display: "Kroger ≈ 1.8¢ net profit per $1 of sales (FY2024, our calc)"
    fields: {aci_spoken: one point two percent, fmi_spoken: two point one percent, wmt_spoken: two hundred and eighty-five billion dollars}
    source_ids: [kroger, aci, wmt, fmi]
    status: source_located
    verification_note: Prior-year margins used because the latest include one-time charges (said).

  - id: ftc
    text: "FTC staff report (March 2024): 'food and beverage retailer revenues increased to more than 6 percent over total costs in 2021, higher than their most recent peak, in 2015, of 5.6 percent. In the first three-quarters of 2023, retailer profits rose even more, with revenue reaching 7 percent over total costs.' The report 'did not test whether the specific companies that received 6(b) Orders increased their prices by more or less than their input cost increases.' FMI (June 27, 2024): 'Food retailer profit margins fell from 2.3% in 2022 to pre- COVID- 19 pandemic levels of 1.6% in 2023'."
    spoken: more than six percent
    display: "FTC: retailer revenue >6% over costs (2021), 7% (2023)"
    fields: {y23_spoken: seven percent, fmi23_spoken: one point six percent}
    source_ids: [ftc24, fmi]
    status: source_located
    verification_note: Different measures (said); both attributed.

  - id: shrink
    text: "BLS: CPI uses 'An effective price per standard size, usually a price per ounce'; example: a 64-ounce carton reduced to 60 ounces at the same price is recorded as a 6.7 percent price increase."
    spoken: six point seven percent
    display: "Shrinkflation: 64 oz → 60 oz = +6.7% in the CPI (BLS)"
    source_ids: [blsshrink]
    status: source_located
    verification_note: BLS example.

  - id: meat
    text: "USDA ERS Amber Waves (Jan 25, 2024): the four largest meatpackers handle '85 percent of all steer and heifer purchases'; in 1980 'the four largest beef packers accounted for 36 percent of all purchases of steers and heifers'; 81 percent by 1995."
    spoken: eighty-five percent
    display: "Top 4 beef packers: 85% of steer & heifer purchases (ERS)"
    fields: {y80_spoken: thirty-six percent}
    source_ids: [ersmeat]
    status: source_located
    verification_note: Share of steer and heifer purchases, not of all beef sold (said).

  - id: merger
    text: "FTC (Feb 26, 2024): challenged 'Kroger Company's $24.6 billion acquisition of the Albertsons Companies, Inc.'; combined firm 'more than 5,000 stores'. Kroger 10-K: 'On December 10, 2024 ... the court issued a preliminary injunction' (D. Or., 3:24-cv-00347-AN); a Washington state court issued a permanent injunction the same day. Albertsons terminated the merger agreement on December 10, 2024 and sued Kroger; Kroger sent its own termination notice December 11, 2024; litigation ongoing as of the 10-Ks."
    spoken: twenty-four point six billion dollars
    display: "Kroger–Albertsons $24.6bn merger blocked (Dec 2024)"
    source_ids: [ftcmerge, kroger, aci]
    status: source_located
    verification_note: Read in FTC releases and both 10-Ks.

  - id: slot
    text: "FTC (2003): 'the average amount of slotting allowances (per item, per retailer, per metropolitan area) for all five categories combined ranged from $2,313 to $21,768, depending on the particular retailer and metropolitan area.' Small, non-representative case studies. PLMA (Jan 20, 2026, Circana data): store brands $282.8bn in 2025; dollar share 21.3% (19.1% in 2021)."
    spoken: twenty-one thousand seven hundred and sixty-eight dollars
    display: "Slotting fees: $2,313–$21,768 per item (FTC, 2003)"
    fields: {low_spoken: two thousand three hundred and thirteen dollars, pl_spoken: twenty-one point three percent}
    source_ids: [ftcslot, plma]
    status: source_located
    verification_note: 2003 case studies (said); PLMA is a trade group (attributed).
