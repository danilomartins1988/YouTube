# Sources and claims for "Before You Buy Meta Stock, Watch This (Nov 2026)" (series Before You Buy, Meta, 2026-11 edition).
# Facts read 2026-11-11 (notes: docs/series/research/meta_2026-11.md, incl. the depreciation addendum). DATA AS OF the 2026-11-10 close.
# QUARTERLY REFRESH: update text/spoken/display/fields below from the new 10-Q/10-K and the new close; the script reads
# every number through {{placeholders}}. Status stays source_located until a named human reviewer signs off. US dollars.
# RULES: the New Mexico accrual amount is NOT disclosed (never say reserved or unreserved); Q3 free cash flow was negative;
# the ≈ $56bn of new capital is OUR sum (forward-sale proceeds not yet received); "free cash flow as Meta defines it";
# TTM net income distorted by one-offs (tax benefit, legal charges); plaintiffs' trillion-dollar figure is a claim, not
# used. Class C dividend (charter effective Jan 19, 2027): the next edition's share count roughly doubles.
# Ratios, the proxy base and the reverse calculation are OUR calculations; never fair value, cheap/expensive, buy/sell.
