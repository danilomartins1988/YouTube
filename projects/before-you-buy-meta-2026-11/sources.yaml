  - id: watch
    text: "Scorecard for the next report (Q4 2026, date not announced; last year Jan 28, 2026, so late January 2027 is our estimate): Q4 revenue vs the $73-76bn guide (Q4 2025: $59.9bn); Q4 capex (implied ≈ $49-59bn) and the first 2027 capex outlook, which decide whether free cash flow recovers from −$2.12bn in Q3; legal accruals ($19.9bn) and the Family of Apps margin. The Class C share dividend takes effect Jan 19, 2027, just before that report."
