requirements:
- No company logos or app UI; generic feed cards, hearts and phones only; no likeness of real people (Zuckerberg named only)
- NM accrual never described; forward-sale proceeds said as not yet received; Class C note for the next edition
- Edition stamp on screen (data as of the Nov 10, 2026 close); our calculations labelled; proxy base labelled as a proxy
- Never fair value, cheap/expensive, buy/sell; disclaimer after the hook
