tts_overrides:
  openai:
    voice: ash
    tempo: 1.0
    instructions: >-
      Voice: the narrator of a premium American documentary about money and power, warm, curious and quietly confident, with a
      light touch of wit and real affection for the characters. Clear, fair and strictly neutral on politics. Pacing: brisk but
      unhurried; slow slightly to land every number; a short beat after a surprising figure and before each verdict. Natural
      American English, conversational, never an announcer, never salesy. Read the short character lines with a little playful
      character. Pronounce names simply: Gus (GUSS), Bia (BEE-ah), Minas Gerais (MEE-nas zheh-RICE), Araxá (ah-rah-SHAH), Jequitinhonha (zheh-kee-cheen-YOH-nyah), Bahia (bah-EE-ah), Camaçari (kah-mah-sah-REE), niobium (nye-OH-bee-um), Custo Brasil (KOOS-too brah-ZEEW).
