    source_ids: [bcb_selic]
    status: source_located
  - id: br_custo
    text: "MBC / MDIC study (2023, FGV update), cited by CNI: producing in Brazil costs companies R$1.7 trillion a year more than the OECD average (about 19.5% of GDP); OUR CONVERSION at 5.5891 BRL/USD = about US$304 billion. An industry estimate."
    spoken: about three hundred billion dollars a year
    display: "'Custo Brasil' ≈ R$1.7 tn ≈ US$304 bn a year · MBC/MDIC INDUSTRY ESTIMATE"
