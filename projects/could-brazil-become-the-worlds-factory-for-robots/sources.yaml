    display: "≈ 2 of 3 tons of freight go by truck · CNT 2026 (industry study)"
    source_ids: [cnt_plan26]
    status: source_located
  - id: br_selic
    text: "Banco Central do Brasil: Selic target rate 13.75% a year (held on Nov 4, 2026)."
