  - id: br_byd
    text: "Ford idled its Camacari (Bahia) plant in January 2021; BYD took over the site and began producing cars there on July 1, 2025."
    spoken: twenty twenty-five
    display: "Camaçari: Ford left 2021 · BYD started 2025 · company announcements"
    source_ids: [byd_ba]
