  - id: br_vat
    text: "EC 132/2023 and LC 214/2025: the dual VAT (CBS + IBS) is tested from 2026 and the old consumption taxes (ICMS, ISS) are fully extinguished in 2033."
    spoken: twenty thirty-three
    display: "New dual VAT: test 2026 · old taxes gone 2033 · EC 132/2023"
