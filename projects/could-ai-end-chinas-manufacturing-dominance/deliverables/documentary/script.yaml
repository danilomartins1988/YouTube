logline: 'Mel, who could not buy a toaster that wasn''t made in China, decides to build one in Ohio with robots. Her illustrative three-factory
  experiment shows automation can bring America within a few dollars of China, and which switches flip the winner; then the twist: China
  installs most of the world''s robots. Verdict: AI changes the test, not the winner.'
title: Could AI Make American Factories Cheaper Than China's?
segments:
- id: co_hook
  chapter: The factory that changes everything
  narration: Meet Mel. In our last episode, she tried to buy a toaster that wasn't made in China, and failed. So now she wants to build
    one herself, in Ohio. Picture her factory on a Sunday afternoon. Robot arms working. Cameras checking every part. Software deciding
    what to build next. And a price that matches China's. That factory doesn't exist yet. But almost every piece of it already does.
    So could AI make American factories cheaper than China's? And if it did, would America actually win?
  claims: []
  analysis: true
  source_note: Hypothetical scenario (labelled HYPOTHETICAL on screen); capabilities described are the IFR's industry-grade list.
- id: title_card
  chapter: The factory that changes everything
  narration: ''
  claims: []
- id: a1_stakes
  chapter: The factory that changes everything
  narration: Mel's banker isn't convinced. For forty years, the rule was simple. Build where the work is cheapest. But a robot doesn't
    care about wages. If machines do more of the work, that old rule starts to wobble. And the stakes are bigger than one toaster. Prices,
    jobs, and which country makes the things everybody needs.
  claims: []
  analysis: true
  source_note: Framing of the central question (no figures).
- id: a1_output
  chapter: The factory that changes everything
  narration: And America has already seen a preview. Today, American factories make about twice as much as they did in the late seventies,
    with millions fewer workers. More stuff, far fewer people. Automation is a big part of that story.
  claims:
  - us_output
- id: a2_card
  chapter: The old formula
  narration: ''
  claims: []
- id: a2_formula
  chapter: The old formula
  narration: So Mel calls her old friend Wei, the line engineer from our last episode, Why the World Still Depends on Chinese Factories.
    Wei's answer, in short. China makes about a quarter of everything the world manufactures, with suppliers down the street, giant
    ports, steady power, and engineers who've done it all before.
  claims:
  - mva
- id: a2_wage
  chapter: The old formula
  narration: And labor? By our rough math, an American factory worker earns about five times what Wei's line workers make per hour.
    That gap is why Mel's old toaster was made in China in the first place.
  claims:
  - wages
- id: a2_question
  chapter: The old formula
  narration: So Mel's whole plan rests on a bet. If robots shrink the labor part of the bill, does China's oldest head start shrink
    too? First, she needs to know what AI can really do on a factory floor.
  claims: []
  analysis: true
  source_note: Transition (no figures).
- id: a3_card
  chapter: When labor matters less
  narration: ''
  claims: []
- id: a3_vision
  chapter: When labor matters less
  narration: Kip, her consultant, starts the tour with what's proven. Cameras running AI software inspect every toaster faster than
    a human eye, and guide robot arms to grab parts that aren't perfectly lined up. The International Federation of Robotics, the industry's
    statistics body, calls machine vision {{ifr_ai}}.
  claims:
  - ifr_ai
- id: a3_maint
  chapter: When labor matters less
  narration: Next, predictive maintenance. Sensors listen to a motor, and software flags it before it breaks. Smart scheduling reshuffles
    the line when an order changes. Self-driving carts move parts across the floor. The federation says tools like these are increasingly
    used in industry.
  claims:
  - ifr_ai
- id: a3_twin
  chapter: When labor matters less
  narration: Then Kip shows her a digital twin, a virtual copy of a factory where engineers test the line before they build it. The
    electronics giant Foxconn says it built one with NVIDIA software for a new plant in {{foxconn_twin}}, Mexico, to train its robots
    in simulation first.
  claims:
  - foxconn_twin
- id: a3_draw
  chapter: When labor matters less
  narration: Let me sort what Mel just saw. Proven, the robot arms that weld, paint and pick, plus machine vision. Growing, predictive
    maintenance, AI inspection and smart scheduling. Not yet, general-purpose robots that learn any job by watching. The federation
    says that kind of physical AI isn't industry-grade yet.
  claims:
  - ifr_ai
- id: a3_humanoid
  chapter: When labor matters less
  narration: Mel asks about the humanoid robots from viral videos. The federation says most are still prototypes or pilot projects,
    and that for factory work today, ordinary industrial robots are the better deal. The robot that matters isn't the one that dances.
    It's the arm bolted to the floor.
  claims:
  - ifr_ai
- id: a3_bill
  chapter: When labor matters less
  narration: And here's why that arm matters less than Mel hoped. In American factories, out of every dollar of sales, only {{asm}}
    go to wages and salaries for everyone, from the line to the front office. Materials and parts take by far the biggest bite.
  claims:
  - asm
- id: a3_pull
  chapter: When labor matters less
  narration: Watch what happens when I pull labor out. Even if every paycheck vanished, the materials, the machines, the energy and
    the building would still be there. And the robots that replace those paychecks send a bill of their own. Automation shrinks a slice.
    It doesn't make the factory free.
  claims: []
  analysis: true
  source_note: Mechanism diagram built on the Census shares above; no new figures.
- id: a4_card
  chapter: The hundred-dollar experiment
  narration: ''
  claims: []
- id: a4_setup
  chapter: The hundred-dollar experiment
  narration: So Mel runs an experiment. Her toaster costs a hundred dollars to make in a regular Chinese factory and ship to an American
    warehouse. Our model is illustrative, not any real company's costs. What matters is how it moves.
  claims: []
  analysis: true
  source_note: ILLUSTRATIVE MODEL (our assumptions; full table in FACT_CHECK.md and RESEARCH_NOTES.md §5); totals 100 / 102 / 95.
- id: a4_f1
  chapter: The hundred-dollar experiment
  narration: First, the conventional Chinese plant. Cheap labor, suppliers next door, an ocean to cross, and a tariff at the border.
    That's Mel's benchmark.
  claims: []
  analysis: true
  source_note: ILLUSTRATIVE MODEL (our assumptions; full table in FACT_CHECK.md and RESEARCH_NOTES.md §5); totals 100 / 102 / 95.
- id: a4_f2
  chapter: The hundred-dollar experiment
  narration: Next, Kip's dream, a highly automated plant in Ohio. Robots cut most of the labor hours, but American pay is higher. Robots,
    software and cameras add a big bill of their own. No ocean and no tariff on the toaster, but many parts still come from Asia. The
    total? Just two dollars more.
  claims: []
  analysis: true
  source_note: ILLUSTRATIVE MODEL (our assumptions; full table in FACT_CHECK.md and RESEARCH_NOTES.md §5); totals 100 / 102 / 95.
- id: a4_tie
  chapter: The hundred-dollar experiment
  narration: Almost a tie. That's the headline. In a model like this, automation can bring an American factory within a few dollars
    of China. Now watch what moves the winner.
  claims: []
  analysis: true
  source_note: ILLUSTRATIVE MODEL (our assumptions; full table in FACT_CHECK.md and RESEARCH_NOTES.md §5); totals 100 / 102 / 95.
- id: a4_flip
  chapter: The hundred-dollar experiment
  narration: Raise the tariff a lot, and the Chinese plant gets pricier. Ohio wins. Now let Ohio's robots sit idle half the time because
    orders are weak. The cost of the machines behind every toaster doubles. China wins again. Tariffs, busy robots, imported parts,
    robot prices. Those are the switches.
  claims: []
  analysis: true
  source_note: ILLUSTRATIVE MODEL (our assumptions; full table in FACT_CHECK.md and RESEARCH_NOTES.md §5); totals 100 / 102 / 95.
- id: a4_f3
  chapter: The hundred-dollar experiment
  narration: Then Wei calls back with another option. The same robots, in China. Lower wages, suppliers down the street, and Chinese-made
    robots that we assume cost less. It comes in about five dollars under Mel's benchmark.
  claims: []
  analysis: true
  source_note: ILLUSTRATIVE MODEL (our assumptions; full table in FACT_CHECK.md and RESEARCH_NOTES.md §5); totals 100 / 102 / 95.
- id: a4_result
  chapter: The hundred-dollar experiment
  narration: In our base case, Wei's automated factory wins. Ohio only comes out ahead when tariffs are high and its robots stay busy.
    So automation doesn't automatically favor America. It favors whoever automates best, at scale. Which raises the real question. Is
    China actually automating?
  claims: []
  analysis: true
  source_note: ILLUSTRATIVE MODEL (our assumptions; full table in FACT_CHECK.md and RESEARCH_NOTES.md §5); totals 100 / 102 / 95.
- id: a5_card
  chapter: China has robots too
  narration: ''
  claims: []
- id: a5_reveal
  chapter: China has robots too
  narration: It is. Last year, factories in China installed more industrial robots than the rest of the world combined. Compared with
    America, that's {{ifr_inst.ratio_spoken}} robots for every American one. In a single year.
  claims:
  - ifr_inst
- id: a5_chart
  chapter: China has robots too
  narration: Let me chart it. China's tower dwarfs everyone else. America, now the second-biggest market, looks like a stub next to
    it. And worldwide, installations hit a record, according to the federation's World Robotics report.
  claims:
  - ifr_inst
  - ifr_countries
- id: a5_brands
  chapter: China has robots too
  narration: Second surprise. More and more of those robots are made in China. A few years ago, foreign brands sold most of China's
    new robots. Now Chinese brands sell more than half.
  claims:
  - ifr_dom
- id: a5_density
  chapter: China has robots too
  narration: Now the twist inside the twist. Per factory worker, China isn't the most automated country. America has more robots per
    worker, and South Korea has several times more than both. China simply has so many factory workers that its robots are spread thin,
    for now. That's room to grow.
  claims:
  - ifr_density
- id: a5_why
  chapter: China has robots too
  narration: And it has reasons to grow. The federation points to a labor shortage from an aging population, and China's new five-year
    plan aims AI research at physical uses like robots. Robots don't cancel China's advantages. Plugged into its supplier network, they
    may multiply them.
  claims:
  - ifr_cn_plan
- id: a6_card
  chapter: Who captures the money?
  narration: ''
  claims: []
- id: a6_supply
  chapter: Who captures the money?
  narration: Back in Ohio, Mel hits the supply-chain problem. Her factory can be brand new and still depend on the world. Robot arms,
    precision gears, sensors, chips, and the rare-earth magnets inside powerful motors. Build the factory at home, and you may still
    buy its brain and its muscles from abroad.
  claims: []
  analysis: true
  source_note: Supply-chain mechanism (no figures).
- id: a6_who
  chapter: Who captures the money?
  narration: And those suppliers live in different countries. Japan builds more of the world's industrial robots than anyone else. Germany
    and Switzerland are home to big automation suppliers. America leads in AI software and chip design. Taiwan and South Korea make
    many of the chips. And China refines most of the rare earths behind those magnets.
  claims:
  - ifr_jp
  - ieare
- id: a6_draw
  chapter: Who captures the money?
  narration: Let me draw where the money from Mel's toaster could go. Materials and parts. The robot maker. Chips and sensors. AI software.
    Energy. Logistics. And whatever is left, for the factory owner.
  claims: []
  analysis: true
  source_note: Illustrative value-chain diagram (no measured allocations), labelled ILLUSTRATIVE.
- id: a6_lesson
  chapter: Who captures the money?
  narration: The splits in our picture are illustrative, but the lesson isn't. The country that hosts the factory may not capture most
    of the value. In an automated world, money flows to whoever owns the robots, the software and the chips.
  claims: []
  analysis: true
  source_note: Illustrative money-flow animation (no measured allocations), labelled ILLUSTRATIVE SPLIT.
- id: a7_card
  chapter: The verdict
  narration: ''
  claims: []
- id: a7_where
  chapter: The verdict
  narration: So, could AI make American factories cheaper than China's? For some products, yes. The likeliest are heavy or bulky goods
    that are costly to ship, products built from many repeated precision steps, and things a country can't risk running out of, like
    chips, batteries and medical supplies. A toaster is light and cheap to ship, so Mel's choice is harder than she hoped.
  claims: []
  analysis: true
  source_note: Analysis built on the experiment's switches (shipping, utilization, tariffs) and the IFR maturity list.
- id: a7_jobs
  chapter: The verdict
  narration: And if Mel does build in Ohio, her factory won't hire the crowds the old plants did. Economists Daron Acemoglu and Pascual
    Restrepo found that in American local job markets, the more robots arrived, the fewer people were employed and the lower wages went.
    The new jobs are different. Technicians, programmers, maintenance crews.
  claims:
  - ar_jobs
- id: a7_china
  chapter: The verdict
  narration: Meanwhile, Wei's factory keeps its suppliers, its ports, its scale, and now the biggest fleet of new robots on Earth, most
    of them homemade. What could stop an American comeback? Robots sitting idle when demand is weak, missing parts suppliers, expensive
    money, and trade rules that keep changing.
  claims: []
  analysis: true
  source_note: Summary of earlier evidence (IFR installations, Ep 60 cluster) and the experiment's switches.
- id: a7_verdict
  chapter: The verdict
  narration: So here's our verdict. AI doesn't end China's manufacturing dominance. It changes the test. For decades, the question was
    who has the cheapest workers. Now it's who can combine intelligent machines, reliable energy, patient capital and a complete supply
    chain. America can win back competitiveness, product by product, without winning back the same jobs. And China can automate too.
    Mel's choice won't be decided by the cheapest labor. It'll be decided by the best system.
  claims: []
  analysis: true
  source_note: Verdict derived from the experiment, the IFR data and the value-chain section; no prediction or date.
- id: teaser
  chapter: The verdict
  narration: Next time, we follow the money behind another hidden link of the world economy. This is The Hidden Economics.
  claims: []
  analysis: true
  source_note: Generic closing teaser (channel rule).
