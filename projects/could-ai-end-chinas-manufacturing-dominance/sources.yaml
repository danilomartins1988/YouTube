    display: "2025 installations: Japan 36,219 · Korea ≈30,000 · Germany <25,000 (IFR)"
    fields: {kr_spoken: about thirty thousand, de_spoken: under twenty-five thousand, stock_spoken: five million}
    source_ids: [ifr_pr_global, ifr_wr26]
    status: source_located
  - id: ifr_dom
    text: "IFR (Sep 24, 2026): Chinese domestic suppliers' installations +15% in 2025, 55% of China's installations; share around 30% in 2019-2021 (WR 2026 executive summary); more than half since 2024."
