  - id: fred_ipman
    title: "Industrial Production: Manufacturing (NAICS) (IPMAN), index 2017=100, Federal Reserve G.17 (via FRED)"
    publisher: Board of Governors of the Federal Reserve System
    url: https://fred.stlouisfed.org/series/IPMAN
    published: "2026-11"
    accessed: "2026-11-18"
    kind: dataset
