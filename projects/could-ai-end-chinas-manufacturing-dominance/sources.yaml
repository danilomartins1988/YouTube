# Sources and claims for "Could AI Make American Factories Cheaper Than China's?" (Episode 62; arc Episode 2; owner request
# 2026-11-18). Arc Episode 1 = Ep 60 "Why the World Still Depends on Chinese Factories" (its verified figures reused where still
# current: World Bank MVA share, BLS and NBS wages, IEA rare-earth refining).
# Every NEW claim was read on its primary page or document on 2026-11-18 (notes: docs/episodes/62-ai-manufacturing/RESEARCH_NOTES.md).
# Status stays source_located until a named human reviewer signs off. US dollars only.
# RULES: IFR World Robotics 2026 (Sep 24, 2026; data year 2025) is the primary source for installations; the IFR density release of
# Nov 12, 2026 (data year 2025) for robot density (units: robots per 10,000 manufacturing employees). Cross-edition density
# comparisons for China are NOT made (the IFR changed China's employment base). Ratios, shares and the 1979-2026 comparison are
# OUR CALCULATIONS and are labelled so. The $100 three-factory experiment is an ILLUSTRATIVE MODEL with no real cost data; it is
# labelled on screen and has no claim. Industrial vs humanoid robots, conventional automation vs AI, demo vs deployment are kept
# apart. No company is said to run a fully autonomous factory.
sources:
  - id: ifr_wr26
    title: "World Robotics 2026 Industrial Robots: Executive Summary (installations 2015-2025, operational stock, customer industries, technology trends incl. AI maturity and humanoids)"
    publisher: International Federation of Robotics (IFR Statistical Department, VDMA Services)
    url: https://ifr.org/img/worldrobotics/Executive_Summary_WR_2026_-_Industrial_Robots.pdf
    published: "2026-09-24"
    accessed: "2026-11-18"
    credit: "IFR World Robotics 2026"
    notes: "2025: 603,307 units installed (+11%); stock 5,079,078 (+9%); China 354,226 (+20%); US 38,428 (+12%); Asia 457,315; Europe 73,054 (-14%); Americas 57,044. 'Machine vision for detection and robot guidance is already established and industry-grade. Predictive maintenance, process optimization and AI-based inspection are also increasingly used in industry. General-purpose Physical AI systems and learning from simulation and experience, are not yet industry-grade.' 'Most humanoids remain prototypes or pilot-stage technologies rather than industrial-grade products. At the current stage of technology, industrial robots are economically superior for industrial production tasks.' Chinese domestic suppliers' share 'around 30% from 2019 to 2021'."
  - id: ifr_pr_global
    title: "Five Million Robots now Operate in Factories Globally (World Robotics 2026 press release)"
    publisher: International Federation of Robotics
    url: https://ifr.org/ifr-press-releases/news/five-million-robots-now-operate-in-factories-globally
    published: "2026-09-24"
    accessed: "2026-11-18"
    credit: "IFR (Sep 2026)"
    notes: "2025 installations: China 354,000 (59%); US almost 38,500 (+12%, now 2nd); Japan 36,219 (-19%); Republic of Korea 30,000 (-1%); Germany fewer than 25,000; India almost 10,500."
  - id: ifr_pr_china
    title: "China Installs 59 Percent of World's Industrial Robots (World Robotics 2026 press release, China)"
    publisher: International Federation of Robotics
    url: https://ifr.org/downloads/press_docs/EN-2026-SEP-24-IFR_Press_Release_WR-CHINA.pdf
    published: "2026-09-24"
    accessed: "2026-11-18"
    credit: "IFR (Sep 2026)"
    notes: "Domestic suppliers +15% in 2025, 55% of installations; 'Since 2024, more than half of the Chinese installations have been from Chinese brands.' 'The economy is suffering from a labor shortage due to demographic change.' 15th Five-Year Plan (2026-2030) 'aims to focus its AI research on physical applications' (IFR President quote)."
  - id: ifr_density
    title: "Robot Density Highest in South Korea, Singapore and Germany (press release; data year 2025)"
    publisher: International Federation of Robotics
    url: https://ifr.org/ifr-press-releases/news/robot-density-highest-in-south-korea-singapore-and-germany
    published: "2026-11-12"
    accessed: "2026-11-18"
    credit: "IFR (Nov 2026)"
    notes: "Robots per 10,000 manufacturing employees, 2025: Republic of Korea 1,066; Singapore 873; Germany 469; Japan 452; United States 323 (8th); China 193 (19th; 'based on employment data of the National Economic Census'; +147% 2020-2025); EU 240; world average 152."
  - id: ifr_japan
    title: "Japan's Car Industry has Highest Robot Installations in Five Years (press release)"
    publisher: International Federation of Robotics
    url: https://ifr.org/ifr-press-releases/news/japans-car-industry-has-highest-robot-installations-in-five-years
    published: "2025-07-15"
    accessed: "2026-11-18"
    credit: "IFR (Jul 2025)"
    notes: "'Japan is the world's predominant robot manufacturing country representing 38% of global robot production' (IFR President, preliminary data). No newer production-share figure located."
  - id: census_asm21
    title: "Annual Survey of Manufactures: 2021 (Manufacturing value of shipments and cost of materials by subsector) and 'Manufacturing in America' infographic (2021 ASM)"
    publisher: U.S. Census Bureau
    url: https://census.gov/content/dam/Census/library/publications/2023/econ/Annual%20Survey%20of%20Manufactures%202021.pdf
    published: "2023"
    accessed: "2026-11-18"
    kind: dataset
    credit: "U.S. Census Bureau, 2021 ASM"
    notes: "Value of shipments $6.1T (21 subsectors sum $6,079.6bn); cost of materials (21 subsectors) $3,340.8bn -> 55% (our calculation). Annual payroll $785.2bn, 11.7M employees (Census 'Manufacturing in America' infographic, https://www.census.gov/content/dam/Census/library/visualizations/2023/econ/manufacturing-in-america.pdf) -> 12.9% of shipments (our calculation). Payroll = wages and salaries of all employees, before benefits. The ASM was discontinued after survey year 2021 (now AIES), so 2021 is the latest edition with this layout."
  - id: fred_manemp
    title: "All Employees, Manufacturing (MANEMP), BLS Current Employment Statistics, monthly, seasonally adjusted (via FRED)"
    publisher: U.S. Bureau of Labor Statistics
