    fields: {share_spoken: fifty-nine percent, us_spoken: thirty-eight thousand, world_spoken: more than six hundred thousand, ratio_spoken: roughly nine}
    source_ids: [ifr_wr26, ifr_pr_global]
    status: source_located
  - id: ifr_countries
    text: "IFR press release Sep 24, 2026: 2025 installations Japan 36,219 (-19%); Republic of Korea 30,000 (-1%); Germany fewer than 25,000; the US 'now the second-largest market'. Operational stock 5,079,078 (2025)."
