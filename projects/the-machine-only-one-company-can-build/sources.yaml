claims:
  - id: euv_only
    text: ASML is the only company that makes EUV lithography systems, used to print the smallest features on the most advanced chips.
    spoken: only one company
    display: "1 maker"
    source_ids: [asml_euv, reuters_explainer]
    status: source_located
    verification_note: Read in the cited source(s) on 2026-11-06 (AI fact-check; still needs a named human reviewer).

  - id: euv_price
    text: Reuters describes ASML's EUV lithography machines as costing about $250 million each (January 2026).
    spoken: about 250 million dollars
    display: "≈ $250m"
    value: 250
    source_ids: [reuters_explainer]
    status: source_located
    verification_note: Read in the cited source(s) on 2026-11-06 (AI fact-check; still needs a named human reviewer).

  - id: highna_price
    text: High-NA EUV scanners are estimated to cost about $300-400 million each; ASML began shipping the first one to Intel in December 2023.
