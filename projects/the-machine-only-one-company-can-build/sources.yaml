    verification_note: Read in the source on 2026-11-06 (AI fact-check, not a named human). The 100,000-parts figure was dropped (no primary source confirmed).
    verification_note: Weight estimates vary between sources (150-200 t); the film says "about 150 tons" with Reuters as source.
