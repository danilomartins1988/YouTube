    display: "$300-400m (est.)"
    value: 300
    source_ids: [highna_2023, highna_reuters]
    status: source_located
    verification_note: Read in the cited source(s) on 2026-11-06 (AI fact-check; still needs a named human reviewer).

  - id: machine_size
    text: "Reuters (Jan 2026): the machines are the size of a school bus and weigh 150 tons; they are assembled in the Netherlands, packed into around 40 containers and taken on 747 cargo planes."
    spoken: 150 tons
