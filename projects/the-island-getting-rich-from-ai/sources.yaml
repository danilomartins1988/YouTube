# Status stays source_located: the channel rule requires a named human reviewer before publishing.
# MONEY: Anguilla reports in Eastern Caribbean dollars (EC$), pegged at EC$2.70 = US$1 since 1976 (source eccb_peg).
# Each US$ figure below is the one the source itself gives; it matches the official peg.
