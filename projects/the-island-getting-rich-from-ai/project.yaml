title: "The Tiny Island Getting Rich From AI"
slug: the-island-getting-rich-from-ai
language: en
# Episode 10 (Anguilla and .ai). Cartoon-first: bright palette for every scene + engine_cartoon worlds. Five-part structure internal only.
# Money: Anguilla reports in Eastern Caribbean dollars (EC$); the film uses the US-dollar figures given by each source.
renderer: remotion
remotion_geo: [world]
style:
  name: cartoon-day
  palette:            # bright cartoon day: sky base, gold = money, blue = internet, green = growth, red = risk
    bg: "#BFE8FA"
    bg2: "#EAF8FF"
    ink: "#10213A"
    muted: "#4F6B80"
    land: "#8BD47A"
    border: "#2E5A73"
    accent: "#E89A00"
    accent2: "#1E7FD8"
    accent3: "#23995A"
    risk: "#E53935"
  fonts:
    display: InterDisplay-Bold
    heading: InterDisplay-SemiBold
    body: Inter-Regular
    body_bold: Inter-SemiBold
  web_fonts:
    display: "Inter Display, Inter, sans-serif"
    body: "Inter, sans-serif"
  transition: scan
  background: grid
  motifs: [chapter-tags]
budget:
  max_paid_usd: 1.00
presenter_min: 4
