# Documentary (target 10-12 min). Cold open + eleven parts + conclusion.
# Every number comes from the dossier (sources.yaml). Money is in US dollars. Segments marked analysis
# contain the channel's interpretation. Three pots of money are kept apart: Formula 1 group revenue,
# team revenue, and promoter / host-city economics.
title: "The Hidden Business Behind Formula 1"
logline: >-
  Formula One looks like a sport. Underneath it is a media business that sells attention to broadcasters,
  cities and brands, and shares the profit with the teams that make the show.
segments:
  # ---------------------------------------------------------------- cold open
  - id: open_hook
    chapter: The business
    narration: >-
      A pack of cars screams past the grandstand. Every surface you can see has been sold: the boards, the
      cars, the overalls, even the time on the screen. The race on track is only half the story.
    claims: []
    analysis: true
    source_note: Scene-setting description; no figures.

  - id: open_revenue
    chapter: The business
    narration: >-
      Last year, the company that runs Formula One took in {{f1_revenue_2025}}, {{f1_revenue_2025.growth_spoken}}
      more than the year before.
    claims: [f1_revenue_2025]

  - id: open_question
    chapter: The business
    narration: >-
      So where does that money come from? Who pays, who gets paid, and why do cities line up to host a race
      that can cost them a fortune? This is The Hidden Economics.
    claims: []
    analysis: true
    source_note: Framing questions; answered in the parts that follow.

  # ---------------------------------------------------------------- part 1: a sport becomes a property
  - id: p1_card
    chapter: A sport becomes a property
    narration: ""
    claims: []

  - id: p1_sketch
    chapter: A sport becomes a property
    narration: >-
      At its core, Formula One is simple. A handful of teams design their own cars, and race them around the
      world. For most of its history, that was the whole idea. The business began when someone realised
      the show itself could be packaged and sold.
    claims: []
    analysis: true
    source_note: Simplified description of the championship; the commercial history follows with sources.

  - id: p1_history
    chapter: A sport becomes a property
    narration: >-
      For decades, that someone was {{ecclestone_role}}, who sold the sport to television as one package.
      {{cvc_2006|cap}}, the investment firm CVC took majority control. According to CVC, the calendar grew
      from {{cvc_2006.races_from_spoken}} to {{cvc_2006.races_to_spoken}} races while it was in charge.
    claims: [ecclestone_role, cvc_2006]
    source_note: The CVC growth figures are the former owner's own account.

  - id: p1_liberty
    chapter: A sport becomes a property
    narration: >-
      {{liberty_deal.year_spoken}}, the American media company Liberty Media agreed to buy Formula One,
      valuing the business at {{liberty_deal}}, including its debt. The deal closed in
      {{liberty_deal.close_spoken}}, and a new era began.
    claims: [liberty_deal]

  # ---------------------------------------------------------------- part 2: who owns what
  - id: p2_card
    chapter: Who owns what
    narration: ""
    claims: []

  - id: p2_layers
    chapter: Who owns what
    narration: >-
      Today the sport has three layers. The FIA writes and polices the rules. Formula One, owned by Liberty
      Media, holds the commercial rights and sells the show. And the teams compete, sharing in the money.
      Liberty's own filings say {{fia_role}} must put safety and sporting concerns above Formula One's
      commercial interests.
    claims: [fia_role]

  - id: p2_motogp
    chapter: Who owns what
    narration: >-
      Liberty has kept building. {{liberty_motogp|cap}}, it also bought most of MotoGP, the motorbike
      championship. Two world series, one owner.
    claims: [liberty_motogp]

  # ---------------------------------------------------------------- part 3: the money machine
  - id: p3_card
    chapter: The money machine
    narration: ""
    claims: []

  - id: p3_sketch
    chapter: The money machine
    narration: >-
      Here is the business model, in one drawing. In the middle sits Formula One. Money flows in from
      broadcasters, from race promoters, and from sponsors. And a large share flows back out again, to the
      teams.
    claims: [revenue_mix_2025, team_payments]
    source_note: Simplified diagram of the revenue streams and team payments reported by Liberty Media.

  - id: p3_mix
    chapter: The money machine
    narration: >-
      Last year, media rights brought in {{revenue_mix_2025.media_spoken}} of the revenue. Race promotion
      fees, {{revenue_mix_2025.promo_spoken}}. Sponsorship, {{revenue_mix_2025.spons_spoken}}. The rest
      came from hospitality, freight and licensing.
    claims: [revenue_mix_2025]

  - id: p3_growth
    chapter: The money machine
    narration: >-
      And the total keeps climbing, year after year, to {{f1_revenue_2025}} across
      {{f1_revenue_2025.races_spoken}} races.
    claims: [f1_revenue_series, f1_revenue_2025]

  # ---------------------------------------------------------------- part 4: media rights
  - id: p4_card
    chapter: Media rights
    narration: ""
    claims: []

  - id: p4_media
    chapter: Media rights
    narration: >-
      Media rights are the biggest single stream. By our calculation, they were worth {{revenue_usd_2025}}
      last year. Broadcasters pay to show every session, and Formula One also sells its own streaming
      service directly to fans.
    claims: [revenue_usd_2025, media_share]

  - id: p4_apple
    chapter: Media rights
    narration: >-
      The biggest new deal is in America. Apple is now the sport's exclusive broadcaster in the United States,
      for {{apple_deal.years_spoken}}. The price was never disclosed, but it is reportedly {{apple_deal}}.
    claims: [apple_deal]

  - id: p4_audience
    chapter: Media rights
    narration: >-
      Why pay that much? Look at the American audience. On ESPN, the average race drew {{espn_audience.base_spoken}}
      viewers in twenty eighteen. By twenty twenty-five, it was {{espn_audience}}, up {{espn_audience.growth_spoken}}.
    claims: [espn_audience]

  # ---------------------------------------------------------------- part 5: hosting fees
  - id: p5_card
    chapter: Hosting fees
    narration: ""
    claims: []

  - id: p5_fees
    chapter: Hosting fees
    narration: >-
      The second stream is the hosting fee. Circuits and cities pay Formula One for the right to stage a
      Grand Prix. Contracts typically run {{promoter_terms.term_spoken}}, with fees rising by
      {{promoter_terms}}. By our calculation, those fees came to {{revenue_usd_2025.promo_spoken}} last year.
    claims: [promoter_terms, revenue_usd_2025]

  - id: p5_governments
    chapter: Hosting fees
    narration: >-
      The fee for each race is almost never published. But we know who often pays: Liberty says some of its
      partners are governments. In Singapore, the twenty twenty-two race cost {{singapore_2022}} to stage,
      and the government covered {{singapore_2022.gov_spoken}} of it.
    claims: [promoter_terms, singapore_2022]
    source_note: Singapore's cost is converted from Singapore dollars at the 2022 Federal Reserve average rate.

  - id: p5_vegas
    chapter: Hosting fees
    narration: >-
      Las Vegas is the exception. There, Formula One is its own promoter. It bought land beside the Strip for
      {{vegas_self}}, built a pit building, and keeps the ticket and hospitality money. It takes the reward,
      and the risk.
    claims: [vegas_self]
    analysis: true
    source_note: '"It takes the reward, and the risk" is our interpretation of F1 acting as promoter.'

  # ---------------------------------------------------------------- part 6: sponsorship
  - id: p6_card
    chapter: Sponsorship
    narration: ""
    claims: []

  - id: p6_sponsors
    chapter: Sponsorship
    narration: >-
      Sponsorship is the third stream, and it is growing fast: {{revenue_mix_2025.spons_spoken}} of revenue
      last year, up from less than a fifth the year before. The luxury group LVMH signed a
      {{lvmh_deal}} global partnership. The oil giant Aramco joined earlier, with Formula One promising it
      an audience of {{aramco_deal}}.
    claims: [revenue_mix_2025, lvmh_deal, aramco_deal]

  - id: p6_hospitality
    chapter: Sponsorship
    narration: >-
      Then there is hospitality. In the Paddock Club, corporate guests watch from above the pit lane.
      Hospitality, freight and licensing together brought in another {{revenue_mix_2025.other_usd_spoken}}.
    claims: [revenue_mix_2025]

  # ---------------------------------------------------------------- part 7: how teams make money
  - id: p7_card
    chapter: How teams make money
    narration: ""
    claims: []

  - id: p7_payments
    chapter: How teams make money
    narration: >-
      So how do the teams get paid? First, a share of Formula One's profits. Last year, Formula One paid the
      teams {{team_payments}}, {{team_payments.share_spoken}} of its underlying profit before those payments.
      And that sum has grown every year.
    claims: [team_payments, team_payments_series]

  - id: p7_own
    chapter: How teams make money
    narration: >-
      Second, their own sponsors: the logos on the car, the overalls and the garage. Mercedes, for example,
      reported revenue of {{mercedes_2024}} in twenty twenty-four, with {{mercedes_2024.spons_spoken}} of it
      from sponsorship and licensing. Its profit was {{mercedes_2024.profit_spoken}}.
    claims: [mercedes_2024]
    source_note: Converted from pounds sterling at the 2024 Federal Reserve average rate.

  - id: p7_pots
    chapter: How teams make money
    narration: >-
      So keep three pots of money apart. Formula One's own revenue. The teams' revenue. And the promoters,
      who pay the hosting fee and sell the tickets.
    claims: []
    analysis: true
    source_note: Editorial summary of the three revenue pools described above.

  # ---------------------------------------------------------------- part 8: the cost cap
  - id: p8_card
    chapter: The cost cap
    narration: ""
    claims: []

  - id: p8_cap
    chapter: The cost cap
    narration: >-
      For years, the richest teams could simply outspend the rest. So in twenty twenty-one, the sport brought
      in a cost cap: {{cost_cap.first_spoken}} that first year, falling to {{cost_cap}}. From twenty twenty-six,
      it rises to {{cost_cap.new_spoken}}, but it now covers far more costs. Driver salaries and the three
      best-paid executives are still outside it.
    claims: [cost_cap]

  - id: p8_breach
    chapter: The cost cap
    narration: >-
      And the cap has teeth. Red Bull Racing went over its twenty twenty-one limit by {{redbull_breach.over_spoken}}.
      The penalty: a {{redbull_breach}} fine, and {{redbull_breach.aero_spoken}} less aerodynamic testing.
    claims: [redbull_breach]

  - id: p8_values
    chapter: The cost cap
    narration: >-
      With costs capped and income shared, teams have started to look like profitable franchises. Forbes
      estimates that the average team was worth {{forbes_values}} last year, with Ferrari on top at
      {{forbes_values.top_spoken}} dollars.
    claims: [forbes_values]
    analysis: true
    source_note: '"Look like profitable franchises" is our reading of the valuations.'

  - id: p8_entry
    chapter: The cost cap
    narration: >-
      That is why a seat at the table is so expensive. When Cadillac was approved as an eleventh team, it
      reportedly agreed to pay {{cadillac_entry}} to the others, more than double the
      {{cadillac_entry.old_spoken}} in the old rules, to make up for sharing the prize money eleven ways.
    claims: [cadillac_entry]

  # ---------------------------------------------------------------- part 9: why brands invest
  - id: p9_card
    chapter: Why brands invest
    narration: ""
    claims: []

  - id: p9_fans
    chapter: Why brands invest
    narration: >-
      Why do brands pay so much? Reach, and a changing audience. Formula One says it had {{fanbase_2025}}
      fans last year, up {{fanbase_2025.growth_spoken}} since twenty eighteen. And {{fanbase_2025.female_spoken}}
      of them are women.
    claims: [fanbase_2025]

  - id: p9_why
    chapter: Why brands invest
    narration: >-
      For a sponsor, that means a global stage almost every other weekend, a wealthy audience, and a
      technology story to tell. Aramco's deal, for example, also covered sustainable fuels.
    claims: [aramco_deal]
    analysis: true
    source_note: Interpretation of sponsor motives; the Aramco fuels element is in F1's 2020 announcement.

  # ---------------------------------------------------------------- part 10: Netflix and expansion
  - id: p10_card
    chapter: Netflix and expansion
    narration: ""
    claims: []

  - id: p10_netflix
    chapter: Netflix and expansion
    narration: >-
      That audience did not grow by accident. {{dts_2019|cap}}, Netflix released Drive to Survive, a
      behind-the-scenes series that turned drivers and team bosses into characters. The new owners pushed
      into social media and streaming. Then came Hollywood: a racing blockbuster, named after the sport, took {{f1_movie}} at the box office.
    claims: [dts_2019, f1_movie]
    analysis: true
    source_note: '"Did not grow by accident" and the social-media push are our characterisation.'

  - id: p10_map
    chapter: Netflix and expansion
    narration: >-
      And the calendar went global. Las Vegas joined, Madrid hosts the Spanish race from twenty twenty-six,
      and a {{madrid_rwanda}} deal will take Formula One to Rwanda in the early twenty-thirties.
    claims: [vegas_self, madrid_rwanda]

  # ---------------------------------------------------------------- part 11: host-city trade-offs
  - id: p11_card
    chapter: The host-city deal
    narration: ""
    claims: []

  - id: p11_sketch
    chapter: The host-city deal
    narration: >-
      For a host city, a Grand Prix is a deal with two sides. On one side, a global audience, full hotels
      and a famous name. On the other, the fee, the track, and weeks of disruption.
    claims: []
    analysis: true
    source_note: Editorial framing of the trade-off; the figures follow.

  - id: p11_costs
    chapter: The host-city deal
    narration: >-
      The bills can be large. The twenty twenty-four Australian Grand Prix cost Victorian taxpayers
      {{australia_2024}}. In Las Vegas, a study paid for by Formula One put the race's economic impact at
      {{vegas_impact_2024}}, with {{vegas_impact_2024.tax_spoken}} in direct taxes.
    claims: [australia_2024, vegas_impact_2024]
    source_note: Australian figure converted from Australian dollars at the 2024 Federal Reserve average rate.

  - id: p11_doubt
    chapter: The host-city deal
    narration: >-
      Economists are sceptical. Independent studies of big sporting events {{matheson_view}} find that the
      promised benefits are exaggerated. Victoria's own Auditor-General found that for the twenty oh-five
      race, the {{vago_2005}}. And in Las Vegas, local businesses complained of lost trade, until
      {{vegas_settle}} of the disputes were settled.
    claims: [matheson_view, vago_2005, vegas_settle]

  # ---------------------------------------------------------------- part 12: risks and opportunities
  - id: p12_card
    chapter: Risks and opportunities
    narration: ""
    claims: []

  - id: p12_risks
    chapter: Risks and opportunities
    narration: >-
      The risks are real. This spring, the Bahrain and Saudi Arabian races were called off because of the
      conflict in the Middle East. Fewer races means less money: in the first half of this year, Formula One's
      revenue fell {{h1_2026}}. Rights groups accuse some hosts of {{sportswashing}}. And sponsors cut back
      in a {{recession_risk}}.
    claims: [gulf_cancel, h1_2026, sportswashing, recession_risk]

  - id: p12_opps
    chapter: Risks and opportunities
    narration: >-
      But the opportunities are big too. A new American broadcaster. An eleventh team. New markets in Spain
      and Africa. All the teams signed up to the sport's governance until twenty thirty. And new engines run
      on sustainable fuel, as Formula One aims for net zero carbon by {{net_zero}}.
    claims: [apple_deal, cadillac_entry, madrid_rwanda, concorde_2025, net_zero]

  # ---------------------------------------------------------------- conclusion
  - id: outro
    chapter: The real product
    narration: >-
      Formula One sells speed. But the real product is attention: hundreds of millions of fans, sold to
      broadcasters, to cities and to brands. The teams race for points. The business races for the next
      contract. This was The Hidden Economics.
    claims: [fanbase_2025]
    analysis: true
    source_note: Concluding interpretation.
