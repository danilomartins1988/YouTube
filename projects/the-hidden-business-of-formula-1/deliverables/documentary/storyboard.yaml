  - id: s20_fees
    segment: p5_fees
    type: circuit
    params:
      chapter: "05 · Hosting fees"
      title: The race promotion contract
      subtitle: Paid by circuits and cities to Formula 1 (Liberty Media 10-K)
      draw_seconds: 2.4
      lap_label: Contract year
      lap_seconds: 4
      laps_total: 7
      scale: 0.85
      ox: 230
      oy: 170
      markers:
        - {along: 0.08, label: Typical term, value: "{{promoter_terms.term_display}}", colour: accent2, cue: "Contracts typically", dx: 80, dy: 80}
        - {along: 0.42, label: Fee increases, value: "{{promoter_terms.display}}", colour: accent3, cue: "with fees rising", dx: -60, dy: -70}
        - {along: 0.72, label: "All fees, 2025 (our calc.)", value: "{{revenue_usd_2025.promo_display}}", colour: accent, cue: "By our calculation", dx: -80, dy: 90}
    sources: [liberty_10k_2025, liberty_fy2025]
    assets: ["font:inter"]

  - id: s21_governments
    segment: p5_governments
    type: compare
    params:
      chapter: "05 · Hosting fees"
      title: "Singapore Grand Prix, 2022: who paid?"
      sides:
        - {kicker: Cost of staging the race, value: "{{singapore_2022.display}}", label: "converted from Singapore dollars", bar: 100, cue: "race cost"}
        - {kicker: Paid by the government, value: "{{singapore_2022.gov_display}}", label: "of the cost", bar: 60, cue: "government covered"}
    sources: [mti_singapore_2023, fed_h10]
    assets: ["font:inter"]

  - id: s22_vegas
    segment: p5_vegas
    type: race_track
    params:
      speed: 1100
      kicker: Las Vegas
      kicker_cue: "Las Vegas"
      title: F1 as its own promoter
      title_cue: "its own promoter"
      value: "{{vegas_self.display}}"
      value_cue: "bought land"
      subtitle: "for land beside the Strip · tickets and hospitality kept by F1"
      subtitle_cue: "keeps the ticket"
      boards: ["TICKETS", "HOSPITALITY", "YOUR BRAND", "PADDOCK"]
    sources: [liberty_10k_2025, vegas_land_2022]
    assets: ["font:inter"]

  # ---------------- part 6
  - id: s23_p6
    segment: p6_card
    type: act_title
    params: {number: Part 6, title: Sponsorship, subtitle: Selling every surface, min_seconds: 3.2}
    sfx: [{kind: hit, at: 0.1, gain: 0.25}]
    assets: ["font:inter"]

  - id: s24_sponsors
    segment: p6_sponsors
    type: compare
    params:
      chapter: "06 · Sponsorship"
      title: Sponsorship's share of Formula 1 revenue
      sides:
        - {kicker: "2024", value: "{{revenue_mix_2025.spons_prev_display}}", label: of revenue, bar: 18.6, cue: "the year before"}
        - {kicker: "2025", value: "{{revenue_mix_2025.spons_display}}", label: "{{revenue_usd_2025.spons_display}} (our calc.)", bar: 21.7, cue: "third stream"}
        - {kicker: "LVMH, from 2025", value: "{{lvmh_deal.display}}", label: "value undisclosed", cue: "LVMH"}
        - {kicker: "Aramco, from 2020", value: "500m fans", label: "promised by F1", cue: "Aramco"}
    sources: [liberty_10k_2025, f1_lvmh_2024, f1_aramco_2020]
    assets: ["font:inter"]

  - id: s25_hospitality
    segment: p6_hospitality
    type: race_track
    params:
      speed: 700
      kicker: Hospitality, freight and licensing
      kicker_cue: "hospitality"
      title: The Paddock Club
      title_cue: "Paddock Club"
      value: "{{revenue_mix_2025.other_usd_display}}"
      value_cue: "brought in"
      subtitle: "other Formula 1 revenue, 2025 ({{revenue_mix_2025.other_display}})"
      subtitle_cue: "another"
      boards: ["PADDOCK CLUB", "HOSPITALITY", "SPONSOR", "VIP"]
    sources: [liberty_fy2025]
    assets: ["font:inter"]

  # ---------------- part 7
  - id: s26_p7
    segment: p7_card
    type: act_title
    params: {number: Part 7, title: How Teams Make Money, subtitle: "Prize money, sponsors and owners", min_seconds: 3.2}
