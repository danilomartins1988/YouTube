      value_prefix: "$"
      value_suffix: "m"
      callout: "{{team_payments.share_display}} of pre-payment profit (Adj. OIBDA)"
      callout_cue: "underlying profit"
    sources: [liberty_fy2025, liberty_fy2023]
    assets: ["font:inter"]

  - id: s28_own
    segment: p7_own
    type: fund_flow
    params:
      chapter: "07 · How teams make money"
      title: "One team's income: Mercedes, 2024"
      nodes:
        - {id: f1, shape: f1, x: 360, y: 330, label: F1 team payments, cue: "Second"}
        - {id: sp, shape: sponsor, x: 360, y: 760, label: Own sponsors and licensing, sub_colour: accent3, sublabel: "{{mercedes_2024.spons_display}} of income", cue: "their own sponsors"}
        - {id: team, shape: car, x: 1360, y: 560, label: "Revenue {{mercedes_2024.display}}", sublabel: "Profit {{mercedes_2024.profit_display}} (converted from GBP)", size: 1.6, cue: "Mercedes"}
      links:
        - {from: f1, to: team, cue: "Mercedes", bend: 0.2, coins: 4}
        - {from: sp, to: team, cue: "sponsorship and licensing", bend: -0.2, colour: accent3, coins: 7}
    sources: [blackbook_mercedes_2024, fed_h10]
    assets: ["font:inter"]

  - id: s29_pots
    segment: p7_pots
    type: kinetic_text
    params:
      align: center
      lines:
        - {text: Three pots of money, size: 80, cue: "three pots"}
        - {text: "1 · Formula 1's revenue", size: 56, color: accent, style: body, cue: "own revenue"}
        - {text: "2 · The teams' revenue", size: 56, color: accent2, style: body, cue: "teams' revenue"}
        - {text: "3 · Promoters: pay the fee, sell the tickets", size: 56, color: accent3, style: body, cue: "promoters"}
