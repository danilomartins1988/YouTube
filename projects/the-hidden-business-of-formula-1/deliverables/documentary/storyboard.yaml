# Storyboard for the Remotion renderer (remotion/src/scenes/*). One scene per script segment.
# Animation is cue-driven: `cue` phrases are matched against the narration's word timings.
# All art is original programmatic SVG: generic open-wheel cars, a fictional circuit, placeholder sponsor
# boards ("YOUR BRAND"), an original hand illustration. No official F1 marks, liveries or broadcast graphics.
# Whiteboard hand-drawing sequences: s05_sketch (car), s11_sketch (revenue model), s43_sketch (circuit).
scenes:
  # ---------------- cold open
  - id: s01_hook
    segment: open_hook
    type: race_track
    params:
      no_chrome: true
      kicker: The Hidden Economics
      kicker_cue: "A pack"
      title: The Hidden Business
      title_cue: "grandstand"
      value: Behind Formula 1
      value_cue: "has been sold"
      subtitle: Who pays, who gets paid, and why
      subtitle_cue: "only half"
      boards: ["YOUR BRAND", "SPONSOR", "PARTNER", "THIS SPACE", "YOUR LOGO"]
    sfx: [{kind: hit, at: 0.0, gain: 0.3}]
    assets: ["font:inter"]

  - id: s02_revenue
    segment: open_revenue
    type: big_counter
    params:
      chapter: "The business"
      cue: "took in"
      kicker: "Formula 1 total revenue, {{f1_revenue_2025.year}}"
      display: "{{f1_revenue_2025.display}}"
      label: "Formula 1 group revenue"
      sublabel: "{{f1_revenue_2025.growth_display}} vs {{f1_revenue_2025.prev_display}} in 2024 · not team or promoter money"
    sfx: [{kind: pop, cue: "took in", offset: 1.4}]
    sources: [liberty_fy2025]
    assets: ["font:inter"]

  - id: s03_question
    segment: open_question
    type: kinetic_text
    params:
      align: center
      lines:
        - {text: "Who pays?", size: 84, cue: "Who pays"}
        - {text: "Who gets paid?", size: 84, color: accent2, cue: "who gets paid"}
        - {text: "Why do cities line up to host a race?", size: 54, color: accent3, style: body, cue: "why do cities"}
    assets: ["font:inter"]

  # ---------------- part 1
  - id: s04_p1
    segment: p1_card
    type: act_title
    params: {number: Part 1, title: A Sport Becomes a Property, subtitle: From racing club to global business, min_seconds: 3.2}
    sfx: [{kind: hit, at: 0.1, gain: 0.25}]
    assets: ["font:inter"]

  - id: s05_sketch
    segment: p1_sketch
    type: whiteboard
    params:
      drawing: car
      speed: 520
      caption: The show itself could be sold
      caption_cue: "packaged and sold"
    assets: ["font:inter"]

  - id: s06_history
    segment: p1_history
    type: timeline
    params:
      chapter: "01 · A sport becomes a property"
      title: Who has owned the show
      start_year: 2004
      end_year: 2018
      tick_every: 2
      items:
        - {year: "{{cvc_2006.value}}", label: "CVC takes majority control", cue: "CVC took"}
        - {year: 2011, display: "16 → 22", label: "Races per season over CVC's tenure (CVC)", cue: "calendar grew"}
        - {year: 2017, label: "Ecclestone hands over after decades", cue: "Bernie Ecclestone"}
    sources: [liberty_close_2017, cvc_case]
    assets: ["font:inter"]

  - id: s07_liberty
    segment: p1_liberty
    type: big_counter
    params:
      chapter: "01 · A sport becomes a property"
      cue: "valuing the business"
      kicker: "Liberty Media agrees to buy Formula 1, {{liberty_deal.year_display}}"
      display: "{{liberty_deal.display}}"
      label: "Enterprise value (including debt)"
      sublabel: "Equity value {{liberty_deal.equity_display}} · completed {{liberty_deal.close_display}}"
    sfx: [{kind: pop, cue: "valuing", offset: 1.4}]
    sources: [liberty_deal_2016, liberty_close_2017]
    assets: ["font:inter"]

  # ---------------- part 2
  - id: s08_p2
    segment: p2_card
    type: act_title
    params: {number: Part 2, title: Who Owns What, subtitle: "The regulator, the rights holder and the teams", min_seconds: 3.2}
    sfx: [{kind: hit, at: 0.1, gain: 0.25}]
    assets: ["font:inter"]

  - id: s09_layers
    segment: p2_layers
    type: fund_flow
    params:
      chapter: "02 · Who owns what"
      title: Three layers
      nodes:
        - {id: fia, shape: flag, x: 380, y: 520, label: The FIA, sublabel: writes and polices the rules, cue: "The FIA writes"}
        - {id: lib, shape: box, x: 960, y: 330, label: Liberty Media, sublabel: owner, colour: accent2, cue: "owned by Liberty"}
        - {id: f1, shape: f1, x: 960, y: 640, label: Formula 1 (FOM), sublabel: commercial rights, cue: "Formula One, owned"}
        - {id: teams, shape: car, x: 1560, y: 560, label: The teams, sublabel: compete and share the money, size: 1.4, cue: "the teams compete"}
      links:
        - {from: lib, to: f1, cue: "holds the commercial", colour: accent2}
        - {from: f1, to: teams, cue: "sharing in the money", bend: 0.25, coins: 6}
        - {from: fia, to: teams, cue: "the teams compete", bend: -0.35, colour: muted, coins: 0}
      caption: "FIA: safety and sport come before commercial interests"
      caption_cue: "must put safety"
    sources: [liberty_10k_2025]
    assets: ["font:inter"]

  - id: s10_motogp
    segment: p2_motogp
    type: kinetic_text
    params:
      align: center
      lines:
        - {text: "Liberty Media", size: 64, color: accent2, cue: "Liberty has"}
        - {text: "+ Formula 1", size: 84, cue: "kept building"}
        - {text: "+ MotoGP (about 84%, {{liberty_motogp.display}})", size: 60, color: accent3, cue: "MotoGP"}
        - {text: "Two world series, one owner", size: 46, style: body, cue: "Two world"}
    sources: [liberty_fy2025]
    assets: ["font:inter"]

  # ---------------- part 3
  - id: s11_p3
    segment: p3_card
    type: act_title
    params: {number: Part 3, title: The Money Machine, subtitle: Where Formula 1's revenue comes from, min_seconds: 3.2}
    sfx: [{kind: hit, at: 0.1, gain: 0.25}]
    assets: ["font:inter"]

  - id: s12_sketch
    segment: p3_sketch
    type: whiteboard
    params:
      drawing: revenue
      speed: 1900
      caption: "Money in from three sources, a large share out to the teams"
      caption_cue: "flows back out"
    sources: [liberty_10k_2025, liberty_fy2025]
    assets: ["font:inter"]

  - id: s13_mix
    segment: p3_mix
    type: donut
    params:
      chapter: "03 · The money machine"
      title: Formula 1 revenue by stream, 2025
      subtitle: Share of total Formula 1 group revenue (Liberty Media 10-K)
      segments: "{{revenue_mix_2025.value}}"
      center: "{{f1_revenue_2025.display}}"
      cue: "media rights"
    sources: [liberty_10k_2025, liberty_fy2025]
    assets: ["font:inter"]

  - id: s14_growth
    segment: p3_growth
    type: bar_chart
    params:
      chapter: "03 · The money machine"
      title: Formula 1 total revenue
      subtitle: US$ million, Formula 1 group (Liberty Media)
      data: "{{f1_revenue_series.value}}"
      highlight: Y2025
      sort: false
      value_prefix: "$"
      value_suffix: "m"
      callout: "{{f1_revenue_2025.races_spoken}} races in 2025"
      callout_cue: "races"
    sources: [liberty_fy2025, liberty_fy2024]
    assets: ["font:inter"]

  # ---------------- part 4
  - id: s15_p4
    segment: p4_card
    type: act_title
    params: {number: Part 4, title: Media Rights, subtitle: Selling the show to screens, min_seconds: 3.2}
    sfx: [{kind: hit, at: 0.1, gain: 0.25}]
    assets: ["font:inter"]

  - id: s16_media
    segment: p4_media
    type: fund_flow
    params:
      chapter: "04 · Media rights"
      title: "Media rights: {{revenue_usd_2025.display}} in 2025 (our calculation)"
      nodes:
        - {id: tv1, shape: tv, x: 360, y: 360, label: Broadcasters, cue: "Broadcasters pay"}
        - {id: tv2, shape: tv, x: 360, y: 720, label: F1 TV streaming, colour: accent2, cue: "streaming"}
        - {id: f1, shape: f1, x: 1180, y: 540, label: Formula 1, sublabel: "{{revenue_mix_2025.media_display}} of revenue", size: 1.3, at: 0.0}
      links:
        - {from: tv1, to: f1, cue: "Broadcasters pay", bend: 0.2, coins: 6, label: "rights fees"}
        - {from: tv2, to: f1, cue: "streaming", bend: -0.2, colour: accent2, coins: 4, label: subscriptions}
      caption: "{{revenue_mix_2025.media_display}} × {{f1_revenue_2025.display}} ≈ {{revenue_usd_2025.display}}"
      caption_cue: "By our calculation"
    sources: [liberty_10k_2025, liberty_fy2025]
    assets: ["font:inter"]

  - id: s17_apple
    segment: p4_apple
    type: kinetic_text
    params:
      align: center
      lines:
        - {text: "United States, from 2026", size: 46, color: accent3, style: body, cue: "in America"}
        - {text: "One exclusive broadcaster", size: 78, cue: "exclusive broadcaster"}
        - {text: "{{apple_deal.years_display}}", size: 64, color: accent2, cue: "for five"}
        - {text: "Reportedly {{apple_deal.display}} (undisclosed)", size: 60, color: accent, cue: "reportedly"}
    sources: [apple_f1_2025, cnbc_apple_value]
    assets: ["font:inter"]

  - id: s18_audience
    segment: p4_audience
    type: line_chart
    params:
      chapter: "04 · Media rights"
      title: Average US TV audience per race (ESPN)
      subtitle: Million viewers · ESPN, ESPN2 and ABC
      series: "{{espn_audience.value}}"
      highlight: ESPN
      cue: "On ESPN"
      draw_seconds: 6
      y_max: 1.5
      y_steps: 3
      axis_prefix: ""
      axis_suffix: "m"
      axis_decimals: 1
      value_prefix: ""
      value_suffix: "m"
      value_decimals: 2
      year_every: 1
      events:
        - {year: 2025, label: "{{espn_audience.growth_display}} since 2018", cue: "up"}
    sources: [espn_2025]
    assets: ["font:inter"]

  # ---------------- part 5
  - id: s19_p5
    segment: p5_card
    type: act_title
    params: {number: Part 5, title: Hosting Fees, subtitle: What a city pays for a race, min_seconds: 3.2}
