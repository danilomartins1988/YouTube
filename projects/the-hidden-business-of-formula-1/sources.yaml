# Sources and claims for "The Hidden Business Behind Formula 1" (Episode 05).
#
# Status meanings (see hiddeneco/models.py):
#   data_derived       computed by the pipeline from a cited dataset (never typed by hand)
#   human_verified     a named person read the primary source and confirmed it (set verified_by)
#   source_located     located via web research on 2026-11-05; NOT yet read in full by a human
#   needs_verification no adequate source yet
#
# Three kinds of money are kept apart throughout, as the brief requires:
#   F1 GROUP revenue  - Formula 1 (Liberty Media segment): media rights, race promotion, sponsorship, other.
#   TEAM revenue      - each team's own accounts: F1 prize/team payments + the team's own sponsors, etc.
#   PROMOTER economics - race organisers / host governments: they PAY F1 a fee and keep (most) ticket income.
#
# Currency rule (2026-11-05): money is shown and spoken in US dollars. Figures reported in other currencies
# are converted by us with the US Federal Reserve H.10 annual average of daily rates for the year concerned
# (source fed_h10) and labelled "about"; the original amount stays in `text` for audit.
#
# Liberty Media's Q3 2026 results were due on 5 Nov 2026 (day of research) and were not yet available;
# the latest verified period is the first half of 2026.

