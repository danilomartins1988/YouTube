    status: source_located
  - id: revenue_mix_2025
    text: "In 2025 media rights were 31.3% of Formula 1's total revenue, race promotion 26.7%, sponsorship 21.7% and other revenue (hospitality, freight, licensing) 20.3%."
    value:
      - {label: Media rights, value: 31.3}
      - {label: Race promotion, value: 26.7}
      - {label: Sponsorship, value: 21.7}
      - {label: "Other (hospitality, freight...)", value: 20.3}
    fields:
      media_spoken: 31 percent
      media_display: "31.3%"
      promo_spoken: about 27 percent
      promo_display: "26.7%"
      spons_spoken: about 22 percent
      spons_display: "21.7%"
      spons_prev_display: "18.6%"
      other_spoken: about 20 percent
      other_display: "20.3%"
      other_usd_spoken: 787 million dollars
      other_usd_display: "$787m"
