    source_ids: [liberty_fy2025]
    status: source_located
  - id: f1_revenue_series
    text: "Formula 1 total revenue (Liberty Media, $ million): 2023 3,222; 2024 3,411; 2025 3,873."
    value:
      - {code: Y2023, name: "2023", value: 3222}
      - {code: Y2024, name: "2024", value: 3411}
      - {code: Y2025, name: "2025", value: 3873}
