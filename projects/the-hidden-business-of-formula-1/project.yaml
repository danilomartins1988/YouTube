title: "The Hidden Business Behind Formula 1"
slug: the-hidden-business-of-formula-1
language: en
# Episode 05. Remotion (React + SVG) engine; all art is original programmatic vector art (no photos, no
# official F1 marks or broadcast-graphics imitation). Money is always shown in US dollars (rule of 2026-11-05).
renderer: remotion
remotion_geo: [world]
style:
  name: pit-lane
  palette:            # vibrant red, electric blue, yellow, white, dark charcoal (brief)
    bg: "#16181D"
    bg2: "#22252C"
    ink: "#FFFFFF"
    muted: "#9AA1AD"
    land: "#2A2E36"
    border: "#3A3F49"
    accent: "#FF2D3D"     # vibrant red
    accent2: "#1E9BFF"    # electric blue
    accent3: "#FFD21F"    # yellow
  fonts:
    display: InterDisplay-Bold
    heading: InterDisplay-SemiBold
    body: Inter-Regular
    body_bold: Inter-SemiBold
  web_fonts:
    display: "Inter Display, Inter, sans-serif"
    body: "Inter, sans-serif"
  transition: race     # chequered racing wipe between scenes
  background: speed    # diagonal speed streaks
  motifs: [chapter-tags]
# Editor instruction (Episode 05 brief): strict cumulative cap for ALL OpenAI voice work on this episode.
budget:
  max_paid_usd: 1.00

# Published before the channel-intro and presenter standards (2026-11-05): kept exactly as released.
# For a future re-edit, set intro.enabled: true (and add presenter scenes or keep presenter_exempt).
intro: {enabled: false}
presenter_exempt: true
