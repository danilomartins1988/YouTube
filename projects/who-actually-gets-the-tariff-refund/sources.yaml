# Sources and claims for "Who Actually Gets the $166 Billion Tariff Refund?" (Episode 41, new topics N1).
# Every claim was read on its primary page/file on 2026-11-10 (notes: docs/episodes/41-tariff-refund/RESEARCH_NOTES.md).
# Status stays source_located until a named human reviewer signs off. US dollars.
# RULES: $166bn is a CBP ESTIMATE (said); refund totals include interest and mean "certified and sent to Treasury" (said);
# consumer class actions are ALLEGATIONS (said); the certified class action is for IMPORTERS; pass-through figures are
# ESTIMATES (attributed); company refund figures as reported in their own filings; no logos.
