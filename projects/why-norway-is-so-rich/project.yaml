title: "Why Norway Is So Rich"
slug: why-norway-is-so-rich
language: en
# Episode 04. Animated with the Remotion (React + SVG) engine in remotion/; Python owns research,
# narration, timing, audio, QC and packaging (hiddeneco/render/remotion_bridge.py).
renderer: remotion
remotion_geo: [europe, world]
# Made before the US-dollar rule (2026-11-05); keeps its local-currency figures.
currency_exempt: true
style:
  name: nordic-ledger
  palette:            # bright cartoon day (2026-11-08 cartoon redo): sky base, gold = money, blue, green = growth, red = risk
    bg: "#BFE8FA"
    bg2: "#EAF8FF"
    ink: "#10213A"
    muted: "#4F6B80"
    land: "#8BD47A"
    border: "#2E5A73"
    accent: "#E89A00"
    accent2: "#1E7FD8"
    accent3: "#23995A"
    risk: "#E53935"
  fonts:              # used by the Python thumbnail renderer
    display: InterDisplay-Bold
    heading: InterDisplay-SemiBold
    body: Inter-Regular
    body_bold: Inter-SemiBold
  web_fonts:          # used by Remotion (system Inter, OFL)
    display: "Inter Display, Inter, sans-serif"
    body: "Inter, sans-serif"
  motifs: [chapter-tags]
# Editor instruction (2026-11-05): cumulative cap for ALL OpenAI voice work on this episode.
budget:
  max_paid_usd: 1.00
youtube:
  category: Education
  default_language: en
  made_for_kids: false

# Published before the channel-intro and presenter standards (2026-11-05): kept exactly as released.
# For a future re-edit, set intro.enabled: true (and add presenter scenes or keep presenter_exempt).
intro: {enabled: false}
presenter_exempt: true
