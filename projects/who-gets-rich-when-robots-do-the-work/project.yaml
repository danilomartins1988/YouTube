title: "Who Gets Rich When Robots Do the Work?"
slug: who-gets-rich-when-robots-do-the-work
language: en
# Episode 64 (series plan docs/series/AI_WINNERS_LOSERS.md, #3; owner: produce directly, no approval step). Core flip: if AI and robots
# shrink labor's share of income, the owners of capital gain, so owning may matter as much as a job or a degree. EDUCATION, NOT
# INVESTMENT ADVICE: no buy recommendation anywhere. Findings (measured) kept apart from forecasts (models) on screen. Neutral on policy.
# US dollars only. Company figures reuse the verified Nov 2026 "Before You Buy" episode figures (latest filed quarter).
# Owner standing direction: prime-time TV-cartoon energy at GENRE level only, original cast and sets, human characters, day scenes.
# Bespoke kit: remotion/src/animation-engine/CartoonStage/robotsrich.tsx. No public figure drawn (Acemoglu, Autor, Allen, Engels named
# in narration only). No company logos (data centers and chips are generic originals; company names as text plaques only).
renderer: remotion
remotion_geo: [world]
style:
  name: cartoon-day
  palette:
    bg: "#F2F5EC"
    bg2: "#FFFFFF"
    ink: "#1B2333"
    muted: "#5E6B7D"
    land: "#A9D18E"
    border: "#2B3A55"
    accent: "#F2B33D"
    accent2: "#2A6FDB"
    accent3: "#2E9E6B"
    risk: "#D9483B"
  fonts:
    display: InterDisplay-Bold
    heading: InterDisplay-SemiBold
    body: Inter-Regular
    body_bold: Inter-SemiBold
  web_fonts:
    display: "Inter Display, Inter, sans-serif"
    body: "Inter, sans-serif"
  transition: scan
  background: grid
  motifs: [chapter-tags]
budget:
  max_paid_usd: 1.00
presenter_min: 5
intro:
  after_segment: co_hook
tts_overrides:
  openai:
    voice: ash
    tempo: 1.08
    instructions: >-
      Voice: the narrator of a smart prime-time animated show who is also a sharp economics investigator. Curious, warm and energetic,
      with a dry twinkle on the comic lines, always clear, fair and credible on facts. Pacing: brisk overall, then slow down slightly to
      land every number cleanly; a short beat after a surprising figure and before each verdict. Natural American English,
      conversational, never an announcer, never salesy, never preachy, never taking a political side.
