logline: If AI and robots shrink the share of income paid to workers, the money goes to whoever owns the machines. Using BLS and BEA
  income data, the Federal Reserve's wealth accounts, Big Tech's AI spending and the best research on AI and jobs, the film follows
  $100 of income, asks who owns the robots, revisits Britain's Engels' pause, weighs the counterarguments and explains (education, not
  advice) what ordinary people can own.
