title: Who Gets Rich When Robots Do the Work?
segments:
- id: co_hook
  chapter: Robots do the work
  narration: Meet Dana. She runs a shift at a warehouse in Ohio. This spring, the robots arrived. They don't take a salary. They don't take vacations.
    They never ask for a raise. And the warehouse is making more money than ever. So Dana has a question. If the robots do the work, who gets
    the money? Here's a clue. In America, the share of business output paid to workers has just hit {{labor_share}}. So the real question about
    AI may not be, will I keep my job? It may be, do I own any of the machines?
  claims:
  - labor_share
  source_note: Hook with fictional protagonist Dana; labor share (bls_ls).
- id: title_card
  chapter: Robots do the work
  narration: ''
  claims: []
- id: a1_link
  chapter: Follow the hundred dollars
  narration: We followed the robots in Could AI Make American Factories Cheaper Than China's, and in Could AI Bring Europe Back to Power. Now
    let's follow the money, through Dana's eyes.
  claims: []
  analysis: true
  source_note: Library link to Ep 62 and Ep 63 by title; fictional protagonist; no figures.
- id: a1_draw
  chapter: Follow the hundred dollars
  narration: Let me draw it. Picture a hundred-dollar bill that stands for everything America earns. A slice goes to the people who do the work,
    as pay and benefits. A slice goes to the owners, as profit. The rest covers machines wearing out, taxes and interest.
  claims: []
  analysis: true
  source_note: Mechanism (GDI components, bea_gdi) drawn by the presenter; the $100 bill is the film's hero object.
- id: a1_then
  chapter: Follow the hundred dollars
  narration: When Dana's dad started on the loading dock, back in the seventies, workers got {{gdi.then_spoken}} of that bill.
  claims:
  - gdi
- id: a1_now
  chapter: Follow the hundred dollars
  narration: Today, they get {{gdi}}. And the owners' slice, profit after tax, has roughly doubled.
  claims:
  - gdi
- id: a1_scale
  chapter: Follow the hundred dollars
  narration: A few dollars doesn't sound like much. But this bill stands for the whole American economy. By our rough math, that gap is worth
    {{shift}}. Not stolen. Just a split that moved.
  claims:
  - shift
- id: a1_index
  chapter: Follow the hundred dollars
  narration: The Labor Department tracks the same thing for private businesses. For decades after the war, workers' share barely budged. Then
    it started to slide. Today it's the lowest on record.
  claims:
  - labor_share
- id: a1_why
  chapter: Follow the hundred dollars
  narration: Why? Economists still argue. Global trade, a few superstar companies, and automation all get blamed. But here's what a robot adds.
    A robot is capital. When a machine does a task a person used to do, the money that paid that person now goes to whoever owns the machine.
  claims: []
  analysis: true
  source_note: Causes debated (autor_superstar); automation lowers the labor share mechanism (ar_framework). Qualitative.
- id: a2_card
  chapter: Who owns the machines?
  narration: ''
  claims: []
- id: a2_own
  chapter: Who owns the machines?
  narration: So Dana asks the obvious question. Who owns the machines? Mostly, whoever owns the company. In other words, stocks. So let's line
    up every household in America, from the least wealthy to the most, and share out a hundred dollars' worth of the stock they own.
  claims: []
  analysis: true
  source_note: Setup for the DFA split (households by wealth percentile).
- id: a2_split
  chapter: Who owns the machines?
  narration: The whole bottom half of the country, all together, gets {{equities.bottom_spoken}}.
  claims:
  - equities
- id: a2_top
  chapter: Who owns the machines?
  narration: And the richest tenth of households? They get {{equities}}. Nearly the whole pile.
  claims:
  - equities
- id: a2_pension
  chapter: Who owns the machines?
  narration: Dana's neighbor Milo, a retired bus driver, has a retirement account from work. Accounts like his are spread wider than stocks. But
    even there, the poorer households hold {{dc}}.
  claims:
  - dc
- id: a2_flip
  chapter: Who owns the machines?
  narration: Now connect the dots. If robots move money from paychecks to profits, the money climbs this ladder, to whoever holds the shares.
    For generations, getting ahead meant getting a better job. When machines do more of the work, owning a piece of them could matter just as
    much.
  claims: []
  analysis: true
  source_note: Thesis framed as a mechanism and a possibility, not a forecast.
- id: a3_card
  chapter: The new factories
  narration: ''
  claims: []
- id: a3_capex
  chapter: The new factories
  narration: And right now, the biggest machines in history are going up. Data centers for AI. Amazon, Alphabet, Microsoft and Meta spent {{capex}}
    on buildings and equipment in the past year, by our sum.
  claims:
  - capex
- id: a3_nvidia
  chapter: The new factories
  narration: Much of that money lands at the company selling the chips. In its latest quarter, Nvidia kept {{nvda}} as profit.
  claims:
  - nvda
- id: a3_loop
  chapter: The new factories
  narration: Let me draw the loop. A business pays for AI instead of hiring. That money goes to a cloud company. The cloud company buys chips
    and builds data centers. Profits flow to the shareholders of both.
  claims: []
  analysis: true
  source_note: Mechanism drawn by the presenter; no figures.
- id: a3_missing
  chapter: The new factories
  narration: Now notice who's missing from the loop. The worker whose task was automated. Unless that worker also owns shares.
  claims: []
  analysis: true
  source_note: Mechanism; no figures.
- id: a3_risk
  chapter: The new factories
  narration: But it's a bet, not a guarantee. Some of this spending may never pay off. Over the past year, Amazon spent {{amzn_fcf}}. Owners get
    the upside. Owners also carry the risk.
  claims:
  - amzn_fcf
- id: a4_card
  chapter: What the evidence says
  narration: ''
  claims: []
- id: a4_find
  chapter: What the evidence says
  narration: So is AI already moving money from people like Dana to the owners? Let's separate what's been measured from what's been predicted.
    First, a finding. When a company gave its customer-support agents an AI assistant, they {{bryn}}, and the newest, least experienced agents
    gained the most.
  claims:
  - bryn
- id: a4_denmark
  chapter: What the evidence says
  narration: In Denmark, researchers matched chatbot use with official payroll records. Since ChatGPT arrived, they've found {{humlum}}.
  claims:
  - humlum
- id: a4_young
  chapter: What the evidence says
  narration: But in America, payroll data shows something to watch. Among the youngest workers in the jobs most exposed to AI, employment is {{canaries}}
    where it would otherwise be. Experienced workers show no such gap. The researchers call it an early warning, not proof.
  claims:
  - canaries
- id: a4_robots
  chapter: What the evidence says
  narration: Factory robots have a longer record. Economists found that American towns that added more robots saw {{robots}}.
  claims:
  - robots
- id: a4_forecast
  chapter: What the evidence says
  narration: Then there are forecasts. MIT economist Daron Acemoglu predicts AI will give productivity {{acemoglu}} over the next decade, and
    widen the gap between what capital earns and what work earns. That's a model, not a measurement. Forecasts differ widely.
  claims:
  - acemoglu
- id: a5_card
  chapter: We've been here before
  narration: ''
  claims: []
- id: a5_britain
  chapter: We've been here before
  narration: And this has happened before. Britain, the age of steam. Machines multiplied what every worker could make. Factory owners grew rich.
    Workers' pay barely moved.
  claims: []
  analysis: true
  source_note: Setup; sourced in a5_draw (allen).
- id: a5_draw
  chapter: We've been here before
  narration: Economic historian Robert Allen measured it. Let me draw his story. Output per worker kept climbing. Real wages stayed flat. The
    profit rate doubled. Historians call it Engels' pause, after Friedrich Engels, who described the factory workers of Manchester.
  claims: []
  analysis: true
  source_note: 'Allen (2009) abstract (allen): real wage stagnated while output per worker expanded; profit rate doubled; profit share rose.'
- id: a5_end
  chapter: We've been here before
  narration: Then, around the middle of the eighteen hundreds, wages finally began to rise with productivity. The pause ended. But it lasted decades.
    For the workers who lived through it, eventually came too late.
  claims: []
  analysis: true
  source_note: 'Allen (2009): after mid-century real wages grew in line with productivity; factor shares stabilized.'
- id: a6_card
  chapter: The case against the doom story
  narration: ''
  claims: []
- id: a6_newjobs
  chapter: The case against the doom story
  narration: Now, the other side. First, new jobs. A team led by economist David Autor found that {{newwork}} Americans today work in job specialties
    that didn't exist in nineteen forty. Machines take over tasks. New kinds of work keep appearing.
  claims:
  - newwork
- id: a6_wages
  chapter: The case against the doom story
  narration: Second, productivity can lift pay. When things get cheaper to make, people buy more. And workers who use AI well can become more
    valuable. Like Dana, who now runs the robot fleet.
  claims: []
  analysis: true
  source_note: Productivity and new-task effects (ar_framework); support-agent finding (bryn). Dana is fictional.
- id: a6_degree
  chapter: The case against the doom story
  narration: Third, skills still pay. A full-time worker with at least a bachelor's degree typically earns {{degree}} than a high school graduate.
  claims:
  - degree
- id: a6_policy
  chapter: The case against the doom story
  narration: And fourth, policy can change the split. Some want to spread ownership wider, with employee ownership, accounts for kids, or public
    funds like Alaska's oil dividend, which we covered in another film. Others prefer training, or changing how work and capital are taxed. Others
    say markets will sort it out. Each has trade-offs. This film takes no side.
  claims: []
  analysis: true
  source_note: Neutral list of policy options (no advocacy); Ep 48 Alaska referenced by subject only.
- id: a7_card
  chapter: What can you actually own?
  narration: ''
  claims: []
- id: a7_now
  chapter: What can you actually own?
  narration: So Dana asks the practical question. What can an ordinary person actually own? Quick note. This is education, not investment advice.
    We're not telling anyone what to buy. Most American families own at least some stock, often through a retirement account. But among lower-income
    families, {{scf.bottom_spoken}} do.
  claims:
  - scf
- id: a7_doors
  chapter: What can you actually own?
  narration: Let me draw the doors. The most common is a workplace retirement account, like a four-oh-one-k. Inside, many people hold index funds,
    which own small slices of hundreds of companies at once. Some employers offer stock plans. Employee stock ownership plans alone cover {{esop}}.
  claims:
  - esop
- id: a7_risk
  chapter: What can you actually own?
  narration: But owning isn't free money. Stock prices can fall hard and take years to recover. Fees eat returns. And betting your savings on
    your own employer, or on a single hot company, piles risk on risk. Owning a slice of the machines means sharing their bad years too.
  claims: []
  analysis: true
  source_note: General risk education; no figures, no recommendation.
- id: a8_card
  chapter: Who gets rich?
  narration: ''
  claims: []
- id: a8_verdict
  chapter: Who gets rich?
  narration: So, who gets rich when robots do the work? On the evidence so far, mostly the people who own them. The shareholders of the companies
    that build, sell and run the machines. And in America, that's a group where the richest tenth hold nearly the whole pile.
  claims:
  - equities
- id: a8_but
  chapter: Who gets rich?
  narration: But it doesn't have to stay that narrow. History says pay can catch up, after a delay. New jobs do appear. And ownership isn't a
    closed club. {{scf}} of American families already own some stock, even if most own very little.
  claims:
  - scf
- id: a8_close
  chapter: Who gets rich?
  narration: For generations, the big money question was, what do you do for a living? Dana's question now has a second part. What do you own?
  claims: []
  analysis: true
  source_note: Closing line; no figures.
- id: teaser
  chapter: Who gets rich?
  narration: Next time, we follow the money behind another hidden link of the world economy. This is The Hidden Economics.
  claims: []
  analysis: true
  source_note: Generic closing teaser (channel rule).
- id: button
  chapter: Who gets rich?
  narration: ''
  claims: []
