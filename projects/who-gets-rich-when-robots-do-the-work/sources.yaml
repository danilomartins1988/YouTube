# Sources and claims for "Who Gets Rich When Robots Do the Work?" (Episode 64; series plan docs/series/AI_WINNERS_LOSERS.md).
# Every claim was read on its primary page, dataset or filing on 2026-11-18 (notes: docs/episodes/64-robots-rich/RESEARCH_NOTES.md).
# Status stays source_located until a named human reviewer signs off. US dollars only.
# FINDINGS vs FORECASTS: research claims are tagged on screen FINDING (measured), FORECAST (model/projection) or DESCRIPTIVE (not causal).
# Company figures reuse the verified figures of our "Before You Buy" episodes (Nov 2026; FACT_CHECK.md in docs/episodes/byb-*),
# which are still the latest filed quarter (calendar Q3 2026; Nvidia fiscal Q3 2027) on 2026-11-18.
# Ownership section is EDUCATION, NOT INVESTMENT ADVICE: no product, fund or stock is recommended.
