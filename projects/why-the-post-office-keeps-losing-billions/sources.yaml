# Sources and claims for "Why the Post Office Keeps Losing Billions" (Episode 47, new topics N7).
# Every claim was read on its primary page/file on 2026-11-10 (notes: docs/episodes/47-post-office/RESEARCH_NOTES.md).
# Status stays source_located until a named human reviewer signs off. US dollars.
# RULES: headline numbers from USPS press releases (10-K PDF was a draft copy); one source per volume figure;
# "generally receives no tax dollars for operating expenses" (exact wording); 2006 law payments "roughly $5.5bn a year";
# our calculations labelled; no privatization proposal attributed to anyone.
