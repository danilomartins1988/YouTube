# Short pt-BR (~55-60 s). Educativo; não é consultoria tributária. Fatos: sources.yaml / RESEARCH_NOTES.md
logline: A Receita propôs dar 30 dias a mais para o acerto definitivo da CBS em 2027, mas isso ainda precisa passar no Congresso.
title: 'Receita quer 30 dias a mais para o acerto da CBS'
segments:
- id: s1
  chapter: ''
  narration: A Receita quer te dar trinta dias a mais para pagar o novo imposto. Mas tem um porém.
  claims: [plp]
- id: s2
  chapter: ''
  narration: O imposto é a CBS, a nova contribuição federal da reforma tributária, que vai substituir o PIS e a Cofins a partir de 2027.
  claims: [cbs]
- id: s3
  chapter: ''
  narration: Pela proposta anunciada pela Receita nesta semana, a empresa paga primeiro uma estimativa e só faz o acerto definitivo um mês depois.
  claims: [plp, how]
- id: s4
  chapter: ''
  narration: Funciona assim. Vendeu em janeiro de 2027? Paga a estimativa em fevereiro e acerta a conta em março.
  claims: [how]
- id: s5
  chapter: ''
  narration: O motivo é o caixa. No começo, a maioria das empresas ainda não vai ter créditos para abater, e a ideia é dar tempo para conferir impostos e créditos antes de fechar a conta.
  claims: [why]
- id: s6
  chapter: ''
  narration: Agora, o porém. Isso ainda é só uma proposta. Como muda a forma de apuração prevista em lei, precisa de um projeto de lei complementar aprovado pelo Congresso.
  claims: [plp]
- id: s7
  chapter: ''
  narration: Se você tem empresa, vale acompanhar de perto, porque a CBS começa pra valer em janeiro de 2027. Segue pra acompanhar a reforma tributária.
  claims: [cbs]
