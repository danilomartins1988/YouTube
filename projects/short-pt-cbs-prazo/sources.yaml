claims:
  - id: plp
    text: "Fazenda enviará ao Congresso um projeto de lei complementar para ampliar em 30 dias o prazo de pagamento definitivo da CBS; depende de aprovação do Congresso (Barreirinhas, 11/11/2026)."
    spoken: trinta dias
    display: "+30 dias (proposta)"
    source_ids: [idn, bn, ce]
    status: source_located
  - id: cbs
    text: "CBS: novo tributo federal da reforma tributária; substituirá o PIS e a Cofins a partir de 2027."
    spoken: CBS
    display: "CBS substitui PIS e Cofins (2027)"
    source_ids: [idn, bn]
    status: source_located
  - id: how
    text: "Pagamento inicial por estimativa no mês seguinte às operações; acerto definitivo dois meses após as vendas. Exemplo: vendas em janeiro de 2027, estimativa em fevereiro, acerto em março."
    spoken: estimativa
    display: "Jan → Fev → Mar"
    source_ids: [idn]
    status: source_located
  - id: why
    text: "Objetivo: mais tempo para conferir valores e créditos; evitar problemas de fluxo de caixa; no início a maioria das empresas ainda não terá créditos para abater (primeiro recolhimento previsto para o fim de fevereiro de 2027)."
    spoken: fluxo de caixa
    display: "Alívio de caixa"
    source_ids: [idn, bn]
    status: source_located
