claims:
  - id: cap
    text: "CSC (Oct 1, 2026): revenue-sharing cap $20.5M per school in 2025-26 and $21.58M in 2026-27; year one $1,770,453,776 paid in revenue sharing (total tracked $1.976bn incl. Alston awards and scholarships) to 34,915 athletes at 307 schools; 319 schools opted in; 68 reached the cap or came within 5%."
    spoken: twenty point five million dollars
    display: "Revenue-sharing cap $20.5M per school (2025-26, CSC)"
    fields: {next_spoken: twenty-one point five eight million dollars, paid_spoken: about one point seven seven billion dollars, athletes_spoken: almost thirty-five thousand}
    source_ids: [csc]
    status: source_located
    verification_note: CSC figures.

  - id: deal
    text: "Final approval order (Jun 6, 2025, Judge Wilken): damages '$2.576 billion in total', 'paid yearly over the course of ten years' ($1.976bn NIL fund + $600M); class of 389,700; schools may share 'up to 22% of the Power Five schools' average athletic revenues each year, subject to specified yearly increases'; plaintiffs' expert estimate: more than $20M per school in 2025-26, $32.9M by 2034-35, and 115,000+ additional scholarships (estimates). Schools 'free to allocate' in a Title IX-compliant way; Title IX claims not released. Appeals pending."
    spoken: about two point six billion dollars
    display: "≈ $2.6bn back damages over 10 years (court order)"
    fields: {share_spoken: up to twenty-two percent}
    source_ids: [order]
    status: source_located
    verification_note: Expert projections said as estimates; appeals pending.

  - id: roster
    text: "NCAA (Jun 23, 2025): Division I rules 'no longer include sport-specific scholarship limits'; roster limits from July 1, 2025 - football 105, basketball 15, baseball 34, softball 25, golf 9; athletes cut or who would have been cut are exempt for their careers."
    spoken: one hundred and five
    display: "Roster limits replace scholarship caps (football 105)"
    fields: {}
    source_ids: [ncaa]
    status: source_located
    verification_note: As adopted.

  - id: nilgo
    text: "CSC NIL Go: reviews third-party NIL deals of $600 or more for a 'valid business purpose' and 'a reasonable range of compensation'. Through Oct 31, 2026: 56,570 deals cleared ($775.11M), 2,877 not cleared ($177.14M). Jan-Feb 2026: deals with associated entities at Power 4 schools up 364% in value."
    spoken: two thousand eight hundred and seventy-seven
    display: "2,877 deals not cleared ($177M) by NIL Go (CSC)"
    fields: {}
    source_ids: [csc]
    status: source_located
    verification_note: Operator not named on CSC pages (not said).

  - id: money
    text: "Ohio State FY2025: athletics revenue $336,077,887, expenses $320,394,965, media rights $64.9M (≈ $15.7M difference, our calculation). SEC distributed $1.03bn to its 16 schools for FY2024-25. Stephen F. Austin (May 22, 2025) cut bowling, men's and women's golf and beach volleyball, citing 'the anticipated financial impact of upcoming revenue-sharing requirements'."
    spoken: three hundred and thirty-six million dollars
    display: "Ohio State athletics: $336M revenue, $320M expenses (FY2025)"
    fields: {sec_spoken: one point zero three billion dollars}
    source_ids: [schools]
    status: source_located
    verification_note: Difference our calculation.

  - id: law
    text: "Johnson v. NCAA (3d Cir., Jul 11, 2024): vacated and remanded for 'an economic realities analysis'; athletes 'cannot be barred as a matter of law' from FLSA claims by amateurism. Senate passed the Protect College Sports Act (S. 4668) 77-22 on Sep 28, 2026; House has not voted (not law). Executive Order 14400 (Apr 3, 2026): revenue sharing that 'preserves or expands' women's and Olympic sports; main sections effective Aug 1, 2026."
    spoken: seventy-seven to twenty-two
    display: "Senate passed 77-22; not law yet (Sep 2026)"
    fields: {}
    source_ids: [law]
    status: source_located
    verification_note: Bills pending (said).
