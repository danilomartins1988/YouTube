# Documentary (target 11-13 min). Five parts as an INTERNAL structure only (never narrated or shown as missions).
# Hook rules (docs/ANALYSIS_HOOKS_THUMBS_VISUALS.md): cold open on the number, four short beats, explicit promise,
# no "What if", channel intro after part 1, no separate part-question scenes.
# Numbers come from sources.yaml via {{placeholders}}; estimates, pending appeals and bills said as such.
logline: For a century, college athletes could not be paid by their schools. Now each school may pay them up to 20.5 million
  dollars a year. How a court settlement created a payroll, who pays for it, and which teams get cut.
title: College Sports Just Got a $20.5 Million Payroll
segments:
- id: h_open
  chapter: Twenty point five million
  narration: Twenty point five million dollars. That is how much each big college athletic department was allowed to pay its
    own athletes directly, in the school year that started in twenty twenty-five.
  claims:
  - cap
- id: h_twist
  chapter: Twenty point five million
  narration: For more than a century, college sports ran on one idea. The players were amateurs, and their schools could not
    pay them a salary. In its first year, the new system paid out {{cap.paid_spoken}} to athletes.
  claims:
  - cap
- id: h_question
  chapter: Twenty point five million
  narration: So how did college sports suddenly get a payroll? And who ends up paying for it?
  claims: []
  analysis: true
  source_note: Hook question built from the sourced figures.
- id: h_promise
  chapter: Twenty point five million
  narration: By the end of this video, you will know how a court case created this payroll, how the money is split, who checks
    the deals, and why some smaller sports are paying the price.
  claims: []
  analysis: true
  source_note: Promise of the episode (hook rule).
- id: m1_card
  chapter: The settlement
  narration: ''
  claims: []
- id: m1_case
  chapter: The settlement
  narration: It started with a class action by college athletes against the NCAA and the biggest conferences. The case was about money
    from the athletes' names, images and likenesses, including the television deals built on their games. Most of the damages,
    about two billion dollars, were set aside for exactly that, the athletes' share of name and image money from the past.
  claims:
  - deal
- id: m1_order
  chapter: The settlement
  narration: In June twenty twenty-five, federal judge Claudia Wilken gave final approval to a settlement. The back damages alone
    came to {{deal}}, to be paid every year over ten years, to a class of almost three hundred and ninety thousand current and
    former athletes.
  claims:
  - deal
- id: m1_future
  chapter: The settlement
  narration: But the real change was about the future. Schools may now share revenue directly with their athletes, {{deal.share_spoken}}
    of the average athletic revenue of the biggest conferences, with set increases every year. In the first year, that cap was
    {{cap}} per school.
  claims:
  - deal
  - cap
- id: m1_rises
  chapter: The settlement
  narration: And it keeps rising. For the twenty twenty-six season, the cap went up to {{cap.next_spoken}}. The plaintiffs'
    own expert estimated that by the middle of the next decade, it could approach thirty-three million dollars per school. That
    is an estimate, not a promise.
  claims:
  - cap
  - deal
- id: m1_draw
  chapter: The settlement
  narration: Let me draw the pie. Here is a big conference school's athletic revenue, one circle. Television money, tickets,
    donations. Now cut a slice, up to twenty-two percent. That slice is the payroll. The rest still has to pay for coaches,
    stadiums, travel and every other team.
  claims:
  - deal
  analysis: true
  source_note: Diagram of the settlement's revenue-sharing pool (commentary).
- id: m1_transition
  chapter: The settlement
  narration: So where did that money go in the first year? The new regulator of college sports has the numbers.
  claims:
  - cap
- id: m2_card
  chapter: Year one
  narration: ''
  claims: []
- id: m2_paid
  chapter: Year one
  narration: The College Sports Commission, created to police the new system, reported its first-year results in October twenty
    twenty-six. Schools paid about one point seven seven billion dollars in revenue sharing, to {{cap.athletes_spoken}} athletes,
    at three hundred and seven schools.
  claims:
  - cap
- id: m2_total
  chapter: Year one
  narration: Counting everything the commission tracks, including scholarships and education awards, payments to athletes reached
    about one point nine eight billion dollars in that first year. For context, that is about the same as the entire ten-year damages fund
    for name and image rights, paid out in a single season.
  claims:
  - cap
  - deal
- id: m2_who
  chapter: Year one
  narration: Not every school went all in. Of the three hundred and nineteen schools that opted into the system, sixty-eight hit
    the cap or came within five percent of it. Most schools in the system paid less than the maximum, because most
    schools simply do not have that kind of money.
  claims:
  - cap
- id: m2_tv
  chapter: Year one
  narration: That television money is huge. The Southeastern Conference alone distributed {{money.sec_spoken}} to its sixteen schools
    for the twenty twenty-four twenty-five year. For a school in a conference like that, a twenty million dollar payroll is a big
    bill, but a payable one.
  claims:
  - money
- id: m2_ohio
  chapter: Year one
  narration: Look at one of the richest programs. Ohio State reported record athletic revenue of about {{money}} in fiscal year
    twenty twenty-five, and expenses of about three hundred and twenty million. By our calculation, the difference was about
    fifteen point seven million dollars. Less than one year's payroll cap.
  claims:
  - money
- id: m2_draw
  chapter: Year one
  narration: Let me draw the budget. Here is the revenue bar. Here is the expense bar, almost as tall. The gap between them is
    thin. Now add a twenty million dollar payroll on top of the expenses. Even a record year does not cover it without changes
    somewhere else.
  claims:
  - money
  analysis: true
  source_note: Bar diagram of Ohio State FY2025 figures plus the cap (our calculation).
- id: m2_transition
  chapter: Year one
  narration: And changes did come. Starting with the size of every team.
  claims:
  - roster
- id: m3_card
  chapter: Fewer seats
  narration: ''
  claims: []
- id: m3_roster
  chapter: Fewer seats
  narration: The old system limited how many scholarships a team could give. The new one limits how many athletes a team can
    have at all. Football rosters are capped at {{roster}}. Basketball at fifteen. Baseball at thirty-four. Softball at twenty-five. Golf at nine. The plaintiffs' expert estimated that removing the old
    scholarship caps could open more than one hundred and fifteen thousand new scholarships across the country, another estimate,
    not a count.
  claims:
  - roster
- id: m3_exempt
  chapter: Fewer seats
  narration: Any school may now give a scholarship to every athlete on its roster, if it can afford to. But for walk-ons, the
    players who joined teams without scholarships, the new limits could mean losing a spot. Athletes who were cut, or would
    have been, are exempt from the limits for the rest of their college careers.
  claims:
  - roster
- id: m3_cuts
  chapter: Fewer seats
  narration: Some schools cut whole sports. Stephen F. Austin State University in Texas dropped bowling, both golf teams and
    beach volleyball. The university said it was responding to the anticipated financial impact of the coming revenue-sharing
    requirements.
  claims:
  - money
- id: m3_titleix
  chapter: Fewer seats
  narration: That raises a legal question. Title IX, the federal law against sex discrimination in education, applies to college
    sports. The judge said schools are free to divide the money in a way that complies with Title IX, and the settlement does not
    release Title IX claims. Lawsuits over the split are still pending.
  claims:
  - deal
- id: m3_draw
  chapter: Fewer seats
  narration: Let me draw the bench. Here is a football team, one hundred and five seats. Before, the roster could be bigger, with
    walk-ons at the end of the bench. Now the bench has a hard edge. And next to it, the smaller sports, some with an empty bench.
  claims:
  - roster
  - money
  analysis: true
  source_note: Illustrative diagram of roster limits and cut programs.
- id: m3_transition
  chapter: Fewer seats
  narration: There is one more source of money for athletes. And it has its own referee.
  claims:
  - nilgo
- id: m4_card
  chapter: The referee
  narration: ''
  claims: []
- id: m4_nil
  chapter: The referee
  narration: Athletes can still sign deals with outside companies for their name, image and likeness, known as NIL. But now
    any outside deal worth six hundred dollars or more is reviewed by a clearinghouse called NIL Go. It checks whether the deal
    has a valid business purpose, and whether the pay is in a reasonable range.
  claims:
  - nilgo
- id: m4_numbers
  chapter: The referee
  narration: The results are public. Through October twenty twenty-six, more than fifty-six thousand deals were cleared, worth
    about seven hundred and seventy-five million dollars. And {{nilgo}} deals were not cleared, worth about one hundred and
    seventy-seven million.
  claims:
  - nilgo
- id: m4_boosters
  chapter: The referee
  narration: The commission's data also showed something telling. In early twenty twenty-six, the value of deals with entities
    associated with the big schools, often booster groups, rose by three hundred and sixty-four percent. The line between a
    sponsorship and a disguised salary is exactly what the referee is trying to police.
  claims:
  - nilgo
- id: m4_draw
  chapter: The referee
  narration: Let me draw the checkpoint. Here comes a line of deals. Most of them pass through. A few are stopped. By our calculation,
    almost one in every five dollars of the deals reviewed was in a deal that did not clear. The checkpoint is where the money
    meets the rules.
  claims:
  - nilgo
  analysis: true
  source_note: Diagram of NIL Go results (our calculation of the dollar share).
- id: m4_transition
  chapter: The referee
  narration: Which leaves the biggest question of all. Are these athletes students, or employees?
  claims:
  - law
- id: m5_card
  chapter: Students or employees
  narration: ''
  claims: []
- id: m5_johnson
  chapter: Students or employees
  narration: In twenty twenty-four, a federal appeals court ruled in a case called Johnson versus the NCAA. It said athletes
    cannot be barred from claiming wages just because they are called amateurs. Courts must look at the economic reality of
    what they do. The court sent the case back to a lower court to do exactly that, and the question is still open.
  claims:
  - law
- id: m5_congress
  chapter: Students or employees
  narration: Washington is trying to write the rules. In April twenty twenty-six, the President signed an executive order asking
    for revenue sharing that preserves or expands women's and Olympic sports. Its main sections took effect in August. An executive
    order can push the schools, but it cannot rewrite the settlement or the labor laws on its own. In September, the Senate passed a bill called the Protect
    College Sports Act, {{law}}. The House has not voted on it, so it is not law.
  claims:
  - law
- id: m5_draw
  chapter: Students or employees
  narration: Let me draw the two doors. One door says student, with scholarships and classes. The other says employee, with
    wages and contracts. Today's athletes stand in the hallway between them, with a payroll in one hand and a student ID in the
    other.
  claims:
  - law
  analysis: true
  source_note: Diagram of the unresolved legal status (commentary).
- id: payoff
  chapter: The lesson
  narration: So how did college sports get a twenty million dollar payroll? Because a court decided the old rules could not
    stand, and the schools agreed to pay. The money is real, but it comes from the same budgets that fund every other team. The
    rich programs can carry it. The rest are deciding which seats to remove. For the athletes, the money is real. For the smaller sports, the question is whether
    there will still be a team to play on. And the courts and Congress have not yet said who the players really are.
  claims:
  - cap
  - money
  analysis: true
  source_note: Conclusion drawn from the sourced parts.
- id: teaser
  chapter: The lesson
  narration: Next time on The Hidden Economics, we follow the money behind another hidden link of the world economy. This
    is The Hidden Economics.
  claims: []
  analysis: true
  source_note: Generic teaser (channel rule).
