# Sources and claims for "Why Banks Still Make Billions From Overdrafts" (Episode 46, new topics N6).
# Every claim was read on its primary page/file on 2026-11-10 (notes: docs/episodes/46-overdrafts/RESEARCH_NOTES.md).
# Status stays source_located until a named human reviewer signs off. US dollars.
# RULES: CFPB revenue = banks with more than $1bn in assets (credit unions excluded), latest official year 2023;
# 2024/2025 totals are third-party analyses of call reports (said, with who); $35 = median at institutions over $10bn;
# frequent-overdrafter shares are 2011-12 data (said as "a CFPB study"); Senate tally not used; BofA fee amount not used.
