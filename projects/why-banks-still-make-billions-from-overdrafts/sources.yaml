claims:
  - id: revenue
    text: "CFPB (Apr 24, 2024): reporting banks' overdraft/NSF revenue $11.96bn in 2019 and $5.83bn in 2023, down 51% ($6.13bn); about $185 a year saved per overdrafting household; 617 banks with assets over $1bn; credit unions excluded. Latest official data year: 2023."
    spoken: five point eight three billion dollars
    display: "Overdraft/NSF revenue $5.83bn in 2023 (CFPB, banks > $1bn)"
    fields: {y2019_spoken: eleven point nine six billion dollars, hh_spoken: one hundred and eighty-five dollars}
    source_ids: [cfpb23]
    status: source_located
    verification_note: Banks over $1bn only (said).

  - id: fee
    text: "CFPB (Dec 2023): median overdraft fee $35 among the 119 institutions over $10bn that charge one; median NSF fee $32. CFPB 2014 Data Point: median debit card transaction that led to an overdraft $24. Wells Fargo: $35 per item, up to 3 a day."
    spoken: thirty-five dollars
    display: "Median overdraft fee $35 (largest banks, CFPB)"
    fields: {debit_spoken: twenty-four dollars}
    source_ids: [cfpbfee, banks]
    status: source_located
    verification_note: Median at institutions over $10bn.

  - id: who
    text: "CFPB Data Point (2017, 2011-12 account data): 9.1% of accounts paid 78.7% of overdraft and NSF fees; accounts with more than 20 a year (4.9%) paid 63.3%. CFPB 2014: 8% of customers incur nearly 75% of fees."
    spoken: about nine percent
    display: "≈ 9% of accounts paid ≈ 79% of fees (CFPB study)"
    fields: {}
    source_ids: [cfpbfee]
    status: source_located
    verification_note: 2011-12 account data (said as a CFPB study).

  - id: rege
    text: "Federal Reserve (Nov 12, 2009): no overdraft fees on ATM and one-time debit card transactions unless the consumer opts in; effective July 1, 2010 (existing accounts Aug 15, 2010). CFPB 2013 white paper: posting high-to-low can increase overdrafts. CFPB Circular 2022-06 (Oct 26, 2022): 'authorize positive, settle negative' fees likely unfair; Supervisory Highlights 29 (2023): at least tens of millions in injury, refunds to over 170,000 consumers."
    spoken: twenty ten
    display: "Opt-in rule for debit and ATM overdrafts (July 1, 2010)"
    fields: {}
    source_ids: [rege, apsn, cfpbfee]
    status: source_located
    verification_note: Circular later withdrawn (2025, via summaries) - not narrated.

  - id: retreat
    text: "Capital One (Dec 1, 2021): ending all overdraft and NSF fees (early 2022). Wells Fargo (Jan 11, 2022): ending NSF and overdraft-protection transfer fees; 24-hour grace period; $35 overdraft fee kept. Citi (Feb 24, 2022): ending overdraft, returned-item and overdraft-protection fees 'by this Summer'; 'the only top five U.S. bank' to do so. Chase (2021): $50 cushion, no returned-item fee. Bank of America 2022 10-K: service charges down $1.1bn 'primarily driven by the impact of non-sufficient funds and overdraft policy changes'."
    spoken: one point one billion dollars
    display: "Big banks cut or ended overdraft fees (2021-22)"
    fields: {}
    source_ids: [banks]
    status: source_located
    verification_note: BofA fee amount not used.

  - id: rule
    text: "CFPB final rule (Dec 12, 2024): institutions over $10bn; options: $5 fee, a fee that covers costs and losses, or treat overdraft as a loan under TILA; 'up to $5 billion in annual overdraft fee savings', $225 per overdrafting household; effective Oct 1, 2025."
    spoken: five dollars
    display: "Rule: $5 overdraft fee option (CFPB, Dec 2024)"
    fields: {save_spoken: up to five billion dollars a year, hh_spoken: two hundred and twenty-five dollars}
    source_ids: [rule]
    status: source_located
    verification_note: Savings are CFPB projections (said).

  - id: repeal
    text: "Public Law 119-10 (S.J.Res. 18), approved May 9, 2025: the rule (89 FR 106768) 'shall have no force or effect'. House passed 217-211 on Apr 9, 2025 (Roll Call 96). Senate passed it in March 2025 (CRS)."
    spoken: May ninth, twenty twenty-five
    display: "Rule repealed by Congress (Public Law 119-10, May 9, 2025)"
    fields: {}
    source_ids: [repeal]
    status: source_located
    verification_note: Senate tally not used.

  - id: since
    text: "Bates White (Aug 11, 2025): banks over $1bn collected about $6.1bn in 2024, about 3% more than 2023; JPMorgan Chase and Wells Fargo each $1bn or more. CFA (Apr 7, 2025): banks over $10bn $4.88bn in 2024; JPMorgan Chase $1.028bn. NCLC (Jun 2026), citing the Financial Health Network: an estimated $12.1bn of overdraft and NSF fees in 2024 including credit unions. Wells Fargo 10-K: deposit-related fees (which include overdraft) $5,099m in 2025."
    spoken: about six point one billion dollars
    display: "≈ $6.1bn in 2024, banks > $1bn (Bates White analysis)"
    fields: {cfa_spoken: four point eight eight billion dollars, jpm_spoken: about one billion dollars, all_spoken: about twelve point one billion dollars}
    source_ids: [after]
    status: source_located
    verification_note: Third-party analyses of call reports (said, with who).
