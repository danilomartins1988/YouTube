title: "Why the World Still Depends on Chinese Factories"
slug: why-the-world-still-depends-on-chinese-factories
language: en
# Episode 60 (owner request, 2026-11-17; "Pode produzir direto sem precisar aprovar"). Category: countries. EVERGREEN: structural
# explanation first; every figure that will change is dated (year or "as of" date) on screen and in narration.
# Owner creative direction (as Ep 56): feel like an actual episode of a prime-time animated TV sitcom (genre level only: all
# characters, designs, names, title card text and music are original). Visual direction: visual_direction.yaml.
# Five-part structure internal only. Money: US dollars only (yuan converted at the Fed G.5A 2025 average, marked ≈).
# Respectful and neutral toward China and its people: no stereotypes, no mocking, no national caricature; Chinese characters are
# ordinary competent professionals. No public figure is central (tariff history is told through documents): no caricatures.
renderer: remotion
remotion_geo: [world]
style:
  name: cartoon-day
  palette:
    bg: "#F3F7F4"
    bg2: "#FFFFFF"
    ink: "#16232E"
    muted: "#66727E"
    land: "#A9D18E"
    border: "#2B4A5E"
    accent: "#FF9F1C"
    accent2: "#1F7A8C"
    accent3: "#2E9E5B"
    risk: "#E5484D"
  fonts:
    display: InterDisplay-Bold
    heading: InterDisplay-SemiBold
    body: Inter-Regular
    body_bold: Inter-SemiBold
  web_fonts:
    display: "Inter Display, Inter, sans-serif"
    body: "Inter, sans-serif"
  transition: scan
  background: grid
  motifs: [chapter-tags]
budget:
  max_paid_usd: 1.00
presenter_min: 4
# TV structure: cold open (hook) -> channel intro (the "theme") -> show title card -> acts.
intro:
  after_segment: co_promise
# Channel voice stays "ash"; lively comedic-documentary delivery for this sitcom-style episode.
tts_overrides:
  openai:
    voice: ash
    instructions: >-
      Voice: the narrator of a smart prime-time animated comedy who is also a sharp economics documentarian. Warm, wry
      and lively, with a playful twinkle on the jokes and dry deadpan on the punchlines, but always clear, fair and credible on
      facts. Pacing: brisk in the comic beats, then slow down noticeably and land every number and date cleanly. Take a short
      beat before a punchline and after a surprising figure. Natural American English, conversational, never an announcer,
      never salesy, never sing-song, never mocking.
