  bg: '#F3F7F4'
  bg2: '#FFFFFF'
  ink: '#16232E'
  muted: '#66727E'
  land: '#A9D18E'
  border: '#2B4A5E'
  accent: '#FF9F1C'
  accent2: '#1F7A8C'
  accent3: '#2E9E5B'
  risk: '#E5484D'
presenter:
  demeanor: warm
  min_sequences: 4
chapters:
- chapter: Cold open
  tone: sitcom
- chapter: The everything factory
  tone: sitcom
- chapter: Everything is down the street
  tone: trade
- chapter: The tariff wall
  tone: sitcom
- chapter: China plus one
  tone: trade
- chapter: Why it's hard to leave
  tone: sitcom
turning_points: []
thumbnail:
  tone: sitcom
  headline: [MADE IN CHINA., STILL.]
  idea: a surprised shopper holding a big MADE IN CHINA label (face layout); standard concept = a giant cardboard box stamped MADE IN CHINA with little legs, walking back
requirements:
- No company logos or brand names on products, signs or ships; generic products only
- No real flag designs; countries are named in text only
- No national-stereotype caricature, accent jokes, or mocking of any people; Chinese workers and engineers shown as skilled professionals
- No character, design, name, catchphrase, location, title text or music borrowed from any existing show
- Jokes never change a number; our calculations and the 2022 IEA solar figures labelled on screen; tariff rates dated
- Day scenes, many generic human characters; no real person drawn
