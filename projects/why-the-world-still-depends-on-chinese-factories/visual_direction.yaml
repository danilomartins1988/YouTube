# Visual direction for why-the-world-still-depends-on-chinese-factories (APPLIED by the pipeline; see hiddeneco/visual_direction.py).
# Director's edit (Ep 60). OWNER DIRECTION (as Ep 56): feel like an actual episode of a prime-time animated TV sitcom, as animated as
# possible. Genre level only: every character, design, name, title card, caption and sound is original. Craft: cold open gag (Mel's
# toaster dies) -> channel intro (the "theme") -> show title card with a typed joke subtitle -> four acts, each opened by a bumper
# with a changing joke caption -> payoff -> end card -> button joke.
# RUNNING GAG: Mel's replacement GIZMO (a toaster) is built from parts that keep arriving by drone, and every parcel lands from the
# same place ("FROM: DOWN THE STREET"); in the moving act, the shipping boxes walk back home on little legs. Button: she finally
# toasts... and the plug's tag gets the last word.
# Recurring cast (original, toon rig): MEL (American shopper, fictional), WEI (line engineer, fictional; a competent, friendly
# professional, never a stereotype), KIP (relocation consultant, fictional, over-confident), generic workers; robots BUZZ (drone),
# LIFT (forklift); new items: gizmo (the toaster being assembled), homebox (a box with legs that walks back), container stacks.
# Bespoke sets (new, CartoonStage/factory.tsx, day scenes): megafloor (the everything factory floor), partsstreet (supplier-cluster
# street), megaport (container port), refinery (rare-earth separation hall), solarline (solar panel line), tariffwall (a wall that
# grows with dated bricks 2018-2026), movingday (a factory trying to move abroad), plus the show title card and act bumper.
# Tone: bright industrial "trade" world; history tint for the tariff timeline; never mocking toward China or its people.
primary_tone: sitcom
secondary_tones:
- trade
- history
