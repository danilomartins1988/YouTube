requirements:
- No company logos (no smile arrow); generic boxes, conveyors, servers only; no likeness of real people
- FCF negative: no reverse calc on FCF; GAAP P/E flagged (Anthropic marks); no implied Q4 capex; named backlog deals unsized
- Drafting-AI disclosure (Anthropic is an Amazon investee and AWS customer) said after the hook and in FACT_CHECK
- Edition stamp on screen (data as of the Nov 10, 2026 close); our calculations labelled; proxy base labelled as a proxy
- Never fair value, cheap/expensive, buy/sell; disclaimer after the hook
