    spoken: about seven hundred and ninety-seven billion dollars
    display: "TTM sales $797.5bn; AWS $161.4bn = 20% of sales, 58% of operating income (our calc.)"
    fields: {aws_spoken: about one hundred and sixty-one billion dollars, aws_share_spoken: about twenty percent, oi_share_spoken: about fifty-eight percent, aws_margin_spoken: about thirty-eight percent, na_margin_spoken: about eight percent, intl_margin_spoken: about three percent, ads_spoken: about seventy-eight billion dollars}
