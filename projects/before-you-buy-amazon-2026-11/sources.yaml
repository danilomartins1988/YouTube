    text: "Q3 2026 release (verbatim): 'Net sales are expected to be between $240.0 billion and $247.0 billion'; 'Operating income is expected to be between $28.5 billion and $33.5 billion, compared with $25.0 billion in fourth quarter 2025'; 'We continue to expect 2026 cash capital expenditures to be approximately $220 billion.' 10-Q: 'We expect cash capital expenditures to meaningfully increase in 2027.' CEO (release, company projection): AWS 'projected revenue growth rates of over 40% both in 2027 and in 2028'. Track record (our check): 2026 operating income beat the top of the guided range in Q1, Q2 and Q3."
