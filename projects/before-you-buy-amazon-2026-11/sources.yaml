  - id: cash
    text: "10-Q: total face value of long-term debt $180.9bn at Sep 30, 2026 vs $68.8bn at Dec 31, 2025. 'There were no repurchases of our common stock during the nine months ended September 30, 2025 or 2026'; no dividends. Shares outstanding 10,687M (Sep 2025) to 10,811M (Sep 2026), +1.2% (our calc.). Investments in AI labs in 9M 2026: '$50.0 billion in OpenAI's Series C Preferred Stock ... and $10.0 billion in Anthropic nonvoting preferred stock'; total equity, warrant and convertible investments $298.8bn."
