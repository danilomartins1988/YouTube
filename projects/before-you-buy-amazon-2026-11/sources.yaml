claims:
  - id: cap
    text: "Close Nov 10, 2026: $270.87 (Yahoo Finance). 10-Q cover: 10,813,138,306 shares outstanding as of October 21, 2026. OUR calculation: market value about $2,929bn (single share class)."
    spoken: about two point nine three trillion dollars
    display: "≈ $2.93tn market value (close Nov 10, 2026 × 10.81bn shares; our calc.)"
    fields: {price_spoken: two hundred and seventy dollars and eighty-seven cents, shares_spoken: about ten point eight billion, date_spoken: "November tenth, twenty twenty-six"}
    source_ids: [px, tenq]
    status: source_located
    verification_note: Our calculation; date on screen.

  - id: lenses
    text: "Releases (TTM to Q3 2026): operating cash flow $168.3bn; capex net of proceeds and incentives $210.7bn; 'Free cash flow decreased to an outflow of $42.4 billion for the trailing twelve months'. Net income TTM $134.8bn, of which about $69.8bn non-operating income (mostly upward adjustments to the Anthropic preferred stock). OUR calculations: GAAP P/E 21.7x; about 37x excluding non-operating income (our assumption: 21% tax); price/FCF not meaningful (negative); operating cash flow yield 5.7%."
    spoken: about twenty-two times
    display: "P/E 21.7x (≈ 37x ex non-operating gains) · FCF negative · OCF yield 5.7% (TTM; our calc.)"
    fields: {ocf_spoken: about one hundred and sixty-eight billion dollars, capex_spoken: about two hundred and eleven billion dollars, fcf_spoken: minus forty-two billion dollars, ni_spoken: about one hundred and thirty-five billion dollars, gains_spoken: about seventy billion dollars, exgains_spoken: about thirty-seven times, ocfy_spoken: about five point seven percent}
    source_ids: [rel, tenq, px]
    status: source_located
    verification_note: Our calculation; the ex-gains P/E uses an assumed 21% tax rate (stated).

  - id: proxy
    text: "OUR proxy base for a capex boom (labelled proxy): operating cash flow $168.3bn minus depreciation and amortization of $79.4bn TTM (SEC XBRL, Q4 2025 to Q3 2026; includes amortization of finance-lease assets) = about $88.9bn (yield about 3.0%). It assumes capex eventually falls back toward that level."
    spoken: about eighty-nine billion dollars
    display: "Proxy base: OCF − D&A ≈ $88.9bn (TTM; our calc.)"
    fields: {dep_spoken: about seventy-nine billion dollars, yield_spoken: about three percent}
    source_ids: [tenq, px]
    status: source_located
    verification_note: Proxy, our calculation.

  - id: rdcf
    text: "OUR illustration (not a valuation): market cap $2,929bn = 10 years of cash growing at g plus a terminal value at 3%, discounted at r. On the PROXY base $88.9bn: r = 8% gives g about 8.9% a year; r = 10% gives g about 13.9%. On TTM free cash flow (-$42.4bn) no growth rate can be solved. Steady-state lens: for the price to work as a business growing 3% a year from now, free cash flow would need to be about $142bn (8%) to $199bn (10%) a year."
    spoken: about nine percent a year
    display: "Implied growth ≈ 8.9%-13.9% a year on the proxy (10 years); steady-state FCF needed ≈ $142-199bn (our illustration)"
    fields: {high_spoken: about fourteen percent, need_low_spoken: about one hundred and forty-two billion dollars, need_high_spoken: about one hundred and ninety-nine billion dollars}
    source_ids: [tenq, px]
    status: source_located
    verification_note: Our illustration; 8% and 10% discount rates, 3% terminal growth, 10 years, on screen.

