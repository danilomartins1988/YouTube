# Sources and claims for "Before You Buy Amazon Stock, Watch This (Nov 2026)" (series Before You Buy, Amazon, 2026-11 edition).
# Facts read 2026-11-11 (notes: docs/series/research/amazon_2026-11.md, incl. the depreciation addendum). DATA AS OF the 2026-11-10 close.
# QUARTERLY REFRESH: update text/spoken/display/fields from the new 10-Q/10-K and close; the script reads every number
# through {{placeholders}}. Status stays source_located until a named human reviewer signs off. US dollars.
# RULES: free cash flow is NEGATIVE, so no reverse calculation on FCF; the gauge uses the labelled proxy (OCF minus
# depreciation and amortization) plus a "steady-state cash the price needs" lens. The 2026 capex guide is quoted verbatim
# only; no implied Q4 figure (the arithmetic looks odd, unverified). The OpenAI/Anthropic backlog expansions are named but
# their share of the $578bn is NOT disclosed. GAAP P/E is flattered by Anthropic mark-ups (say so). Company claims attributed.
# DISCLOSURE: drafted with an AI made by Anthropic, an Amazon investee and AWS customer named in these filings.
