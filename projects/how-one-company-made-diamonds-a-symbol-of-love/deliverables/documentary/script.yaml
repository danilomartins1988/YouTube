- id: m5_2011
  chapter: For sale
  narration: In twenty eleven, the mining group Anglo American paid the Oppenheimer family {{oppenheimer_sale}} for forty
    percent of De Beers. That put a value of {{oppenheimer_sale.implied_spoken}} on the whole company. The family that had
    run De Beers for generations stepped aside.
  claims:
  - oppenheimer_sale
- id: m5_writedown
  chapter: For sale
  narration: Fifteen years later, the story was very different. In its results for twenty twenty-five, Anglo American booked
    an impairment of {{writedown}} on De Beers, as diamond markets weakened. It is now trying to sell the business.
  claims:
  - writedown
- id: m5_sale
  chapter: For sale
  narration: In July twenty twenty-six, Bloomberg reported that Anglo was in advanced talks to sell its stake to a group led
    by a former De Beers chief executive, for {{sale}}. Anglo did not confirm the figure, and said it was not exclusive with
    any buyer. But even as a rough guide, the gap is enormous. Almost thirteen billion dollars, then. Perhaps one billion,
    now.
  claims:
  - sale
  - oppenheimer_sale
- id: payoff
  chapter: The lesson
  narration: So what is the lesson of De Beers? That a price is not only about how rare something is. It is about who controls
    the supply, and what story people believe. De Beers mastered both for a century. It held the stones back, and it gave
    them a meaning. The slogan still works. But a story can only hold a price up for as long as people stop asking what the
    thing would cost without it.
  claims:
  - share
  - ayer
  analysis: true
  source_note: Conclusion drawn from the sourced parts.
