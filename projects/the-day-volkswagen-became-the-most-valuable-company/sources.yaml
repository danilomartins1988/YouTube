claims:
  - id: march
    text: "International Banker: by March 2008 Porsche owned 31% of Volkswagen and said it was not looking to go to 75%: 'In view of the fact that Lower Saxony as second largest shareholder owns 20 percent of VW, the probability of acquiring the necessary shares in freefloat is extremely low.' VW was a 'troubled carmaker, which had amassed substantial debt'; many hedge funds held the view the stock had become overvalued and increased short positions; as the crisis unfolded, demand for new cars collapsed."
    spoken: thirty-one percent
    display: "31%"
    fields: {lsax_spoken: twenty percent, lsax_display: "20%"}
    source_ids: [ib_squeeze]
    status: source_located
    verification_note: Read on 2026-11-08 (AI fact-check; needs a named human reviewer).

  - id: stake
    text: "Porsche SE (26 Oct 2008): at the end of last week it held 42.6% of the Volkswagen ordinary shares and in addition 31.5% in so-called cash-settled options relating to VW ordinary shares, to hedge against price risks, a total of 74.1%; on settlement Porsche receives in cash the difference between the share price and the strike price; the aim is to increase to 75% in 2009, paving the way to a domination agreement; the families Porsche and Piëch, who own all Porsche ordinary shares, expressed their unconditioned backing and support for a domination of the Volkswagen group by Porsche. Risk.net: this was more than the 35.14% Porsche had disclosed on 16 September."
    spoken: seventy-four point one percent
    display: "74.1%"
    fields: {shares_spoken: forty-two point six percent, shares_display: "42.6%", options_spoken: thirty-one point five percent, options_display: "31.5%"}
    source_ids: [porsche_oct26, risk_options]
    status: source_located
    verification_note: Read on 2026-11-08. The 74.1% is shares plus cash-settled options, not direct ownership; the film says so.

  - id: float
    text: "International Banker: with Lower Saxony's 20%, less than 6% of VW voting stock was available in the market, while around 12% of VW's outstanding shares had been sold short, so it was impossible for every short seller to buy back their shares. Risk.net: the surge is widely attributed to short sellers trying to close out positions from a smaller pool of shares than they previously thought were available."
    spoken: less than six percent
    display: "< 6%"
    fields: {short_spoken: around twelve percent, short_display: "≈ 12%"}
    source_ids: [ib_squeeze, risk_options]
    status: source_located
    verification_note: Read on 2026-11-08. Both percentages as given by the source; shown as approximate.

  - id: price
    text: "Risk.net: VW's share price rose to €1,005.01 on 28 October from €210.52 on 24 October, then closed at €512 on 29 October. Porsche SE (29 Oct): the price at one stage exceeded €1,000. Converted at the Fed H.10 rate of each day: 24 Oct 1.2639 → ≈ $266; 28 Oct 1.2476 → ≈ $1,254; 29 Oct 1.2851 → ≈ $658."
    spoken: about two hundred and sixty-six dollars
    display: "≈ $266"
    fields: {peak_spoken: about one thousand two hundred and fifty dollars, peak_display: "≈ $1,250", close_spoken: about six hundred and sixty dollars, close_display: "≈ $660"}
    source_ids: [risk_options, porsche_oct29, fed_h10]
    status: source_located
    verification_note: Read on 2026-11-08. International Banker gives the starting price as €210.85 (≈ $266.5 at the same rate); both round to about $266.

  - id: top
    text: "International Banker: Volkswagen became the world's largest company by market value on 28 October, very briefly; at up to €1,005 per share VW's voting stock was worth €296bn, exceeding the $343bn market capitalisation of the world's incumbent top company, ExxonMobil. Converted at the 28 Oct 2008 H.10 rate (1.2476): ≈ $369bn."
    spoken: about three hundred and seventy billion dollars
    display: "≈ $370bn"
    fields: {exxon_spoken: three hundred and forty-three billion dollars, exxon_display: "$343bn"}
    source_ids: [ib_squeeze, fed_h10]
    status: source_located
    verification_note: Read on 2026-11-08. The ExxonMobil figure is the source's own US$ figure. The 'most valuable' claim is the source's; the film says 'briefly'.

  - id: bafin
    text: "International Banker: BaFin announced on the same day (28 Oct) that it was examining the VW share-price activity for evidence of insider trading or market manipulation; Porsche issued a blanket denial. Risk.net (7 Nov 2008): BaFin launched a formal investigation into market manipulation of VW shares. Porsche SE (29 Oct): Porsche rejects responsibility for the price movements; BaFin was informed in advance about the settlement measure."
    spoken: the same day
    display: "28 Oct 2008"
    source_ids: [ib_squeeze, risk_options, porsche_oct29]
    status: source_located
    verification_note: Read on 2026-11-08. An investigation is not a finding; the film pairs it with the 2016 acquittal.

  - id: settle
    text: "Porsche SE (29 Oct 2008): short sellers had to buy VW ordinary shares to fulfil their delivery obligations, which led to a massive increase in the price, at one stage above €1,000; to avoid further market distortions, Porsche intends, depending on the state of the market, to settle hedging transactions of up to 5% of VW ordinary shares; it still aims for up to 75%. International Banker: the following day Porsche unloaded around 5% of its VW holdings to the short sellers."
    spoken: up to five percent
    display: "up to 5%"
    source_ids: [porsche_oct29, ib_squeeze]
    status: source_located
    verification_note: Read on 2026-11-08.

  - id: dax_cap
    text: "Deutsche Börse (28 Oct 2008): it decided to extraordinarily adjust the DAX weightings; the 10 percent capping rule is brought forward for Volkswagen as of the start of trading on Monday 3 November; at Tuesday's close Volkswagen was weighted with 27 percent; the next regular adjustment date was 22 December."
    spoken: ten percent
    display: "10%"
    fields: {weight_spoken: twenty-seven percent, weight_display: "27%"}
    source_ids: [dbg_cap]
    status: source_located
    verification_note: Read on 2026-11-08.

  - id: fall
    text: "International Banker: after the peak on the 28th, the stock plunged 58 percent in just four days; a month later it was down 70 percent from its peak. Hedge funds that had shorted VW stock lost an estimated $30 billion. 'I have had hedge fund managers literally in tears on the phone,' said a London-based analyst on the 29th."
    spoken: fifty-eight percent
    display: "−58%"
    fields: {month_spoken: seventy percent, month_display: "−70%", loss_spoken: an estimated thirty billion dollars, loss_display: "≈ $30bn"}
    source_ids: [ib_squeeze]
    status: source_located
    verification_note: Read on 2026-11-08. The $30bn is the source's estimate, in US$; shown as an estimate.

  - id: options_gain
    text: "Risk.net (7 Nov 2008): Porsche made a €6.83bn gain in its 2007/08 business year on cash-settled options on VW shares (previous year €3.59bn); group profit €8.6bn in 2007/08. Converted at the 2008 H.10 average (1.4726): ≈ $10.1bn and ≈ $12.7bn; the previous year's €3.59bn at the 2007 average (1.3711): ≈ $4.9bn."
    spoken: about ten billion dollars
    display: "≈ $10bn"
    fields: {profit_spoken: about twelve point seven billion dollars, profit_display: "≈ $12.7bn", prev_spoken: about four point nine billion dollars, prev_display: "≈ $4.9bn"}
    source_ids: [risk_options, fed_h10]
    status: source_located
    verification_note: Read on 2026-11-08. The business year 2007/08 straddles two calendar years; converted at the 2008 average (rounded).

  - id: merger
    text: "AFP (13 Aug 2009): VW and Porsche approved a plan to merge by 2011; VW will initially buy 42% of Porsche by the end of 2009 for €3.3bn (US$4.7bn), valuing Porsche at €12.4bn; Porsche to be integrated as VW's 10th brand; VW CEO Martin Winterkorn becomes head of both; 'the failure of a gamble begun by Porsche's management last year to take over the far larger VW'; a clear victory for VW chairman Ferdinand Piëch; Winterkorn had previously announced that Qatar would take a direct 17% stake in VW by acquiring stock options owned by Porsche, and negotiations with Qatar would continue. Valuation converted at the 2009 H.10 average (1.3935): ≈ $17bn."
    spoken: four point seven billion dollars
    display: "$4.7bn"
    fields: {value_spoken: about seventeen billion dollars, value_display: "≈ $17bn", stake_spoken: forty-two percent, stake_display: "42%"}
    source_ids: [afp_merger, fed_h10]
    status: source_located
    verification_note: Read on 2026-11-08. $4.7bn is AFP's own dollar figure. The film does not claim the merger timetable was met.

  - id: acquittal
    text: "Porsche SE (28 Jul 2016): the Stuttgart Regional Court acquitted former Porsche SE executive board members Wendelin Wiedeking and Holger Härter on 18 March 2016 of alleged information-based market manipulation on all charges; the six indicted statements (10 March to 26 October 2008) were neither false nor misleading, and it was not proven they influenced the price; the prosecutor withdrew its appeal, making the acquittal legally binding; the motion for a fine against Porsche SE was finally rejected."
    spoken: March twenty sixteen
    display: "18 Mar 2016"
    source_ids: [porsche_2016]
    status: source_located
    verification_note: Read on 2026-11-08 (company release reporting a court judgment). Civil claims by investors are not covered and not mentioned.

