# Sources and claims for "The Day Volkswagen Became the World's Most Valuable Company" (Episode 13).
# Every claim was read on its source page on 2026-11-08 by an AI fact-check (quotes in docs/episodes/13-volkswagen/FACT_CHECK.md).
# Status stays source_located: the channel rule requires a named human reviewer before publishing.
# LEGAL CARE: Porsche denied any manipulation. Its former CEO and CFO were ACQUITTED of information-based market
# manipulation by the Stuttgart Regional Court (18 March 2016; final in July 2016). The film never says or implies a
# crime; it says "Porsche denied", "acquitted", "the court found the statements were neither false nor misleading".
# MONEY: all amounts in US dollars. Prices and the market value on a given day are converted at the Fed H.10 rate of
# that day (FRED DEXUSEU: 24 Oct 2008 1.2639, 28 Oct 1.2476, 29 Oct 1.2851 USD per EUR). Yearly figures use the H.10
# annual average (FRED AEXUSEU: 2007 1.3711, 2008 1.4726, 2009 1.3935). Dollar figures printed by a source are used as printed.
