title: "The Day Volkswagen Became the World's Most Valuable Company"
slug: the-day-volkswagen-became-the-most-valuable-company
language: en
# Episode 13 (Volkswagen, 2008 short squeeze). Cartoon-first: bright palette + engine_cartoon worlds. Five-part structure internal only.
# Money: all amounts in US dollars. One-day market figures are converted at the Federal Reserve H.10 noon rate of that day
# (FRED DEXUSEU); yearly figures at the H.10 annual average (FRED AEXUSEU). Dollar figures given by a source are used as is.
renderer: remotion
remotion_geo: [world]
style:
  name: cartoon-day
  palette:            # bright cartoon day: sky base, gold = money, blue = Volkswagen, green = gains, red = losses / squeeze
    bg: "#C4E4FA"
    bg2: "#EEF8FF"
    ink: "#0F1E36"
    muted: "#4D6680"
    land: "#8BD47A"
    border: "#2B5573"
    accent: "#E89A00"
    accent2: "#1565C0"
    accent3: "#23995A"
    risk: "#E53935"
  fonts:
    display: InterDisplay-Bold
    heading: InterDisplay-SemiBold
    body: Inter-Regular
    body_bold: Inter-SemiBold
  web_fonts:
    display: "Inter Display, Inter, sans-serif"
    body: "Inter, sans-serif"
  transition: scan
  background: grid
  motifs: [chapter-tags]
budget:
  max_paid_usd: 1.00
presenter_min: 4
