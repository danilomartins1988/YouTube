claims:
  - id: cpi
    text: "BLS: motor vehicle insurance 12-month change peaked at 22.6% (April 2024), the largest since November 1976 (23.6%, our comparison); Sep 2025→Sep 2026 −5.0% vs all items +3.7%. Index Sep 2021 566.211 → Sep 2026 846.102 (+49.4%, our calculation) vs all items 274.310 → 336.940 (+22.8%). Motor vehicle repair +46.2% (5 yrs), new vehicles +12.2%, used cars −3.1% (our calculations)."
    spoken: twenty-two point six percent
    display: "+22.6% in a year (Apr 2024)"
    fields: {five_spoken: almost fifty percent, all_spoken: about twenty-three percent, now_spoken: five percent}
    source_ids: [bls]
    status: source_located
    verification_note: BLS values via page reader; re-check by eye on data.bls.gov.

  - id: naic
    text: "NAIC (Sep 2026): 'In 2024, the countrywide average expenditure was $1,431 an increase of 11.71% over the previous year.' 2020: $1,047.75 (our change +36.6%). 2024 most expensive: Florida $2,017.97, New York $1,980.93, Louisiana $1,880.42; cheapest: North Dakota $907.25, Maine $934.54, Hawaii $934.69. 'direct comparisons between state results should be treated with a high degree of caution.' NAIC 2022/2023 report: as prices rise 'the amount of insurance demanded decreases (i.e., dropping coverage or increasing deductibles)'; CPI 2019–2023 cumulative: used vehicles 36.04%, maintenance and repair 31.13%, legal service fees 20.88%, total medical care 8.50%."
    spoken: one thousand four hundred and thirty-one dollars
    display: "Avg spend $1,431/yr (2024, NAIC)"
    source_ids: [naic, naicdb]
    status: source_located
    verification_note: NAIC average expenditure (not premium).

  - id: tech
    text: "IIHS-HLDI (Aug 2026): 'collision claim severity was about 10% higher for the equipped vehicles'; 'The sensors are expensive and often require calibration after replacement'; claim frequency 'about 10% lower for collision claims and almost 40% lower for PDL claims'. IIHS and HLDI are 'wholly supported by ... auto insurers and insurance associations.'"
    spoken: about ten percent
    display: "Sensor cars: +10% repair cost per claim (HLDI)"
    source_ids: [iihs]
    status: source_located
    verification_note: Insurer-funded institute, said.

  - id: deaths
    text: "IIHS Fatality Facts (FARS): deaths 36,355 (2019), 39,007 (2020), 43,230 (2021), 42,721 (2022), 41,025 (2023), 39,254 (2024); rate per 100M miles 1.11 (2019), 1.38 (2021), 1.19 (2024); 'In 2024, speeding was a factor in 29% of motor vehicle crash deaths.' IRC (Feb 2025): 'In 2023, more than one in seven drivers countrywide (15.4%) were uninsured'."
    spoken: forty-three thousand two hundred and thirty
    display: "43,230 road deaths (2021)"
    source_ids: [iihs, irc]
    status: source_located
    verification_note: IRC is industry-funded; its estimate is claim-ratio based.

  - id: courts
    text: "Triple-I/CAS (Oct 2025, industry): personal auto liability 'LSA and inflation increased losses ... by $91.6 billion–$102.3 billion'. Florida HB 837 (approved March 24, 2023): 'Repeals Florida's one-way attorney fee statutes'; 'Reduces the statute of limitations for general negligence cases from 4 years to 2 years'. Florida CFO/OIR (Mar 2026): physical damage loss ratios 'dropping from 112.0% in 2022 ... to 49.5% in 2025'; top writers 'indicating an -8% rate change for 2026'. California DOI (Sep 2026): rates 'primarily determined by three mandatory factors: a driver's safety record, annual miles driven, and years of driving experience.' NAIC: 'about 95 percent of auto insurers' use credit-based insurance scores where allowed; Hawaii and Massachusetts bar credit-based rating."
    spoken: four years to two
    display: "Florida 2023 reform; −8% indicated for 2026"
    source_ids: [iii, flhb, flcfo, cdi, naiccredit]
    status: source_located
    verification_note: Industry and state framings attributed.

  - id: insurers
    text: "Allstate 10-K: auto combined ratio 110.1 (2022), 103.4 (2023), 95.0 (2024), 85.0 (2025); 'net loss of $1.39 billion in 2022'; 'net income applicable to common shareholders was $10.17 billion in 2025 ... primarily due to higher underwriting income and gains on dispositions'; 'Rate increases of 17.9% were taken for Allstate brand in 55 locations' (2023). Progressive: 'we increased personal auto rates in 48 states during 2023, with an aggregate increase of about 19%, which followed ... 2022 of about 13%'; net income $722M (2022) → $11,308M (2025); FY2025: '$1,224 million of policyholder credit expense' as Florida profit 'exceeded the statutory profit limit'; Q3 2026 10-Q: 'average written premium per policy decreased 2% in personal auto'. NAIC glossary: combined ratio 'calculated by adding the loss and expense ratios.'"
    spoken: one point three nine billion dollars
    display: "Allstate: −$1.39bn (2022) → +$10.17bn (2025)"
    fields: {pgr_spoken: eleven point three billion dollars}
    source_ids: [allstate, progressive]
    status: source_located
    verification_note: Read in SEC filings.
