# Sources and claims for "Why Your Car Insurance Got So Expensive" (Episode 36, US batch #10).
# Title changed from the batch's working title ("...Keeps Getting More Expensive") for accuracy: BLS shows motor vehicle
# insurance prices DOWN 5.0% year over year in Sep 2026 after the 2022-2024 surge.
# Every claim was read on its primary page/filing on 2026-11-10 (notes: docs/episodes/36-car-insurance/RESEARCH_NOTES.md).
# BLS index values read via a page reader (bls.gov blocked curl) and cross-checked with Table 2; re-check by eye before publishing.
# RULES: % changes are OUR calculation; IIHS/HLDI and IRC are insurer-funded (said); "legal system abuse" is industry framing
# (said); Florida loss-ratio and rate figures are the state's own release (attributed); Allstate 2025 income includes gains on
# dispositions (said). No insurer logos; names in text only.
