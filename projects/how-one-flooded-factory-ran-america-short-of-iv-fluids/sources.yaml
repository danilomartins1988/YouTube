claims:
  - id: share
    text: "AHA (Oct 7, 2024): the Marion, NC plant produces 'approximately 60% — or 1.5 million bags — of the IV solutions used every day in the U.S.' Baxter: North Cove is 'the largest manufacturer of these solutions in the United States'; fact sheet: '1M+ IV solutions produced at the site every day', 'more than 2,500 employees', '1.4M+ square foot facility', '$500M+ facility investments since 2017'."
    spoken: about sixty percent
    display: "≈ 60% of U.S. IV solutions (AHA estimate)"
    fields: {daily_spoken: more than a million, staff_spoken: more than two thousand five hundred}
    source_ids: [aha, baxter]
    status: source_located
    verification_note: 60% is an AHA estimate (said); daily output per Baxter.

  - id: flood
    text: "Baxter (Sep 29, 2024): North Cove 'affected by flooding due to the storm and is currently closed for production'; 'The heavy rain and storm surge triggered a levee breach, which led to water permeating the site. The bridges accessing the site have also been damaged.' Hurricane Helene, late Sep 2024."
    spoken: September twenty twenty-four
    display: "Helene floods North Cove (Sep 2024)"
    fields: {}
    source_ids: [baxter]
    status: source_located
    verification_note: Baxter wording.

  - id: ration
    text: "Baxter (Oct 9, 2024): allocations of highest-demand IV fluids raised from 40% to 60% for direct customers and from 10% to 60% for distributors; goal to return to 90-100% allocation of certain IV codes by end of 2024; FDA (Oct 11) temporary compounding guidance; providers urged to conserve. ASHP survey (401 respondents, Oct 16-25, 2024): 84% moderate or critical impact (critical = delay or cancel treatments or procedures); 47% of purchasing staff had two weeks or less of large-volume fluids."
    spoken: forty percent
    display: "Hospitals rationed to 40-60% of normal orders (Baxter)"
    fields: {ashp_spoken: eighty-four percent}
    source_ids: [baxter, ashp]
    status: source_located
    verification_note: Allocation percentages are of normal orders (said).

  - id: response
    text: "FDA (Oct 11, 2024): added Dextrose 70%, Lactated Ringer's and peritoneal dialysis solution to the shortage list; temporary compounding guidance. FDA (Oct 18): temporary importation of '23 different IV and PD fluids from five Baxter facilities around the world'. Baxter fact sheet: ~200 airplanes, nearly 18,000 tons by end of 2024; 9 plants in its network. B. Braun: Irvine and Daytona Beach output to rise 20 percent. ICU Medical 10-K: competes with Baxter and B. Braun; competitor's damage caused 'a national shortage'."
    spoken: twenty-three
    display: "FDA cleared imports of 23 fluids from 5 Baxter plants"
    fields: {planes_spoken: about two hundred, tons_spoken: nearly eighteen thousand tons}
    source_ids: [fda, baxter, rivals]
    status: source_located
    verification_note: Airlift figures are Baxter's.

  - id: recovery
    text: "Baxter: first line restarted week of Oct 28 (Oct 31, 2024 update), the highest-throughput line, ~25% of site output and ~50% of its 1-liter bags; first post-storm product released Nov 21, 2024; all 10 lines restarted Jan 28, 2025; pre-hurricane production levels Feb 17, 2025; allocations removed for 'virtually all' North Cove IV codes May 13, 2025."
    spoken: about four and a half weeks
    display: "Back to pre-storm output Feb 17, 2025 (Baxter)"
    fields: {}
    source_ids: [baxter]
    status: source_located
    verification_note: Recovery per Baxter (FDA confirmation not found).

  - id: cost
    text: "Baxter 2024 10-K: estimated $110M reduction in sales; $44M of inventory/asset write-offs and $317M of remediation, idle-facility and freight costs, offset by $251M of insurance recoveries (net $110M pre-tax charges); North Cove 'was not fully operational for most of the fourth quarter'."
    spoken: three hundred and seventeen million dollars
    display: "Baxter: $317M of cleanup, idle-plant and freight costs (10-K)"
    fields: {ins_spoken: two hundred and fifty-one million dollars, sales_spoken: one hundred and ten million dollars}
    source_ids: [tenk]
    status: source_located
    verification_note: 10-K actuals (guidance not used).

  - id: why
    text: "FDA root causes report (Oct 2019, updated Feb 2020): root cause 1 'Lack of incentives for manufacturers to produce less profitable drugs'; of 163 shortage drugs, 63% sterile injectables; median per-unit price $8.73 ($11.05 injectables) in the year before shortage. GAO-14-194: 'low profit margins have limited infrastructure investments'; 'constrained manufacturing capacity'. FDA 2017 shortage report: Hurricane Maria 'disrupted the manufacturing of sterile saline solution at the Baxter ... facility located in Puerto Rico'; temporary imports from Baxter plants abroad."
    spoken: eight dollars and seventy-three cents
    display: "Shortage drugs: median price $8.73 a unit (FDA)"
    fields: {inj_spoken: sixty-three percent}
    source_ids: [roots, maria]
    status: source_located
    verification_note: FDA report is 2019 (said).
