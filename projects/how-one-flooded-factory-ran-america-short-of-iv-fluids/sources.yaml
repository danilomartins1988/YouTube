# Sources and claims for "How One Flooded Factory Ran America Short of IV Fluids" (Episode 44, new topics N4).
# Every claim was read on its primary page/file on 2026-11-10 (notes: docs/episodes/44-iv-bags/RESEARCH_NOTES.md).
# Status stays source_located until a named human reviewer signs off. US dollars.
# RULES: "about 60%" is an AHA estimate (said, attributed); daily output = Baxter's "more than a million"; HHS/ASPR
# statements not used (not fetched); no named hospitals; no market-share split between makers; FDA root-cause report = 2019.
