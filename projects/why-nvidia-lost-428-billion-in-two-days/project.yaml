# few charts; genre-level inspiration only, all designs original). Live story: re-check facts after Nov 17 earnings and
# the requested Nov 18 House briefing before rendering. Money: US dollars; market-value figures are OUR estimates.
renderer: remotion
remotion_geo: [world]
style:
  name: cartoon-day
  palette:
    bg: "#1B0B3F"
    bg2: "#341A6B"
    ink: "#FFF8E1"
    muted: "#C9B8F0"
    land: "#2A1658"
    border: "#7B61FF"
    accent: "#FFE14D"
    accent2: "#3DF5FF"
    accent3: "#7DFF8A"
    risk: "#FF4F6B"
  fonts:
    display: InterDisplay-Bold
    heading: InterDisplay-SemiBold
    body: Inter-Regular
    body_bold: Inter-SemiBold
  web_fonts:
    display: "Inter Display, Inter, sans-serif"
    body: "Inter, sans-serif"
  transition: scan
  background: grid
  motifs: [chapter-tags]
budget:
  max_paid_usd: 1.00
