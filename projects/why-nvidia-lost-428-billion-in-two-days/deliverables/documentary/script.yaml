# Documentary (target 11-13 min). Five parts as an INTERNAL structure only. Hook rules: cold open on the number, four short
# beats, explicit promise, channel intro after part 1. LIVE STORY: re-check after Nov 17 earnings / Nov 18 briefing.
# Allegations attributed (NYT/FT via Bloomberg/NBC/CNBC); the woman is never named; nobody charged; our estimates labelled.
logline: In November 2026, Nvidia lost about $428 billion of market value in two trading days (our estimate). Not because of its chips,
  but because of a story about its founder, export rules and a Singapore customer.
title: Why Nvidia Lost $428 Billion in Two Days
segments:
- id: h_open
  chapter: Four hundred billion
  narration: '{{drop}}. By our own estimate, that is about how much stock market value Nvidia, the company whose chips power artificial
    intelligence, lost in just two trading days in November twenty twenty-six.'
  claims:
  - drop
- id: h_twist
  chapter: Four hundred billion
  narration: No factory burned down. No chip stopped working. No customer cancelled an order. What changed over one weekend was a story
    about one man, and about where some of the world's most wanted chips may end up.
  claims:
  - drop
  - report
- id: h_question
  chapter: Four hundred billion
  narration: So how can a single story wipe out that much value so fast? And why does a small city state in Southeast Asia keep turning
    up in Nvidia's numbers?
  claims: []
  analysis: true
  source_note: Hook question built from the sourced facts.
- id: h_promise
  chapter: Four hundred billion
  narration: By the end of this video, you will know why investors treat Nvidia's founder as part of the product, what the reports actually
    claim and what is only alleged, how American export rules try to keep the best chips out of China, and what happens next.
  claims: []
  analysis: true
  source_note: Promise of the episode (hook rule).
- id: m1_card
  chapter: One man, one company
  narration: ''
  claims: []
- id: m1_size
  chapter: One man, one company
  narration: Start with the company. Nvidia designs the processors that train and run most of today's artificial intelligence. In its
    fiscal year that ended in January twenty twenty-six, it reported about two hundred and sixteen billion dollars of revenue. Before
    that weekend, its shares were worth about four and a half trillion dollars, by our estimate from its share count.
  claims:
  - rules
  - drop
- id: m1_founder
  chapter: One man, one company
  narration: Its founder and chief executive is Jensen Huang. Investors do not just see him as a manager. They see him as part of the
    product. One well known chip analyst, Stacy Rasgon, put it in five words to CNBC. Jensen is Nvidia. Nvidia is Jensen.
  claims:
  - risk
- id: m1_risk
  chapter: One man, one company
  narration: Companies have a name for this. It is called key person risk. Nvidia's own annual report warns that it is highly dependent
    on the services of its longstanding executive team, and that failing to plan for succession could hurt its long term success. The
    report does not name him. And the latest proxy statement does not use the word succession even once.
  claims:
  - risk
- id: m1_stake
  chapter: One man, one company
  narration: Huang also owns a slice of the company, about {{risk}} of the shares according to that proxy, roughly eight hundred and
    seventy million shares. By our estimate, that stake lost about fifteen billion dollars of paper value in those two days, assuming
    his holding has not changed since March.
  claims:
  - risk
- id: m1_draw
  chapter: One man, one company
  narration: Let me draw key person risk. Here is the company, with its chips, its software and its customers. Here is the founder,
    who sets the strategy and sells the vision. Now draw an arrow between them. When investors believe that arrow carries the whole
    company, the founder's reputation becomes part of the share price. One analyst, Dan Ives, said that without Huang, Nvidia would
    be worth twenty five to thirty percent less. That is an opinion, not a fact. But it shows how thick that arrow is.
  claims:
  - risk
  analysis: true
  source_note: Diagram of key-person risk (10-K risk factor; analyst opinion attributed).
- id: m1_transition
  chapter: One man, one company
  narration: Then, over one weekend in November, that arrow came under strain.
  claims:
  - report
- id: m2_card
  chapter: The weekend
  narration: ''
  claims: []
- id: m2_reports
  chapter: The weekend
  narration: On October twenty-ninth, the New York Times reported on a relationship between Huang and a businesswoman linked to Megaspeed,
    a Singapore cloud company that buys Nvidia chips. Then, on Friday, November sixth, according to reporting relayed by Bloomberg,
    the Times reported that American intelligence officials had told the administration that she was working for China's Ministry of
    State Security.
  claims:
  - report
- id: m2_memo
  chapter: The weekend
  narration: On Sunday, November eighth, Huang wrote to Nvidia's employees. In his own words, I was unfaithful to my wife. There is
    no excuse for what I did. That is all this video will say about his private life. What matters for the money is what came next.
  claims:
  - memo
- id: m2_board
  chapter: The weekend
  narration: The same day, Nvidia's board announced an independent investigation, in light of reporting that its founder had been the
    target of a foreign intelligence effort. The board said it had no reason to believe that national security or Nvidia's secrets were
    compromised, and that it had confidence in Huang. China's foreign ministry called the spy allegation unsubstantiated. And no one
    has been charged with anything.
  claims:
  - memo
  - report
- id: m2_monday
  chapter: The weekend
  narration: On Monday, the market answered. The S and P five hundred rose more than two percent. Rival chip makers soared. A M D jumped
    about thirteen percent, and Broadcom almost nine. Nvidia fell more than four percent. When a company drops on a day its whole industry
    rises, investors are reacting to that company alone.
  claims:
  - drop
- id: m2_tuesday
  chapter: The weekend
  narration: On Tuesday, the independent directors named their investigator, Joon Kim, a former acting United States Attorney for the
    Southern District of New York, with the law firm Wachtell, Lipton, Rosen and Katz. The stock fell again, by about five and a half
    percent, to just under one hundred and sixty-nine dollars a share.
  claims:
  - memo
  - drop
- id: m2_sum
  chapter: The weekend
  narration: Put the two days together and the shares lost about nine and a half percent. With roughly twenty-four billion shares outstanding,
    that is about {{drop}} of market value, gone, by our estimate.
  claims:
  - drop
- id: m2_transition
  chapter: The weekend
  narration: So why would a story about one person and one customer frighten investors this much? The answer is China, and the rules
    that keep Nvidia's best chips out of it.
  claims:
  - rules
- id: m3_card
  chapter: Chips at the border
  narration: ''
  claims: []
- id: m3_rules
  chapter: Chips at the border
  narration: Since twenty twenty-two, the United States has required licences to export Nvidia's most advanced chips to China. In October
    twenty twenty-three, the rules got tighter and covered a long list of products. In April twenty twenty-five, even its H twenty chip
    needed a licence, and Nvidia took a charge of about {{rules}} in that quarter.
  claims:
  - rules
- id: m3_foreclosed
  chapter: Chips at the border
  narration: Nvidia now says it is effectively foreclosed from competing in China's data center market. In its most recent reported
    quarter, shipments of its Hopper data center chips to China were less than one percent of data center revenue. Customers headquartered
    in China still made up about eight percent of total revenue, by our calculation from the filing.
  claims:
  - rules
- id: m3_smuggle
  chapter: Chips at the border
  narration: Where there are strict rules and high prices, some people try to get around them. The Justice Department has brought several
    chip export cases. In one, a businessman and his company pleaded guilty in a case involving at least {{smuggle}} of Nvidia chips,
    which prosecutors said had been relabeled. And in October twenty twenty-six, a California man was indicted over servers allegedly
    sent through Malaysia and Singapore. Nvidia is not accused in any of these cases.
  claims:
  - smuggle
- id: m3_draw
  chapter: Chips at the border
  narration: Let me draw the route these cases describe. Here is the chip, sold to a company in a third country. Here is a middleman,
    often in Southeast Asia. And here is the arrow the rules forbid, from the middleman into China. The export rules sit on that last
    arrow like a checkpoint. Prosecutors say smugglers try to slip past it with false paperwork and new labels.
  claims:
  - smuggle
  analysis: true
  source_note: Diagram of the route described in DOJ releases.
- id: m3_transition
  chapter: Chips at the border
  narration: Which brings us to Singapore, and to the customer at the center of this story.
  claims:
  - sing
- id: m4_card
  chapter: The Singapore question
  narration: ''
  claims: []
- id: m4_billing
  chapter: The Singapore question
  narration: Here is a number that has puzzled many investors. In Nvidia's twenty twenty-five fiscal year, Singapore accounted for {{sing}}
    of its revenue, based on where customers were billed. That was more than twenty-three billion dollars. But in the same report, Nvidia
    explained that customers use Singapore to centralize invoicing, and that its products are almost always shipped elsewhere. Actual
    shipments to Singapore were less than two percent of revenue.
  claims:
  - sing
- id: m4_draw
  chapter: The Singapore question
  narration: Let me draw that gap. Here is the bar for billing, eighteen percent. Here is the bar for what was actually shipped there,
    less than two. According to Nvidia, the difference is invoicing, not shipping. The company later said that over ninety-nine percent
    of its controlled data center revenue billed to Singapore came from orders by companies based in the United States.
  claims:
  - sing
  analysis: true
  source_note: Bar sketch of the FY2025 10-K footnote.
- id: m4_megaspeed
  chapter: The Singapore question
  narration: Megaspeed is one of the companies that buy Nvidia chips in the region. According to a Reuters factbox, it took the name
    Megaspeed in twenty twenty-three, and its assets grew from thirty-three million dollars to three billion dollars in a single year.
    The New York Times reported in twenty twenty-five that it had bought {{mega}} worth of Nvidia's most advanced products through a
    Malaysian subsidiary.
  claims:
  - mega
- id: m4_alleged
  chapter: The Singapore question
  narration: That year, Senator Tom Cotton asked the Commerce Department to investigate Megaspeed, alleging that American chips were
    being diverted to China through a network of shell companies. According to the New York Times, a Commerce inquiry was later paused
    after Nvidia's general counsel contacted the investigators, and the case moved to the Justice Department. The Commerce Department
    says it handled the case by the book.
  claims:
  - mega
- id: m4_denial
  chapter: The Singapore question
  narration: Megaspeed calls the reporting misleading, and says regulators and Nvidia found no evidence of any illegal transfer of chips.
    It has not been charged, and it is not on the government's trade blacklist. Nvidia has described Megaspeed as a small commercial
    cloud, and says the diversion claims were thoroughly investigated and debunked.
  claims:
  - mega
- id: m4_transition
  chapter: The Singapore question
  narration: So, with all of that unresolved, what happens now?
  claims:
  - memo
- id: m5_card
  chapter: What happens next
  narration: ''
  claims: []
- id: m5_detective
  chapter: What happens next
  narration: First, the investigation. A committee of independent directors, helped by outside lawyers, will examine all available information,
    and the board has promised further updates. Until it reports, investors are pricing a question mark.
  claims:
  - memo
- id: m5_calendar
  chapter: What happens next
  narration: Second, the calendar. Nvidia is scheduled to report its quarterly results on November seventeenth. And three House committee
    chairmen have asked Huang to brief them behind closed doors on {{house}}, saying it is vital that Congress determines the extent
    to which national security has been placed at risk. It is not yet confirmed that the briefing will happen.
  claims:
  - house
- id: m5_politics
  chapter: What happens next
  narration: Third, politics. President Trump has publicly backed Huang. He said Huang told him he had absolutely no idea that the person
    in question was a spy, and that he really believes him. That is his account.
  claims:
  - report
- id: payoff
  chapter: The lesson
  narration: So why did Nvidia lose about {{drop}} in two days? Not because its chips got worse. Because investors suddenly had to price
    two risks at once. The first is the risk of depending on one person. The second is the risk that the rules around its most valuable
    product could bite harder than anyone expected. Neither risk has been shown to have caused any harm. The board says it has no reason
    to believe secrets were compromised, and nobody has been charged. But markets do not wait for verdicts. They price stories, and
    they price people. Even a company worth about four trillion dollars can hang on one name, one weekend, and one question.
  claims:
  - drop
  - memo
  - report
  analysis: true
  source_note: Conclusion drawn from the sourced parts.
- id: teaser
  chapter: The lesson
