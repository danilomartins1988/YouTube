# Sources and claims for "Why Nvidia Lost $428 Billion in Two Days" (Episode 52, owner request R2).
# Read on 2026-11-11 (notes: docs/episodes/52-nvidia-probe/RESEARCH_NOTES.md). LIVE STORY: re-check before rendering.
# Status stays source_located until a named human reviewer signs off. US dollars.
# RULES: spy claims are REPORTED (NYT/FT, relayed by Bloomberg/NBC/CNBC), never stated as fact; the woman is never named;
# nobody has been charged; Megaspeed denies wrongdoing and is not on the Entity List; never "obstructed" (NYT: Commerce
# inquiry paused after Nvidia's GC contacted investigators; Commerce: handled by the book); market-value changes are OUR
# estimates from Nvidia's share count; the Nov 5 market-wide drop is NOT attributed to the story.
