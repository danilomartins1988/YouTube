claims:
  - id: drop
    text: "Closing prices (Yahoo Finance): $186.64 (Fri Nov 6), $178.67 (Mon Nov 9, -4.27%), $168.89 (Tue Nov 10, -5.47%); two days -9.51%. Share count 24.1bn (10-Q cover, Aug 21, 2026). OUR estimate: about -$192bn (Nov 9), -$236bn (Nov 10), about -$428bn over two days; market value about $4.50tn on Nov 6. Nov 9: S&P 500 +2.35%, AMD +13.26%, Broadcom +8.78%."
    spoken: four hundred and twenty-eight billion dollars
    display: "≈ -$428bn in two days (our estimate: price × 24.1bn shares)"
    fields: {}
    source_ids: [px, sec]
    status: source_located
    verification_note: Our calculation; label as estimate. Do not attribute the Nov 5 market-wide drop to the story.

  - id: memo
    text: "Huang email to employees, Nov 8, 2026: 'I was unfaithful to my wife. My actions hurt her and our children. There is no excuse for what I did. I am deeply sorry.' The email does not name the woman. Board statement, Nov 8: independent investigation 'in light of recent reporting that founder and CEO Jensen Huang has been the target of a foreign intelligence effort'; 'no reason to believe that either national security or NVIDIA secrets were compromised'; 'confidence in Jensen'. Nov 10: Joon H. Kim, former acting U.S. Attorney (SDNY), and Wachtell, Lipton, Rosen & Katz retained."
    spoken: the board's statement
    display: "Nvidia statements, Nov 8 and Nov 10, 2026"
    fields: {}
    source_ids: [nvidia]
    status: source_located

  - id: report
    text: "NYT (Oct 29, 2026) reported the relationship with a businesswoman linked to Megaspeed; NYT via Bloomberg (Nov 6): US intelligence officials told the administration she was working for China's Ministry of State Security. China's foreign ministry (Nov 9): 'unsubstantiated'. No charges found against anyone as of Nov 11. Trump (CNBC, Nov 9): Huang 'said he had absolutely no idea that the person in question was a spy'; 'I really believe him'."
    spoken: the reports
    display: "Reported by the NYT and FT; denied by China; no charges"
    fields: {}
    source_ids: [press]
    status: source_located
    verification_note: Allegations only; attribute every line; never name the woman.

  - id: risk
    text: "Nvidia 10-K FY2026: 'we are highly dependent on the services of our longstanding executive team. Failure to ensure effective succession planning ... could hinder our strategic planning, execution, and long-term success.' Proxy (May 12, 2026): Huang 870,604,104 shares, 3.58%; the word 'succession' does not appear. OUR estimate: about -$15.5bn paper value Nov 6-10 (assumes holding unchanged). Analysts (CNBC/Yahoo): Stacy Rasgon 'Jensen is Nvidia. Nvidia is Jensen.'; Dan Ives: worth '25%-30%' less without him (opinion)."
    spoken: three point six percent
    display: "Key-person risk (10-K); Huang 3.58% (proxy)"
    fields: {}
    source_ids: [sec, press]
    status: source_located

  - id: rules
    text: "Nvidia 10-Q: export licensing for A100/H100 to China announced Aug 2022; updated requirements Oct 2023; H20 licence required Apr 2025 with a $4.5bn charge in Q1 FY2026; Nvidia 'effectively foreclosed from competing in China's data center computing/compute market'; Hopper data-center shipments to China less than 1% of Data Center revenue in Q2 FY2027; China (customer HQ) $7,880M of $96,221M in Q2 FY2027, about 8% (our calc); FY2026 revenue $215,938M."
    spoken: four and a half billion dollars
    display: "Export rules: 2022, 2023, 2025 (Nvidia 10-Q)"
    fields: {}
    source_ids: [sec]
    status: source_located

  - id: smuggle
    text: "DOJ: Dec 8, 2025 (S.D. Tex.): Alan Hao Hsu and Hao Global pleaded guilty; at least $160 million of H100/H200 GPUs exported or attempted, relabeled. Nov 20, 2025 (M.D. Fla.): four charged over 400 A100s to China via Malaysia and Thailand. Oct 1, 2026 (C.D. Cal.): a California man indicted over more than $300M of GPU servers allegedly sent to Malaysia and Singapore for reshipment to China. Nvidia is not a defendant."
    spoken: one hundred and sixty million dollars
    display: "DOJ chip-export cases (2025-2026)"
    fields: {}
    source_ids: [doj]
    status: source_located

  - id: sing
    text: "Nvidia 10-K FY2025: 'Singapore represented 18% of fiscal year 2025 total revenue based upon customer billing location. Customers use Singapore to centralize invoicing while our products are almost always shipped elsewhere. Shipments to Singapore were less than 2% of fiscal year 2025 total revenue.' ($23,684M of $130,497M). 10-Q Q2 FY2026: 'Over 99% of controlled Data Center compute revenue billed to Singapore was for orders from U.S.-based customers.' From Q3 FY2026 revenue is reported by customer headquarters."
    spoken: eighteen percent
    display: "Singapore: 18% billed, <2% shipped (FY2025 10-K)"
    fields: {}
    source_ids: [sec]
    status: source_located

  - id: mega
    text: "Reuters factbox (Nov 10, 2026): renamed Megaspeed International in March 2023; assets $3bn in 2024 up from $33M in 2023; calls itself an 'Nvidia Cloud Partner'. NYT via CNBC (Oct 2025): bought 'nearly $2 billion worth of Nvidia's most advanced products' through its Malaysian subsidiary. Sen. Cotton (Oct 2025) asked Commerce to investigate alleged diversion 'through a network of shell companies'. NYT (Nov 2026, relayed): Commerce inquiry paused after Nvidia's general counsel contacted investigators; moved to DOJ; Commerce says it handled it by the book. Megaspeed (CNBC, Nov 9, 2026): reporting 'misleading'; 'no evidence of any violations'. Not on the Entity List; not charged. Nvidia: 'small commercial cloud' (Oct 2025); 'thoroughly investigated and debunked last year' (Oct 2026). Singapore police: investigation ongoing (Oct 2025)."
    spoken: nearly two billion dollars
    display: "Megaspeed: allegations, denials (Reuters, CNBC, NYT)"
    fields: {}
    source_ids: [reuters, cotton, press]
    status: source_located
    verification_note: Allegations; attribute; never 'smuggled'.

  - id: house
    text: "House letter (dated Nov 4, publicized Nov 5, 2026) from chairs Moolenaar, Mast and Crawford requesting a joint closed-door briefing from Huang on Nov 18: it is 'vital that Congress determines the extent to which U.S. national security has been placed at risk.' Not confirmed that it will take place. Nvidia Q3 FY2027 results scheduled Nov 17, 2026."
    spoken: November eighteenth
    display: "Requested House briefing, Nov 18; results Nov 17"
    fields: {}
    source_ids: [press, nvidia]
    status: source_located
