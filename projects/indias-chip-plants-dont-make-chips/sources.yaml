claims:
  - id: value
    text: "BCG/SIA (Apr 2021, data for 2019): chip design = 50% of the industry's value added; wafer fabrication ≈ 25% of value added and ≈ 65% of industry capex; assembly, packaging and testing = 6% of value added and 13% of capex, 'relatively less capital-intensive and employs more labor than the front-end'; a state-of-the-art fab costs roughly $5 billion (advanced analog) to $20 billion (advanced logic and memory)."
    spoken: six percent
    display: "6%"
    fields: {design_spoken: half, design_display: "50%", fab_spoken: about a quarter, fab_display: "≈ 25%",
             fablo_spoken: five billion dollars, fabhi_spoken: twenty billion dollars}
    source_ids: [bcg_sia]
    status: source_located
    verification_note: Read in the PDF (pp. 15, 18, 19). 2019 data; the film says 'one industry study'.

  - id: units
    text: "PIB (17 Sep 2026): twelve semiconductor manufacturing units approved under Semicon 1.0 with cumulative investment of over Rs 1.64 lakh crore: one silicon fab, one silicon carbide fab, one GaN micro-LED display fab and nine ATMP/OSAT units; five units have commenced commercial production; 'In 2021, the country had no commercial chip plant.' Converted at 95.32 rupees per dollar (5 May 2026, when the count reached 12): ≈ $17.2 billion."
    spoken: about seventeen billion dollars
    display: "≈ $17bn"
    fields: {n_spoken: twelve, packaging_spoken: nine, five_spoken: five}
    source_ids: [pib_sep26, pib_may26, fred_inr]
    status: source_located
    verification_note: Conversion is ours (FRED DEXINUS).

  - id: sanand
    text: "Tech Times (Aug 2026): Micron Technology's $2.75 billion assembly and test facility in Sanand, Gujarat, inaugurated on 28 February 2026, ships DRAM and NAND memory; Kaynes Semicon's Sanand plant reached commercial operation on 31 March 2026; CG Power's joint venture with Renesas and Stars Microelectronics began commercial production on 4 July 2026. PIB (Apr 2026): commercial production from two plants (Micron and Kaynes) had commenced."
    spoken: two point seven five billion dollars
    display: "$2.75bn"
    source_ids: [tt_sites, pib_apr26]
    status: source_located
    verification_note: Plant value as reported by Tech Times.

  - id: imports
    text: "PIB (Sep 2026): India spent almost USD 150 billion on semiconductor product imports during FY17–FY25; imports grew at a CAGR of 23%; if the trend continues, annual imports could reach USD 240 billion by 2035; demand projected to reach USD 110 billion by FY2030; India employs nearly 20% of the global semiconductor chip design workforce."
    spoken: almost one hundred and fifty billion dollars
    display: "≈ $150bn"
    fields: {y2035_spoken: two hundred and forty billion dollars, y2035_display: "$240bn", demand_spoken: one hundred and ten billion dollars,
             design_spoken: nearly one in five, design_display: "≈ 20%"}
    source_ids: [pib_sep26]
    status: source_located
    verification_note: Government projections, labelled.

  - id: phones
    text: "PIB (Apr 2026): mobile phones imported (units) fell from 75% of total demand in 2014-15 to 0.02% in 2024-25; mobile phone production rose from ₹18 thousand crore to ₹5.45 lakh crore."
    spoken: three in every four
    display: "75% → 0.02%"
    source_ids: [pib_apr26]
    status: source_located
    verification_note: Read on 2026-11-08.

  - id: dholera
    text: "PIB (Apr 2026): Tata Electronics is establishing a fab in Gujarat with an investment of Rs 91,526 crore, in technology partnership with PSMC (Taiwan), capacity around 50,000 wafer starts per month (≈ $11.0bn at 82.87 rupees per dollar on the 29 Feb 2024 approval). Tech Times (Jul 2026): the minister said in March 2024 the first chip would come in December 2026 at 28 nm; the fab will now start at 90 nm, with commercial production targeted for mid-2028; construction about 50% complete in April 2026."
    spoken: about eleven billion dollars
    display: "≈ $11bn"
    fields: {wspm_spoken: fifty thousand wafers a month, wspm_display: "50,000 / month"}
    source_ids: [pib_apr26, tt_dholera, fred_inr]
    status: source_located
    verification_note: Dates are targets. Conversion is ours.

  - id: china_mature
    text: "Tech Times (Jul 2026): Chinese foundries SMIC, Hua Hong and Nexchip are expanding mature-node capacity with state subsidies, targeting the 40-90 nm range Dholera will initially serve; Nexchip ramping to 100,000 wafers per month."
    spoken: one hundred thousand wafers a month
    display: "100,000 / month"
    source_ids: [tt_dholera]
    status: source_located
    verification_note: Read on 2026-11-08.

  - id: semindia
    text: "Tech Times (Aug 2026): in 2005 semiconductor equipment imported for a $3 billion project by SemIndia became stuck at Indian ports awaiting customs clearances from multiple agencies."
    spoken: three billion dollars
    display: "$3bn"
    source_ids: [tt_sites]
    status: source_located
    verification_note: Historical account as reported; the film attributes it.

  - id: semicon2
    text: "PIB (Sep 2026): the Union Cabinet approved Semicon 2.0 on 15 July 2026 with an outlay of Rs 1,27,500 crore (≈ $13.2bn at 96.26 rupees per dollar), six pillars including machines and materials. Tech Times: a flat 30% incentive on project cost for makers of equipment, specialty chemicals, gases and materials; Kearney's PS Subramaniam: 'a lion share of critical inputs into the value chain will still be imported'."
    spoken: about thirteen billion dollars
    display: "≈ $13bn"
    fields: {inc_spoken: thirty percent, inc_display: "30%"}
    source_ids: [pib_sep26, tt_sites, fred_inr]
    status: source_located
    verification_note: Conversion is ours.

  - id: osat_how
    text: "Tech Times (Aug 2026): OSAT takes finished silicon wafers produced elsewhere, dices them into individual dies, places each die in a protective package, bonds the electrical connections, and tests the finished chips; it is the most accessible entry point because it does not require extreme precision equipment, exotic photochemistry or multi-step photolithography; OSAT uses wire bonders (mainly US and Japan) and packaging materials from Japan, Taiwan and South Korea; front-end chemistry needs contamination control in parts per trillion."
    spoken: parts per trillion
    display: "parts per trillion"
    source_ids: [tt_sites]
    status: source_located
    verification_note: Read on 2026-11-08.

  - id: loan
    text: "Tech Times (Jul 2026): a $735 million loan package from HSBC, MUFG, First Abu Dhabi Bank, DBS and ANZ in February 2026, with the project's 163.5-acre Dholera land pledged as collateral at a valuation of zero; lenders relied on Tata Group's reputation."
    spoken: seven hundred and thirty-five million dollars
    display: "$735M"
    source_ids: [tt_dholera]
    status: source_located
    verification_note: As reported; described by analysts as unconventional.

  - id: pillars
    text: "Tech Times (Aug 2026): Semicon 2.0 offers 40% capex support for CMOS silicon fabs and 35% for compound-semiconductor and display fabs; ₹1,000 crore for research centres in FY2026-27; more than 315 universities equipped with design tools and about 68,000 engineers trained by mid-2026; Lam Research's partnership targets 60,000 fab engineers over the next decade."
    spoken: forty percent
    display: "40%"
    fields: {eng_spoken: sixty thousand, uni_spoken: more than three hundred}
    source_ids: [tt_sites, pib_may26]
    status: source_located
    verification_note: PIB (May 2026) also cites design infrastructure for 315 academic institutions.

  - id: geo
    text: "Tech Times (Jul 2026): India's surviving competitive argument against subsidised Chinese mature-node capacity is not price but geopolitics, the security and resilience value of sourcing chips from a democratic, non-adversarial partner."
    spoken: not price
    display: "trust, not price"
    source_ids: [tt_dholera]
    status: source_located
    verification_note: Analysis by Tech Times, attributed.
