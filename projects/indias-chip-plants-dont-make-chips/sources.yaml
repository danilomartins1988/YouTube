# the approval or announcement day: 15 Dec 2021 76.38; 29 Feb 2024 82.87; 5 May 2026 95.32; 15 Jul 2026 96.26 rupees per dollar.
# Dollar figures given by a source (imports, demand, Micron's plant) are used as published.
# PLANS AND PROJECTIONS (demand 2030, imports 2035, Dholera dates) are labelled as such.
