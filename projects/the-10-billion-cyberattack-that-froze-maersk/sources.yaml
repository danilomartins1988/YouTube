# Sources and claims for "The $10 Billion Cyberattack That Froze the World's Biggest Shipping Company"
# (Episode 20, top-10 #3: NotPetya / Maersk).
# Every claim was read on its source page on 2026-11-09 (AI fact-check; quotes in docs/episodes/20-notpetya/FACT_CHECK.md).
# Status stays source_located until a named human reviewer signs off.
# MONEY: all amounts in US dollars as published. Company losses are the companies' own reported figures (via the press);
# the $10bn total is a White House assessment, said as such. Attribution: the film says which governments blamed the
# Russian military, that the Kremlin rejected the accusation, and that the GRU officers are charged (an indictment, not a
# conviction). Real people are named in text only; no logos, no likeness, no real company UI.
