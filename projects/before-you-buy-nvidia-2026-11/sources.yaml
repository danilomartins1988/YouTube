    spoken: one hundred and fifteen point eight billion dollars
    display: "Q3 FY2027 revenue $115.8bn, +103% y/y (Nvidia 8-K)"
    fields: {yoy_spoken: a hundred and three percent, ago_spoken: fifty-seven billion dollars, dc_spoken: one hundred and seven point six billion dollars, dcshare_spoken: ninety-three percent, hyper_spoken: sixty point one billion dollars, hyper_yoy_spoken: seventy-one percent, aice_spoken: forty-seven and a half billion dollars, aice_yoy_spoken: a hundred and ninety-five percent, edge_spoken: eight point two billion dollars, edge_yoy_spoken: forty-two percent}
