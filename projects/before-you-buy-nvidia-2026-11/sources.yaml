claims:
  - id: cap
    text: "Close Nov 17, 2026: $155.46 (Yahoo Finance; the Nov 12 8-K scheduled the results for about 1:20 p.m. PT, i.e. after the 4 p.m. ET close, so this close does not reflect them). Q3 FY2027 weighted-average basic shares 24,106M (release income statement; the Q3 10-Q cover count is not filed yet; the Q2 10-Q cover showed about 24.1bn as of Aug 21, 2026). OUR calculation: market value ≈ $3,747.5bn (≈ $3.75tn). Close Nov 4, 2026 $200.13, so −22.3% to Nov 17 (our calc.). Net cash ≈ $21.1bn (cash, cash equivalents and marketable debt securities $53.5bn minus long-term debt $32.4bn; our calc.) ≈ 0.6% of the price, so market cap is used."
    spoken: about three point seven five trillion dollars
    display: "≈ $3.75tn market value (close Nov 17, 2026 × 24.1bn shares; our calc.)"
    fields: {price_spoken: one hundred and fifty-five dollars and forty-six cents, shares_spoken: about twenty-four point one billion, date_spoken: "November seventeenth, twenty twenty-six", nov4_spoken: two hundred dollars and thirteen cents, drop_spoken: about twenty-two percent, netcash_spoken: about twenty-one billion dollars}
    source_ids: [px, pr]
    status: source_located
    verification_note: Our calculation; date on screen; price is a data-vendor close taken before the report.

  - id: lenses
    text: "OUR calculations, trailing twelve months (Q4 FY2026 + first nine months FY2027): GAAP net income $226.3bn ($42,960M + $183,297M); P/E 16.6x. Gains from equity securities in that period $31.0bn pre-tax ($5,491M + $25,474M); taxed at 17% (the Q3 non-GAAP rate) that is ≈ $25.7bn, so P/E ≈ 18.7x excluding them (rough). Free cash flow (company definition) $148.6bn ($34,902M + $113,672M), FCF yield 4.0%; operating cash flow $158.9bn, OCF yield 4.2%; purchases of property, equipment and intangibles $10.1bn ≈ 6% of operating cash flow (small), so FCF is the gauge base. TTM revenue $361.8bn; price/sales 10.4x."
    spoken: about sixteen and a half times
    display: "P/E 16.6x (≈ 18.7x ex equity gains) · FCF yield 4.0% · OCF yield 4.2% (our calc., TTM)"
    fields: {ni_spoken: about two hundred and twenty-six billion dollars, pex_spoken: about eighteen point seven times, gains_spoken: about thirty-one billion dollars, fcf_spoken: about one hundred and forty-nine billion dollars, fcfy_spoken: about four percent, ocfy_spoken: about four point two percent, capex_spoken: about ten billion dollars, capexshare_spoken: about six percent}
    source_ids: [pr, q4, px]
    status: source_located
    verification_note: Our calculation from company figures; equity-gain tax rate is our simplification.

  - id: rdcf
    text: "OUR illustration (not a valuation): market cap $3,747.5bn = 10 years of FCF growing at g from TTM FCF $148.6bn, plus a terminal value at 3% growth, discounted at r. Solved: r = 8% gives g ≈ 5.6% a year (year-10 FCF ≈ $255bn); r = 10% gives g ≈ 10.3% (≈ $395bn). With zero growth the same model gives ≈ $2.41tn (8%) or ≈ $1.76tn (10%), so ≈ 36% to ≈ 53% of the price is a bet on growth. Net cash ignored (≈ 0.6% of the price)."
    spoken: about five and a half percent a year
    display: "Implied FCF growth ≈ 5.6%-10.3% a year for 10 years (our illustration)"
    fields: {high_spoken: about ten percent, z8_spoken: about two point four trillion dollars, z10_spoken: about one point eight trillion dollars, y10_spoken: about two hundred and fifty-five billion dollars, y10h_spoken: about three hundred and ninety-five billion dollars, gap_spoken: between a third and a half}
    source_ids: [pr, q4, px]
    status: source_located
    verification_note: Our illustration; assumptions on screen (8% and 10% discount rates, 3% terminal growth, 10 years).

