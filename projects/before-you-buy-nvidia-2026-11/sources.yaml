# Sources and claims for "Before You Buy Nvidia Stock, Watch This (Nov 2026)" (series Before You Buy, Nvidia, 2026-11 edition).
# Facts read 2026-11-17 from the Q3 FY2027 8-K (filed Nov 17, 2026, after the close), its three exhibits, the Nov 12, 2026
# 8-K (CEO transition), the Q4 FY2026 8-K and the FY2026 10-K. The Q3 FY2027 10-Q is NOT filed yet (CFO commentary: "We
# plan to file our 10-Q in the coming weeks"). Notes: docs/series/research/nvidia_2026-11.md. DATA AS OF the 2026-11-17
# close, which is the close just BEFORE the results came out.
# QUARTERLY REFRESH: update text/spoken/display/fields below from the new 8-K/10-Q/10-K and the new close; the script
# reads every number through {{placeholders}}. Status stays source_located until a named human reviewer signs off.
# RULES: no analyst views; ratios and the reverse calculation are OUR calculations (illustration, inputs on screen);
# never fair value, cheap/expensive, buy/sell. Huang: only what the 8-K says (resignation accepted, no reason given);
# the independent-committee investigation only in the release's words, no details, nobody named. US dollars.
