# The second person is never named; the first woman is never named; allegations attributed; our estimates labelled.
logline: Two days after Nvidia lost about $428 billion over reports about its founder, a second report and a board meeting about
  his future pushed the loss further. What was reported, what is confirmed, and what removing a founder would mean.
title: Nvidia's Founder Might Be Out. Here's What's at Stake
