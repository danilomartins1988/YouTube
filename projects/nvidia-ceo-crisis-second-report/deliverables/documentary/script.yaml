- id: payoff
  chapter: The lesson
  narration: So why is Nvidia worth so much less than a week ago? Not because its chips changed. Because investors are trying to price a
    company that, by its own admission, depends heavily on its leaders, at the exact moment its board is reported to be debating whether
    to replace the most important one. Nothing in this story has been proven in court, and nobody has been charged. But markets do not wait
    for verdicts. They price people, and they price uncertainty. And for now, the biggest uncertainty in artificial intelligence is not a
    chip. It is a chair.
  claims:
  - cum
  - control
  analysis: true
  source_note: Conclusion drawn from the sourced parts.
