- id: m5_keyperson
  chapter: What the price says
  narration: Remember the phrase from our last video, key person risk. Nvidia's annual report says it is highly dependent on its longstanding
    executive team. The analyst Stacy Rasgon summed it up in five words. Jensen is Nvidia. Nvidia is Jensen.
  claims:
  - control
  - analysts
- id: m5_ives
  chapter: What the price says
  narration: Some analysts have put numbers on that. Dan Ives said that if Huang were removed, Nvidia would be worth a lot less, {{analysts}},
    and he gave different price targets depending on whether Huang stays or goes. Bernstein downgraded the stock and cut its target in half.
    Those are opinions, not facts. But they show how a single seat can move a valuation by hundreds of billions of dollars.
  claims:
  - analysts
- id: m5_peers
  chapter: What the price says
  narration: And look at the neighbors. When Nvidia fell, AMD and Broadcom rose, on Monday and again on Thursday morning. Investors were not
    selling chips. They were selling uncertainty about one company's leadership, and buying its rivals.
  claims:
  - night
