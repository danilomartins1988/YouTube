- id: m4_calls
  chapter: Washington
  narration: Senator Kevin Cramer, a Republican from North Dakota, told Politico that the potential for extortion was so tremendous, given
    something as sensitive as Nvidia chips, that, in his words, he's got to go. Representative Suhas Subramanyam, a Democrat from Virginia,
    told CNBC that Huang should resign. Those are their opinions. No regulator has made a finding.
  claims:
  - congress
- id: m4_chairs
  chapter: Washington
  narration: Two House committee chairmen, Brian Mast and John Moolenaar, said they had not heard from Huang and gave him until the end of
    Wednesday to respond. Asked whether subpoenas were possible, Mast said, yes.
  claims:
  - congress
- id: m4_letter
  chapter: Washington
  narration: In the Senate, Elizabeth Warren and Chris Coons asked the Commerce Department to preserve its records on Nvidia's chip exports
    to China, writing that the incident raises significant concerns about the government's ability to enforce export controls. And in
    January, Democrats take control of both chambers, with the power to issue subpoenas.
  claims:
  - congress
