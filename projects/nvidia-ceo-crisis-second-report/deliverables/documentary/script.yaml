- id: m2_card
  chapter: The second report
  narration: ''
  claims: []
- id: m2_nyt
  chapter: The second report
  narration: On Wednesday, November eleventh, the New York Times reported that Huang had had a second relationship, this time with an
    Nvidia vice president who reports to him. The Times cited five people who had worked at the company. According to the report, both
    were married to other people.
  claims:
  - second
- id: m2_unconfirmed
  chapter: The second report
  narration: Here is what is not confirmed. Huang has not confirmed it. Nvidia has not commented. NBC News said it had not confirmed the
    Times report. When the Times reached Huang by phone, he said, I don't think you should be talking to me directly. We are not naming
    the executive, and we will not speculate about her. She is not accused of anything.
  claims:
  - second
- id: m2_why
  chapter: The second report
  narration: So why would this matter to investors at all? Because of the reporting line. A chief executive in a relationship with someone
    who reports to him is not a gossip question for a board. It is a governance question, about conflicts of interest and about who
    knew what. That is the lens the market used.
  claims:
  - second
  analysis: true
  source_note: Commentary on why boards treat reporting-line relationships as governance issues.
- id: m2_afterhours
  chapter: The second report
  narration: The timing shows it. Nvidia's shares had actually closed up {{night}} on Wednesday, at about a hundred and seventy-four dollars.
    In trading after the close, they slid. By about five twenty-five in the evening, New York time, the price had touched about a hundred
    and fifty-six dollars, roughly ten percent below the close. At eight in the evening, the last after-hours trade was still about
    a hundred and fifty-nine dollars. On Thursday morning, before the open, rivals AMD and Broadcom were up,
    and Nvidia was still down nearly eight percent.
  claims:
  - night
- id: m2_transition
  chapter: The second report
  narration: And while the price was falling, the board was meeting.
  claims:
  - oust
- id: m3_card
  chapter: The board meeting
  narration: ''
  claims: []
- id: m3_reports
  chapter: The board meeting
  narration: The Wall Street Journal reported that Nvidia's board was preparing to oust Huang. Semafor reported the same, and added that the
    full board had yet to make a decision. CNBC confirmed that the board met on Wednesday to discuss whether to remove him. On Thursday
    morning, CNBC wrote that no outcome had been announced.
  claims:
  - oust
- id: m3_confidence
  chapter: The board meeting
  narration: Notice the contrast with four days earlier. On Sunday, the board's own statement said it had confidence in Jensen and his
    leadership team. As of Thursday morning, that line had not been withdrawn or updated in public. There was no new statement on the
    company's newsroom, and no new filing with the SEC. Everything about a possible change of leadership was still coming from reporting,
    not from Nvidia.
  claims:
  - recap
  - oust
- id: m3_interim
  chapter: The board meeting
  narration: Bloomberg reported that Nvidia was working with an outside search firm to identify chief executive candidates, and was weighing
    an interim leader first. Semafor reported that some directors favor the chief financial officer, Colette Kress, for that interim
    role. Those are reports. No name has been confirmed by the company.
  claims:
  - oust
- id: m3_control
  chapter: The board meeting
  narration: Could a board really remove the founder of a company like this? According to Nvidia's latest proxy statement, Huang owns about
    {{control}} of the company's shares, mostly through family trusts. That is a fortune, but it is far from a majority. The chief executive
    serves at the pleasure of the board, which CNBC says has eleven directors and a lead director instead of a chair. And removing him as
    chief executive would not, by itself, remove him from the board. And the proxy statement does not use the word succession even once.
  claims:
  - control
- id: m3_draw
  chapter: The board meeting
  narration: Let me draw the decision. Here is the board. Here is the chief executive's seat. The board appoints whoever sits in it. Today
    that arrow points at the founder. If the board changes its mind, the arrow moves to an interim leader, while a search firm looks for
    a permanent one. And by law, the company would have to tell regulators, normally within four business days.
  claims:
  - oust
  - control
  analysis: true
  source_note: Diagram of the board-CEO relationship and the 8-K timing.
