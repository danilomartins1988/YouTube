- id: m1_recap
  chapter: The story so far
  narration: A quick recap. On Sunday, November eighth, Jensen Huang, Nvidia's founder and chief executive, sent an email to employees.
    In it he wrote, I was unfaithful to my wife. The same day, the board opened an independent investigation, in light of reporting that
    he had been the target of a foreign intelligence effort. The New York Times and the Financial Times had reported that American officials
    believed a businesswoman linked to an Nvidia customer was working for China's intelligence service. China called that unsubstantiated,
    and nobody has been charged.
  claims:
  - recap
- id: m1_market
  chapter: The story so far
  narration: The board said it had no reason to believe that national security or company secrets were compromised. Investors sold anyway.
    On Monday, the broad market and Nvidia's rivals rose, while Nvidia fell. Over two trading days, about {{recap}} of market value
    disappeared, by our estimate.
  claims:
  - recap
- id: m1_draw
  chapter: The story so far
  narration: Let me draw the share price on four checkpoints. Friday, November sixth, about a hundred and eighty-seven dollars. Tuesday,
    about a hundred and sixty-nine. Then Wednesday's close, a little higher, about a hundred and seventy-four. And here is the latest
    price we used, {{cum.price_spoken}}. Look at what happened between those last two bars.
  claims:
  - cum
  - night
  - recap
  analysis: true
  source_note: Bar sketch of the sourced closing and premarket prices.
- id: m1_transition
  chapter: The story so far
  narration: Wednesday had started as a good day. Then, a little before five in the afternoon, the second story broke.
  claims:
