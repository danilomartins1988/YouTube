    text: "Dan Ives (Yahoo, Nov 10): 'We believe if Jensen was removed as CEO, Nvidia is worth a lot less (25%-30%)'; relayed Nov 11-12: $300 target if Huang stays, $225 if ousted; 'the writing is on the wall'. Bernstein downgraded to Market-Perform, target cut from $400 to $200 (CNBC, Yahoo). Stacy Rasgon (CNBC): 'Jensen is Nvidia. Nvidia is Jensen.'"
    spoken: twenty-five to thirty percent
