  - id: recap
    text: "Ep 52 facts: Huang email to employees, Nov 8, 2026: 'I was unfaithful to my wife.' Board, Nov 8: independent investigation 'in light of recent reporting that founder and CEO Jensen Huang has been the target of a foreign intelligence effort'; 'no reason to believe that either national security or NVIDIA secrets were compromised'. NYT/FT reported (relayed) that US intelligence officials believed a businesswoman linked to Megaspeed was working for China's Ministry of State Security; China called it 'unsubstantiated'; nobody charged. Closes $186.64 (Nov 6), $168.89 (Nov 10): about -$428bn over two trading days (our estimate). Nov 9: S&P 500 +2.35%, AMD +13.26%, Broadcom +8.78%."
    spoken: four hundred and twenty-eight billion dollars
    display: "≈ -$428bn, Nov 6-10 (our estimate; Ep 52)"
    fields: {}
    source_ids: [nvidia, press, px, sec]
    status: source_located
    verification_note: Allegations only; never name the first woman.

  - id: second
    text: "NYT (Wed Nov 11, 2026), citing five people who worked at Nvidia, relayed by CNBC/NBC/TNW: Huang had a relationship with an Nvidia vice president who reports to him; both reportedly married to other people. Huang to the NYT by phone: 'I don't think you should be talking to me directly.' Nvidia did not respond to requests for comment (NBC). NBC: 'has not confirmed the Times report.' No Nvidia statement on it."
    spoken: a second relationship
    display: "Second relationship: NYT report, unconfirmed (NBC)"
    fields: {}
    source_ids: [nyt]
    status: source_located
    verification_note: NYT-only; the person is never named, drawn or described beyond 'an Nvidia executive who reports to him'.

  - id: night
    text: "Nov 11 regular close $173.73 (+2.86% on the day, before the news; about +$117bn our calc). After-hours decline began with the 4:55 p.m. ET bar and steepened 5:20-5:25 p.m.; low $156.20 (5:25 p.m. bar), -10.09% vs Nov 11 close; last after-hours $158.78 (8 p.m.), -8.61%. Premarket Nov 12, 7:03 a.m. ET: $160.27, -7.75%. Peers premarket (CNBC 6:23 a.m. ET): AMD +3.9%, Broadcom +3%."
    spoken: two point eight six percent
