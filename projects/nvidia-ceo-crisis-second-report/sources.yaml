# Status stays source_located until a named human reviewer signs off. US dollars.
# RULES: the second relationship is a New York Times report only (NBC has not confirmed; Huang, the executive and Nvidia
# have not confirmed); the second person is NEVER named, drawn or described beyond "an Nvidia executive / a vice president
# who reports to him"; the first woman is never named (silhouette only) and the spy claim is "alleged / reported";
# "preparing to oust" = WSJ and Semafor reporting; interim CEO + search firm = Bloomberg report; Colette Kress only as
