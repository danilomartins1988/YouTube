  - id: oust
    text: "WSJ (Nov 11, relayed): the board was 'preparing to oust' Huang. Semafor: 'The full board has yet to make a decision.' CNBC confirmed the board met Wednesday Nov 11 to discuss whether to oust Huang. Bloomberg (Nov 11, relayed): working with an outside search firm; weighing an interim CEO. Semafor alone: 'some board members favor' CFO Colette Kress as interim. CNBC 6:06 a.m. ET Nov 12: 'So far, no outcome has been announced.' No 8-K; newsroom unchanged since Nov 10 (checked ~7 a.m. ET Nov 12). An 8-K (Item 5.02) normally within four business days of a CEO change. Board statement Nov 8: 'confidence in Jensen and his leadership team' — not withdrawn or updated publicly as of ~7 a.m. ET Nov 12."
    spoken: preparing to oust
    display: "Board: 'preparing to oust' (WSJ, Semafor · reported); no decision announced"
    fields: {}
    source_ids: [board, sec]
    status: source_located
    verification_note: Reports, not decisions; never say 'fired'.

  - id: control
    text: "Proxy (May 12, 2026): Huang 870,604,104 shares, 3.58%, mostly via family trusts; Lead Director Stephen C. Neal, no chair; the word 'succession' does not appear. CNBC: 11 directors. 10-K FY2026: 'we are highly dependent on the services of our longstanding executive team.' Removal as CEO would not by itself remove him from the board (TNW/Korea Times, snippet)."
    spoken: three point six percent
    display: "Huang ≈ 3.6% of shares (proxy); 11 directors (CNBC)"
    fields: {}
    source_ids: [sec, board]
    status: source_located

  - id: congress
    text: "Sen. Kevin Cramer (R-N.D.) to Politico via Reuters (Nov 10): 'The potential for extortion is so tremendous that something as sensitive as Nvidia chips, I just think he's got to go.' Rep. Suhas Subramanyam (D-Va.) to CNBC: 'Jensen Huang should resign from Nvidia.' Chairs Mast and Moolenaar (CNBC, Nov 11): had not heard from Huang, gave him until end of day; Mast on subpoenas: 'yes'. Sens. Warren and Coons to Commerce (NBC): records preserved; 'This incident raises significant concerns about the federal government's ability to effectively enforce our export controls and protect our national security.' Democrats take control of both chambers in January (CNBC/NBC)."
    spoken: he's got to go
    display: "Congress: resignation calls, subpoena threat (attributed)"
    fields: {}
    source_ids: [hill]
    status: source_located
    verification_note: Opinions of the named lawmakers; no regulator statement found.

