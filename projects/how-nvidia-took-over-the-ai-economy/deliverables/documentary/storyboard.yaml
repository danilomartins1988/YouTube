# Storyboard for the Remotion renderer (remotion/src/scenes/*). One scene per script segment.
# Animation is cue-driven: `cue` phrases are matched against the narration's word timings.
# Colour language: accent (green) = Nvidia ecosystem; accent2 (blue/cyan) = computing infrastructure and
# competing ecosystems; accent3 (gold) = revenue and economic value; risk (red) = risks and bottlenecks.
# SIGNATURE ANIMATIONS: s08_cpu_gpu (1), s11_stack + s12_switch (2), s22_chain + s23_bottleneck (3),
# s15_revenue + s16_mix + s18_margin (4), s29_landscape (5). Whiteboards: s07_sketch, s13_flywheel.
scenes:
  # ================= ACT 1
  - id: s01_network
    segment: open_network
    type: ai_network
    params:
      no_chrome: true
      kicker: The Hidden Economics
      kicker_cue: "Every time"
      groups:
        - {label: AI apps, colour: accent2, cue: "AI chatbot", nodes: [Chatbots, Coding assistants, Image tools, Search]}
        - {label: AI labs, colour: accent3, cue: "AI labs", nodes: [OpenAI, Anthropic, Google DeepMind, Meta AI]}
        - {label: Clouds, colour: accent2, cue: "cloud companies", nodes: [AWS, Microsoft Azure, Google Cloud, Oracle Cloud]}
        - {label: Data centers, colour: accent3, cue: "data centers", nodes: [Enterprises, Startups, Sovereign AI, Research labs]}
      hub: NVIDIA
      hub_cue: "one supplier"
      hub_label: One supplier
    sfx: [{kind: hit, at: 0.0, gain: 0.3}, {kind: pop, cue: "one supplier", offset: 0.4}]
    assets: ["font:inter"]

  - id: s02_value
    segment: open_value
    type: big_counter
    params:
      chapter: "The supplier"
      cue: "worth"
      kicker: "Stock market value, 29 October 2025"
      display: "{{market_cap_5tn.display}}"
      label: "First company ever to close above it"
      sublabel: "NVIDIA"
    sfx: [{kind: pop, cue: "worth", offset: 1.2}]
    sources: [ap_5tn]
    assets: ["font:inter"]

  - id: s03_revenue
    segment: open_revenue
    type: compare
    params:
      chapter: "The supplier"
      title: "NVIDIA revenue, three fiscal years apart"
      sides:
        - {kicker: "Fiscal 2023", value: "{{revenue_fy2023.display}}", label: "year to Jan 2023", bar: 27.0, cue: "three years"}
        - {kicker: "Fiscal 2026", value: "{{revenue_fy2026.display}}", label: "year to Jan 2026 ({{revenue_fy2023.multiple_display}})", bar: 215.9, cue: "it sold"}
    sources: [nvda_q4fy26, nvda_xbrl]
    assets: ["font:inter"]

  - id: s04_question
    segment: open_question
    type: kinetic_text
    params:
      align: center
      lines:
        - {text: "Known for video game graphics", size: 60, style: body, cue: "For most"}
        - {text: "Now at the center of the AI economy", size: 74, color: accent, cue: "how did"}
        - {text: "Can it stay there?", size: 64, color: accent3, cue: "Can it stay"}
    assets: ["font:inter"]

  # ================= ACT 2
  - id: s05_act2
    segment: a2_card
    type: act_title
    params: {number: Act 2, title: From Gaming to AI, subtitle: "Why graphics chips suit artificial intelligence", min_seconds: 3.0}
    sfx: [{kind: hit, at: 0.1, gain: 0.25}]
    assets: ["font:inter"]

  - id: s06_origins
    segment: a2_origins
    type: timeline
    params:
      chapter: "02 · From gaming to AI"
      title: A graphics company
      start_year: 1992
      end_year: 2001
      tick_every: 1
      items:
        - {year: "{{founded_1993.value}}", label: "NVIDIA founded in California", cue: "was founded"}
        - {year: "{{gpu_1999.value}}", label: "Launches what it calls the first GPU", cue: "first GPU"}
        - {year: 2000, display: "PC gaming", label: "Business: drawing video games, fast", cue: "drawing video games"}
    sources: [nvda_10k_fy2026]
    assets: ["font:inter"]

  - id: s07_sketch
    segment: a2_sketch
    type: whiteboard
    params:
      speed: 2000
      caption: "Graphics = many small jobs at once"
      caption_cue: "same time"
      strokes:
        - {d: "M 160 220 L 860 220 L 860 640 L 160 640 Z", w: 7, cue: "one frame"}
        - {d: "M 160 360 L 860 360 M 160 500 L 860 500 M 393 220 L 393 640 M 626 220 L 626 640", w: 4, cue: "millions of pixels"}
        - {text: "MILLIONS OF PIXELS", x: 230, y: 720, size: 40, cue: "each pixel"}
        - {d: "M 1100 330 A 80 80 0 1 0 1260 330 A 80 80 0 1 0 1100 330", fill: accent2, w: 6, cue: "few very fast"}
        - {text: "A FEW FAST WORKERS", x: 1010, y: 470, size: 36, cue: "few very fast"}
        - {d: "M 1010 600 A 24 24 0 1 0 1058 600 A 24 24 0 1 0 1010 600 M 1090 600 A 24 24 0 1 0 1138 600 A 24 24 0 1 0 1090 600 M 1170 600 A 24 24 0 1 0 1218 600 A 24 24 0 1 0 1170 600 M 1250 600 A 24 24 0 1 0 1298 600 A 24 24 0 1 0 1250 600 M 1330 600 A 24 24 0 1 0 1378 600 A 24 24 0 1 0 1330 600 M 1410 600 A 24 24 0 1 0 1458 600 A 24 24 0 1 0 1410 600", fill: accent, w: 5, cue: "huge number", speed: 1500}
        - {d: "M 1010 680 A 24 24 0 1 0 1058 680 A 24 24 0 1 0 1010 680 M 1090 680 A 24 24 0 1 0 1138 680 A 24 24 0 1 0 1090 680 M 1170 680 A 24 24 0 1 0 1218 680 A 24 24 0 1 0 1170 680 M 1250 680 A 24 24 0 1 0 1298 680 A 24 24 0 1 0 1250 680 M 1330 680 A 24 24 0 1 0 1378 680 A 24 24 0 1 0 1330 680 M 1410 680 A 24 24 0 1 0 1458 680 A 24 24 0 1 0 1410 680", fill: accent, w: 5, cue: "simpler ones", speed: 1500}
        - {text: "MANY SIMPLE WORKERS", x: 1000, y: 780, size: 36, cue: "simpler ones"}
        - {d: "M 870 430 C 940 430 960 600 1000 600 M 870 500 C 940 520 960 680 1000 680", w: 5, cue: "same time"}
    assets: ["font:inter"]

  - id: s08_cpu_gpu
    segment: a2_cpu_gpu
    type: cpu_gpu
    params:
      title: Same job, two designs
      title_cue: "Give both"
      cpu_cue: "same job"
      gpu_cue: "same job"
      run_cue: "work through them"
      gpu_run_cue: "The GPU gives"
      workload_label: "192 INDEPENDENT TASKS"
      serial_cue: "flip the problem"
      serial_label: "A STEP-BY-STEP JOB: EACH STEP WAITS FOR THE LAST ONE"
      note_cue: "Real performance"
    sfx: [{kind: pop, cue: "The GPU gives", offset: 0.6}]
    assets: ["font:inter"]

  - id: s09_alexnet
    segment: a2_alexnet
    type: kinetic_text
    params:
      align: center
      lines:
        - {text: "Neural networks = piles of multiplications", size: 54, style: body, cue: "enormous piles"}
        - {text: "{{alexnet.display}}: AlexNet", size: 88, color: accent, cue: "AlexNet"}
        - {text: "trained on 2 NVIDIA gaming GPUs", size: 56, color: accent2, cue: "trained on"}
        - {text: "wins the ImageNet contest", size: 56, color: accent3, cue: "won a famous"}
        - {text: "{{tensor_2017.display}}: first Tensor Core GPU, built for AI", size: 48, color: accent, style: body, cue: "Tensor Cores"}
    sources: [alexnet_2012]
    assets: ["font:inter"]

  # ================= ACT 3
  - id: s10_act3
    segment: a3_card
    type: act_title
    params: {number: Act 3, title: The CUDA Advantage, subtitle: "Software that turned chips into a platform", min_seconds: 3.0}
    sfx: [{kind: hit, at: 0.1, gain: 0.25}]
    assets: ["font:inter"]

  - id: s11_stack
    segment: a3_stack
    type: stack
    params:
      title: "The NVIDIA stack"
      title_cue: "only half"
      layer_h: 82
      layer_gap: 10
      base_pad: 110
      layers:
        - {label: GPU hardware, sub: "the chip", colour: accent, cue: "the chip was only"}
        - {label: Drivers, sub: "talk to the hardware", colour: accent, cue: "Years before"}
        - {label: "CUDA ({{cuda_2006.display}})", sub: "general-purpose GPU programming", colour: accent, cue: "released CUDA"}
        - {label: Libraries, colour: accent, items: [cuBLAS (math), cuDNN (neural nets), NCCL (multi-chip)], cue: "libraries for math"}
        - {label: AI frameworks, colour: accent2, items: [PyTorch, TensorFlow, JAX], cue: "frameworks plugged"}
        - {label: Developers, colour: accent2, cue: "Developers learned"}
        - {label: AI applications, colour: accent3, cue: "applications were built"}
      counter: "{{developers.display}}"
      counter_label: "Developers using NVIDIA tools"
      counter_sub: "NVIDIA 10-K, fiscal 2026"
      counter_cue: "Today Nvidia says"
    sources: [nvda_10k_fy2026]
    assets: ["font:inter"]

  - id: s12_switch
    segment: a3_switch
    type: stack
    params:
      title: "Switching costs"
      title_cue: "switching costs"
      layer_h: 82
      layer_gap: 10
      base_pad: 110
      layers:
        - {label: GPU hardware, colour: accent, at: 0}
        - {label: Drivers, colour: accent, at: 0}
        - {label: CUDA, colour: accent, at: 0}
        - {label: Libraries, colour: accent, at: 0}
        - {label: AI frameworks, colour: accent2, at: 0}
        - {label: Developers, colour: accent2, at: 0}
        - {label: AI applications, colour: accent3, at: 0}
      switch_cue: "move to another chip"
      switch_label: "What moving can cost"
      rival: "Another chip + its software"
      costs:
        - {label: "Port and retest code", cue: "port and retest", weight: 0.9}
        - {label: "Tune performance again", cue: "tune its performance", weight: 0.7}
        - {label: "Change tools", cue: "change its tools", weight: 0.6}
        - {label: "Retrain teams", cue: "retrain its teams", weight: 0.8}
      caption: "Possible, but costly: the friction protects the incumbent"
      caption_cue: "friction"
    assets: ["font:inter"]

  - id: s13_flywheel
    segment: a3_flywheel
    type: whiteboard
    params:
      speed: 900
      caption: "A network effect: the wheel feeds itself"
      caption_cue: "feeds itself"
      caption_y: 1030
      strokes:
        - {text: "DEVELOPERS", x: 820, y: 250, size: 48, cue: "More developers"}
        - {d: "M 1120 300 A 300 300 0 0 1 1255 470 M 1235 445 L 1255 472 L 1270 440", w: 7, cue: "write more software"}
        - {text: "SOFTWARE", x: 1290, y: 600, size: 48, cue: "More software"}
        - {d: "M 1245 690 A 300 300 0 0 1 1090 840 M 1120 838 L 1088 842 L 1105 815", w: 7, cue: "attracts more customers"}
        - {text: "CUSTOMERS", x: 830, y: 930, size: 48, cue: "More customers"}
        - {d: "M 830 840 A 300 300 0 0 1 675 690 M 672 722 L 674 688 L 700 706", w: 7, cue: "more money"}
        - {text: "MONEY FOR R&D", x: 270, y: 600, size: 48, cue: "new chips"}
        - {d: "M 670 470 A 300 300 0 0 1 805 300 M 776 304 L 807 299 L 795 328", w: 7, cue: "even more developers"}
        - {d: "M 800 520 L 1120 520 L 1120 640 L 800 640 Z", fill: accent, w: 6, cue: "feeds itself"}
        - {text: "NETWORK EFFECT", x: 822, y: 598, size: 40, cue: "feeds itself"}
    assets: ["font:inter"]

  # ================= ACT 4
  - id: s14_act4
    segment: a4_card
    type: act_title
    params: {number: Act 4, title: How Nvidia Makes Money, subtitle: "Revenue, customers and margins", min_seconds: 3.0}
    sfx: [{kind: hit, at: 0.1, gain: 0.25}]
    assets: ["font:inter"]

  - id: s15_revenue
    segment: a4_revenue
    type: stacked_columns
    params:
      title: "NVIDIA revenue by fiscal year"
      subtitle: "US$ billion · fiscal years end in late January (FY26 = year to Jan 2026) · 10-K"
      title_cue: "the money"
      years: "{{revenue_columns.value}}"
      series: [{key: total, label: "Total revenue", colour: accent3}]
      grow_cue: "For a decade"
      step_seconds: 0.6
      y_max: 230
      ticks: [50, 100, 150, 200]
      notes:
        - {text: "FY23: $27.0bn", x: 1040, y: 700, colour: accent3, cue: "fiscal twenty twenty-three"}
        - {text: "FY26: $215.9bn", x: 1480, y: 230, colour: accent, cue: "to"}
    sources: [nvda_xbrl]
    assets: ["font:inter"]

  - id: s16_mix
    segment: a4_mix
    type: stacked_columns
    params:
      title: "Who buys: revenue by market"
      subtitle: "US$ billion, fiscal years · NVIDIA 10-K"
      mix_title: "Data Center's share of revenue"
      mix_subtitle: "Share of each fiscal year's total"
      title_cue: "who buys"
      years: "{{segments.value}}"
      series:
        - {key: dc, label: "Data Center", colour: accent}
        - {key: gaming, label: "Gaming", colour: accent2}
        - {key: other, label: "Pro visualization, auto, other", colour: muted}
      grow_cue: "In fiscal twenty twenty"
      step_seconds: 0.5
      y_max: 230
      ticks: [50, 100, 150, 200]
      mix_cue: "That is"
    sources: [nvda_10k_fy2022, nvda_10k_fy2025, nvda_10k_fy2026]
    assets: ["font:inter"]

  - id: s17_customers
    segment: a4_customers
    type: donut
    params:
      chapter: "04 · How Nvidia makes money"
      title: "Customer concentration, fiscal 2026"
      subtitle: "Share of NVIDIA revenue · direct customers are not named in the 10-K"
      segments: "{{customer_split.value}}"
      center: "36%"
      cue: "one direct customer"
    sources: [nvda_10k_fy2026]
    assets: ["font:inter"]

  - id: s18_margin
    segment: a4_margin
    type: line_chart
    params:
      chapter: "04 · How Nvidia makes money"
      title: "Gross margin"
      subtitle: "GAAP, by fiscal year · our calculation from 10-K gross profit ÷ revenue"
      series: "{{gross_margin_series.value}}"
      highlight: GM
      cue: "Then look"
      draw_seconds: 8
      y_max: 80
      y_steps: 4
      axis_suffix: "%"
      value_suffix: "%"
      value_decimals: 1
      year_every: 2
      year_prefix: "FY"
      events:
        - {year: 2023, label: "FY23: 56.9%", cue: "fiscal twenty twenty-three"}
        - {year: 2025, label: "FY25: 75.0%", cue: "fiscal twenty twenty-five"}
        - {year: 2026, label: "FY26: 71.1% ($4.5bn charge)", cue: "charge", dx: -330, dy: 70}
    sources: [nvda_xbrl, nvda_10k_fy2026]
    assets: ["font:inter"]

  - id: s19_why
    segment: a4_why
    type: kinetic_text
    params:
      align: center
      lines:
        - {text: "Why so profitable?", size: 76, cue: "Why so"}
        - {text: "Demand ran ahead of supply", size: 54, color: accent3, style: body, cue: "Demand ran"}
        - {text: "A product that is hard to replace", size: 54, color: accent, style: body, cue: "hard to replace"}
        - {text: "Whole systems, not just chips", size: 54, color: accent2, style: body, cue: "whole systems"}
        - {text: "Networking: {{dc_fy2026.networking_display}} in fiscal 2026", size: 50, color: accent2, style: body, cue: "Networking alone"}
        - {text: "R&D since founding: {{rnd_total.display}}", size: 50, color: accent3, style: body, cue: "keeps reinvesting"}
    sources: [nvda_10k_fy2026]
    assets: ["font:inter"]

  - id: s20_latest
    segment: a4_latest
    type: big_counter
    params:
      chapter: "04 · How Nvidia makes money"
      cue: "brought in"
      kicker: "Quarter ended 26 July 2026 (Q2 fiscal 2027)"
      display: "{{q2fy27.display}}"
      label: "Revenue in one quarter · +{{q2fy27.growth_spoken}}"
      sublabel: "Data Center {{q2fy27.dc_display}} · gross margin {{q2fy27.gm_display}} · next-quarter outlook {{q2fy27.guide_display}}"
    sfx: [{kind: pop, cue: "brought in", offset: 1.2}]
    sources: [nvda_q2fy27]
    assets: ["font:inter"]

  # ================= ACT 5
