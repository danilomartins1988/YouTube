title: "How Nvidia Took Over the AI Economy"
slug: how-nvidia-took-over-the-ai-economy
language: en
# Episode 06. Remotion (React + SVG) engine with the technology-economics scene library
# (remotion/src/scenes/TechScenes.tsx). Money in US dollars; Nvidia figures labelled by FISCAL year.
renderer: remotion
remotion_geo: [world]
style:
  name: silicon-ledger
  palette:            # dark navy/charcoal; green = Nvidia ecosystem; blue/cyan = competing/compute; gold = value; red = risk
    bg: "#0A1120"
    bg2: "#121B2D"
    ink: "#F2F5F9"
    muted: "#8C98AD"
    land: "#18233A"
    border: "#2A3854"
    accent: "#7CD340"     # Nvidia-inspired green (not the official brand colour)
    accent2: "#2FB4FF"    # electric blue / cyan: computing, competitors
    accent3: "#E8B64C"    # warm gold: revenue and economic value
    risk: "#FF5A5F"       # red: risks, bottlenecks
  fonts:
    display: InterDisplay-Bold
    heading: InterDisplay-SemiBold
    body: Inter-Regular
    body_bold: Inter-SemiBold
  web_fonts:
    display: "Inter Display, Inter, sans-serif"
    body: "Inter, sans-serif"
  transition: scan
  background: grid
  motifs: [chapter-tags]
# Editor instruction (Episode 06 brief): hard cap for ALL OpenAI voice work on this episode, retries included.
budget:
  max_paid_usd: 1.00
