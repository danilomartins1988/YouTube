  # ---------------------------------------------------------------- history
  - id: founded_1993
    text: NVIDIA was incorporated in California in April 1993; Jen-Hsun (Jensen) Huang co-founded it and has been CEO since inception.
    spoken: In 1993
    display: "1993"
    value: 1993
    fields: {mid_spoken: in 1993}
    source_ids: [nvda_10k_fy2026]
    status: source_located
  - id: gpu_1999
    text: "NVIDIA's 10-K says its 'invention of the GPU in 1999 sparked the growth of the PC gaming market and redefined computer graphics'."
    spoken: In 1999
    display: "1999"
    value: 1999
    source_ids: [nvda_10k_fy2026]
    status: source_located
    verification_note: Company's own description; say "what Nvidia calls the first GPU".
  - id: cuda_2006
    text: "NVIDIA introduced CUDA in 2006, opening 'the parallel processing capabilities of our GPU to a broad range of compute-intensive applications' (10-K)."
    spoken: in 2006
    display: "2006"
    value: 2006
    source_ids: [nvda_10k_fy2026]
    status: source_located
  - id: alexnet
    text: In 2012 the AlexNet neural network, trained on two NVIDIA GTX 580 GPUs, won the ImageNet image-recognition competition; training took five to six days.
    spoken: In 2012
    display: "2012"
    value: 2012
    fields: {gpus_spoken: two, days_spoken: five to six days}
    source_ids: [alexnet_2012, nvda_10k_fy2026]
    status: source_located
  - id: tensor_2017
    text: NVIDIA introduced its first Tensor Core GPU, built for AI, in 2017 (10-K).
    spoken: in 2017
    display: "2017"
    value: 2017
    source_ids: [nvda_10k_fy2026]
    status: source_located
  - id: developers
    text: "NVIDIA's FY2026 10-K says there are over 7.5 million developers worldwide using CUDA and its other software tools."
    spoken: more than 7.5 million
    display: "7.5M+"
    value: 7.5
    source_ids: [nvda_10k_fy2026]
    status: source_located
  - id: rnd_total
    text: NVIDIA says it has invested over $76.7 billion in research and development since its inception (FY2026 10-K).
    spoken: more than 76 billion dollars
    display: "$76.7bn+"
    value: 76.7
    source_ids: [nvda_10k_fy2026]
    status: source_located

