# Status meanings (see hiddeneco/models.py):
#   data_derived       computed by the pipeline from a cited dataset (never typed by hand)
#   human_verified     a named person read the primary source and confirmed it (set verified_by)
#   source_located     located via research on 2026-11-05; NOT yet read in full by a human
#   needs_verification no adequate source yet
#
# FISCAL YEARS: Nvidia's fiscal year ends on the last Sunday of January. "Fiscal 2026" (FY2026) = the
# 52 weeks ended 25 January 2026, i.e. mostly calendar 2025. Every Nvidia figure below names its fiscal
