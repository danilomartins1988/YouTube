# Nvidia annual revenue and gross profit were read from SEC XBRL company facts (10-K values) and from the
# FY2022, FY2025 and FY2026 Form 10-K "revenue by specialized markets" tables, retrieved 2026-11-05.
# Nvidia's Q3 FY2027 results (quarter ending Oct 2026) had not been published at research time; the latest
# reported quarter is Q2 FY2027 (ended 26 July 2026).

