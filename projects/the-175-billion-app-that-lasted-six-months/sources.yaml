claims:
  - id: raised
    text: "Fortune (Oct 2020): Quibi raised $1.75 billion to lavish on Hollywood-caliber shows that few people watched. Variety (Aug 2018): NewTV (later Quibi) closed a $1 billion first round; backers include Disney, 21st Century Fox, NBCUniversal, Sony Pictures, Viacom, WarnerMedia, Lionsgate, MGM, Alibaba, Goldman Sachs and JPMorgan Chase; episodes of 10 minutes each."
    spoken: one point seven five billion dollars
    display: "$1.75bn"
    fields: {first_spoken: one billion dollars, first_display: "$1bn"}
    source_ids: [fortune_shut, variety_2018, nbc_why]
    status: source_located
    verification_note: Read on 2026-11-08.

  - id: ads
    text: "TechCrunch (Oct 2019): Quibi sold out its $150 million first-year advertising inventory before launch; ads of six, 10 or 15 seconds with no skip button."
    spoken: one hundred and fifty million dollars
    display: "$150M"
    source_ids: [tc_ads]
    status: source_located
    verification_note: Read on 2026-11-08.

  - id: launch
    text: "CNN: Quibi launched on April 6 (2020). TechCrunch (7 Apr 2020): over 300,000 downloads on launch day (Sensor Tower preliminary), about 7.5% of the ≈ 4 million installs Disney+ saw at launch; 90-day free trial, then $4.99 a month with ads or $7.99 without; no AirPlay or Chromecast at launch."
    spoken: about three hundred thousand
    display: "300K"
    fields: {ads_price_spoken: four ninety-nine, noads_price_spoken: seven ninety-nine}
    source_ids: [cnn_may, tc_launch]
    status: source_located
    verification_note: Sensor Tower estimate, attributed.

  - id: turnstyle
    text: "The Verge (Mar 2020): Quibi's 'Turnstyle' switches between landscape and portrait video depending on how you hold your phone; Eko sued, alleging patent infringement and misappropriation of trade secrets; Quibi said the claims 'have absolutely no merit' and that it received its own patent."
    spoken: Turnstyle
    display: "Turnstyle"
    source_ids: [verge_eko, bbc_review]
    status: source_located
    verification_note: Allegations, said as allegations; outcome not stated.

  - id: may
    text: "CNN (12 May 2020): Quibi has roughly 1.3 million active users, compared with more than 50 million Disney+ customers and 183 million Netflix users; most of its customers are in the 90-day free trial."
    spoken: about one point three million
    display: "≈ 1.3M active"
    source_ids: [cnn_may]
    status: source_located
    verification_note: Read on 2026-11-08.

  - id: convert
    text: "The Verge citing Sensor Tower (Jul 2020): of about 910,000 users who signed up in the first few days, about 72,000 stayed after the three-month free trial (≈ 8%); Quibi said the figure was 'incorrect by an order of magnitude' and that over 5.6 million people had downloaded the app."
    spoken: about seventy-two thousand
    display: "≈ 72,000"
    fields: {signed_spoken: about nine hundred and ten thousand, pct_spoken: about eight percent, quibi_spoken: five point six million}
    source_ids: [verge_subs]
    status: source_located
    verification_note: Estimate disputed by Quibi; the film says both.

  - id: pandemic
    text: "Next TV: Katzenberg's pitch was that mobile viewers would pay to watch shows in 10-minute chunks; the pandemic made people much less mobile, and Quibi was not compatible with large-screen TV sets. Fortune: Katzenberg first claimed the pandemic wrecked the launch; the farewell notice said other businesses faced the pandemic 'and have found their way through it. We were not able to do so.' NBC: apps for TV came only in October."
    spoken: much less mobile
    display: "pandemic"
    source_ids: [nexttv_shut, fortune_shut, nbc_why]
    status: source_located
    verification_note: Read on 2026-11-08.

  - id: burn
    text: "NBC News (Oct 2020): it was reported in June that Quibi expected to have spent $1 billion of the $1.75 billion by the third quarter of 2020, and projected it would need to raise an additional $200 million by mid-2021 to stay viable. Recode (Sep 2020): Quibi said it had more than $200 million on hand while looking for a buyer, pitching its cash and its Turnstyle technology. Deadline (21 Oct 2020): around $350 million still in the bank and a staff of about 200 at the shutdown announcement."
    spoken: one billion dollars
    display: "$1bn spent"
    fields: {bank_spoken: about three hundred and fifty million dollars, bank_display: "≈ $350M", staff_spoken: about two hundred, more_spoken: two hundred million dollars, sep_spoken: two hundred million dollars}
    source_ids: [nbc_why, vox_sale, deadline_shut]
    status: source_located
    verification_note: Figures as reported; they come from different dates.

  - id: shut
    text: "Fortune / Next TV (21-22 Oct 2020): Quibi announced it was shutting down about six months after its April launch; Katzenberg: 'our standalone business model is no longer viable'; Deadline: the founders aimed to return as much money as possible to investors."
    spoken: about six months
    display: "6 months"
    source_ids: [fortune_shut, nexttv_shut, deadline_shut]
    status: source_located
    verification_note: Read on 2026-11-08.

  - id: roku
    text: "The Verge (8 Jan 2021): Roku acquired Quibi's library of more than 75 shows for the Roku Channel; the WSJ reported it paid 'significantly less' than $100 million; the shows must be presented in their original short form; Quibi content stays exclusive for the same two-year exclusivity window originally agreed with content creators, after which Roku keeps the right to show it until 2027."
    spoken: significantly less than one hundred million dollars
    display: "< $100M"
    fields: {window_spoken: two years}
    source_ids: [verge_roku]
    status: source_located
    verification_note: Price as reported by the WSJ, via The Verge.

  - id: go90
    text: "Variety (Aug 2018): Verizon shut down Go90, its ad-supported short-form video service that never hit critical mass, the month before; for Q2 2018 Verizon took a $658 million writedown mainly related to Go90's demise."
    spoken: six hundred and fifty-eight million dollars
    display: "$658M"
    source_ids: [variety_2018]
    status: source_located
    verification_note: Read on 2026-11-08.

  - id: stars
    text: "TechCrunch (7 Apr 2020): shows with Sophie Turner, Liam Hemsworth, Chance the Rapper, Jennifer Lopez and Chrissy Teigen at launch; promised content from Steven Spielberg, Guillermo del Toro, Lena Waithe and Catherine Hardwicke; heavily promoted by App Store editorial; reached No. 3 on the App Store."
    spoken: number three
    display: "No. 3"
    source_ids: [tc_launch]
    status: source_located
    verification_note: Names in text only.

  - id: adfmt
    text: "TechCrunch (Oct 2019): advertisers were offered six, 10 or 15-second pre-roll spots with no skip button. Next TV (Oct 2020): fewer downloads and less usership than expected disappointed blue-chip marketers who had bought $150 million in advertising."
    spoken: no skip button
    display: "unskippable"
    source_ids: [tc_ads, nexttv_shut]
    status: source_located
    verification_note: Read on 2026-11-08.

  - id: quote_stop
    text: "Deadline (21 Oct 2020), Katzenberg: 'There was no question that keeping us going was not going to have a different outcome, it was just going to spend a whole lot more money without any value to show for it'; 'out of respect for these people that put up this extraordinary amount of capital… that's irresponsible'; the founders: over the previous three weeks they had looked at strategic partners, potential acquirers, additional funding and financing; 'Every one of those stones was turned'."
    spoken: a whole lot more money
    display: "'a whole lot more money'"
    source_ids: [deadline_shut]
    status: source_located
    verification_note: Quotes read on the page.
