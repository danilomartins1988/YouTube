# Documentary (target 11-13 min). Five parts as an INTERNAL structure only (never narrated or shown as missions).
# Hook rules (docs/ANALYSIS_HOOKS_THUMBS_VISUALS.md): cold open on the number, four short beats, explicit promise,
# no "What if", channel intro after part 1, no separate part-question scenes.
# Numbers come from sources.yaml via {{placeholders}}; each shortfall figure attributed; civil settlement said precisely.
logline: In October 2011, a Wall Street firm collapsed, and about 1.6 billion dollars of its customers' money was missing.
  Much of it belonged to farmers who had used the firm to protect their crops. How a bet on European bonds broke the one rule
  of the futures business, and how the money came back.
title: 'MF Global: The $1.6 Billion That Vanished'
segments:
- id: h_open
  chapter: One point six billion
  narration: One point six billion dollars. That is how much customer money was missing when the brokerage firm MF Global
    collapsed in October twenty eleven, according to the trustee who took over the firm.
  claims:
  - gap
- id: h_twist
  chapter: One point six billion
  narration: This was not the firm's own money. It belonged to its customers. Among them were farm cooperatives representing
    up to thirty-five thousand farmers, who used the firm to protect themselves against swings in crop prices.
  claims:
  - gap
- id: h_question
  chapter: One point six billion
  narration: So how does customer money simply vanish from a regulated firm? And did those farmers ever get it back?
  claims: []
  analysis: true
  source_note: Hook question built from the sourced facts.
- id: h_promise
  chapter: One point six billion
  narration: By the end of this video, you will know what a futures broker does with your money, the bet that sank MF Global,
    what happened in its last week, and how long it took to find the money.
  claims: []
  analysis: true
  source_note: Promise of the episode (hook rule).
- id: m1_card
  chapter: The firm
  narration: ''
  claims: []
- id: m1_broker
  chapter: The firm
  narration: MF Global was a futures broker. Farmers, ranchers, traders and companies used it to buy and sell futures contracts.
    A farmer could lock in a price for corn months before the harvest. A cattle rancher could protect against a fall in beef
    prices. That is called hedging.
  claims:
  - gap
  analysis: true
  source_note: Explanation of futures hedging (commentary; customer types from the House report).
- id: m1_rule
  chapter: The firm
  narration: To trade, customers leave money with the broker as a deposit. And here is the most important rule in the whole
    business. That customer money must be kept separate from the firm's own money. The law says it shall not be commingled.
    It sits in segregated accounts, like a glass box the firm is not allowed to open for itself.
  claims:
  - rules
- id: m1_trust
  chapter: The firm
  narration: Customers trusted that rule completely. One farmer later told the United States Senate that his broker had assured
    him that no customer had ever lost a penny in segregated accounts. He had about two hundred and fifty-three thousand dollars
    in his account when it was frozen.
  claims:
  - rules
- id: m1_size
  chapter: The firm
  narration: The firm was big. According to a congressional report, it had about thirty-six thousand futures customers and more
    than three hundred securities customers when it fell. A senator later described its collapse as the eighth largest bankruptcy
    in the history of the United States.
  claims:
  - gap
  - rules
- id: m1_draw
  chapter: The firm
  narration: Let me draw the glass box. Here is the firm, with its own money on one side. Here is the customer box, locked,
    on the other. Farmers put their deposits into the box. The firm may hold the box, but it may not use what is inside to pay
    its own bills. That line in the middle is the whole system.
  claims:
  - rules
  analysis: true
  source_note: Diagram of customer fund segregation (CEA section 4d).
- id: m1_transition
  chapter: The firm
  narration: In twenty ten, the firm got a new chief executive, and a new strategy.
  claims:
  - boss
- id: m2_card
  chapter: The bet
  narration: ''
  claims: []
- id: m2_ceo
  chapter: The bet
  narration: Jon Corzine became chairman and chief executive of MF Global's parent company in March twenty ten. Over the next year and a half,
    the firm built up a very large trading position with its own money, on top of handling trades for its customers.
  claims:
  - boss
  - bet
- id: m2_bonds
  chapter: The bet
  narration: The biggest was a bet on European government bonds. In its last earnings release, the firm disclosed a position of
    {{bet}} in short-term bonds of Belgium, Italy, Spain, Portugal and Ireland. In twenty eleven, those were exactly the countries
    at the center of Europe's debt crisis.
  claims:
  - bet
- id: m2_repo
  chapter: The bet
  narration: The trades used a structure called repo to maturity. The firm bought the bonds, then borrowed against them until
    the day they matured. Under the accounting rules of the time, these trades were treated as sales. So the bonds did not appear
    on the firm's balance sheet. But as the industry regulator later told Congress, the firm was still exposed to the risk.
  claims:
  - bet
- id: m2_capital
  chapter: The bet
  narration: That regulator, FINRA, decided the firm needed to hold more capital against those bonds. According to the congressional
    report, MF Global resisted throughout the summer of twenty eleven, then gave in at the end of August. The extra charges came to about two hundred and fifty-seven
    million dollars. It had to report a
    capital shortfall for July. The news was in a public filing in September, but few people noticed.
  claims:
  - bet
- id: m2_draw
  chapter: The bet
  narration: Let me draw the invisible bet. Here is the balance sheet, what everyone could see. Here are six point three billion
    dollars of bonds, moved off the page by the accounting. And here is the risk, still tied to the firm by a thin string. When
    Europe shook, the string pulled.
  claims:
  - bet
  analysis: true
  source_note: Diagram of repo-to-maturity derecognition (FINRA and House report descriptions).
- id: m2_transition
  chapter: The bet
  narration: In October twenty eleven, that string began to pull very hard.
  claims:
  - gap
- id: m3_card
  chapter: The last week
  narration: ''
  claims: []
- id: m3_downgrade
  chapter: The last week
  narration: On Monday, October twenty-fourth, the rating agency Moody's cut MF Global's credit rating to one notch above junk.
    The next day, the firm reported a quarterly loss of {{bet.loss_spoken}}, and disclosed the full size of its European bet.
  claims:
  - gap
  - bet
- id: m3_run
  chapter: The last week
  narration: Confidence collapsed. On Thursday, October twenty-seventh, Moody's and
    Fitch both cut the firm's rating to junk. A broker that lives on trust was losing it by the hour.
  claims:
  - gap
- id: m3_glass
  chapter: The last week
  narration: In those final days, according to the regulator, the firm used customer money that was supposed to stay in the
    glass box. The Commodity Futures Trading Commission later said that nearly one billion dollars of segregated customer funds
    had been unlawfully used.
  claims:
  - boss
- id: m3_fall
  chapter: The last week
  narration: On October thirty-first, twenty eleven, the parent company filed for bankruptcy, and a trustee began to liquidate
    the brokerage. When the trustee opened the books, the customer accounts did not add up.
  claims:
  - gap
- id: m3_draw
  chapter: The last week
  narration: Let me draw the last week. Monday, the downgrade. Tuesday, the loss and the bet revealed. Thursday, junk. Monday,
    bankruptcy. Seven days, from the first downgrade to a firm that could not find its customers' money.
  claims:
  - gap
  - bet
  analysis: true
  source_note: Timeline of the sourced dates.
- id: m3_transition
  chapter: The last week
  narration: The next question was simple, and terrifying for the customers. Where did the money go?
  claims:
  - gap
- id: m4_card
  chapter: The missing money
  narration: ''
  claims: []
- id: m4_estimates
  chapter: The missing money
  narration: The answer came slowly. In November, the trustee said the shortfall could be as much as one point two billion dollars
    or more. By June twenty twelve, the estimate was about {{gap}}. About {{gap.us_spoken}} in American accounts, and about
    {{gap.fx_spoken}} linked to customers trading on foreign exchanges.
  claims:
  - gap
- id: m4_farmer
  chapter: The missing money
  narration: For the customers, the frozen money was not abstract. The farmer who testified to the Senate said he was forced
    to close his hedges, which cost him well over an additional one hundred thousand dollars. His words were blunt. Commingling
    money is stealing money.
  claims:
  - rules
- id: m4_senate
  chapter: The missing money
  narration: At the same hearing, a farm cooperative leader asked Congress to ensure the sanctity of segregated funds. And a senator
    called the collapse a violation of the most sacred rule of the futures industry.
  claims:
  - rules
- id: m4_draw
  chapter: The missing money
  narration: Let me draw the hole. Here is the glass box, as it should have been. Here is what the trustee found. A gap of about
    one point six billion dollars. On one side, the American accounts. On the other, the money tied to trades abroad. And
    thousands of customers waiting outside.
  claims:
  - gap
  analysis: true
  source_note: Diagram of the trustee's shortfall split.
- id: m4_transition
  chapter: The missing money
  narration: Then came the long work of getting it back, and of deciding who would be held responsible.
  claims:
  - order
- id: m5_card
  chapter: The aftermath
  narration: ''
  claims: []
- id: m5_back
  chapter: The aftermath
  narration: Piece by piece, the trustee paid customers back in stages. By November twenty thirteen, the securities customers had
    their property back. By April twenty fourteen, he announced a final distribution. In total, about {{back}} had gone back to more than twenty-six thousand customers. In his words, they
    were made one hundred percent whole. The biggest group, about twenty-four thousand American futures customers, received
    about five point four billion dollars. It had taken about two and a half years.
  claims:
  - back
- id: m5_order
  chapter: The aftermath
  narration: In twenty thirteen, a federal court order required MF Global's brokerage to pay {{order}} in restitution to customers,
    plus a one hundred million dollar penalty, to be paid only after the customers had been paid. The regulator later said restitution had been paid to satisfy all customer claims.
  claims:
  - order
- id: m5_corzine
  chapter: The aftermath
  narration: And in January twenty seventeen, Jon Corzine settled the regulator's civil case. He agreed to pay a {{boss}} civil
    penalty and never to register with the commission again. He settled without admitting or denying the charges, and he was
    not criminally charged.
  claims:
  - boss
- id: m5_rules
  chapter: The aftermath
  narration: The rules changed too. In late twenty thirteen, the regulator approved new customer protections. Brokers must now
    report their segregated accounts every day, and large withdrawals of customer money need approval from senior management.
    The chairman of the commission called segregation the core foundation of the markets.
  claims:
  - rules
- id: m5_draw
  chapter: The aftermath
  narration: Let me draw the repair. Here is the glass box again. Now add a camera, watching it every day. Now add a second key,
    held by a senior manager. And a phone line to the regulator. The box was always supposed to be locked. Now someone is watching
    the lock.
  claims:
  - rules
  analysis: true
  source_note: Diagram of the 2013 customer protection rules.
- id: payoff
  chapter: The lesson
  narration: So how did one point six billion dollars vanish? A firm made a giant bet that its own balance sheet did not show, and
    when the bet turned against it, customer money that should never have been touched was used to keep it alive. The farmers got
    their money back, but only after years of waiting. The rule had been there all along. The lesson is that a rule only works
    if someone is checking it.
  claims:
  - gap
  - bet
  - back
  analysis: true
  source_note: Conclusion drawn from the sourced parts.
- id: teaser
  chapter: The lesson
  narration: Next time on The Hidden Economics, we follow the money behind another hidden link of the world economy. This
    is The Hidden Economics.
  claims: []
  analysis: true
  source_note: Generic teaser (channel rule).
