# Sources and claims for "MF Global: The $1.6 Billion That Vanished" (Episode 50, new topics N10).
# Every claim was read on its primary page/file on 2026-11-10 (notes: docs/episodes/50-mf-global/RESEARCH_NOTES.md).
# Status stays source_located until a named human reviewer signs off. US dollars.
# RULES: each shortfall figure labelled by source ($1.6bn trustee/House report; "nearly $1 billion" misused per CFTC;
# $1.212bn restitution order); Corzine: settled a CFTC civil case without admitting or denying, was not criminally charged
# (never "cleared"); "eighth-largest bankruptcy" attributed (Sen. Roberts / CRS); UK customers not claimed repaid 100%.
