# Sources and claims for "Why America's Electricity Bills Are Rising" (Episode 35, US batch #08).
# Every claim was read on its primary page or data file on 2026-11-10 (notes: docs/episodes/35-electricity/RESEARCH_NOTES.md).
# Status stays source_located until a named human reviewer signs off. US dollars as published (nominal unless said).
# RULES: EIA 2026 monthly data are preliminary (said); % changes are OUR calculation; the PJM market monitor's data-center
# share is the monitor's own estimate (attributed); data-center share of US power is the DOE/LBNL estimate; no national
# average ROE is claimed (California decision used as an example). No logos of real utilities; names in text only.
