# Sources and claims for "Why AI Could Make Your Electricity Bill Explode" (Episode 65; series docs/series/AI_WINNERS_LOSERS.md #5).
# Every claim below was read on its primary page or document on 2026-11-18 (notes: docs/episodes/65-ai-power-bill/RESEARCH_NOTES.md).
# Status stays source_located until a named human reviewer signs off. US dollars only. Every forecast is labelled FORECAST on screen
# and "forecast"/"projects" in narration. OUR CALCULATION is labelled wherever we derive a number.
# Overlap rule: Ep 35 "Why America's Electricity Bills Are Rising" already narrated the PJM 2024/25-2025/26 jump, the 4.4% -> 6.7-12%
# LBNL shares and the cost-of-service model. This film uses the 2028/29 auction (July 2026), the Market Monitor's 2026 data-center
# estimates, PJM's 2026 load forecast, the AEP Ohio and Dominion large-load tariffs, the 2025 10-K capex plans, tech companies'
# disclosed power deals, the November 2026 STEO and the LBNL/Brattle price-driver study.
