title: "Why AI Could Make Your Electricity Bill Explode"
slug: why-ai-could-make-your-electricity-bill-explode
language: en
# Episode 65 (series docs/series/AI_WINNERS_LOSERS.md #5). Owner: "Pode produzir direto sem precisar aprovar".
# Flip: AI data centers compete with households for power; ordinary customers MAY pay part of the AI boom through capacity prices,
# grid upgrades and rate cases. "could" vs "is" kept precise; every forecast labelled FORECAST; OUR CALCULATION labelled.
# Overlap: Ep 35 "Why America's Electricity Bills Are Rising" linked by title, its numbers not repeated (see sources.yaml header).
# Owner standing direction: prime-time TV-cartoon energy at GENRE level only; original cast (MAYA, a homeowner, and DEV, a lineworker,
# both fictional) and sets, human characters, day scenes. Bespoke kit: remotion/src/animation-engine/CartoonStage/powerbill.tsx.
# No public figure drawn; companies named in narration only, shown as generic buildings; no logos.
renderer: remotion
remotion_geo: [world]
style:
  name: cartoon-day
  palette:
    bg: "#F3F6FA"
    bg2: "#FFFFFF"
    ink: "#14213D"
    muted: "#5E6B85"
    land: "#A9D18E"
    border: "#23406A"
    accent: "#F5B700"
    accent2: "#1E88E5"
    accent3: "#2E9E6B"
    risk: "#E5483B"
  fonts:
    display: InterDisplay-Bold
    heading: InterDisplay-SemiBold
    body: Inter-Regular
    body_bold: Inter-SemiBold
  web_fonts:
    display: "Inter Display, Inter, sans-serif"
    body: "Inter, sans-serif"
  transition: scan
  background: grid
  motifs: [chapter-tags]
budget:
  max_paid_usd: 1.00
presenter_min: 4
intro:
  after_segment: co_hook
tts_overrides:
  openai:
    voice: ash
    tempo: 0.97
    instructions: >-
      Voice: the narrator of a premium American documentary about money and power, warm, curious and quietly confident, with a
      light touch of wit. Clear, fair and credible on facts; neutral on politics. Pacing: brisk but unhurried; slow slightly to land
      every number; a short beat after a surprising figure and before each verdict. Natural American English, conversational, never
      an announcer, never salesy, never alarmist.
