# Visual direction for why-ai-could-make-your-electricity-bill-explode (APPLIED by the pipeline; see hiddeneco/visual_direction.py).
# Ep 65. Owner direction: as animated as possible in the prime-time TV-cartoon GENRE (original cast and sets, human characters, day
# scenes, bespoke world). World: CartoonStage/powerbill.tsx (pbtown street + AI campus, bigbill kitchen table, auction hall,
# gridbuild towers and who-pays buckets, hearing room with contract scroll and lock, plantdeal reactors and new supply, gaugeroom
# price gauge and verdict dials, pbtitle, pbbumper; items pbtag, billpaper, sparky). Cast: MAYA (homeowner) and DEV (lineworker),
# fictional. Palette meanings: GOLD = capacity / money, BLUE = energy / homes, GREEN = transmission / a fix, RED = pressure added by
# data centers, PURPLE = forecasts and data-center class. Neutral, explanatory, never alarmist.
