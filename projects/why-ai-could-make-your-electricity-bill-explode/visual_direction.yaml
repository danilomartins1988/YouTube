requirements:
- No company logos, brand names on buildings or traced plants; companies named in narration, shown as generic buildings
- Every number on screen carries a pbtag pill (FACT / FORECAST / ESTIMATE / OUR CALC / ILLUSTRATIVE / DISCLOSED)
- The $150 bill split is labelled ILLUSTRATIVE; the $11/month figure labelled OUR CALC, IF FULLY PASSED THROUGH
- No real person drawn; regulators and executives are anonymous silhouettes
- Day scenes, human characters, neutral tone (no political advocacy)
