claims:
  - id: cost
    text: "U.S. Mint 2024 Annual Report: 'The unit cost for pennies (3.69 cents) and nickels (13.78 cents) remained above face value for the 19th consecutive fiscal year'; penny unit cost $0.0369, up 20.2% from $0.0307. Shipments, costs and seigniorage: one-cent 3,172 million coins, seigniorage ($85.3) million; nickel ($17.7)M; dime +$35.6M; quarter +$165.6M; half +$8.4M; total circulating seigniorage $99.5M ('decreased 60.0 percent', FY2023 $249.0M); penny ($2.69) per $1 issued; unit costs dime $0.0576, quarter $0.1468. Treasury FAQ: cost rose 'from 1.3 cents to 3.69 cents' over ten years."
    spoken: three point six nine cents
    display: "Penny cost 3.69¢ to make (FY2024, U.S. Mint)"
    fields: {loss_spoken: eighty-five point three million dollars, nickel_spoken: thirteen point seven eight cents, quarter_spoken: one hundred and sixty-five point six million dollars}
    source_ids: [mint24, treas, stlfed]
    status: source_located
    verification_note: FY2024 figures (said).

  - id: end
    text: "Mint (Nov 12, 2025): ceremonial strike in Philadelphia marking the end of circulating penny production; 'the penny remains legal tender'; 'an estimated 300 billion pennies in circulation'; correction: strike 'performed by United States Treasurer Brandon Beach'. Treasury FAQ (Dec 23, 2025): 'roughly 114 billion pennies'; stopping saves '$56 million' a year in material costs. St. Louis Fed: ending 232 years of production. Fed: last new pennies from the Mint shortly after May 2025; penny deposits resumed Jan 14, 2026; 'All coin terminals are fulfilling penny orders and accepting penny deposits' (Nov 9, 2026)."
    spoken: two hundred and thirty-two years
    display: "Last circulating cent struck Nov 12, 2025"
    fields: {save_spoken: fifty-six million dollars}
    source_ids: [mintpr, treas, stlfed, fedcash]
    status: source_located
    verification_note: Circulation estimates differ (Mint 300bn, Treasury 114bn) - both said.

  - id: round
    text: "Treasury guidance (not binding): cash only, after tax; totals ending in 1, 2, 6 or 7 cents round down, 3, 4, 8 or 9 round up. Washington SHB 2334 (signed Mar 23, 2026; effective June 11, 2026): rounding allowed, not required, in-person cash only; customers may pay exact change; tax before rounding. Common Cents Act: House passed H.R. 3074 on Jul 14, 2026; Senate passed S. 1525 on Aug 7, 2026; at the House desk since Aug 10 (not law). Richmond Fed (EB 25-27): rounding costs consumers about $6.06M a year; also dropping the nickel would be about $55.58M a year (estimates)."
    spoken: about six million dollars
    display: "Rounding 'tax' ≈ $6M a year (Richmond Fed estimate)"
    fields: {nickel_spoken: about fifty-six million dollars}
    source_ids: [treas, wa, congress, richfed]
    status: source_located
    verification_note: Estimates attributed; bill status as of Aug 2026.

  - id: zinc
    text: "CSM (Apr 24, 1981): the new cent 97.6 percent zinc and 2.4 percent copper, replacing 95% copper, to 'save the Treasury $25 million a year'; Minneapolis Fed (1992) confirms the 1982 switch; 31 U.S.C. 5112(c)."
    spoken: twenty-five million dollars
    display: "1982: copper → zinc penny"
    source_ids: [zinc]
    status: source_located
    verification_note: Composition quoted from the 1981 report.

  - id: canada
    text: "Government of Canada: Finance Minister Jim Flaherty struck the last penny in Winnipeg on May 4, 2012; the Mint stopped distributing pennies on Feb 4, 2013; a penny cost 1.6 Canadian cents to make; saving C$11 million a year. At the Fed H.10 rate of Jan 4, 2013 (0.9856 C$/US$): ≈ 1.62 US cents and ≈ US$11.2 million (our conversion)."
    spoken: about eleven million US dollars
    display: "Canada dropped its penny in 2013 (≈ $11M a year saved)"
    fields: {cost_spoken: about one point six cents}
    source_ids: [canada]
    status: source_located
    verification_note: Converted at H.10 rate of Jan 4, 2013 (said).
