# Sources and claims for "Why America Stopped Making the Penny" (Episode 42, new topics N2).
# Every claim was read on its primary page/file on 2026-11-10 (notes: docs/episodes/42-penny/RESEARCH_NOTES.md).
# Status stays source_located until a named human reviewer signs off. US dollars.
# RULES: unit costs are FY2024 (said); FY2025 Mint report not read (3.02¢ not used); "lost $85.3M" = negative seigniorage
# (cost above face value); pennies in circulation given as a range with both attributions; Treasury rounding is guidance,
# not law; Common Cents Act not law (status Aug 2026); Canadian figures converted at the Fed H.10 rate of the date (stated).
