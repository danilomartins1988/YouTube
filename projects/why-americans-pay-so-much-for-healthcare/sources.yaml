# Sources and claims for "Why Americans Pay So Much for Healthcare" (Episode 29, US batch #01).
# Every claim was read on its source page on 2026-11-09 (AI fact-check; quotes in docs/episodes/29-us-healthcare/RESEARCH_NOTES.md).
# Status stays source_located until a named human reviewer signs off. US dollars as published.
# RULE: CMS national figures ($15,474 per person; 18.0% of GDP) and the OECD-basis international figures (Peterson-KFF:
# $14,775; 17.2%) are never mixed in one sentence; the film says which basis it uses. RAND hospital and drug figures are
# said with their caveats (limited sample; list prices before rebates). No logos; no likeness of real people.
