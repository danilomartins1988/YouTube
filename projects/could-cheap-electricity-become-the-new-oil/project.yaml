title: "Could Cheap Electricity Become the New Oil?"
slug: could-cheap-electricity-become-the-new-oil
language: en
# Episode 67 (series docs/series/AI_WINNERS_LOSERS.md #1). Owner: "Pode produzir direto sem precisar aprovar".
# Flip: with AI and robots, cheap, abundant, quickly connectable electricity becomes what oil was in the 20th century; data centers
# (like aluminum smelters before them) follow the plug, not the worker. But unlike oil, power cannot be shipped, so the advantage is
# local and governments guard it. Forecasts labelled FORECAST / PLAN; OUR CALCULATION labelled.
# Overlaps: Ep 65 "Why AI Could Make Your Electricity Bill Explode" (US household side) and Ep 04 "Why Norway Is So Rich" linked by
# title only, their figures not repeated; Ep 63's short Brazil beat not repeated (this film's Brazil beat is taxes and charges).
# Owner standing direction: prime-time TV-cartoon energy at GENRE level only; original cast (NIA, a site scout, and CUBBY, the walking
# scale model of the campus she must find a home for; both fictional) and sets, human characters, day scenes. Bespoke kit:
# remotion/src/animation-engine/CartoonStage/powermap.tsx. No public figure drawn; companies named in narration only, shown as
# generic buildings; no logos, no flags. USD only: CAD at the Fed G.5A 2025 average (1.3973 per USD), labelled.
renderer: remotion
remotion_geo: [world]
style:
  name: cartoon-day
  palette:
    bg: "#F4F7F2"
    bg2: "#FFFFFF"
    ink: "#16223A"
    muted: "#5E6B85"
    land: "#A6D08A"
    border: "#23407A"
    accent: "#F5B700"
    accent2: "#1E88E5"
    accent3: "#2E9E6B"
    risk: "#E5483B"
  fonts:
    display: InterDisplay-Bold
    heading: InterDisplay-SemiBold
    body: Inter-Regular
    body_bold: Inter-SemiBold
  web_fonts:
    display: "Inter Display, Inter, sans-serif"
    body: "Inter, sans-serif"
  transition: scan
  background: grid
  motifs: [chapter-tags]
budget:
  max_paid_usd: 1.00
presenter_min: 3
intro:
  after_segment: co_hook
tts_overrides:
  openai:
    voice: ash
    tempo: 1.0
    instructions: >-
      Voice: the narrator of a premium American documentary about money and power, warm, curious and quietly confident, with a
      light touch of wit and real affection for the characters. Clear, fair and credible on facts; neutral. Pacing: brisk but
      unhurried; slow slightly to land every number; a short beat after a surprising figure and before each verdict. Natural
      American English, conversational, never an announcer, never salesy. Pronounce names simply: Nia (NEE-ah), Cubby (KUB-ee),
      Narvik (NAR-vik), Hydro-Québec (HY-dro kay-BECK), Ceará (say-ah-RAH), Abilene (AB-ih-leen), Nscale (EN-scale).
