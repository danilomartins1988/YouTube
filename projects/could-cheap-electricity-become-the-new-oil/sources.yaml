# Sources and claims for "Could Cheap Electricity Become the New Oil?" (Episode 67; series docs/series/AI_WINNERS_LOSERS.md #1).
# Every claim below was read on 2026-11-18 on its primary page or document, or (where the primary page blocked automated access, noted
# per source) via named coverage of it (notes: docs/episodes/67-power-new-oil/RESEARCH_NOTES.md). Status stays source_located until a
# named human reviewer signs off. US dollars only: CAD converted at the Federal Reserve G.5A 2025 annual average, 1.3973 CAD per USD
# (release of Jan 5, 2026), shown as "≈". OUR CALCULATION is labelled wherever we derive a number. Forecasts are FORECAST, company
# plans are PLAN, proposals are PROPOSED.
# Overlap rule: Ep 65 "Why AI Could Make Your Electricity Bill Explode" (US household bills, PJM) and Ep 04 "Why Norway Is So Rich"
# (the oil fund) are linked by title only and none of their figures are repeated.
sources:
