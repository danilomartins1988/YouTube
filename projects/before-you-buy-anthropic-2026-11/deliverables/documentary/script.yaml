logline: 'Maya, a fictional would-be buyer, watches Anthropic''s first trading day and works through a buyer''s checklist before she touches the
  buy button: what she would own (share classes, votes, share count, dilution), what she would pay (price to sales vs the megacaps, our calc),
  when insiders can sell (the lock-up staircase and the big gate on May 17, 2027 or earlier), what the first report should show, who the company
  depends on, how wild new stocks get (Facebook 2012, Arm 2023), and who governs it (public benefit corporation and Long-Term Benefit Trust).
  Ends with bullish and bearish signals of equal weight. Not investment advice.'
title: 'Anthropic Stock Before You Buy: 7 Things to Check (Nov 2026)'
segments:
- id: h_open
  chapter: The day-one question
  narration: Maya has had the app open since breakfast. On the screen sits a brand-new ticker, A, N, T. Anthropic, the company behind the Claude
    A I models, sold its first shares to the public at {{ipo_price}}. And her thumb is hovering over the buy button.
  claims:
  - ipo_price
  analysis: true
  source_note: Hook. Maya is fictional (a would-be buyer). Offer price per the 424B4 / FWP.
- id: h_day
  chapter: The day-one question
  narration: Day one was a roller coaster. The stock opened far above the offer, slid back all afternoon, and closed at {{close_px}}. Everyone
    on her feed has an opinion. Maya has a rule instead. Never buy something before you've read the label.
  claims:
  - close_px
- id: h_maya
  chapter: The day-one question
  narration: So she grabs a clipboard and writes down the questions a careful buyer asks. What do I actually own? What am I paying? When can insiders
    sell? What will the first report show? Who does this company depend on? How wild do new stocks get? And who's really in charge? Let's go through
    them with her.
  claims: []
  analysis: true
  source_note: 'Promise of the episode: the buyer''s checklist.'
- id: h_disclaimer
  chapter: The day-one question
  narration: A quick note first. This is not investment advice. We won't tell you to buy or sell, and we have no price target. Everything here
    comes from Anthropic's prospectus, other public filings and named news reports, with our own math labelled. Our channel uses A I tools, including
    Claude, to make its videos. Anthropic didn't sponsor or review this one, which is exactly why we stick to the filings.
  claims: []
  analysis: true
  source_note: Series disclaimer and production disclosure (neutrality rule).
- id: c1_card
  chapter: What you actually own
  narration: ''
  claims: []
- id: c1_classes
  chapter: What you actually own
  narration: First on the list. What do you actually own? Anthropic doesn't have just one kind of stock. It has a whole family. Class A is what
    trades on the Nasdaq, with one vote per share. Class N gets the same money, but no vote, and it's held mostly by big strategic partners. And
    then come the special classes that carry power, but no money at all.
  claims: []
  analysis: true
  source_note: '424B4: Class A one vote; Class N no vote except as required by law, holders primarily strategic business partners; Class T, F
    and E no economic rights.'
- id: c1_votes
  chapter: What you actually own
  narration: Here's the twist. A single Class F share, held by a company the co-founders own, carries {{votes}} of the votes at every shareholder
    meeting. A single Class T share, held by an independent trust, picks most of the board. So a Class A buyer does get a vote. But the big decisions
    are already spoken for.
  claims:
  - votes
- id: c1_float
  chapter: What you actually own
  narration: Next, how many shares really exist. The offering put a big block of stock into public hands. But that block is {{float}} of all the
    shares outstanding. Most of the company still belongs to early investors, partners and employees. And for now, most of them can't sell.
  claims:
  - float
- id: c1_draw
  chapter: What you actually own
  narration: Let me draw the difference between outstanding and fully diluted. Outstanding shares are the ones that exist today. Now add the employee
    stock options, the stock awards still vesting, and the notes Amazon holds that turn into stock. That's the fully diluted count, {{fd}} shares
    than today. So when someone quotes a market value, ask which count they used.
  claims:
  - fd
- id: c1_dilute
  chapter: What you actually own
  narration: And that count can keep growing. Amazon's notes convert a slice at a time, every few months, up to an ownership cap. Employee plans
    add new stock every year. And there's a twist you won't find at most companies. Each time the share price hits a new milestone, the board
    may hand extra shares to Anthropic's own public benefit fund. Good for its mission. A slightly smaller slice for everyone else.
  claims: []
  analysis: true
  source_note: '424B4: Amazon Notes convert at the end of each fiscal quarter up to the ownership cap; 2026 Plan and ESPP annual increases; Public
    Benefit Issuances of up to 2% more shares each time the price rises 50% above the prior milestone (from the IPO price), at the board''s discretion.'
- id: c1_transition
  chapter: What you actually own
  narration: So that's what you own. Now, what are you paying for it?
  claims: []
  analysis: true
  source_note: Transition.
- id: c2_card
  chapter: The price you pay
  narration: ''
  claims: []
- id: c2_ps
  chapter: The price you pay
  narration: Next on the list. The price. Anthropic barely makes an operating profit yet, so the usual price to earnings ratio doesn't work. Investors
    use price to sales instead. Take the latest close, multiply by the shares outstanding, and divide by the last year of revenue. By our math,
    that's {{ps_ant}} sales.
  claims:
  - ps_ant
- id: c2_draw
  chapter: The price you pay
  narration: Let me put that next to the giants. Here's Nvidia. Here's Microsoft. On the same day's close, with the same math, both sit at {{ps_megas}}
    their sales. And here's A, N, T, towering over them. Same yardstick. Very different height.
  claims:
  - ps_megas
- id: c2_growth
  chapter: The price you pay
  narration: Is that crazy? Not automatically. The giants grow far more slowly, and Anthropic's revenue so far this year is many times what it
    was a year earlier. Measured against its latest monthly pace, stretched over a year, the multiple shrinks a lot. That's the bull case. The
    bear case is simple. A price that high only works if fast growth lasts for years, and fast growth rarely lasts forever.
  claims: []
  analysis: true
  source_note: '424B4: revenue 9M 2026 $33.2bn vs 9M 2025 $2.5bn (13x, our calc); run rate ≈$81bn (Oct 31) → ≈15.9x outstanding (our calc). Balance:
    bull and bear in one segment.'
- id: c2_value
  chapter: The price you pay
  narration: One more label to check. Anthropic holds a big pile of cash from its private rounds, plus the money from this offering, and very
    little debt. So its enterprise value, the price of the business itself, is lower than its market value. Our multiple uses market value. Whatever
    headline you read, check which one it uses.
  claims: []
  analysis: true
  source_note: '424B4: cash $95.6bn + short-term investments $36.3bn (Sep 30, 2026), ≈$104.8bn net proceeds, debt $6.2bn. Equity value vs EV.'
- id: c3_card
  chapter: The lock-up calendar
  narration: ''
  claims: []
- id: c3_waves
  chapter: The lock-up calendar
  narration: Next question. When can insiders sell? Most new stocks come with a lock-up. Early holders promise not to sell for a while. Anthropic's
    isn't one cliff. It's a staircase. Some employee shares could trade from day one. More unlock in steps through December, January and February.
    And a bigger wave follows right after the first annual results.
  claims: []
  analysis: true
  source_note: '424B4 ''Shares Eligible for Future Sale'' table: Nov 19, Dec 15, 2026; Jan 5, Jan 19, Feb 2, 2027; FY26 Earnings Release Date
    + 2 trading days.'
- id: c3_gate
  chapter: The lock-up calendar
  narration: Then comes the big gate, the one most investors will circle. It opens right after the results for January to March, or at the very
    latest on {{lock_may}} next year.
  claims:
  - lock_may
- id: c3_size
  chapter: The lock-up calendar
  narration: Behind that gate sit {{lock_big}}, the biggest single step on the whole calendar.
  claims:
  - lock_big
- id: c3_year
  chapter: The lock-up calendar
  narration: The co-founders, and investors holding more than a sliver of the company, wait longer. Up to a full year, until the results for next
    summer are out, or the following November at the latest.
  claims: []
  analysis: true
  source_note: '424B4: co-founders and holders of >0.5% of fully diluted shares: earlier of the Q3 2027 release + 2 trading days or the 365th
    day (Nov 18, 2027); timed automatic expirations apply.'
- id: c3_meaning
  chapter: The lock-up calendar
  narration: Unlocked doesn't mean sold. Plenty of holders keep their shares. But more shares that can be sold means more possible sellers, so
    Maya writes these dates down. One more detail. The chip and cloud companies that bought shares privately at the offer price aren't in the
    lock-up at all. But their shares are restricted, so they can't simply sell them on the market whenever they like.
  claims: []
  analysis: true
  source_note: '424B4: concurrent private placement shares are not subject to lock-up but are restricted securities under Rule 144.'
- id: c4_card
  chapter: The first report card
  narration: ''
  claims: []
- id: c4_when
  chapter: The first report card
  narration: Next, the first report card. Anthropic's first results as a public company will cover this full year, and they should arrive early
    next year. The date hasn't been announced yet. But it matters twice. It's the first fresh look at the numbers since the offering. And it's
    also the trigger for one of those lock-up waves.
  claims: []
  analysis: true
  source_note: '424B4: the FY26 Earnings Release Date (results for the year ending Dec 31, 2026) triggers a release step; no date announced as
    of 2026-11-20.'
- id: c4_draw
  chapter: The first report card
  narration: Here's what Maya will look for. First, revenue growth. Is the rocket still climbing? Second, the compute bill. How much do chips
    and data centers cost for each dollar of sales? Third, operating cash flow. Is real cash still coming in? And fourth, the commitment schedule.
    How much has it promised to spend, and when?
  claims: []
  analysis: true
  source_note: Watchlist (our analysis), each tied to a 424B4 line item.
- id: c4_cost
  chapter: The first report card
  narration: That compute bill is the one to watch. Last year, it was bigger than the sales it helped earn. So far this year, it's down to {{compute}}
    for every dollar of revenue. If that keeps falling, margins open up. If it climbs back, the story gets harder.
  claims:
  - compute
- id: c4_cash
  chapter: The first report card
  narration: And then there are the promises. Anthropic has signed up to spend {{commit}} on computing and data centers over many years, much
    of it owed whether customers show up or not. On the other side, it has a large cash cushion, and its operating cash flow turned positive this
    year. The report will show whether that cash keeps pace with the bills.
  claims:
  - commit
- id: c5_card
  chapter: Who it depends on
  narration: ''
  claims: []
- id: c5_partners
  chapter: Who it depends on
  narration: Next. Who does Anthropic depend on? Start with Amazon and Google. Both are big shareholders. Both rent it the computing power it
    runs on. Both sell Claude to their own cloud customers. And both build A I models of their own. Partner, landlord, salesman and rival, all
    at once.
  claims: []
  analysis: true
  source_note: '424B4: Amazon 14.6% and Google 13.4% of outstanding capital stock; compute arrangements; CSP marketplaces; risk factor on CSPs
    that develop their own models.'
- id: c5_draw
  chapter: Who it depends on
  narration: Let me draw how that works. Amazon invests in Anthropic. Anthropic pays Amazon for computing. Amazon's cloud customers buy Claude,
    and Amazon keeps a cut. Google sits in a similar triangle. The prospectus itself warns that these ties could create conflicts of interest
    and affect its access to computing.
  claims: []
  analysis: true
  source_note: 424B4 risk factor (verbatim words 'conflicts of interest'); Amazon 10-Q investments; partner fees recorded as expense.
- id: c5_chips
  chapter: Who it depends on
  narration: The reassuring part is in the chips. Anthropic trains and runs Claude on chips from Amazon, Google, Nvidia and A M D, so no single
    supplier can choke it off. The flip side? Several of those suppliers are also shareholders, and its commitments to them are huge.
  claims: []
  analysis: true
  source_note: '424B4: multi-chip architecture across AWS Trainium, Google TPUs, NVIDIA GPUs and AMD GPUs; placement buyers incl. Google, NVIDIA,
    AMD.'
- id: c5_customers
  chapter: Who it depends on
  narration: And the customers? So far this year, no single customer was big enough to be named in the filing. Last year, a couple were. That's
    a healthier spread. But a big share of sales still flows through the cloud marketplaces of those same partners. So the web of ties runs both
    ways.
  claims: []
  analysis: true
  source_note: '424B4: customers ≥10% of revenue: 2025 Customer A 12%, Customer B 12%; 9M 2026 none. CSP marketplaces 44% of 9M 2026 revenue.
    (Customers are not named in the filing; ''named'' = listed as a ≥10% customer.)'
- id: c6_card
  chapter: New-IPO weather
  narration: ''
  claims: []
- id: c6_fb
  chapter: New-IPO weather
  narration: Next. How wild can a new stock get? Look back at Facebook's debut. Within a few months, its shares had fallen to {{fb}} the offer
    price, and the first lock-up ended right in the middle of that slide. A year after the offering, it was still below the offer.
  claims:
  - fb
- id: c6_arm
  chapter: New-IPO weather
  narration: Now the opposite story. Chip designer Arm listed in the fall, popped on day one, then slipped below its offer within weeks. Months
    later, a strong quarterly report came out, and the stock jumped by {{arm}} in a single day.
  claims:
  - arm
- id: c6_lesson
  chapter: New-IPO weather
  narration: Same lesson from both. In its first year, a new stock trades on very little history. In both of these cases, some of the biggest
    moves came around lock-up dates and earnings reports. Those are exactly the dates on Maya's clipboard.
  claims: []
  analysis: true
  source_note: Analysis of the two cases (AP, Bloomberg, Yahoo Finance closes). Not a forecast for ANT.
- id: c7_card
  chapter: Who is in charge
  narration: ''
  claims: []
- id: c7_pbc
  chapter: Who is in charge
  narration: Last question. Who governs this company? Anthropic is a public benefit corporation. By law, its board must balance shareholders'
    money with the interests of people affected by its work, and with a stated mission, the responsible development of advanced A I for the long-term
    benefit of humanity.
  claims: []
  analysis: true
  source_note: '424B4: PBC; specific public benefit purpose quoted.'
- id: c7_trust
  chapter: Who is in charge
  narration: On top of that sits the Long-Term Benefit Trust, a small group of trustees with no financial stake in the company. Through that Class
    T share, they elect most of the board. That makes Anthropic what Nasdaq calls a controlled company, which may skip some of the usual governance
    rules.
  claims: []
  analysis: true
  source_note: '424B4: LTBT of five financially disinterested trustees; Class T elects a majority of the board; controlled company under Nasdaq
    rules.'
- id: c7_meaning
  chapter: Who is in charge
  narration: What does that mean for a buyer? Supporters say it shields long-term thinking from short-term pressure. The prospectus itself warns
    that the trust may have interests that differ from yours, and could use its power in ways you disagree with. Either way, if you buy, you're
    joining a company where your vote has limits.
  claims: []
  analysis: true
  source_note: 424B4 risk factor ('may have interests that differ from yours'). Both sides.
- id: c8_card
  chapter: What would change the picture
  narration: ''
  claims: []
- id: c8_bull
  chapter: What would change the picture
  narration: So, what would change the picture? On the bright side, watch for revenue that keeps growing fast, a compute bill that keeps shrinking
    for every dollar of sales, cash flow that stays positive, and lock-up waves that pass without a flood of selling.
  claims: []
  analysis: true
  source_note: Bullish signals (our analysis), same weight as the bearish ones.
- id: c8_bear
  chapter: What would change the picture
  narration: On the dark side, watch for growth that slows sharply, a compute bill that climbs back up, cash that can't keep pace with the commitments,
    or big holders heading for the exit when the gates open.
  claims: []
  analysis: true
  source_note: Bearish signals (our analysis), same weight as the bullish ones.
