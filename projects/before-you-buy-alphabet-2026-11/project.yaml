title: "Before You Buy Alphabet Stock, Watch This (Nov 2026)"
slug: before-you-buy-alphabet-2026-11
language: en
series: before-you-buy
edition: "2026-11"
# Series "Before You Buy" (docs/series/BEFORE_YOU_BUY.md), Alphabet, November 2026 edition. Not a numbered channel episode.
# DATA AS OF the 2026-11-10 close; latest report Q3 2026 (quarter ended Sep 30, 2026). Remade every quarter: update the
# inputs in sources.yaml (claims and fields), re-run tools/gen_byb_alphabet_storyboard.py, re-render.
# Owner direction: as animated as possible, retro-futurist cartoon comedy (genre-level only, original designs); a younger
# series voice is being chosen (the tts override goes in the deliverable once picked). Money: US dollars only.
renderer: remotion
remotion_geo: [world]
style:
  name: cartoon-day
  palette:
    bg: "#0E1B3D"
    bg2: "#1A2C5C"
    ink: "#F2F8FF"
    muted: "#A9C3E8"
    land: "#16306A"
    border: "#7DFF8A"
    accent: "#FFE14D"
    accent2: "#3DF5FF"
    accent3: "#7DFF8A"
    risk: "#FF4F6B"
  fonts:
    display: InterDisplay-Bold
    heading: InterDisplay-SemiBold
    body: Inter-Regular
    body_bold: Inter-SemiBold
  web_fonts:
    display: "Inter Display, Inter, sans-serif"
    body: "Inter, sans-serif"
  transition: scan
  background: grid
  motifs: [chapter-tags]
budget:
  max_paid_usd: 1.00
presenter_min: 3
intro:
  after_segment: m1_transition
# Series voice (owner chose "alloy" 2026-11-11); the channel default (ash) is unchanged.
tts_overrides:
  openai:
    voice: alloy
    instructions: >-
      Voice: a young creator in their mid-twenties explaining something cool to a friend. Natural, human, warm and a
      little playful, with small smiles in the voice. Pacing: relaxed and unhurried, like thinking out loud; take a real
      breath at commas and full stops, and slow down noticeably on numbers so they land. Not an announcer, not salesy.
