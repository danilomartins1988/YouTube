requirements:
- No company logos; generic library, search bar, servers and chips only; no likeness of real people
- GAAP P/E flagged (equity gains); capex range not quoted; backlog definition change said; the private company never named
- Edition stamp on screen (data as of the Nov 10, 2026 close); our calculations labelled; proxy base labelled as a proxy
- Never fair value, cheap/expensive, buy/sell; disclaimer after the hook
