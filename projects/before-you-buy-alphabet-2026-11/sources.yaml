# Sources and claims for "Before You Buy Alphabet Stock, Watch This (Nov 2026)" (series Before You Buy, Alphabet, 2026-11 edition).
# Facts read 2026-11-11 (notes: docs/series/research/alphabet_2026-11.md, incl. the depreciation addendum). DATA AS OF the 2026-11-10 close.
# QUARTERLY REFRESH: update text/spoken/display/fields from the new 10-Q/10-K and close; the script reads every number
# through {{placeholders}}. Status stays source_located until a named human reviewer signs off. US dollars.
# RULES: market cap sums Class A + B (at the GOOGL price) + C; GAAP P/E is distorted by ~$130bn of equity gains (say so);
# the 2026 capex range is NOT on an Alphabet page we could open (MarketBeat only) -> never quoted as a number; backlog
# definition changed in Q1 2026 (not like-for-like); the "private company" stake is never named; company claims attributed.
# Ratios, the proxy base and the reverse calculation are OUR calculations (illustration, inputs on screen); never fair
# value, cheap/expensive, buy/sell. No analyst consensus.
