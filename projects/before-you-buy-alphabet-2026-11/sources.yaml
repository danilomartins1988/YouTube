  - id: tenq
    title: "Alphabet Form 10-Q for Q3 2026 (quarter ended September 30, 2026)"
    publisher: Alphabet Inc. (SEC filing)
    url: https://www.sec.gov/Archives/edgar/data/1652044/000165204426000084/goog-20260930.htm
    published: "2026-10-29"
    accessed: "2026-11-11"
    credit: "Alphabet 10-Q (SEC)"
  - id: rel
    title: "Alphabet Q3 2026 earnings release (8-K Ex. 99.1, Oct 28, 2026), earlier 2026 releases and Form 10-K FY2025"
    publisher: Alphabet Inc. (SEC filings)
