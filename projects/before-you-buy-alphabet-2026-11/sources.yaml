    published: "2026-10-28"
    accessed: "2026-11-11"
    credit: "Alphabet filings (SEC)"
  - id: px
    title: "GOOGL and GOOG closing prices, Nov 10, 2026 (data vendor); share counts from the 10-Q cover (Oct 21, 2026); depreciation from SEC XBRL"
