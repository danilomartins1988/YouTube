title: "The Cables at the Bottom of the Ocean That Carry the Internet"
slug: the-cables-at-the-bottom-of-the-ocean
language: en
# Episode 09 (undersea internet cables). Five-part structure (internal only) + animation engine + cartoon ocean scenes.
# All money already in US dollars in the sources; no conversion needed.
renderer: remotion
remotion_geo: [world]
style:
  name: deep-sea
  palette:            # deep ocean base, cyan = light in the fibre, gold = money, green = repairs/complete, red = cuts
    bg: "#041421"
    bg2: "#0A2233"
    ink: "#EEF4F2"
    muted: "#86A0AE"
    land: "#163243"
    border: "#2C4D5E"
    accent: "#E0B64F"
    accent2: "#4FD1E8"
    accent3: "#7FD6A8"
    risk: "#FF5A5F"
  fonts:
    display: InterDisplay-Bold
    heading: InterDisplay-SemiBold
    body: Inter-Regular
    body_bold: Inter-SemiBold
  web_fonts:
    display: "Inter Display, Inter, sans-serif"
    body: "Inter, sans-serif"
  transition: scan
  background: grid
  motifs: [chapter-tags]
budget:
  max_paid_usd: 1.00
presenter_min: 4
