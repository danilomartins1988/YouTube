title: "Will AI Make Japan Rich Again?"
slug: will-ai-make-japan-rich-again
language: en
# Episode 66 (series docs/series/AI_WINNERS_LOSERS.md #2). Owner: "Pode produzir direto sem precisar aprovar".
# Flip: the most extreme aging big country is also the world's leading robot maker; the shortage of workers could become an
# advantage if robots and AI raise output per pair of hands. Industrial robots (deployed) kept apart from humanoids (demos/plans).
# Overlap: Ep 23 "When Tokyo's Land Was Worth More Than Entire Countries" linked by title, its figures not repeated.
# Owner standing direction: prime-time TV-cartoon energy at GENRE level only; original cast (HIRO, a workshop owner; AOI, his
# granddaughter; KOBO, their cobot; all fictional) and sets (fictional town Hoshimachi), human characters, day scenes, a bespoke
# Japanese world drawn respectfully. Kit: remotion/src/animation-engine/CartoonStage/japan.tsx. No public figure drawn; companies
# named in narration only, shown as generic buildings; no logos. JPY in USD at the Fed G.5A 2025 average (149.5686).
renderer: remotion
remotion_geo: [world]
style:
  name: cartoon-day
  palette:
    bg: "#F6F3EC"
    bg2: "#FFFFFF"
    ink: "#1B2333"
    muted: "#5E6B85"
    land: "#9CCB86"
    border: "#2E3F7F"
    accent: "#F08A24"
    accent2: "#2F6FD1"
    accent3: "#3E9B5F"
    risk: "#D9443A"
  fonts:
    display: InterDisplay-Bold
    heading: InterDisplay-SemiBold
    body: Inter-Regular
    body_bold: Inter-SemiBold
  web_fonts:
    display: "Inter Display, Inter, sans-serif"
    body: "Inter, sans-serif"
  transition: scan
  background: grid
  motifs: [chapter-tags]
budget:
  max_paid_usd: 1.00
presenter_min: 4
intro:
  after_segment: co_hook
tts_overrides:
  openai:
    voice: ash
    tempo: 1.0
    instructions: >-
      Voice: the narrator of a premium American documentary about money and power, warm, curious and quietly confident, with a
      light touch of wit and real affection for the characters. Clear, fair and credible on facts; neutral. Pacing: brisk but
      unhurried; slow slightly to land every number; a short beat after a surprising figure and before each verdict. Natural
      American English, conversational, never an announcer, never salesy. Pronounce Japanese names simply: Hiro (HEE-ro), Aoi
      (ah-OH-ee), Kobo (KOH-boh), Hoshimachi (ho-shee-MAH-chee), Yaskawa (yahs-KAH-wah), FANUC (FAN-uck).
