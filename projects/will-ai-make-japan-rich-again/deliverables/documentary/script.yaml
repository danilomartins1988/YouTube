logline: Hiro runs a small metal-parts workshop in a fictional Japanese mountain town and cannot find a single worker. His country is
  the oldest big nation on Earth and also the world's leading robot maker. Following Hiro, his granddaughter Aoi and the small robot
  arm they install, the film asks whether AI and robots can turn Japan's shortage of workers into an advantage, and finds the answer
  lies in output per pair of hands, not in a new bubble.
title: Will AI Make Japan Rich Again?
# Story over statistics (docs/STORY_OVER_STATS.md): one protagonist (HIRO, fictional), hero numbers "almost four in ten" robots,
# "thirteen and a half million" fewer workers, "about half" by 2070, "nine of every ten yen" abroad; at most one spoken number per
# segment; all exact figures in FACT_CHECK.md and the description. Industrial robots (deployed) vs humanoids (demos/plans) kept apart.
segments:
- id: co_hook
  chapter: The empty stool
  narration: Meet Hiro. He makes small, precise metal parts in a workshop in a mountain town in Japan, parts that end up inside cars and
    machines all over the world. For a long time now, the same paper sign has hung in his window. Help wanted. Nobody calls. Hiro isn't
    unlucky. His whole country is running out of workers. And yet, a short drive from towns like his, Japan builds {{ifr_prod}} industrial
    robots made on Earth. So could the world's oldest big country turn its biggest problem into its biggest advantage?
  claims:
  - ifr_prod
  analysis: true
  source_note: Hook; Hiro and his town are fictional; 38% of global robot production per IFR (Jul 2025).
- id: title_card
  chapter: The empty stool
  narration: ''
  claims: []
- id: c1_town
  chapter: The empty stool
  narration: Hoshimachi isn't a real town, but towns like it are all over Japan. The train comes less often. More shops keep their shutters
    down. Hiro's apprentice left for the city years ago, and his stool still sits by the lathe. The strange thing is, Hiro's customers aren't
    leaving. They want more parts than ever. What's missing is hands.
  claims: []
  analysis: true
  source_note: Story beat (fictional town and characters).
- id: c1_draw
  chapter: The empty stool
  narration: Let me draw what happened. This bar is everyone of working age in Japan, at the peak, a generation ago. This bar is today.
    Since that peak, Japan has lost {{wa_drop}} working-age people. That's almost as many people as live in all of Tokyo. Picture every
    office and every train in Tokyo, empty. That's the size of the hole.
  claims:
  - wa_drop
  analysis: true
  source_note: IPSS (1995 census peak 87.26m) and Statistics Bureau (73.7m, Oct 2024); difference is OUR CALCULATION; Tokyo 14.3m (TMG).
- id: c1_future
  chapter: The empty stool
  narration: And it isn't slowing down. The government's own population researchers project that, within the lifetime of today's children,
    Japan will have {{wa_2070}} the working-age people it had at the peak. Think of a rush-hour train platform, where you can barely move.
    Now take away every other person.
  claims:
  - wa_2070
  source_note: IPSS 2023 medium projection 45.35m in 2070 = 52% of the 1995 peak (a projection).
- id: c1_jobs
  chapter: The empty stool
  narration: You can feel it in the job market. Month after month, Japan has had more open jobs than people looking for work. Hiro is
    competing for workers with the convenience store, the nursing home and the delivery company. And they're all losing too.
  claims:
  - jobs_ratio
  source_note: MHLW openings-to-applicants ratio above 1 (1.19 in Sept 2026), shown on screen only.
- id: c2_card
  chapter: A country running out of hands
  narration: ''
  claims: []
- id: c2_trucks
  chapter: A country running out of hands
  narration: Take the trucks that carry Hiro's parts. Japan capped truck drivers' overtime to protect their health. Good for the drivers. But
    fewer drivers, working fewer hours, move fewer boxes. The government warns that, if nothing changes, by the end of the decade Japan could
    be short of trucks for {{truck_gap}} of its cargo.
  claims:
  - truck_gap
  source_note: MLIT White Paper 2024 (34% capacity shortfall in FY2030 without measures; an estimate).
- id: c2_care
  chapter: A country running out of hands
  narration: Then there's Hiro's mother. She lives in a care home down the road. It needs more caregivers every year, because more people grow
    old and fewer young people arrive to help. The health ministry's own estimate is that Japan will need hundreds of thousands more caregivers
    in the years ahead.
  claims:
  - care_need
  source_note: MHLW (Jul 2024) +570,000 care workers needed by FY2040 vs FY2022 (prefecture estimates).
- id: c2_aoi
  chapter: A country running out of hands
  narration: Even Hiro's granddaughter, Aoi, moved away. She writes software in Tokyo now. Hiro is proud of her. He still needs someone to
    run the lathe.
  claims: []
  analysis: true
  source_note: Story beat (fictional characters).
- id: c2_turn
  chapter: A country running out of hands
  narration: So far, this sounds like the story everyone tells about Japan. Old, shrinking, stuck. But here's the twist. The same kind of
    shortage that is emptying Hoshimachi helped create one of Japan's greatest industries.
  claims: []
  analysis: true
  source_note: Transition.
- id: c3_card
  chapter: The robot superpower
  narration: ''
  claims: []
- id: c3_birth
  chapter: The robot superpower
  narration: Go back to {{kawasaki69}}. Japan's economy was booming and factories couldn't hire fast enough. Kawasaki, a heavy-industry company,
    began building the first industrial robot made in Japan, under an American license. Carmakers hungry for workers were among the first
    buyers.
  claims:
  - kawasaki69
  source_note: Kawasaki robot history (1968 Unimation license, 1969 first production in Japan); early demand from carmakers per Kawasaki.
- id: c3_world
  chapter: The robot superpower
  narration: Today, the International Federation of Robotics calls Japan the world's predominant robot manufacturing country. FANUC, Yaskawa,
    Kawasaki and others build the arms that weld cars, assemble electronics and lift boxes on every continent. These are industrial robots,
    the workhorses. They don't walk, and they don't chat. They just work.
  claims: []
  analysis: true
  source_note: IFR quote (Jul 2025); companies named, never shown with logos.
- id: c3_fanuc
  chapter: The robot superpower
  narration: But here's the strange part. Look at where the robots go. In its latest fiscal year, {{fanuc_abroad}} of FANUC's sales came from
    customers outside Japan. Its robot sales in China jumped. Its robot sales at home fell. Japan builds the robots. The world buys them.
  claims:
  - fanuc_abroad
  source_note: FANUC FY ended Mar 2026 results (net sales by customer location; robot division commentary); share is OUR CALCULATION.
- id: c3_density
  chapter: The robot superpower
  narration: So who actually uses the most robots? Count robots per factory worker, and South Korea has {{density_x}} as many as Japan. China
    and Germany are ahead of Japan too. The robot superpower is not the most robotic country.
  claims:
  - density_x
  source_note: IFR World Robotics 2025 robot density 2024 (Korea 1,220; Japan 446); ratio OUR CALCULATION.
- id: c3_draw
  chapter: The robot superpower
  narration: Why would a shortage be good news for robots? Let me draw it. Fewer workers means employers compete for them, so wages rise.
    Higher wages make a robot look cheap by comparison. So companies buy robots, and every remaining worker produces more. That last box is
    the whole game. Output per worker. A country can shrink and still get richer per person, if each pair of hands does more.
  claims: []
  analysis: true
  source_note: Mechanism (standard capital-labour substitution); no figures.
- id: c4_card
  chapter: Robots on the front line
  narration: ''
  claims: []
- id: c4_konbini
  chapter: Robots on the front line
  narration: Step behind the drink fridge in a Tokyo convenience store, and you may find a robot arm sliding cold bottles onto the shelves.
    Its maker, a startup called Telexistence, says one arm can restock {{tx_drinks}}. When it fumbles a bottle, a person somewhere else puts
    on a headset and finishes the job remotely. That's not a demo. That's a deployment.
  claims:
  - tx_drinks
  source_note: Telexistence releases (FamilyMart since 2021; 7-Eleven pilots 2025); throughput is the company's claim.
- id: c4_humanoid
  chapter: Robots on the front line
  narration: Now compare that with the robots in the headlines. Japan's most famous walking humanoid, Honda's ASIMO, charmed crowds for years
    and retired without ever getting a real job. Today, Seven-Eleven Japan and Telexistence are developing a humanoid helper, with a target of
    putting it in stores by {{astra_year}}. That's a plan, not a product. In Japan, the robots doing the work right now are arms, not androids.
  claims:
  - astra_year
  source_note: ASIMO retirement (Japan Times, Mar 2022); Astra humanoid target 2029 (Telexistence/Seven-Eleven, Sept 2025), a plan.
- id: c4_care
  chapter: Robots on the front line
  narration: Back at the care home, the helpers are quieter. Sensors under the mattress that tell night staff who is awake. Machines that help
    lift residents out of bed. Economists who studied Japanese nursing homes found something surprising. Homes that adopted robots ended up
    with more staff, not fewer, and caregivers spent more of their time on what the researchers call human touch.
  claims:
  - care_study
  source_note: Lee, Iizuka & Eggleston (NBER w33116; Labour Economics 2025), a research finding.
- id: c4_hiro
  chapter: Robots on the front line
  narration: Which brings us back to Hiro. One weekend, Aoi comes home with a plan. Not a humanoid. A small collaborative robot arm, the kind
    built to work safely beside people. They name it Kobo, from the Japanese word for workshop. Aoi writes the program. Kobo loads the lathe,
    again and again, while Hiro does the part only he can do, checking every piece with a lifetime of experience.
  claims: []
  analysis: true
  source_note: Story beat (fictional; cobots are a real product category, no brand shown).
- id: c4_draw
  chapter: Robots on the front line
  narration: But who gets paid for Kobo? Let me draw it. First, the arm, the hardware. Japan is superb at this. Second, the brain, the AI
    software that lets a robot see and learn. Much of that is written in America and China. And finally, the user, the small business that puts the
    robot to work. In an AI economy, more and more of the money flows to the brain and to the user. Japan owns the arm.
  claims: []
  analysis: true
  source_note: Framework (our analysis; no figures).
- id: c5_card
  chapter: The catch
  narration: ''
  claims: []
- id: c5_yen
  chapter: The catch
  narration: Now the catches. First, the currency. Since the pandemic, Japan's money has lost {{yen_drop}} of its value against the dollar. That makes Japanese
    robots cheap for foreign buyers, which helps FANUC. But it makes every imported chip, every barrel of fuel and every software subscription
    more expensive for Hiro.
  claims:
  - yen_drop
  source_note: Fed G.5A annual averages 2020 vs 2025; decline is OUR CALCULATION.
- id: c5_software
  chapter: The catch
  narration: Second, software. Japan builds superb machines, but the economy around them hasn't kept up. Measured by output per hour worked,
    Japan sits in {{jpc_rank}} of the rich-country club. And remember FANUC's robot sales at home? They fell. The robots are being made here.
    They just aren't spreading fast enough here.
  claims:
  - jpc_rank
  source_note: Japan Productivity Center 2025 (OECD data), 28th of 38; FANUC Japan robot sales decreased (FY to Mar 2026).
- id: c5_debt
  chapter: The catch
  narration: And then there is debt. The IMF says Japan's government owes {{jp_debt}} its entire economy, the highest of any advanced country. The
    government also owns large financial assets, so the net picture is less extreme. But as more people retire, more money goes to pensions
    and health care, and there's less room for everything else.
  claims:
  - jp_debt
  source_note: IMF F&D Sept 2026 (gross ~207% of GDP; net 89-186%).
- id: c5_slow
  chapter: The catch
  narration: Add it all up, and you can see why so many videos call Japan a slow-motion collapse. Last year, its whole economy grew {{gdp25}}.
    And yet, that headline may be measuring the wrong thing.
  claims:
  - gdp25
  source_note: Cabinet Office calendar-year real GDP growth 2025 (+1.2%).
- id: c6_card
  chapter: Will AI make Japan rich again?
  narration: ''
  claims: []
- id: c6_twist
  chapter: Will AI make Japan rich again?
  narration: Economists led by Jesús Fernández-Villaverde of the University of Pennsylvania asked a different question. Not how fast Japan grew
    per citizen, but per working-age adult. Their answer? From the late nineties until the pandemic, Japan grew {{fv_japan}}.
  claims:
  - fv_japan
  source_note: "NBER w31914 (1998-2019, +31.9% Japan vs +29.5% US per working-age adult)."
- id: c6_draw
  chapter: Will AI make Japan rich again?
  narration: Let me draw it. Japan's total economy looks flat, because the number of workers keeps falling. But divide by the people who
    actually work, and the line climbs, right alongside America's. Japan's problem was never lazy workers. It was fewer of them. And fewer
    hands is exactly the problem robots are built to solve.
  claims: []
  analysis: true
  source_note: Illustrative shape drawn from the NBER finding (no new figures).
- id: c6_verdict
  chapter: Will AI make Japan rich again?
  narration: So, will AI make Japan rich again? Not the way it was in the bubble, when Tokyo land was said to be worth more than entire
    countries. That boom was built on debt and land prices. This one, if it comes, would be built on output per pair of hands. Robots and AI
    can let a shrinking Japan keep getting richer per person. But only if small firms like Hiro's actually use them, Japan writes more of the
    brains and not just the arms, and the debt doesn't crowd everything else out.
  claims: []
  analysis: true
  source_note: Verdict (our analysis); Ep 23 referenced by its theme only.
- id: c6_hiro
  chapter: Will AI make Japan rich again?
  narration: In Hoshimachi, the help-wanted sign is still in the window. Hiro still wants an apprentice. But now the parts ship on time, and
    Aoi comes home to teach Kobo something new. Japan's biggest problem isn't going away. What's changing is what a workshop with too few
    hands can do.
  claims: []
  analysis: true
  source_note: Story resolution (fictional).
- id: teaser
  chapter: Will AI make Japan rich again?
  narration: Next time, we follow the money behind another hidden link of the world economy. This is The Hidden Economics.
  claims: []
  analysis: true
  source_note: Generic closing teaser (channel rule).
- id: button
  chapter: Will AI make Japan rich again?
  narration: ''
  claims: []
