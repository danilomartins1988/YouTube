# Sources and claims for "Will AI Make Japan Rich Again?" (Episode 66; series docs/series/AI_WINNERS_LOSERS.md #2).
# Every claim below was read on its primary page or document on 2026-11-18 (notes: docs/episodes/66-japan-ai/RESEARCH_NOTES.md).
# Status stays source_located until a named human reviewer signs off. US dollars only: JPY converted at the Federal Reserve G.5A
# 2025 annual average, 149.5686 yen per dollar (release of Jan 5, 2026), shown as "≈". OUR CALCULATION is labelled wherever we
# derive a number. Industrial robots (deployed) are kept apart from humanoids (demos, plans).
# Overlap rule: Ep 23 "When Tokyo's Land Was Worth More Than Entire Countries" covered the 1980s land bubble; it is linked by title
# only and none of its figures are repeated.
sources:
  - id: stat_pop24
    title: "Population Estimates (October 1, 2024)"
    publisher: Statistics Bureau of Japan (Ministry of Internal Affairs and Communications)
    url: https://www.stat.go.jp/english/data/jinsui/2024np/index.html
    published: "2025-04-14"
    accessed: "2026-11-18"
    kind: dataset
    credit: "Statistics Bureau of Japan"
    notes: "Total population 123,802 thousand (Oct 1, 2024), down 550 thousand, 14th straight year of decline; aged 15-64: 73,728 thousand (59.6%); aged 65+: 36,243 thousand (29.3%). Publication date not printed on the page (April 2025 release)."
  - id: stat_cen2000
    title: "2000 Population Census, basic complete tabulation (age structure)"
    publisher: Statistics Bureau of Japan
    url: https://www.stat.go.jp/english/data/kokusei/2000/kihon1/00/03.html
    published: "2001-10-31"
    accessed: "2026-11-18"
    credit: "Statistics Bureau of Japan, 2000 Census"
    notes: "Population aged 15-64: 86,219,631 in 2000, the first decline in this group since the census began (i.e. the 1995 census was the peak)."
  - id: ipss23
    title: "Population Projections for Japan (2023 revision): 2021 to 2070, Summary of Results"
    publisher: National Institute of Population and Social Security Research (IPSS)
    url: https://www.ipss.go.jp/pp-zenkoku/e/zenkoku_e2023/pp2023e_Summary.pdf
    published: "2023-04-26"
    accessed: "2026-11-18"
    credit: "IPSS 2023 projections"
    notes: "'The 15-64 years old population ... reaching its peak of 87.26 million in the 1995 population census ... falling to 75.09 million according to the 2020 population census. The future 15-64 years old population is expected to fall below 70 million, 60 million, and 50 million in 2032, 2043, and 2062, respectively, down to 45.35 million in 2070, according to the medium-fertility projection.' Total population 126.15m (2020) -> 87m (2070); 65+ share 38.7% in 2070. Page blocked automated fetch (403) but the PDF was read directly."
  - id: tmg_pop
    title: "Tokyo Metropolitan Government population estimate (November 1, 2025)"
    publisher: Tokyo Metropolitan Government
    url: https://www.metro.tokyo.lg.jp/information/press/2025/11/2025112707
    published: "2025-11-27"
    accessed: "2026-11-18"
    credit: "Tokyo Metropolitan Government"
    notes: "Estimated population of Tokyo 14,281,897 (Nov 1, 2025). Used only as a size comparison (read via search-result excerpt of the TMG press release)."
  - id: mic_elderly26
    title: "Statistical Topics: Japan's elderly from the viewpoint of statistics (Respect for the Aged Day, Sept 2026)"
    publisher: Statistics Bureau of Japan
