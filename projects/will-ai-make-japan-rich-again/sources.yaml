    notes: "About 2.15 million care workers in FY2022; about 2.40 million needed in FY2026 (+250,000) and about 2.72 million in FY2040 (+570,000), prefecture estimates. Read via search excerpts of the MHLW release and a PDF table (mhlw.go.jp/content/12004000/001274769.pdf)."
  - id: mlit_wp24
