    url: https://www.mlit.go.jp/hakusyo/mlit/r05/hakusho/r06/html/n2522c01.html
    published: "2024-06-01"
    accessed: "2026-11-18"
    credit: "MLIT White Paper 2024"
    notes: "'このまま対策を講じなければ、2024年度には14％、2030年度には34％の輸送力が不足すると見込まれており' (if no measures are taken, a 14% transport-capacity shortfall in FY2024 and 34% in FY2030); overtime cap for truck drivers applied from April 2024."
  - id: ifr_wr25
    title: "World Robotics 2025 Industrial Robots: Foreword (key figures for 2024)"
