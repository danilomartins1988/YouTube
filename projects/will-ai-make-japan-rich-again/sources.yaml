    notes: "65+ share a record 29.6% (Sept 15, 2026 estimate), the highest among the 39 countries with 40 million+ people (Italy 25.6%, Germany 24.2%). Read via Jiji/The Star reports of the release (Sept 20, 2026); the topics PDF itself was not opened. Narration says 'the oldest population of any big country'."
  - id: mhlw_jobs
    title: "General Employment Placement Situation (Ippan Shokugyo Shokai Jokyo), September 2026, compiled by JILPT"
    publisher: Ministry of Health, Labour and Welfare (via JILPT main labour statistics)
    url: https://www.jil.go.jp/kokunai/statistics/shuyo/0208.html
    published: "2026-10-30"
    accessed: "2026-11-18"
    kind: dataset
