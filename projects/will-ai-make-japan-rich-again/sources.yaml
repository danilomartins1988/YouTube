    notes: "Annual averages: 106.7754 (2020), 151.4551 (2024), 149.5686 (2025) yen per dollar (2020 value from the FRED series AEXJPUS, same source). OUR CALCULATION: dollar value of one yen fell 1 - 106.7754/149.5686 = 28.6% from 2020 to 2025."
