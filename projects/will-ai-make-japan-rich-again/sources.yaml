  - id: nh_robots
    title: "Robots and Labor in Nursing Homes (NBER Working Paper 33116; Labour Economics 2025)"
    publisher: Yong Suk Lee, Toshiaki Iizuka and Karen Eggleston (NBER)
    url: https://www.nber.org/papers/w33116
    published: "2024-11-01"
    accessed: "2026-11-18"
    credit: "Lee, Iizuka & Eggleston (NBER)"
    notes: "Japanese nursing homes: 'robot adoption is accompanied by an increase in employment and retention', 'reallocation of care worker effort to \"human touch\" tasks'; robots associated with 'reduction in restraint use and pressure ulcers' and productivity. Associational with an instrument (subsidies); a finding, not a guarantee."
  - id: fed_g5a
    title: "Foreign Exchange Rates (G.5A, annual): Japan, yen per U.S. dollar"
    publisher: Board of Governors of the Federal Reserve System
    url: https://www.federalreserve.gov/releases/g5a/current/default.htm
    published: "2026-01-05"
    accessed: "2026-11-18"
