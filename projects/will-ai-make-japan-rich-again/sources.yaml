    title: "The Wealth of Working Nations (NBER Working Paper 31914; European Economic Review 2025)"
    publisher: Jesús Fernández-Villaverde, Gustavo Ventura and Wen Yao (NBER)
    url: https://www.nber.org/papers/w31914
