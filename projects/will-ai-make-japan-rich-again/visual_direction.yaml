requirements:
- No company logos, brand names on buildings or traced robots; companies named in narration, shown as generic buildings
- Every number on screen carries a jtag pill (FACT / PROJECTION / ESTIMATE / OUR CALC / COMPANY CLAIM / PLAN / FINDING)
- Industrial robots (deployed) and humanoids (demos, plans) always labelled apart
- No real person drawn; Hiro, Aoi, Kobo and Hoshimachi are fictional; Japan drawn respectfully, no stereotypes
- Day scenes, human characters, neutral tone; USD only (JPY at the dated Fed rate)
