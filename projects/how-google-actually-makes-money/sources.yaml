claims:
  - id: apple
    text: "Mehta opinion FOF 299: 'In 2022, Google's revenue share payment to Apple was an estimated $20 billion (worldwide queries).' FOF 298: Google pays Apple a percentage of its ad revenue on Safari and Chrome in return for default placement. FOF 299: the 2022 payment 'is more than all of its other revenue share payments combined'. FOF 289: 'In 2021, Google paid out a total of $26.3 billion in revenue share' (Apple, Mozilla, Android OEMs, carriers), 'listed in its financial statements as traffic acquisition costs'. Conclusion: 'Google is a monopolist, and it has acted as one to maintain its monopoly.'"
    spoken: twenty billion dollars
    display: "≈ $20bn to Apple in 2022 (court estimate, worldwide queries)"
    fields: {total21_spoken: twenty-six point three billion dollars}
    source_ids: [mehta]
    status: source_located
    verification_note: Say "an estimated"; attribute to the court; it is a revenue share for default placement, not a flat fee.

  - id: remedy
    text: "Remedies opinion (Sept 2, 2025): 'Google will be barred from entering or maintaining any exclusive contract relating to the distribution of Google Search, Chrome, Google Assistant, and the Gemini app'; 'Google will not be barred from making payments ... to distribution partners'; 'Cutting off payments from Google almost certainly will impose substantial—in some cases, crippling—downstream harms to distribution partners'; no Chrome divestiture. 10-K: final judgment Dec 2025 also 'requires us to share certain search data with and offer syndication services to certain competitors'; Google appealed Jan 2026, DOJ and states Feb 2026."
    spoken: barred exclusive contracts
    display: "Remedies: no exclusive deals; payments allowed; data sharing; both sides appealed"
    fields: {}
    source_ids: [remedy, tenk]
    status: source_located

  - id: auction
    text: "Mehta opinion FOF 240-242: 'Google's text ads auction is a classic second-price auction, with modifications ... the winner, instead of paying the price of their highest bid, pays one cent above the first runner-up.' 'An auction winner is not determined solely based its bid ... LTV = bid x pCTR – β'; pCTR, the predicted click-through rate, 'is a score between 0 and 1'. FOF 243-252: 'pricing knobs' (squashing, format pricing, rGSP); 'Google strategically has used pricing knobs to raise text ads prices'; studies 'showed that Google could raise prices using squashing without losing advertisers.'"
    spoken: one cent above the runner-up
    display: "Second-price auction: winner pays 1¢ above the runner-up (court findings)"
    fields: {}
    source_ids: [mehta]
    status: source_located

