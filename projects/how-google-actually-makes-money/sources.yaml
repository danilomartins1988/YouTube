# Sources and claims for "How Google Actually Makes Money" (Episode 54).
# Every claim was read on its primary page on 2026-11-13 (notes: docs/episodes/54-alphabet/RESEARCH_NOTES.md).
# Status stays source_located until a named human reviewer signs off. US dollars as reported.
# RULES: the Apple figure is the court's "estimated $20 billion" for 2022 (worldwide queries), attributed to the court;
# margins, per-day revenue, free cash flow, TTM sums and shares are OUR calculations (say so); company claims
# (YouTube > $60bn, 325M paid subscriptions, 150M YouTube Music and Premium incl. trials, Waymo miles and cities,
# half-trillion run rate, query growth) are attributed; AI Mode monetization is attributed to the Q3 2026 call;
# capex guide $195-205bn is from the official call transcript. This is NOT a valuation episode: no price, no multiple.
