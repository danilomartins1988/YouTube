title: "How Google Actually Makes Money"
slug: how-google-actually-makes-money
language: en
# Episode 54 (owner request, 2026-11-13). Visual direction: visual_direction.yaml.
# Five-part structure internal only. Money: US dollars as reported in Alphabet's SEC filings; court figures attributed.
# Not a valuation episode (that is Before You Buy): no share price, no multiples.
renderer: remotion
remotion_geo: [world]
style:
  name: cartoon-day
  palette:
    bg: "#C9E7F5"
    bg2: "#F2FAFF"
    ink: "#13213A"
    muted: "#4F667E"
    land: "#9BD38A"
    border: "#2B5573"
    accent: "#F2A900"
    accent2: "#2E6FD8"
    accent3: "#22A06B"
    risk: "#E5483B"
  fonts:
    display: InterDisplay-Bold
    heading: InterDisplay-SemiBold
    body: Inter-Regular
    body_bold: Inter-SemiBold
  web_fonts:
    display: "Inter Display, Inter, sans-serif"
    body: "Inter, sans-serif"
  transition: scan
  background: grid
  motifs: [chapter-tags]
budget:
  max_paid_usd: 1.00
presenter_min: 4
# Hook rules (docs/ANALYSIS_HOOKS_THUMBS_VISUALS.md): the channel intro plays after part 1, never inside the hook.
intro:
  after_segment: m1_transition
