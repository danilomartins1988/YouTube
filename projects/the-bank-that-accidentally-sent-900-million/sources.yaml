# Sources and claims for "The Bank That Accidentally Sent $900 Million" (Episode 21, top-10 #4: Citibank / Revlon).
# Every claim was read on its source page on 2026-11-09 (AI fact-check; quotes in docs/episodes/21-citibank/FACT_CHECK.md).
# The main source is the court's own opinion (Judge Jesse Furman, S.D.N.Y., 16 Feb 2021, 105 pages); the 2022 appeal is
# followed through law-firm summaries (Kelley Drye, Torys), as read. Status stays source_located until a human signs off.
# MONEY: all amounts in US dollars as published. Real people are named in text only (as they appear in the court opinion);
# no logos, no real software UI (the screen is redrawn generically), no likenesses.
