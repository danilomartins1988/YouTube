# Documentary (target 11-13 min). Five parts as an INTERNAL structure only (never narrated or shown as missions).
# Hook rules (docs/ANALYSIS_HOOKS_THUMBS_VISUALS.md): cold open on the number, four short beats, explicit promise,
# no "What if", channel intro after part 1, no separate part-question scenes.
# Numbers come from sources.yaml via {{placeholders}}. Customer A and Customer B are never named; Q3 profit caveated.
logline: SpaceX is famous for rockets, but its own filings show the rockets lose money. Starlink pays the bills, and the biggest
  revenue line is now artificial intelligence, much of it from renting out computing power.
title: How SpaceX Actually Makes Money
segments:
- id: h_open
  chapter: A rent from the sky
  narration: A rent of {{gpu}}. That is what one artificial intelligence company agreed to pay SpaceX, until May twenty twenty-nine,
    according to the prospectus SpaceX filed when it went public. Not for a rocket launch. For computer chips.
  claims:
  - gpu
- id: h_twist
  chapter: A rent from the sky
  narration: In twenty twenty-six, SpaceX finally opened its books. And the most famous rocket company in the world turned
    out to earn most of its money from something else. In its latest quarter, artificial intelligence came first, internet
    subscriptions second, and rockets last.
  claims:
  - q3
- id: h_question
  chapter: A rent from the sky
  narration: So how does SpaceX actually make money? And why has the rocket business, the part everyone watches, been losing
    money?
  claims: []
  analysis: true
  source_note: Hook question built from the sourced facts.
- id: h_promise
  chapter: A rent from the sky
  narration: By the end of this video, you will know where SpaceX's money comes from, why most of its rockets carry its own
    cargo, and who really controls the company.
  claims: []
  analysis: true
  source_note: Promise of the episode (hook rule).
- id: m1_card
  chapter: Three businesses
  narration: ''
  claims: []
- id: m1_ipo
  chapter: Three businesses
  narration: On June twelfth, twenty twenty-six, SpaceX began trading on the stock market. The shares were sold at {{ipo}}
    each, and the company, a Texas corporation, raised about {{ipo.net_spoken}} after fees. At that price, by our calculation,
    the whole company was valued at about {{ipo.value_spoken}}.
  claims:
  - ipo
- id: m1_recast
  chapter: Three businesses
  narration: There is one catch. Before going public, SpaceX bought xAI, the artificial intelligence company that also owns
    the social network X. Both were controlled by Elon Musk. So the filings rewrite SpaceX's past to include them. On that
    basis, revenue in twenty twenty-five was {{rev}}.
  claims:
  - rev
- id: m1_split
  chapter: Three businesses
  narration: The company splits that money into three businesses. Space, meaning launches and contracts with NASA and the
    military, brought in about {{rev.space_spoken}}. Connectivity, which is mostly Starlink, brought in about {{rev.conn_spoken}}.
    And artificial intelligence, including advertising on X, brought in about {{rev.ai_spoken}}.
  claims:
  - rev
- id: m1_loss
  chapter: Three businesses
  narration: And here is the first surprise. Only one of the three made an operating profit that year. Starlink earned about
    {{rev.connop_spoken}}. The space business lost about {{rev.spaceop_spoken}}. The artificial intelligence business lost
    about {{rev.aiop_spoken}}. Overall, the company reported a net loss of about {{rev.net_spoken}}.
  claims:
  - rev
- id: m1_draw
  chapter: Three businesses
  narration: Let me draw the three engines. Here is the space business, the part everyone sees. Here is Starlink, the internet
    service. Here is artificial intelligence, the newest. Now the arrows. In twenty twenty-five, only Starlink made an operating
    profit. One engine was carrying the whole ship.
  claims:
  - rev
  analysis: true
  source_note: Diagram of the three reported segments and their FY2025 operating results.
- id: m1_transition
  chapter: Three businesses
  narration: So let's start with the engine that carries everything.
  claims: []
  analysis: true
  source_note: Transition.
