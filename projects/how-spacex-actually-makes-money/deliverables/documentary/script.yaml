  chapter: Starlink
  narration: ''
  claims: []
- id: m2_subs
  chapter: Starlink
  narration: Starlink sells internet from space. A small dish on a roof talks to satellites flying in low orbit. By the end
    of September twenty twenty-six, Starlink had about {{starlink}} consumer subscribers, in {{starlink.markets_spoken}} countries,
    territories and other markets. At the end of twenty twenty-three, it had about {{starlink.subs23_spoken}}.
  claims:
  - starlink
- id: m2_sats
  chapter: Starlink
  narration: To serve them, SpaceX flies more than {{starlink.sats_spoken}} Starlink satellites. According to the prospectus,
    SpaceX owns and operates about {{starlink.share_spoken}} of all the active satellites in orbit that can maneuver.
  claims:
  - starlink
- id: m2_arpu
  chapter: Starlink
  narration: But each customer now pays less than before. Average revenue per subscriber was about {{starlink.arpu23_spoken}}
    a month in twenty twenty-three. In early twenty twenty-six, it was about {{starlink.arpu26_spoken}}. The company says
    that is mainly because of international expansion and cheaper plans.
  claims:
  - starlink
- id: m2_margin
  chapter: Starlink
  narration: And still, it is very profitable. In the third quarter of twenty twenty-six, the connectivity business earned
    about {{starlink.q3op_spoken}} of operating profit on {{starlink.q3rev_spoken}} of revenue. By our calculation, that is
    about {{starlink.margin_spoken}} of every dollar that comes in.
  claims:
  - starlink
- id: m2_draw
  chapter: Starlink
  narration: Let me draw the subscriber climb. Twenty twenty-three, about {{starlink.subs23_spoken}}. Twenty twenty-four,
    {{starlink.subs24_spoken}}. Twenty twenty-five, {{starlink.subs25_spoken}}. And by September twenty twenty-six, {{starlink}}
    consumers alone. Each bar is a city of customers.
  claims:
  - starlink
  analysis: true
  source_note: Bar diagram of reported subscriber counts (definition narrowed to consumers from Q3 2026).
- id: m2_transition
  chapter: Starlink
  narration: Starlink pays the bills. So what about the rockets?
  claims: []
  analysis: true
