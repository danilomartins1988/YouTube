  chapter: The landlord
  narration: ''
  claims: []
- id: m4_xai
  chapter: The landlord
  narration: In February twenty twenty-six, SpaceX merged with xAI, the maker of the Grok chatbot. Since then the segment
    has been renamed Super Intelligence. It also includes the social network X, and Cursor, a coding tool SpaceX bought in
    August at an implied value of {{q3.cursor_spoken}}.
  claims:
  - q3
- id: m4_rent
  chapter: The landlord
  narration: But the biggest money is not from chatbots. It is rent. In May twenty twenty-six, according to the prospectus,
    SpaceX signed cloud services agreements with Anthropic, another artificial intelligence company, for about {{gpu.gpus_spoken}}
    Nvidia graphics chips, at {{gpu}} through May twenty twenty-nine. After three months, either side can end the deal with
    {{gpu.notice_spoken}} notice.
  claims:
  - gpu
- id: m4_q3
  chapter: The landlord
  narration: Then came the third quarter. SpaceX reported revenue of {{q3}}, up from {{q3.prior_spoken}} a year earlier. Super
    Intelligence brought in {{q3.si_spoken}}, more than Starlink for the first time. And one single customer, which the filing
    does not name, accounted for {{q3.custb_spoken}} of all revenue in the quarter.
  claims:
  - q3
- id: m4_profit
  chapter: The landlord
  narration: SpaceX even reported a profit that quarter, {{q3.net_spoken}}. But that figure was helped by a tax benefit, and
    by a gain on its stake in another Musk company, The Boring Company. A strong quarter, but not yet proof of a reliable
    money machine.
  claims:
  - q3
- id: m4_capex
  chapter: The landlord
  narration: And renting out chips costs a fortune up front. In the first nine months of twenty twenty-six, SpaceX spent {{capex}}
    on capital expenditure. By our calculation, about {{capex.si_share_spoken}} of it went to the Super Intelligence business.
  claims:
  - capex
- id: m4_draw
  chapter: The landlord
  narration: Let me draw the third quarter. A bar for rockets, {{q3.space_spoken}}. A bar for Starlink, {{q3.conn_spoken}}.
    And a bar for Super Intelligence, {{q3.si_spoken}}. The rocket company now earns its biggest share of revenue from artificial
    intelligence.
  claims:
  - q3
  analysis: true
  source_note: Bar diagram of Q3 2026 segment revenue.
- id: m4_transition
  chapter: The landlord
  narration: Which leaves one question. Who is in charge of all this?
  claims: []
  analysis: true
  source_note: Transition.
- id: m5_card
  chapter: Who's in charge
  narration: ''
  claims: []
- id: m5_vote
  chapter: Who's in charge
  narration: Elon Musk. After the offering, according to the prospectus, he held {{musk}} of the voting power, mostly through
    special class B shares that carry ten votes each. That makes SpaceX a controlled company under Nasdaq rules.
  claims:
  - musk
- id: m5_risk
  chapter: Who's in charge
  narration: The prospectus is blunt about it. It says the company is highly dependent on Mr. Musk, that it does not carry
    key person life insurance on him, and that he does not devote his full time to SpaceX, because he also runs Tesla.
  claims:
  - musk
- id: m5_govdep
  chapter: Who's in charge
  narration: The second big dependence is government. One customer, which the filing does not name, accounted for about {{gov.custa_spoken}}
    of SpaceX's revenue in twenty twenty-five. Its government contracts are mainly with NASA, the Department of War, the General
    Services Administration and intelligence agencies.
  claims:
  - gov
- id: m5_draw
  chapter: Who's in charge
  narration: Let me draw the control panel. Here is SpaceX, with its three businesses. Here are the ordinary shareholders,
    with their shares. And here is one person, holding {{musk}} of the votes. Every arrow of control runs through one box.
  claims:
  - musk
  analysis: true
  source_note: Diagram of voting control (prospectus).
- id: payoff
  chapter: The lesson
  narration: So how does SpaceX actually make money? Not mainly from rockets. The rocket business has been losing money, because
    SpaceX is pouring billions into Starship, and most launches carry its own satellites. Starlink makes the operating profit.
    And now the biggest revenue line is artificial intelligence, much of it from renting out computing power, with one unnamed
    customer bringing in about a third of the latest quarter's revenue. The lesson is that the most famous part of a company
    is not always the part that pays. At SpaceX, the rocket is the delivery truck, Starlink is the cash register, and the
    newest business is a landlord with very large bills. Whether that mix keeps working depends on Starship, on a few big
    customers, and on one man.
  claims:
  - launch
  - starlink
  - q3
  analysis: true
  source_note: Conclusion drawn from the sourced parts.
