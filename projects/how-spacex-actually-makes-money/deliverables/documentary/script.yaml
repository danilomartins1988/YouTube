- id: m3_card
  chapter: The rockets
  narration: ''
  claims: []
- id: m3_count
  chapter: The rockets
  narration: SpaceX launches more rockets than anyone. In twenty twenty-five, it flew {{launch}} Falcon rockets. And according
    to the prospectus, since twenty twenty-three it has launched {{launch.mass_spoken}} of all the mass sent to orbit by the
    entire world, every year.
  claims:
  - launch
- id: m3_own
  chapter: The rockets
  narration: But here is the twist. Of those {{launch}} launches, only {{launch.cust_spoken}} carried paying customers. The
    other {{launch.int_spoken}} carried SpaceX's own Starlink satellites. By our calculation, that is about three out of every
    four. And for those launches, the space business books no revenue at all, because SpaceX does not charge itself.
  claims:
  - launch
- id: m3_reuse
  chapter: The rockets
  narration: What keeps that affordable is reuse. Falcon boosters fly back and land, standing up, on a pad or on a ship at
    sea. The prospectus counts more than {{launch.landings_spoken}} successful booster landings. A rocket that lands can fly
    again.
  claims:
  - launch
- id: m3_starship
  chapter: The rockets
  narration: So why does the space business lose money? The answer is Starship, the giant new rocket. In twenty twenty-five
    alone, SpaceX spent about {{starship}} on Starship research and development, and it says it has invested more than {{starship.total_spoken}}
    in it so far. That year, the space business posted an operating loss of about {{rev.spaceop_spoken}}. The prospectus warns
    that any delay in Starship would limit its growth plans, including computers in orbit.
  claims:
  - starship
  - rev
- id: m3_gov
  chapter: The rockets
  narration: Rockets also bring in steady government money. In twenty twenty-five, SpaceX launched {{gov}} medium and heavy
    national security missions for the United States, and every crew and cargo mission to the space station for NASA.
  claims:
  - gov
- id: m3_draw
  chapter: The rockets
  narration: Let me draw one year of launches. Here are {{launch}} rockets. Here, {{launch.cust_spoken}} carry customers,
    and send money back in. And here, {{launch.int_spoken}} carry Starlink, and send satellites up, not money. The rocket
    business works like a delivery truck for the internet business.
  claims:
  - launch
  analysis: true
  source_note: Diagram of 2025 customer vs internal Falcon launches (prospectus).
- id: m3_transition
  chapter: The rockets
  narration: And then, in twenty twenty-six, a third business took over.
  claims: []
  analysis: true
  source_note: Transition.
