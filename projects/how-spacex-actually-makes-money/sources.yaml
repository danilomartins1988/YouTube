# Sources and claims for "How SpaceX Actually Makes Money" (Episode 51, owner request R1).
# Every claim was read on its primary page on 2026-11-11 (notes: docs/episodes/51-spacex/RESEARCH_NOTES.md).
# Status stays source_located until a named human reviewer signs off. US dollars as reported.
# RULES: FY2023-2025 figures are recast to include xAI and X (say so); Customer A and Customer B are NOT named;
# Musk voting power said as "more than 80%"; Q3 2026 net income said with its tax-benefit and Boring Company caveats;
# no Falcon 9 list price; SpaceX is a Texas corporation listed on Nasdaq and Nasdaq Texas; "our calculation" labels.
