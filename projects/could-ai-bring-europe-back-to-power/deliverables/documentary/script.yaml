logline: Europe is aging, pays more for energy and has few tech giants. But if AI and robots make labor matter less, what matters more
  is who owns the technology, the patents and the machines. Through Europe's drugmakers, ASML, Siemens and Airbus, the film tests a
  hypothesis - that automation could hand Europe a different way back into the global race - and names the conditions it needs.
title: Could AI Bring Europe Back to Power?
segments:
- id: co_hook
  chapter: A continent in a squeeze
  narration: Everyone says Europe is falling behind. Its people are getting older. Its companies pay {{energy}} what American companies
    pay for electricity. America leads the digital economy, China has become the world's factory, and most of the giant tech companies
    are based somewhere else. But Europe still builds the only machines that can print the most advanced chips, and it invents medicines
    sold all over the world. So here's a question almost nobody is asking. What if the technology that seems to threaten Europe could
    bring it back?
  claims:
  - energy
  analysis: true
  source_note: Hook framing (states the common belief, then flips it); ASML sole EUV supplier (asml_ar25); energy ratio (draghi_a).
- id: title_card
  chapter: A continent in a squeeze
  narration: ''
  claims: []
- id: a1_size
  chapter: A continent in a squeeze
  narration: First, a reality check, because Europe is not poor. By the IMF's estimates for {{gdp.year_spoken}}, the European Union
    produced {{gdp.eu_spoken}} dollars of output. China, {{gdp.cn_spoken}}. The United States, {{gdp}}. Europe is a giant. It's just
    a giant that has been slipping.
  claims:
  - gdp
- id: a1_gap
  chapter: A continent in a squeeze
  narration: A twenty twenty-four report for the European Commission by Mario Draghi found that the size gap between the EU and US economies
    grew from {{draghi_gap.then_spoken}} in {{draghi_gap.then_year_spoken}} to {{draghi_gap}} by {{draghi_gap.now_year_spoken}}. And
    about {{draghi_gap.prod_spoken}} of the gap in income per person comes from one thing. Lower productivity.
  claims:
  - draghi_gap
- id: a1_age
  chapter: A continent in a squeeze
  narration: Now add age. At the start of last year, {{eu_age}} of everyone in the EU was {{eu_age.age_spoken}} or older, according
    to Eurostat. Draghi's report projects that by {{workforce.year_spoken}}, the EU's workforce will shrink by close to {{workforce}}
    every single year, and the balance will move {{workforce.ratio_spoken}}.
  claims:
  - eu_age
  - workforce
- id: a1_squeeze
  chapter: A continent in a squeeze
  narration: Then the costs. EU companies pay {{energy}} as much for electricity as American firms, and {{energy.gas_spoken}} as much
    for natural gas. And in tech, only {{tech50}} of the world's top {{tech50.of_spoken}} tech companies are European. Close to {{unicorns}}
    of Europe's billion-dollar startups moved their headquarters abroad, mostly to America.
  claims:
  - energy
  - tech50
  - unicorns
- id: a1_paradox
  chapter: A continent in a squeeze
  narration: So here's the contradiction. Enormous wealth, world-class universities, famous companies, and serious questions about the
    future. Those are the facts. Now, a hypothesis.
  claims: []
  analysis: true
  source_note: Framing; marks the switch from facts to hypothesis (FACT / HYPOTHESIS chips on screen).
- id: a2_card
  chapter: The old formula
  narration: ''
  claims: []
- id: a2_formula
  chapter: The old formula
  narration: For two centuries, the recipe for growth was simple. Workers, plus capital, makes output. More people, more machines, more
    stuff. Europe's industrial revolution ran on it.
  claims: []
  analysis: true
  source_note: Textbook mechanism (labor and capital as inputs); no figures.
- id: a2_draw
  chapter: The old formula
  narration: Let me draw the problem. Output equals the number of workers, times what each worker produces. If the number of workers
    starts falling, and in Europe it's about to, there's only one way to keep growing. Each worker has to produce more. Expensive labor
    makes that even harder.
  claims: []
  analysis: true
  source_note: Mechanism (growth accounting identity), drawn by the presenter; workforce decline sourced in a1_age.
- id: a2_question
  chapter: The old formula
  narration: So here's the question. What if technology let companies produce far more with far fewer workers? Then a shrinking workforce
    stops being a death sentence, and a different question matters more.
  claims: []
  analysis: true
  source_note: Transition to the hypothesis (no figures).
- id: a3_card
  chapter: When machines do the work
  narration: ''
  claims: []
- id: a3_factory
  chapter: When machines do the work
  narration: Walk into a modern automated factory. Cameras running AI software check every part, and guide robot arms. The International
    Federation of Robotics calls that machine vision {{ifr_ai}}. Sensors warn before a motor fails. Self-driving carts move parts. And
    engineers test the line in a digital twin before building it.
  claims:
  - ifr_ai
- id: a3_proven
  chapter: When machines do the work
  narration: But careful with the hype. The federation says general-purpose robots that can learn any job are not yet industry-grade.
    So this isn't a factory with no people. It's a factory where each person does far more.
  claims:
  - ifr_ai
- id: a3_robots
  chapter: When machines do the work
  narration: Factories in Europe installed {{ifr_europe}} new industrial robots last year, down {{ifr_europe.drop_spoken}}. Germany
    runs {{ifr_europe.de_spoken}} robots for every {{ifr_europe.unit_spoken}} factory workers. The EU, {{ifr_europe.eu_spoken}}. The
    world average, {{ifr_europe.world_spoken}}.
  claims:
  - ifr_europe
- id: a3_bill
  chapter: When machines do the work
  narration: Picture a factory's costs as a stack. Automation shrinks the labor slice. But the machines, the software and the know-how
    behind them become a bigger part of the bill. So the money starts flowing to whoever owns those things. That's not a forecast. It's
    how the arithmetic moves.
  claims: []
  analysis: true
  source_note: Mechanism, illustrative cost stack (no measured shares), labelled ILLUSTRATIVE on the board.
- id: a3_people
  chapter: When machines do the work
  narration: Human work doesn't disappear. Someone designs the robots, writes the software, fixes the line. But if fewer hands are needed
    per product, cheap labor matters less, and owning the technology may matter more. Europe owns quite a lot of it. Starting with medicine.
  claims: []
  analysis: true
  source_note: Conjecture (labelled), built on the a3_bill mechanism.
- id: a4_card
  chapter: 'Pharma: Europe''s hidden advantage'
  narration: ''
  claims: []
- id: a4_surplus
  chapter: 'Pharma: Europe''s hidden advantage'
  narration: Here's a number that surprises most Americans. In twenty twenty-five, the EU sold {{pharma_surplus}} more medicines to
    the world than it bought, by our conversion of Eurostat data. Its biggest customer? The United States, with about {{pharma_surplus.us_spoken}}
    of those exports.
  claims:
  - pharma_surplus
- id: a4_six
  chapter: 'Pharma: Europe''s hidden advantage'
  narration: Look at the names. Roche and Novartis in Basel, Switzerland. AstraZeneca in Cambridge and GSK in London. Sanofi in Paris.
    Novo Nordisk outside Copenhagen. Switzerland and the UK are in Europe, but not in the EU. Together, these six brought in {{pharma_six}}
    last year, and spent {{pharma_six.rd_spoken}} on research.
  claims:
  - pharma_six
- id: a4_chain
  chapter: 'Pharma: Europe''s hidden advantage'
  narration: So where does the money in a medicine come from? Let me draw the chain. Research finds a molecule. Patents protect it.
    Trials prove it works. Then factories make it, and distributors ship it worldwide. Most of the value sits at the start. In the ideas,
    the patents and the proof.
  claims: []
  analysis: true
  source_note: Mechanism (value chain), drawn by the presenter; no allocation figures.
- id: a4_novo
  chapter: 'Pharma: Europe''s hidden advantage'
  narration: Take Novo Nordisk, the Danish maker of diabetes and obesity drugs. Last year it sold {{novo}} worth of medicine, and spent
    {{novo.rd_spoken}} on research. It is buying and expanding factories. But what it really sells is decades of science that only it
    controls.
  claims:
  - novo
- id: a4_ai
  chapter: 'Pharma: Europe''s hidden advantage'
  narration: Could AI speed that science up? AstraZeneca bought a company called {{az_ai}} to build AI models into its cancer research.
    But getting a medicine from lab to pharmacy takes {{drug_odds}} on average, and only {{drug_odds.odds_spoken}} substances make it.
    AI may help pick better bets. It doesn't guarantee a single approval.
  claims:
  - az_ai
  - drug_odds
- id: a4_reveal
  chapter: 'Pharma: Europe''s hidden advantage'
  narration: And here's the revelation. A company doesn't have to perform every manufacturing step at home to capture a lot of the value.
    What it has to do is own, and keep improving, the thing everyone else needs.
  claims: []
  analysis: true
  source_note: Conclusion of Act 4 (mechanism; no figures).
- id: a5_card
  chapter: The machines behind the machines
  narration: ''
  claims: []
- id: a5_asml
  chapter: The machines behind the machines
  narration: Same story in chips. ASML, in the Dutch town of Veldhoven, is the only company that makes the extreme ultraviolet machines
    used to print the world's most advanced chips. Last year it sold {{asml}} worth of equipment and kept {{asml.ni_spoken}} as profit.
    It doesn't make a single chip.
  claims:
  - asml
- id: a5_web
  chapter: The machines behind the machines
  narration: About {{asml.sup_spoken}} suppliers feed in lenses, lasers and parts. Out go machines to chip factories in Asia and America.
    Every time someone, anywhere, builds a factory for AI chips, part of the bill lands in the Netherlands.
  claims:
  - asml
- id: a5_siemens
  chapter: The machines behind the machines
  narration: Siemens, from Munich, sells factories the controllers, automation, software and digital twins. In its fiscal year to September,
    it brought in {{siemens}}, and its factory software grew {{siemens.growth_spoken}}. Its chief executive calls industrial AI an exceptional
    growth opportunity. When the world automates, someone sells the automation.
  claims:
  - siemens
- id: a5_airbus
  chapter: The machines behind the machines
  narration: Then there's Airbus, registered in the Netherlands and run from near Toulouse. Last year it delivered {{airbus}} commercial
    jets, with {{airbus.backlog_spoken}} more on order. Its real product is coordination. Thousands of parts from many countries, engineered
    and certified to fit. Exactly where better software and automation could pay off.
  claims:
  - airbus
- id: a5_limits
  chapter: The machines behind the machines
  narration: None of this means Europe dominates everything. Its robot installations fell, and its cloud and consumer tech are mostly
    American. But it does own capabilities that could gain value as production gets more automated.
  claims: []
  analysis: true
  source_note: Balance note; robot decline sourced in a3_robots (ifr_europe); tech position sourced in a1_squeeze (draghi_a).
- id: a6_card
  chapter: Owning vs. operating
  narration: ''
  claims: []
- id: a6_old
  chapter: Owning vs. operating
  narration: For decades, countries competed to host factories and their jobs. But in a more automated economy, the factory floor may
    employ fewer people. And the question shifts from who operates the machines to who owns them.
  claims: []
  analysis: true
  source_note: Hypothesis (labelled), no figures.
- id: a6_company
  chapter: Owning vs. operating
  narration: Imagine a made-up European company. Let's call it Company E. Its scientists and engineers in Europe develop the technology.
    It owns the patents and the software, and its people make the key decisions and carry the big risks. It licenses that know-how worldwide,
    and has partner factories in several countries make the product.
  claims: []
  analysis: true
  source_note: HYPOTHETICAL company (labelled on screen); no real firm implied.
- id: a6_numbers
  chapter: Owning vs. operating
  narration: Now some made-up numbers, per hundred dollars of sales. A contract factory abroad spends sixty dollars making the product
    and earns a steady fee, a five percent markup, so three dollars. Company E pays its own research and sales costs of twenty, and
    keeps seventeen. Then the factory automates, and its costs fall to fifty. It still earns its five percent, now two dollars fifty.
    Company E's share jumps to twenty-seven dollars fifty.
  claims: []
  analysis: true
  source_note: 'ILLUSTRATIVE MODEL (our assumptions; labelled on screen). Per $100 of sales. Before: factory costs 60, markup 5% = 3,
    charge 63; Company E costs 20; E keeps 100-63-20 = 17; group 20. After: factory costs 50, markup 2.50, charge 52.50; E keeps 100-52.50-20
    = 27.50; group 30. Assumes sales prices hold and Company E genuinely performs and controls the development and risks.'
- id: a6_catch
  chapter: Owning vs. operating
  narration: Two catches. This only works if the European company really does the work, and if prices hold, though rivals automate too.
    And simply registering a patent somewhere doesn't move the profit. The real work, people and decisions have to be there too.
  claims: []
  analysis: true
  source_note: Caveats. Tax sentence consistent with OECD TPG 2022 Chapter VI (legal ownership alone does not confer the right to retain
    returns; DEMPE functions and control of risk) - see FACT_CHECK.md (sources oecd_tpg, eu_pillar2, not narrated).
- id: a6_question
  chapter: Owning vs. operating
  narration: So the real question isn't whether Europe can win back the assembly line. It's whether it can attract and keep the companies,
    the scientists, the capital and the ideas that capture value from automated production everywhere.
  claims: []
  analysis: true
  source_note: Restates the hypothesis (no figures).
- id: a6_energy
  chapter: Owning vs. operating
  narration: 'Now a twist. If robots make labor matter less, other costs matter more: energy, the cost of money, logistics, stability,
    and the taxes and charges on producing. Take Brazil. In {{br_power.year_spoken}}, {{br_power}} of its electricity came from renewables.
    But one industry study found taxes and sector charges took {{br_charges}} of what its power companies billed. Brazil is phasing
    in a new value-added tax through {{br_vat}}. So in this scenario, an energy-rich country would need competitive costs to produce,
    charges and taxes included. And the profit from the technology could still flow to its owner. Possibly a European one.'
  claims:
  - br_power
  - br_charges
  - br_vat
  analysis: true
  source_note: 'Owner-added beat (2026-11-18). Mechanism + SCENARIO (labelled), not a prediction or policy recommendation. Brazil facts:
    EPE BEN 2026, PwC/Acende Brasil 2025, Agencia Senado (EC 132/2023).'
- id: a7_card
  chapter: A magnet for capital
  narration: ''
  claims: []
- id: a7_magnet
  chapter: A magnet for capital
  narration: Europe has real pull. Strong courts, research labs, a huge single market, industrial clusters, and cities people want to
    live in. That can attract engineers, entrepreneurs, investors and headquarters.
  claims: []
  analysis: true
  source_note: Qualitative strengths (no rankings or figures claimed).
- id: a7_kinds
  chapter: A magnet for capital
  narration: But careful. Wealthy residents are not the same as productive investment. A head office is not a research lab. Only real
    activity builds real growth.
  claims: []
  analysis: true
  source_note: Distinction requested by the brief; mechanism, no figures.
- id: a7_risks
  chapter: A magnet for capital
  narration: And inflows bring problems. Pricier housing. Wider inequality. Shortages of skilled workers. And rich newcomers don't automatically
    pay for pensions and hospitals. That depends on what they do and how they're taxed.
  claims: []
  analysis: true
  source_note: Risks requested by the brief; qualitative, no figures.
- id: a8_card
  chapter: Could Europe come back?
  narration: ''
  claims: []
- id: a8_conditions
  chapter: Could Europe come back?
  narration: So what would a comeback take? Let me list it. Turn research into companies that can grow big without leaving. Make capital
    easier to raise. Bring down energy costs. Actually adopt AI in everyday factories and offices. And compete hard for talent. Miss
    these, and the automated economy's profits flow elsewhere.
  claims: []
  analysis: true
  source_note: Conditions drawn from the brief and the Draghi report themes (scale-ups, capital, energy, adoption, skills); no figures.
- id: a8_verdict
  chapter: Could Europe come back?
  narration: So, could AI bring Europe back to power? Not by winning the race to build the most factories. That race is China's. And
    not as a copy of Silicon Valley. But as the owner, developer, financier and licensor of technology the whole world runs on. That's
    a plausible path, not a promise. Europe has the assets. The rest depends on choices it hasn't made yet.
  claims: []
  analysis: true
  source_note: Verdict (hypothesis plus conditions); no prediction or date.
- id: a8_close
  chapter: Could Europe come back?
  narration: For generations, economic power meant factories and workers. In a world run more and more by machines, the question may
    change. Not just who makes the products, but who owns the technology, the machines and the ideas behind them. And that could give
    Europe a very different way back into the race.
  claims: []
  analysis: true
  source_note: Closing line (owner direction, rewritten).
- id: teaser
  chapter: Could Europe come back?
  narration: Next time, we follow the money behind another hidden link of the world economy. This is The Hidden Economics.
  claims: []
  analysis: true
  source_note: Generic closing teaser (channel rule).
