# Sources and claims for "Could AI Bring Europe Back to Power?" (Episode 63; owner request 2026-11-18).
# Every claim was read on its primary page or document on 2026-11-18 (notes: docs/episodes/63-europe-ai/RESEARCH_NOTES.md).
# Status stays source_located until a named human reviewer signs off. US dollars only.
# SCOPE RULE: every statistic says whether it covers the EU (27 member states), the eurozone, or Europe (EFPIA = Europe incl.
# Switzerland, UK, Norway, Turkey; IFR "Europe" = the continent). AstraZeneca and GSK are UK-based (Europe, not the EU); Roche and
# Novartis are Swiss (Europe, not the EU).
# FX RULE: calendar-2025 figures converted at the ECB 2025 average reference rates (per EUR: USD 1.1300, DKK 7.4634, CHF 0.9370,
# GBP 0.85687; via Bank of Finland) -> USD per DKK 0.15141, per CHF 1.20598, per GBP 1.31875 (cross rates: OUR CALCULATION).
# Siemens fiscal 2026 (Oct 2025-Sep 2026) converted at USD 1.1616 per EUR, the mean of the 255 ECB daily reference rates in that
# period (ECB Data Portal series EXR.D.USD.EUR.SP00.A; our calculation). Every converted figure is "our conversion".
# TAX: the film contains one sentence on tax (registering a patent does not move profit by itself). The OECD Transfer Pricing
# Guidelines (2022, Chapter VI, DEMPE), and Council Directive (EU) 2022/2523 (Pillar Two) are listed for the FACT_CHECK and the
# description only. The owning-vs-operating experiment is an ILLUSTRATIVE MODEL with no claim (labelled on screen).
