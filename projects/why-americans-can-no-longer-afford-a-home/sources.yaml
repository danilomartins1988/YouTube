# Sources and claims for "Why Americans Can No Longer Afford a Home" (Episode 58, owner request 2026-11-17; supersedes Ep 31).
# Ep 31's dossier was the starting point; every figure was re-read on its primary page or data file on 2026-11-17 and updated
# to the latest release (notes: docs/episodes/58-housing-v2/RESEARCH_NOTES.md). Status stays source_located until a named
# human reviewer signs off. US dollars only, nominal unless said otherwise.
# RULES: NAR prices are the median EXISTING-home price (all housing types, October 2026, not seasonally adjusted); the Census
# income is the 2025 REAL median HOUSEHOLD income; the monthly payments and the income needed at today's rate are OUR
# calculation (NAR's affordability method: 20% down, 30-year fixed, principal+interest = 25% of income); completions by decade
# are OUR sums of Census monthly data; shortage numbers are ESTIMATES and always said as a range / attributed; the NAHB
# regulation share is a home builders' trade-group estimate; the Berkeley zoning share is Greater Los Angeles (region, not
# city); the FHFA lock-in figures are a working-paper estimate for 2022Q2-2023Q4. No real person is drawn; buyers are
# generic cartoon characters.
