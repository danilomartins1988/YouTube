title: "Why Americans Can No Longer Afford a Home"
slug: why-americans-can-no-longer-afford-a-home
language: en
# Episode 58 (owner request, 2026-11-17): Ep 31 ("Why American Homes Became So Expensive", 2026-11-10) re-made in the
# current sitcom format and updated to the latest data (NAR Oct 2026, PMMS Nov 12 2026, Census income 2025, NAR Profile
# 2026). Ep 31 stays untouched; this episode supersedes it in docs/PRODUCTION_QUEUE.md.
# Owner creative direction (as Ep 56): feel like an actual episode of a prime-time animated TV sitcom (genre level only: all
# characters, designs, names, title card text and music are original). Visual direction: visual_direction.yaml.
# Five-part structure internal only. Money: US dollars only. Our calculations and estimates are labelled.
renderer: remotion
remotion_geo: [world]
style:
  name: cartoon-day
  palette:
    bg: "#FFF4DE"
    bg2: "#FFFBF2"
    ink: "#1B2433"
    muted: "#6B7385"
    land: "#9CCB7A"
    border: "#2E4A66"
    accent: "#FFB300"
    accent2: "#2F6FD1"
    accent3: "#2E9E5B"
    risk: "#E53950"
  fonts:
    display: InterDisplay-Bold
    heading: InterDisplay-SemiBold
    body: Inter-Regular
    body_bold: Inter-SemiBold
  web_fonts:
    display: "Inter Display, Inter, sans-serif"
    body: "Inter, sans-serif"
  transition: scan
  background: grid
  motifs: [chapter-tags]
budget:
  max_paid_usd: 1.00
presenter_min: 4
# TV structure: cold open (hook) -> channel intro (the "theme") -> show title card -> acts.
intro:
  after_segment: co_promise
tts_overrides:
  openai:
    voice: ash
    instructions: >-
      Voice: the narrator of a smart prime-time animated comedy who is also a sharp economics documentarian. Warm, wry
      and lively, with a playful twinkle on the jokes and dry deadpan on the punchlines, but always clear and credible on
      facts. Pacing: brisk and energetic in the comic beats, then slow down noticeably and land every number cleanly. Take
      a short beat before a punchline and after a surprising figure. Natural American English, conversational, never an
      announcer, never salesy, never sing-song. A touch of empathy for young buyers, never mocking.
