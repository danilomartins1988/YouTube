# Documentary (target 11-13 min), built like an episode of a prime-time animated sitcom: cold open, channel intro
# (our "theme"), a show title card, five acts with bumpers, a button joke. The five parts stay an INTERNAL structure
# (never narrated as missions). Numbers come from sources.yaml via {{placeholders}}; years are spoken as words.
# Rules: the payments and the income needed at today's rate are OUR calculation (said); shortage figures are ESTIMATES
# (said, as a range, attributed); NAHB = home builders' trade group (said); Berkeley = Greater Los Angeles (said);
# FHFA = a working-paper estimate (said). MAYA, REX and DEEDEE are fictional cartoon characters, never real people;
# jokes never change a number.
logline: A typical American home now costs almost five times a typical income, the mortgage rate that doubled the payment
  froze the owners who already have cheap loans, a decade of underbuilding left the country millions of homes short, and
  local rules make the cheapest homes the hardest to build. The first-time buyer is now forty.
title: Why Americans Can No Longer Afford a Home
segments:
- id: co_open
  chapter: Cold open
  narration: Saturday morning, an open house in an ordinary suburb. Three bedrooms, one bathroom, a lawn the size of a parking
    space. Half the town is in the kitchen. Someone just offered more than the asking price, in cash. And Maya, who has been
    saving since forever, is holding up a sign that just says, please.
  claims: []
  analysis: true
  source_note: Cold-open scene with fictional characters (illustrative, no figures); market figures are sourced in the next segments.
- id: co_hook
  chapter: Cold open
  narration: Here's the whole problem in one breath. The typical existing home in America sold for {{nar_price}} in October.
    The typical household earned {{census_inc}} last year, a record. And with mortgage rates above seven percent, the paycheck
    you need to buy that home has run right past the paycheck most people have.
  claims:
  - nar_price
  - census_inc
  - pmms
- id: co_promise
  chapter: Cold open
  narration: So why can't Americans afford a home anymore? Let's follow the money. The price that outran the paycheck, the rate
    that rode a rollercoaster, the owners who can't move, the homes we never built, and the room where it's decided.
  claims: []
  analysis: true
  source_note: Promise of the episode (hook rule).
