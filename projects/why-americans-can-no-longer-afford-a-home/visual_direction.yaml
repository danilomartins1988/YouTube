requirements:
- No brokerage, lender, listing-site or builder logos, names on signage, or trademarked art; houses and towns are generic
- No character, design, name, catchphrase, location, title text or music borrowed from any existing show
- Jokes never change a number; our calculations (payments, income needed), estimates (shortage, NAHB, FHFA) and the one-region
  zoning figure (Greater LA) are labelled on screen
- Day scenes, many generic human characters; fictional cast only; no real person drawn
- Charts use supplied data only (the rollercoaster track is the Freddie Mac weekly series, sampled)
