# Visual direction for why-americans-can-no-longer-afford-a-home (APPLIED by the pipeline; see hiddeneco/visual_direction.py).
# Director's edit (Ep 58). OWNER DIRECTION: feel like an actual episode of a prime-time animated TV sitcom, at genre level
# only: every character, design, name, title card, caption and sound is original. Craft: cold open gag (a Saturday open house
# with a bidding war) -> channel intro (the "theme") -> show title card "STARTER HOME" with a typed joke subtitle -> five
# acts, each opened by a bumper whose STARTER HOME keeps shrinking (bungalow -> shed -> doghouse -> birdhouse -> mailbox: the
# running gag) while Maya runs at it and DeeDee beats her to it with a SOLD sign -> the basement -> button joke after the end card.
# Recurring cast (original, fictional): MAYA (first-time buyer, teal top, glasses), REX (her dad, refinanced near the bottom,
# locked in), DEEDEE (realtor, pink blazer, clipboard). Generic buyers and neighbours only; no real person drawn.
# Bespoke day sets (CartoonStage/housing.tsx): openhouse, ratecoaster (track = Freddie Mac weekly 30-yr rate, supplied data),
# lockstreet, shrinker (SHRINK-O-MATIC), emptylot, zoningboard, basement.
