# Sources and claims for "The Hamburger That Became a Symbol of the Cold War's End" (Episode 26, top-10 #9: McDonald's
# in Moscow, 1990-2022). Every claim was read on its source page on 2026-11-09 (AI fact-check; quotes in
# docs/episodes/26-mcdonalds/RESEARCH_NOTES.md and FACT_CHECK.md). Status stays source_located until a named human
# reviewer signs off.
# MONEY: US dollars as published. 1990 Soviet prices are NOT converted (the currency was non-convertible; the official
# rate badly misstates real value) and are said only as a share of wages ("half a day's average pay").
# Conflicting figures (seats 700 vs 900; Big Mac price 3 / 3.50 / 3.75; queue head-count) are left out.
# No McDonald's logo, arches, mascot or trade dress: a generic cartoon burger and storefront; names in text only;
# no likeness of real people.
