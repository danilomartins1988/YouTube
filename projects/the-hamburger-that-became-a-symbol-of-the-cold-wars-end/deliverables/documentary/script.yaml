logline: On a freezing morning in January nineteen ninety, people in Moscow began lining up before dawn to buy a hamburger.
  The first McDonald's in the Soviet Union served thirty thousand customers that day. How a fast food chain spent fourteen
  years getting in, built its own farms and factory to stay, and how, thirty-two years later, it left.
title: The Hamburger That Became a Symbol of the Cold War's End
segments:
- id: h_question
  chapter: A line in the snow
  narration: Why would thousands of people stand in the snow before dawn, in the capital of the Soviet Union, just to buy
    a hamburger?
  claims:
  - opening
  analysis: true
  source_note: Hook question built from the sourced opening-day account.
- id: h_stakes
  chapter: A line in the snow
  narration: On January thirty-first, nineteen ninety, people began lining up near Pushkin Square in Moscow as early as four
    in the morning. By the end of the day, {{opening}} customers had walked through the doors of the first McDonald's in the
    Soviet Union, a record for any opening day in the company's history. For a few years, that hamburger became a symbol of
    the Cold War coming to an end. Thirty-two years later, it became a symbol of something else.
  claims:
  - opening
- id: m1_card
  chapter: Fourteen years
  narration: ''
  claims: []
- id: m1_question
  chapter: Fourteen years
  narration: How do you open a burger restaurant in a country where private business is not allowed?
  claims: []
  analysis: true
  source_note: Part question.
- id: m1_start
  chapter: Fourteen years
  narration: Very slowly. The idea started in the nineteen seventies, with the Canadian arm of McDonald's. Beginning in nineteen
    seventy-six, one of its executives made the first of dozens of trips to Moscow, to lobby the officials of the Communist
    Party. In the Soviet Union, the state owned the shops, the farms and the factories. A foreign company could not just rent
    a building and start selling.
  claims:
  - deal
- id: m1_jv
  chapter: Fourteen years
  narration: The door opened only when the rules changed. In the late nineteen eighties, under perestroika, the Soviet Union
    began to allow joint ventures with foreign companies. On April twenty-ninth, nineteen eighty-seven, McDonald's Canada
    signed one with the Moscow city government. But there was a catch. The city kept the controlling share, fifty-one percent.
    The foreign partner was limited to forty-nine.
  claims:
  - deal
- id: m1_draw
  chapter: Fourteen years
  narration: Let me draw how that deal worked. On one side, the city of Moscow, with fifty-one percent. On the other, McDonald's
    Canada, with forty-nine. Between them, one company, which would own the restaurant. The city brought the land, the permits
    and the political cover. McDonald's brought the money, the recipes and the know-how. And neither could do it alone.
  claims:
  - deal
  analysis: true
  source_note: Diagram of the joint venture described by Ironside.
- id: m1_cost
  chapter: Fourteen years
  narration: In the end, it took {{deal}} of work, and an investment of {{deal.invest_spoken}}, before the first burger was
    sold. And a big part of that money did not go into the restaurant at all.
  claims:
  - deal
- id: m1_transition
  chapter: Fourteen years
  narration: Because there was a problem nobody could negotiate away. The country had no reliable supply of the food a burger
    chain needs.
  claims:
  - plant
  analysis: true
  source_note: Bridge to the sourced supply-chain build-out.
- id: m2_card
  chapter: Building a food chain
  narration: ''
  claims: []
- id: m2_question
  chapter: Building a food chain
  narration: What do you do when the country cannot supply your ingredients?
  claims: []
  analysis: true
  source_note: Part question.
- id: m2_shortage
  chapter: Building a food chain
  narration: A hamburger chain depends on the same bun, the same beef and the same potato, every day, in huge quantities.
    In the Soviet planned economy, nobody could guarantee that. So McDonald's decided to build the supply chain itself.
  claims:
  - plant
  analysis: true
  source_note: Context for the plant built by McDonald's (Ironside, CBC).
- id: m2_plant
  chapter: Building a food chain
  narration: In nineteen eighty-nine, work began on a giant food plant in Solntsevo, on the edge of Moscow. It covered about
    one hundred thousand square feet. According to CBC, it was built to turn out {{plant}}, and {{plant.patties_spoken}}.
    The building opened in nineteen ninety, just in time for the restaurant.
  claims:
  - plant
- id: m2_potatoes
  chapter: Building a food chain
  narration: Even the potatoes had to be imported, as seeds. McDonald's brought in Russet Burbank seed potatoes, the variety
    used for its fries, and trained Soviet collective farmers in how to grow bigger harvests. A burger restaurant was teaching
    farming to a superpower.
  claims:
  - plant
- id: m2_draw
  chapter: Building a food chain
  narration: Let me draw the chain. Here are the farms, with the imported potato seeds. The crop goes into the plant, which
    makes the buns, the patties and the fries. And from the plant, the food goes to the restaurant on Pushkin Square. Every
    link in the chain was built from scratch, before a single customer walked in.
  claims:
  - plant
  analysis: true
  source_note: Supply-chain diagram of the plant and farms described by Ironside and CBC.
- id: m2_transition
  chapter: Building a food chain
  narration: By the end of January nineteen ninety, the chain was ready. Now the question was whether anyone would come.
  claims: []
- id: m3_card
  chapter: Opening day
  narration: ''
  claims: []
- id: m3_question
  chapter: Opening day
  narration: How many people will queue in the snow for a taste of the West?
  claims: []
  analysis: true
  source_note: Part question.
- id: m3_queue
  chapter: Opening day
  narration: The answer was, thousands. On January thirty-first, the first people arrived around four in the morning, in the
    dark and the cold. By the time the doors opened, thousands of people were waiting in line. Inside, the restaurant had
    {{opening.tills_spoken}} cash registers ready for them.
  claims:
  - opening
- id: m3_record
  chapter: Opening day
  narration: The staff had expected to serve around {{opening.expected_spoken}} meals that day. They served {{opening}}. No
    McDonald's anywhere in the world had ever served so many customers on its first day.
  claims:
  - opening
- id: m3_draw
  chapter: Opening day
  narration: Let me draw what opening day looked like. Here is the plan, ten thousand meals. And here is what actually happened.
    Thirty thousand. Three times the plan, from a single restaurant, in a single day.
  claims:
  - opening
  analysis: true
  source_note: Bar chart of the sourced expected and served figures.
- id: m3_price
  chapter: Opening day
  narration: And it was not cheap. According to CBC, a meal cost about {{wage}}. One man outside told a reporter that they
    were being ripped off. Still, the crowds kept coming. For many people, it was not really about the food.
  claims:
  - wage
- id: m3_quote
  chapter: Opening day
  narration: The restaurant's first manager put it best. Many people talk about perestroika, he said, but for them it is an
    abstraction. I can touch my perestroika. I can taste it. {{perestroika}}.
  claims:
  - perestroika
- id: m3_leader
  chapter: Opening day
  narration: Even the country's leadership saw it that way. Mikhail Gorbachev later called the restaurant a breakthrough,
    one which showed that new economic relations between the Soviet Union and the rest of the world were possible. A hamburger
    had become a piece of foreign policy.
  claims:
  - perestroika
  analysis: true
  source_note: Gorbachev quote as cited by Ironside; last sentence is commentary.
- id: m3_transition
  chapter: Opening day
  narration: Less than two years later, the Soviet Union itself was gone. The restaurant stayed.
  claims: []
  analysis: true
  source_note: Historical fact (USSR dissolved December 1991) used as a bridge.
- id: m4_card
  chapter: Thirty years
  narration: ''
  claims: []
- id: m4_question
  chapter: Thirty years
  narration: What happens to a symbol when the country around it changes?
  claims: []
  analysis: true
  source_note: Part question.
- id: m4_control
  chapter: Thirty years
  narration: In the new Russia, McDonald's slowly took control. In February nineteen ninety-six, it bought most of the city's
    shares in the joint venture, raising its own stake from forty-nine percent to {{control}}. The company that had once needed
    permission to open a single restaurant now ran the business.
  claims:
  - control
- id: m4_growth
  chapter: Thirty years
  narration: And it grew. By twenty twenty-two, McDonald's had {{size}} restaurants in Russia. It owned about eighty-four
    percent of them, and ran most of them itself, rather than through franchise owners. They employed {{size.staff_spoken}}
    people. Together with its restaurants in Ukraine, the business brought in about nine percent of the company's annual revenue,
    {{size.revenue_spoken}}. For a brand built on burgers and fries, Russia had become one of its big markets.
  claims:
  - size
- id: m4_draw
  chapter: Thirty years
  narration: Let me draw how the business changed. In nineteen ninety, one restaurant, forty-nine percent owned, in a joint
    venture with the state. By twenty twenty-two, more than eight hundred and fifty restaurants, mostly owned and run by McDonald's
    itself. That is what made the next step so expensive.
  claims:
  - control
  - size
  analysis: true
  source_note: Comparison of the sourced 1990 and 2022 positions.
- id: m4_transition
  chapter: Thirty years
  narration: Then, in February twenty twenty-two, Russia invaded Ukraine.
  claims: []
- id: m5_card
  chapter: Leaving
  narration: ''
  claims: []
- id: m5_question
  chapter: Leaving
  narration: What does it cost to walk away from thirty years of business?
  claims: []
  analysis: true
  source_note: Part question.
- id: m5_close
  chapter: Leaving
  narration: On March eighth, twenty twenty-two, McDonald's announced that it was temporarily closing its restaurants in Russia.
    Two months later, on May sixteenth, it went further. After {{exit}} in the country, it said, it would leave Russia for
    good, and it expected to book a charge of about one point two to one point four billion dollars. Its chief executive wrote
    that the company could no longer keep the Arches shining there.
  claims:
  - exit
- id: m5_sale
  chapter: Leaving
  narration: Three days later, McDonald's agreed to sell the whole business to Alexander Govor, a local businessman who had
    run {{sale}} as a McDonald's licensee. The deal kept the employees in their jobs for at least two years. The price was
    never made public.
  claims:
  - sale
- id: m5_draw
  chapter: Leaving
  narration: Let me draw what leaving cost. Here is McDonald's, and here is the Russian business, more than eight hundred
    and fifty restaurants. An arrow to the new owner, for a price nobody disclosed. And an arrow back, to the company's books.
    A charge of {{charge}}, mostly to write off what it had invested in Russia.
  claims:
  - charge
  - sale
  - size
  analysis: true
  source_note: Diagram of the sale and the charge reported by McDonald's.
- id: m5_charge
  chapter: Leaving
  narration: In its results, McDonald's booked a charge of {{charge.quarter_spoken}} in the second quarter of twenty twenty-two,
    and {{charge}} over the first half of the year, related to the sale of its business in Russia.
  claims:
  - charge
- id: m5_reopen
  chapter: Leaving
  narration: And then came the strangest part. On {{reopen}}, the restaurants began to reopen under their new owner, starting
    with the very same building on Pushkin Square. Same address, and under the deal, the same staff. Only the name had changed.
    It was announced just a couple of hours before the doors opened. Vkusno and tochka. Roughly, tasty, and that's it.
  claims:
  - reopen
- id: payoff
  chapter: The lesson
  narration: So what does one hamburger restaurant teach us about the world economy? That a business is never only a business.
    In nineteen ninety, a burger in Moscow meant the walls between East and West were coming down. It took fourteen years
    of politics to open the door, and one war to close it. The kitchens are still there, and so are the customers. What left
    was the name, and the idea that trade alone would keep the world together.
  claims:
  - opening
  - exit
  - reopen
  analysis: true
  source_note: Conclusion drawn from the sourced parts.
- id: teaser
  chapter: The lesson
  narration: Next time on The Hidden Economics, we follow the money behind another hidden link of the world economy. This
    is The Hidden Economics.
  claims: []
  analysis: true
  source_note: Generic teaser (channel rule).
