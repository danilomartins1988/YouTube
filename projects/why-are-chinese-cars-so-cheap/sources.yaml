  - id: seagull
    text: "electrive (2026-10-21) and CnEVPost (2026-10-20): the second-generation BYD Seagull launched in China on Oct 20, 2026 with guide prices from 65,900 yuan (Vitality) to 99,900 yuan; up to 39.2 kWh Blade battery with 'Flash-Charging' 10-70% in five minutes (company claim); LiDAR optional with advanced driver assistance; 85-95 kW rear motor; 4.21 m long. 65,900 yuan / 6.6710 (H.10, Nov 13, 2026) = $9,879 ≈ $9,900 (our conversion). China list prices include 13% VAT; in 2026 NEV buyers pay a 5% purchase tax (half rate)."
    spoken: about nine thousand nine hundred dollars
    display: "BYD Seagull (2nd gen), China, Oct 2026: from ¥65,900 ≈ $9,900 (incl. VAT; before 5% NEV purchase tax)"
    fields: {yuan_spoken: sixty-five thousand nine hundred yuan}
    source_ids: [seagull, cnevpost_seagull, h10, nevtax]
    status: source_located
    verification_note: "Price conversion is ours (H.10). Specs and charging time are company figures reported by electrive/CnEVPost."
