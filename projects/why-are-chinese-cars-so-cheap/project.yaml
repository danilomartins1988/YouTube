tts_overrides:
  openai:
    voice: ash
    instructions: >-
      Voice: the narrator of a premium business documentary with a playful edge, like a sharp investigative economics
      host. Confident, curious and warm, with a dry twinkle on the wry lines, always clear and fair on facts. Pacing: brisk and
      energetic overall, then slow down slightly to land each number and date cleanly. A short beat after a surprising figure and
      before each verdict. Natural American English, conversational, never an announcer, never salesy, never sing-song, never
