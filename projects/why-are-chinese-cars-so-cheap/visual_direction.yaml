# Visual direction for why-are-chinese-cars-so-cheap (APPLIED by the pipeline; see hiddeneco/visual_direction.py).
# Director's edit (Ep 61, owner PRIORITY brief). Tone: PREMIUM BUSINESS DOCUMENTARY WITH CARTOON ENERGY (house style of Ep 56):
# bright day scenes, original characters and sets, but the explanatory sequences carry the film. Structure: cold open (a $9,900
# EV on a showroom turntable) -> channel intro -> show title card with a typed subtitle -> six parts opened by bumpers (a generic
# car zooms through; VOLTY the battery cell's price tag drops: the running gag) -> verdict -> end card -> button.
# Device: THE FOUR SUSPECTS lineup board (efficiency, subsidies, financial engineering, cash burn), stamped at the verdict.
# Cast (original, toon rig): JUNE (American car shopper), MEI (battery-line engineer: a competent professional, never a stereotype),
# MORGAN (a Western automaker's finance chief). Real people: Wang Chuanfu (BYD) and Lei Jun (Xiaomi) only, as respectful busts.
# Bespoke sets (CartoonStage/cars.tsx): evshow, costlab, gigaline, cellplant, chainvalley, cashworks, pricestreet, carport,
# tariffgate, c61title, c61bumper. Five presenter boards: p10 cost structure, p18 subsidy experiment, p25 battery chain, p35 two
# carmakers' cash, p43 price-war squeeze.
