# Documentary (target 11-13 min). Premium animated business documentary with cartoon energy (house style of Ep 56):
# cold open (the hook) -> channel intro -> show title card -> six acts with bumpers -> payoff -> end card -> button.
# The "four suspects" (efficiency, subsidies, financial engineering, cash burn) are the narrative device; the six-act structure
# stays internal (never narrated as acts/missions). Numbers come from sources.yaml via {{placeholders}}; years are words.
# Rules: market + taxes stated for every price; company-level vs segment results separated; grants vs buyer incentives vs equity
# financing vs supplier credit separated; our calculations said "by our calculation"; EU findings attributed (China disputes).
logline: China's cheap electric cars are mostly the product of an industrial machine (LFP batteries made in-house or next door,
  clustered suppliers, fast engineering, scale) that years of buyer-focused subsidies helped build; the unsustainable part is the
  price war, which is squeezing profits and cash so hard that the cars will stay cheap while the number of carmakers shrinks.
title: Why Are Chinese Cars So Cheap — And So Advanced?
segments:
- id: co_open
  chapter: Cold open
  narration: Picture a brand-new electric car. A big touchscreen. A laser scanner on the roof for driver assistance. A battery its maker
    says charges from ten to seventy percent in five minutes. Now, the price.
  claims:
  - seagull
- id: co_hook
  chapter: Cold open
  narration: In China, the newest BYD Seagull starts at {{seagull.yuan_spoken}}. That's {{seagull}}. The average new electric car in
    America sold for {{kbb_ev}} in October.
  claims:
  - seagull
  - kbb_ev
- id: co_contra
  chapter: Cold open
  narration: Ford's electric car unit lost {{ford}} last year. Is China just better at building cars? Is the government paying? Are
    the books dressed up? Or is someone burning cash on every car?
  claims:
  - ford
- id: co_promise
  chapter: Cold open
  narration: Four suspects. To find the culprit, we'll take the car apart, follow the battery, read the cash flow, and step into a price
    war that's hurting its own winners.
  claims: []
  analysis: true
  source_note: Promise of the episode (hook rule); the four suspects are the owner's four hypotheses (efficiency, subsidies, financial
    engineering, cash burn).
- id: title_card
  chapter: Cold open
  narration: ''
  claims: []
- id: a1_card
  chapter: The impossible car
  narration: ''
  claims: []
- id: a1_fair
  chapter: The impossible car
  narration: First, a fair warning. The Seagull is a small city car, and Chinese buyers add a {{nevtax}} purchase tax this year. Its
    European cousin, the Dolphin Surf, lists in Germany at {{surf_de}}, under different taxes and tariffs.
  claims:
  - nevtax
  - surf_de
- id: a1_real
  chapter: The impossible car
  narration: But adjust for all that, and something real remains. In twenty twenty-five, the IEA found {{iea_cheaper}} of battery electric
    cars sold in China were cheaper than comparable gasoline cars. Before incentives.
  claims:
  - iea_cheaper
- id: a1_scale
  chapter: The impossible car
  narration: China now builds {{iea_prod}} electric cars on Earth. BYD alone sold {{byd_vol}} vehicles last year, and more fully electric
    cars than Tesla.
  claims:
  - iea_prod
  - byd_vol
- id: a1_draw
  chapter: The impossible car
  narration: 'Let me draw where a car''s money goes. A hypothetical twenty-five thousand dollar electric car, not any company''s numbers.
    The biggest part: the battery. At Bloomberg NEF''s average pack price last year, sixty kilowatt-hours costs {{bnef}}.'
  claims:
  - bnef
- id: a1_slices
  chapter: The impossible car
  narration: Then the motor and electronics. Screens, chips and software. Body, steel and glass. Labor and the factory. Shipping and
    the dealer. Taxes. And at the bottom, the slice the company keeps. It's thin.
  claims: []
  analysis: true
  source_note: Illustrative cost allocation (no company's data), labelled ILLUSTRATIVE on screen; only the battery slice is calculated
    (BNEF).
- id: a1_turn
  chapter: The impossible car
  narration: 'So who''s making those slices cheaper? The first suspect everyone names: the government.'
  claims: []
  analysis: true
  source_note: Transition.
- id: a2_card
  chapter: The subsidy suspect
  narration: ''
  claims: []
- id: a2_csis
  chapter: The subsidy suspect
  narration: There's evidence. The Center for Strategic and International Studies estimates Beijing spent {{csis}} backing electric
    cars from twenty oh-nine to twenty twenty-three.
  claims:
  - csis
- id: a2_where
  chapter: The subsidy suspect
  narration: 'But most of it went to buyers, not carmakers: purchase rebates and a break on the ten percent car tax. And it shrank,
    to {{csis.percar_spoken}} per car by twenty twenty-three.'
  claims:
  - csis
- id: a2_hidden
  chapter: The subsidy suspect
  narration: Some support isn't in that count, like cities buying stakes. In twenty twenty, Hefei-led investors put {{nio_hefei}} into
    NIO's Chinese business. An investment, not a gift.
  claims:
  - nio_hefei
- id: a2_grants
  chapter: The subsidy suspect
  narration: Carmakers get direct grants too. The Kiel Institute estimated {{kiel}} for BYD in twenty twenty-two. BYD's own annual report
    counts {{byd_grants}} of grants in its twenty twenty-five profit.
  claims:
  - kiel
  - byd_grants
- id: a2_draw
  chapter: The subsidy suspect
  narration: So let's run an experiment with BYD's numbers. Its grants were {{byd_grants.rev_spoken}} of revenue. On a twenty thousand
    dollar car, a sliver. But they're {{byd_grants.np_spoken}} of its profit, by our calculation. Subsidies can make a company profitable.
    They can't make a car cheap.
  claims:
  - byd_grants
- id: a2_eu
  chapter: The subsidy suspect
  narration: 'Europe judged the support unfair. Since late twenty twenty-four, Chinese-made electric cars pay extra duties on top of
    its ten percent tariff: {{eu_cvd}} more for BYD, {{eu_cvd.saic_spoken}} for SAIC. China disputes the findings.'
  claims:
  - eu_cvd
- id: a2_turn
  chapter: The subsidy suspect
  narration: If subsidies were the whole story, those duties would have closed the gap. Instead, sales of Chinese-made electric cars
    in Europe grew {{iea_prod.eu_spoken}} last year.
  claims:
  - iea_prod
- id: a3_card
  chapter: The machine
  narration: ''
  claims: []
- id: a3_battery
  chapter: The machine
  narration: So start with who builds them. Wang Chuanfu, trained in metallurgical chemistry, founded BYD in {{byd_founded}} as a battery
    company. It still makes its own, and the battery is a car's priciest part.
  claims:
  - byd_founded
- id: a3_lfp
  chapter: The machine
  narration: Chinese makers bet early on lithium iron phosphate, or L F P. It holds less energy per pound than nickel-rich batteries,
    but needs no nickel or cobalt. Last year, L F P packs averaged {{bnef.lfp_spoken}} per kilowatt-hour. Nickel packs, {{bnef.nmc_spoken}}.
  claims:
  - bnef
- id: a3_blade
  chapter: The machine
  narration: BYD's Blade battery packs long, flat cells straight in, skipping a layer of parts. Neither chemistry wins at everything.
    But for an affordable car, cheap and good enough wins.
  claims: []
  analysis: true
  source_note: Cell-to-pack design (BYD Blade) explained qualitatively; no figures. "Neither chemistry is better at everything" per
    owner brief (LFP vs NMC trade-offs).
- id: a3_chain
  chapter: The machine
  narration: 'Let me draw the battery''s journey. Minerals are mined, refined, turned into powders, made into cells, packed, and put
    in a car. Now let me shade China''s share: {{iea_batt.cam_spoken}} of the cathode powder, {{iea_batt.aam_spoken}} of the anode powder,
    {{iea_batt.cells_spoken}} of the cells. And two companies, CATL and BYD, supplied {{sne}} of the world''s car batteries.'
  claims:
  - iea_batt
  - sne
- id: a3_price
  chapter: The machine
  narration: 'The result: in twenty twenty-five, battery packs in China cost {{iea_batt}} less than in North America, and {{iea_batt.eu_spoken}}
    less than in Europe.'
  claims:
  - iea_batt
- id: a3_cluster
  chapter: The machine
  narration: And motors, chips and seats come from supplier clusters a short drive away, the ones from our film on Chinese factories.
    A problem gets fixed with a truck, not a container ship.
  claims: []
  analysis: true
  source_note: Library connection to Ep 60 (supplier clusters); qualitative.
- id: a3_speed
  chapter: The machine
  narration: Then speed. AlixPartners estimated Chinese electric carmakers develop a new model in {{alix}}, about half the time of traditional
    automakers.
  claims:
  - alix
- id: a3_xiaomi
  chapter: The machine
  narration: Speed even lets outsiders in. Phone maker Xiaomi launched its car business in twenty twenty-one, with founder Lei Jun in
    charge. Last year it delivered {{xiaomi.deliv_spoken}} cars.
  claims:
  - xiaomi
- id: a3_scale
  chapter: The machine
  narration: 'And scale. China built {{iea_prod.prod_spoken}} electric cars last year, spreading every robot and design across millions.
    That''s why one new Western factory can''t match it: it''s an ecosystem, not a building.'
  claims:
  - iea_prod
- id: a3_caution
  chapter: The machine
  narration: A giant screen isn't proof of better engineering. Features show up on day one. Safety and reliability show up years later,
    in independent testing.
  claims: []
  analysis: true
  source_note: Owner brief requirement (visible features vs independently validated performance); no claim about any model's safety.
- id: a4_card
  chapter: Follow the cash
  narration: ''
  claims: []
- id: a4_byd
  chapter: Follow the cash
  narration: Are the companies making money? BYD is. Last year it earned {{byd_fy.np_spoken}} on revenue of {{byd_fy}}, though profit
    fell {{byd_fy.chg_spoken}} as prices dropped. Its car business made {{byd_seg}} before tax. That's {{byd_seg.percar_spoken}} a vehicle,
    by our rough math.
  claims:
  - byd_fy
  - byd_seg
- id: a4_machine
  chapter: Follow the cash
  narration: 'But profit isn''t cash. Here''s the machine. Revenue pours in. Subtract parts and workers: gross profit. Subtract research
    and marketing: operating profit. Then timing, when customers pay and when suppliers get paid. Subtract new factories, and you''re
    left with free cash flow.'
  claims: []
  analysis: true
  source_note: Definitions (revenue, gross profit, operating profit, operating cash flow, capital spending, free cash flow); no figures.
- id: a4_draw
  chapter: Follow the cash
  narration: Take two hypothetical carmakers with the same profit. A pays suppliers in two months. B takes six, sitting on its suppliers'
    money, interest free. On paper, identical. In the bank, B looks richer. Until it has to pay up.
  claims: []
  analysis: true
  source_note: Hypothetical comparison, labelled HYPOTHETICAL on screen; no real company's data.
- id: a4_pledge
  chapter: Follow the cash
  narration: In China, that wasn't hypothetical. In June twenty twenty-five, after suppliers complained, {{pledge}} major carmakers,
    BYD among them, promised to pay within sixty days.
  claims:
  - pledge
- id: a4_unwind
  chapter: Follow the cash
  narration: 'Watch BYD''s cash. What it owed suppliers fell by {{byd_cash.pay_spoken}}. Cash from operations dropped from {{byd_cash.ocf24_spoken}}
    to {{byd_cash.ocf25_spoken}}. It spent {{byd_cash.capex_spoken}} on factories and equipment, and borrowed more. Free cash flow,
    by our calculation: minus {{byd_cash}}. Profitable, and burning cash.'
  claims:
  - byd_cash
- id: a4_others
  chapter: Follow the cash
  narration: Xiaomi's car business lost {{xiaomi.loss_spoken}} in twenty twenty-four, then made its first operating profit last year,
    {{xiaomi}}. But its average car sold for about {{xiaomi.asp_spoken}}. Not every Chinese car is cheap.
  claims:
  - xiaomi
- id: a4_nio
  chapter: Follow the cash
  narration: NIO lost {{nio}} last year, after years of losses, then posted its first quarterly operating profit. A low price isn't
    a loss. And one good quarter isn't a lasting business.
  claims:
  - nio
- id: a5_card
  chapter: The price war
  narration: ''
  claims: []
- id: a5_glut
  chapter: The price war
  narration: Last year China built {{iea_prod.over_spoken}} more electric cars than its own drivers bought. Make more than the market
    wants, and prices fall.
  claims:
  - iea_prod
- id: a5_margin
  chapter: The price war
  narration: And they did. China's auto industry kept just {{nbs}} of sales as profit in twenty twenty-five, a record low. In the first
    half of this year, {{nbs.h1_spoken}}, with profits down {{nbs.drop_spoken}}.
  claims:
  - nbs
- id: a5_draw
  chapter: The price war
  narration: Here's how a price war squeezes. This line is the price. This one, the cost. The gap is the margin. One company cuts. Rivals
    follow. Costs fall too, but slower. The gap shrinks. The strongest survive on thin margins. The weakest can't.
  claims: []
  analysis: true
  source_note: Illustrative margin-compression diagram (no real data), labelled ILLUSTRATIVE.
- id: a5_fail
  chapter: The price war
  narration: Some couldn't. WM Motor went into bankruptcy restructuring in twenty twenty-three. Hozon, maker of Neta cars, followed
    in {{failures}}. Price wars help buyers. They bury weaker companies.
  claims:
  - failures
- id: a5_export
  chapter: The price war
  narration: So carmakers looked abroad. Electric car exports doubled to {{iea_prod.exp_spoken}} in twenty twenty-five, running more
    than {{iea_prod.inv_spoken}} ahead of overseas sales.
  claims:
  - iea_prod
- id: a5_walls
  chapter: The price war
  narration: And walls went up. America set a {{us301}} tariff on Chinese electric cars in twenty twenty-four, and bans Chinese connected-car
    software from twenty twenty-seven models. Europe now offers minimum-price deals instead of duties.
  claims:
  - us301
  - eu_cvd
- id: a5_abroad
  chapter: The price war
  narration: 'So Chinese makers build abroad, {{iea_overseas}} cars a year of capacity so far. Every government faces the trade-off:
    tariffs protect jobs, and keep cheaper cars from drivers.'
  claims:
  - iea_overseas
- id: a6_card
  chapter: The verdict
  narration: ''
  claims: []
- id: a6_eff
  chapter: The verdict
  narration: 'So, our four suspects. Efficiency: guilty, and the main reason. Cheap batteries, suppliers next door, fast engineering
    and huge scale are structural.'
  claims: []
  analysis: true
  source_note: Verdict synthesised from Acts 2-3.
- id: a6_sub
  chapter: The verdict
  narration: 'Subsidies: an accomplice. Years of support, mostly to buyers, built the industry. Today it matters more to profit than
    to price.'
  claims:
  - byd_grants
  - csis
- id: a6_fin
  chapter: The verdict
  narration: 'Financial engineering: real, and being unwound. Paying suppliers late was a cheap loan.'
  claims:
  - pledge
  - byd_cash
- id: a6_burn
  chapter: The verdict
  narration: 'Cash burn: depends who. BYD is profitable but spent more cash than it made. NIO lost money for years. The price war is
    pushing the weakest out.'
  claims:
  - byd_cash
  - nio
- id: payoff
  chapter: The verdict
  narration: So here's the answer. The cheap Chinese car is real. It comes from a machine the West can't copy with one factory, or block
    forever with one tariff. What isn't real yet is the profit behind every one. Expect the cars to stay cheap. And expect fewer companies
    making them.
  claims: []
  analysis: true
  source_note: Conclusion drawn from the sourced facts above (no new figures).
- id: teaser
  chapter: The verdict
  narration: Next time, we follow the money behind another hidden link of the world economy. This is The Hidden Economics.
  claims: []
  analysis: true
  source_note: Generic closing teaser (channel rule).
- id: button
  chapter: The verdict
  narration: ''
  claims: []
