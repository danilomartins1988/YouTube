# Sources and claims for "How Car Dealerships Really Make Money" (Episode 34, US batch #07).
# Every claim was read on its primary page or filing on 2026-11-10 (notes: docs/episodes/34-car-dealers/RESEARCH_NOTES.md).
# Status stays source_located until a named human reviewer signs off. US dollars as published.
# RULES: the profit mix is ONE large public dealer group (AutoNation FY2025 10-K), said as such, not "all dealers"; shares,
# margins and ratios are OUR calculation; the CFPB 2013 bulletin was disapproved by Congress in 2018 (said); Experian loan figures
# are as printed in NADA's report; NY Fed is Q2 2026 (Q3 due Nov 10). No logos or real dealership/brand designs; names in text only.
