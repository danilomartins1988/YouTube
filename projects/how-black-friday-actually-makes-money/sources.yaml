claims:
  - id: police
    text: "Inquirer (2011), citing Bonnie Taylor-Blake's report to the American Dialect Society: a 1961 Public Relations News article said 'in Philadelphia, it became customary for officers to refer to the post-Thanksgiving days as Black Friday and Black Saturday'; the term referred to traffic problems. History.com: Philadelphia police used the term in the 1950s/60s for the chaos the day after Thanksgiving; merchants 'tried unsuccessfully to change it to Big Friday'."
    spoken: nineteen sixty-one
    display: "1961: Philadelphia police called it 'Black Friday' (Public Relations News, via Inquirer)"
    fields: {}
    source_ids: [inq, hist]
    status: source_located
  - id: myth
    text: "History.com: the 'in the black' explanation is 'officially sanctioned—but inaccurate'; 'Sometime in the late 1980s, however, retailers found a way to reinvent Black Friday' as the day stores went from red to black."
    spoken: the late nineteen-eighties
    display: "'In the black' story: late 1980s reinvention (History.com)"
    fields: {}
    source_ids: [hist]
    status: source_located
  - id: adobe_bf
    text: "Adobe (Jan 7, 2026): Black Friday 2025 U.S. online spending $11.8 billion, up 9.1% YoY; Thanksgiving $6.4bn; Cyber Monday $14.25bn up 7.1% (biggest e-commerce day of the season and year); Cyber Week (Thanksgiving-Cyber Monday) $44.2bn up 7.7%; season Nov 1-Dec 31 $257.8bn up 6.8%; 56.4% of online transactions on smartphones."
    spoken: eleven point eight billion dollars
    display: "Black Friday 2025 online: $11.8bn (+9.1%, Adobe)"
    fields: {growth_spoken: nine percent, cm_spoken: fourteen point two five billion dollars, cw_spoken: forty-four point two billion dollars, season_spoken: two hundred and fifty-eight billion dollars}
    source_ids: [adobe_jan, adobe_cm]
    status: source_located
  - id: adobe_disc
    text: "Adobe (Jan 7, 2026): 2025 season discounts peaked at 30.9% off listed price in electronics (30.1% in 2024), toys 29.6%, apparel 25.1%, televisions 24.3%, computers 23.4%."
    spoken: thirty-one percent
    display: "Peak discounts off listed price, 2025: electronics 30.9%, toys 29.6%, TVs 24.3% (Adobe)"
    fields: {toys_spoken: thirty percent, tv_spoken: twenty-four percent}
    source_ids: [adobe_jan]
    status: source_located
    verification_note: Adobe's Sep 2026 forecast quotes the 2025 electronics peak as 30.1%; we use the January 2026 final release (30.9%) and round ("about thirty-one percent").
  - id: adobe_aff
    text: "Adobe (Jan 7, 2026): 'affiliates and partners', which includes social media influencers, revenue share 20.4% of the 2025 holiday season, up 15.9% YoY; social media 4.6% share."
    spoken: about a fifth
    display: "Affiliates & partners: 20.4% of online holiday revenue (Adobe)"
    fields: {}
    source_ids: [adobe_jan]
    status: source_located
  - id: adobe26
    text: "Adobe forecast (Sep 28, 2026): Black Friday 2026 $12.9bn online (up 9.2%), Cyber Monday $15.1bn (up 6.2%), Cyber Week $47.5bn, season $275.1bn (up 6.7%), BNPL $21.3bn."
    spoken: twelve point nine billion dollars
    display: "2026 FORECAST: Black Friday $12.9bn online (Adobe)"
    fields: {}
    source_ids: [adobe_fc]
    status: source_located
    verification_note: Forecast, not a result; labelled FORECAST on screen and in narration.
  - id: bnpl
    text: "Adobe (Jan 7, 2026): Buy Now Pay Later contributed $20 billion in online spend in the 2025 season, up 9.8% YoY; Cyber Monday was the biggest BNPL day on record, $1.03bn (up 4.2%)."
    spoken: twenty billion dollars
    display: "BNPL, holiday 2025: $20bn online (+9.8%, Adobe)"
    fields: {cm_spoken: one billion dollars}
    source_ids: [adobe_jan, adobe_cm]
    status: source_located
  - id: nrf
    text: "NRF (Dec 2, 2025): 'A record 202.9 million consumers shopped during the five-day holiday weekend' (Thanksgiving Day through Cyber Monday); 129.5M in stores, 134.9M online; Black Friday 80.3M in-store and 85.7M online. Survey of 3,099 adults, Nov 26-30, ±1.8 points."
    spoken: two hundred and three million
    display: "Thanksgiving-Cyber Monday 2025: 202.9M shoppers (NRF survey)"
    fields: {bfstore_spoken: eighty million people, bfonline_spoken: eighty-six million}
    source_ids: [nrf_wk]
    status: source_located
  - id: census
    text: "Census Bureau, Q4 2025: not seasonally adjusted e-commerce $365.2 billion = 18.3% of total retail sales (adjusted: 16.6%); 2025 e-commerce $1,233.7bn = 16.4% of retail."
    spoken: eighteen point three percent
    display: "Q4 2025: e-commerce = 18.3% of U.S. retail sales (Census, not seas. adj.)"
    fields: {}
    source_ids: [census]
    status: source_located
  - id: bby
    text: "Best Buy fiscal 2026 (ended Jan 31, 2026): revenue $41,691M; Q4 (13 weeks) $13,814M; Q4 gross profit 20.9% vs 22.5% for FY; operating income Q4 $721M vs FY $1,389M (GAAP). Q4 share of revenue 33.1%, of operating income 51.9%, average of Q1-Q3 revenue $9,292M: OUR calculations. 10-K: 'A large proportion of our revenue and earnings is generated in the fiscal fourth quarter, which includes the majority of the holiday shopping season.'"
    spoken: forty-one point seven billion dollars
    display: "Best Buy FY2026: Q4 $13.8bn of $41.7bn revenue (≈ 33%, our calc.)"
    fields: {q4_spoken: thirteen point eight billion dollars, gmq4_spoken: twenty point nine percent, gmfy_spoken: twenty-two point five percent, avg_spoken: nine point three billion dollars}
    source_ids: [bbyq4, bby10k]
    status: source_located
    verification_note: GAAP operating income includes fiscal 2026 impairment and restructuring charges (Q4 restructuring was a $28M credit); share of operating income said only as 'about half'.
  - id: vendor
    text: "Best Buy 10-K: inventory management includes 'agreements with vendors relating to reimbursement for the cost of markdowns or sales incentives'; vendor allowances for purchases, sales volumes, advertising and placement reduce cost of sales. Target 10-K: vendor income 'principally earned as a result of volume rebates, promotions, certain advertising activities, and markdown allowances'."
    spoken: markdown allowances
    display: "Vendors reimburse markdowns (Best Buy 10-K) · 'markdown allowances' (Target 10-K)"
    fields: {}
    source_ids: [bby10k, tgt10k]
    status: source_located
  - id: target
    text: "Target 10-K: 'A larger share of annual net sales are traditionally earned during the fourth quarter because it includes the November and December holiday sales period.' 'Because of the seasonal nature of the retail business, employment levels peak in the holiday season.' Roundel: in-house retail media network selling advertising primarily to merchandise vendors."
    spoken: the fourth quarter
    display: "Target: larger share of sales in Q4; staffing peaks in the holidays (10-K)"
    fields: {}
    source_ids: [tgt10k]
    status: source_located
  - id: warranty
    text: "Kellogg Insight (2019) on Abito & Salant (Review of Economic Studies, 2018): extended warranties averaged 24 percent of a product's price across electronics; using TV failure rates (5-8%), 'profit margins can be as high as 62 to 73 percent'."
    spoken: sixty-two to seventy-three percent
    display: "TV extended warranties: margins up to 62-73% (Abito & Salant, academic estimate)"
    fields: {avg_spoken: twenty-four percent}
    source_ids: [kellogg]
    status: source_located
    verification_note: Academic estimate for the market and years studied; said as 'as high as'.
  - id: cr
    text: "Consumer Reports (2018): 'low-priced TVs made specifically for Black Friday and often available through a single retailer'; 'derivatives' are similar to regular models 'but with different model numbers and often fewer features', e.g. fewer HDMI inputs; a 2017 55-inch derivative CR tested 'was about $170 cheaper than the TV it was based on' and 'performed equally well'; single-retailer sets can't be price-matched."
    spoken: one hundred and seventy dollars
    display: "One derivative CR tested: ≈ $170 cheaper, performed equally well (CR 2018)"
    fields: {}
    source_ids: [cr]
    status: source_located
  - id: fed
    text: "Federal Reserve (Dec 2025), 2023 data: interchange fees on all debit and general-use prepaid transactions totaled $34.12 billion; 100.7 billion transactions worth $4.7 trillion; average interchange fee for covered (Reg II-capped) transactions $0.24 single-message / $0.22 dual-message; exempt transactions $0.52; network fees $12.95 billion."
    spoken: thirty-four billion dollars
    display: "Debit & prepaid interchange, 2023: $34.12bn (Federal Reserve)"
    fields: {cov_spoken: twenty-two to twenty-four cents, ex_spoken: fifty-two cents, net_spoken: almost thirteen billion dollars}
