# Sources and claims for "How Black Friday Actually Makes Money" (Episode 56, owner request 2026-11-15).
# Every claim was read on its primary page on 2026-11-15 (notes: docs/episodes/56-black-friday/RESEARCH_NOTES.md).
# Status stays source_located until a named human reviewer signs off. US dollars only.
# RULES: Adobe figures are Adobe Analytics measurements of U.S. online spending (2025 = results; 2026 = FORECAST, say so);
# NRF weekend counts are survey estimates (Prosper Insights, 3,099 adults); Best Buy shares of revenue / operating income
# are OUR calculations from its filings (fiscal year ended Jan 31, 2026: always "fiscal"); the Which? study is UK-only
# (2023 deals) and is said so; warranty margins are an academic estimate (Abito & Salant) for the market they studied;
# loss-leader / basket / clearance explanations are analysis, not figures. No brand logos drawn; no real person drawn.
