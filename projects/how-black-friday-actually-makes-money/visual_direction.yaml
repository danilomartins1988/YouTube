requirements:
- No store, card network, BNPL, platform or TV-maker logos, names on signage, or trademarked art; stores are generic
- No character, design, name, catchphrase, ship, location, title text or music borrowed from any existing show
- Jokes never change a number; our calculations, forecasts and the UK-only study labelled on screen
- Day scenes, many generic human characters; no real person drawn
