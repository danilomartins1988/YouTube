# Visual direction for how-black-friday-actually-makes-money (APPLIED by the pipeline; see hiddeneco/visual_direction.py).
# Director's edit (Ep 56). OWNER DIRECTION: feel like an actual episode of a prime-time animated TV sitcom ("extremely
# animated, really looking like the TV cartoon"). Genre level only: every character, design, name, title card, caption and
# sound is original. Craft: cold open gag -> channel intro (the "theme") -> show title card with a joke subtitle -> five
# acts, each opened by a quick bumper with a changing joke caption (running gag) -> button joke after the end card.
# Recurring cast (original): GLORIA (frazzled store manager, headset, clipboard), DASH (over-caffeinated deal-hunter,
# thermos, sneakers), TAGBOT (a deadpan price-tag printer robot on one wheel; its printed tags are the running gag:
# "WAS $999" anchors that grow every act), BUZZ (delivery drone), LIFT (warehouse forklift with headlight eyes).
# Bespoke sets (all new in CartoonStage, day scenes): megamall (retro-futurist mega-mall at dawn, 5 a.m.), philly61
# (1961 downtown traffic jam, sepia), tvfactory (the "derivative" doorbuster factory), quarterhq (calendar tower where Q4
# is a giant floor), payrails (payment-rails highway with card trucks and toll gantries), bnplride (installment carousel),
# adarena (ad-auction arena inside a phone), returnsmtn (returns mountain behind the warehouse).
