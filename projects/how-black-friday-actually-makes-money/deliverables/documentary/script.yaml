# Documentary (target 11-13 min), built like an episode of a prime-time animated sitcom: cold open, channel intro
# (our "theme"), a show title card, five acts with bumpers, a button joke. The five parts stay an INTERNAL structure
# (never narrated as missions). Numbers come from sources.yaml via {{placeholders}}; years are spoken as words.
# Rules: Adobe 2025 = measured results, 2026 = forecast (said); Best Buy shares are our calculations; the Which? study is
# UK-only (said); warranty margins are an academic estimate (said "as high as"); jokes never change a number.
logline: Black Friday is a day of planned losses. Doorbusters bring the crowd; carts, protection plans, supplier markdown money
  and a record holiday quarter bring the profit, while card networks, pay-later lenders and ad sellers take a cut either way.
title: How Black Friday Actually Makes Money
segments:
- id: co_open
  chapter: Cold open
  narration: Five in the morning, the day after Thanksgiving. A crowd has been waiting outside in the cold for a television
    priced so low it looks like a typo. The doors open, and the store starts losing money. On purpose.
  claims: []
  analysis: true
  source_note: Cold-open scene (illustrative, no figures); doorbuster logic explained and sourced later.
- id: co_hook
  chapter: Cold open
  narration: And yet, last year, Americans spent {{adobe_bf}} online on Black Friday alone, a record, according to Adobe.
    Retailers plan their whole year around this weekend. So how does a day built on discounts actually make money?
  claims:
  - adobe_bf
- id: co_promise
  chapter: Cold open
  narration: Let's follow the money. The deal that loses, the cable that wins, the quarter that pays for the year, and everyone
    who quietly takes a cut.
  claims: []
  analysis: true
  source_note: Promise of the episode (hook rule).
- id: title_card
  chapter: Cold open
  narration: ''
  claims: []
- id: a1_card
  chapter: Why it's called Black Friday
  narration: ''
  claims: []
- id: a1_police
  chapter: Why it's called Black Friday
  narration: First, the name. It has nothing to do with profit. In {{police}}, a public relations newsletter reported that
    police officers in Philadelphia called the days after Thanksgiving Black Friday and Black Saturday. For them, it meant
    jammed streets, packed sidewalks and long shifts.
  claims:
  - police
- id: a1_big
  chapter: Why it's called Black Friday
  narration: Downtown merchants hated the name. According to History dot com, they tried to rebrand it as Big Friday. It
    didn't stick.
  claims:
  - police
- id: a1_myth
  chapter: Why it's called Black Friday
  narration: Then, in {{myth}}, retailers found a happier story. This is the day stores finally move from red ink to black
    ink, from loss to profit. It's a great story. But it's a reinvention. The police came first.
  claims:
  - myth
- id: a1_turn
  chapter: Why it's called Black Friday
  narration: Still, the myth points at a real question. How does a store make money on a day of discounts?
  claims: []
  analysis: true
  source_note: Transition.
- id: a2_card
  chapter: The doorbuster trick
  narration: ''
  claims: []
- id: a2_door
  chapter: The doorbuster trick
  narration: Start with the doorbuster. It's a small batch of products priced so low that the store may earn little or nothing
    on them. Sometimes less than nothing. Economists call it a loss leader. Its job isn't profit. Its job is to get you through
    the door.
  claims: []
  analysis: true
  source_note: Definition of a loss leader / doorbuster (standard retail economics); no figures.
- id: a2_basket
  chapter: The doorbuster trick
  narration: Because once you're inside, you rarely buy just one thing. You came for the television. You leave with a wall mount,
    a cable, a soundbar, and a cart full of things that were never the headline deal.
  claims: []
  analysis: true
  source_note: Illustration of basket building (attach sales); no figures.
- id: a2_plan
  chapter: The doorbuster trick
  narration: Then comes the most profitable question in retail. Would you like the protection plan? Economists Jose Miguel Abito
    and Yuval Salant studied extended warranties, which averaged about {{warranty.avg_spoken}} of a product's price. Using failure
    rates for televisions, they estimated profit margins as high as {{warranty}}.
  claims:
  - warranty
- id: a2_draw
  chapter: The doorbuster trick
  narration: Let me draw the trade. Box one is the doorbuster, with a thin margin, or a negative one. Box two is everything
    else in the cart. The add-ons, the plan, the full-price items. The arrow between them is foot traffic. The loss on box one
    is simply the price of a visitor.
  claims: []
  analysis: true
  source_note: Simplified loss-leader diagram (analysis, no figures).
- id: a2_deriv
  chapter: The doorbuster trick
  narration: Some deals are built for the day itself. Consumer Reports has described low-priced TVs made specifically for Black
    Friday, often sold by a single retailer. The industry calls them derivatives. They're similar to regular models, but with
    different model numbers and often fewer features, like fewer HDMI inputs.
  claims:
  - cr
- id: a2_deriv2
  chapter: The doorbuster trick
  narration: To be fair, one derivative that Consumer Reports tested cost about {{cr}} less than the model it was based on,
    and performed just as well. The catch is comparison. If only one store sells that model number, you can't easily check the
    price anywhere else.
  claims:
  - cr
- id: a2_vendor
  chapter: The doorbuster trick
  narration: And the store doesn't always pay for the discount. Best Buy's annual report describes agreements with vendors for
    reimbursement of the cost of markdowns. Target lists {{vendor}} among the money it collects from suppliers. Part of your
    price cut is quietly paid by the brand.
  claims:
  - vendor
- id: a2_clear
  chapter: The doorbuster trick
  narration: Black Friday also empties the warehouse. Stock that sits loses value. Moving it before the new year turns boxes
    back into cash.
  claims: []
  analysis: true
  source_note: Inventory clearance logic (analysis); Target 10-K notes planning seasonal inventory to minimize markdowns.
- id: a3_card
  chapter: The quarter that pays for the year
  narration: ''
  claims: []
- id: a3_quarter
  chapter: The quarter that pays for the year
  narration: Now zoom out to the calendar. Best Buy's fiscal fourth quarter, which covers the holidays, is thirteen weeks out
    of fifty-two. In fiscal twenty twenty-six, it brought in {{bby.q4_spoken}} of revenue, out of {{bby}} for the whole year.
    That's about a third of the money in a quarter of the time, by our calculation.
  claims:
  - bby
- id: a3_margin
  chapter: The quarter that pays for the year
  narration: But look at the margin. In that holiday quarter, Best Buy's gross margin was {{bby.gmq4_spoken}}, versus {{bby.gmfy_spoken}}
    for the full year. Discounts shave the percentage. Volume brings back the dollars. Operating income in that one quarter
    was about half of the year's total, again our calculation.
  claims:
  - bby
- id: a3_draw
  chapter: The quarter that pays for the year
  narration: Let me chart it. The other three quarters averaged about {{bby.avg_spoken}} in revenue each. The holiday quarter
    brought in {{bby.q4_spoken}}. That tall bar is the season retailers stock up and staff up for. Target's annual report
    says the same thing. A larger share of its sales comes in the fourth quarter, and its staffing peaks in the holidays.
  claims:
  - bby
  - target
- id: a3_crowd
  chapter: The quarter that pays for the year
  narration: So where does all that shopping happen? Over the five days from Thanksgiving to Cyber Monday last year, the National
    Retail Federation counted a record {{nrf}} shoppers in its survey. On Black Friday itself, about {{nrf.bfstore_spoken}}
    shopped in stores, and about {{nrf.bfonline_spoken}} shopped online.
  claims:
  - nrf
- id: a3_online
  chapter: The quarter that pays for the year
  narration: Online, Adobe measured {{adobe_bf}} on Black Friday, up {{adobe_bf.growth_spoken}}, and {{adobe_bf.cm_spoken}}
    on Cyber Monday, the biggest online day of the year. The five days of Cyber Week reached {{adobe_bf.cw_spoken}}, and more
    than half of online holiday purchases were made on phones.
  claims:
  - adobe_bf
- id: a3_stores
  chapter: The quarter that pays for the year
  narration: But here's the twist. Even in that holiday quarter, the Census Bureau says e-commerce was only {{census}} of U.S.
    retail sales. More than four out of every five retail dollars were still spent offline. The stampede is real. It just shares
    the stage.
  claims:
  - census
- id: a3_next
  chapter: The quarter that pays for the year
  narration: And this year, Adobe forecasts {{adobe26}} online on Black Friday. That's a forecast, not a result.
  claims:
  - adobe26
- id: a4_card
  chapter: Everyone takes a cut
  narration: ''
  claims: []
- id: a4_cards
  chapter: Everyone takes a cut
  narration: Every swipe pays a toll. When you pay with a debit card, the store pays an interchange fee to the bank that issued
    it. The Federal Reserve counted {{fed}} of debit and prepaid interchange fees in twenty twenty-three. For big banks, the fee
    is capped, and averaged about {{fed.cov_spoken}} per purchase. For smaller, exempt banks, about {{fed.ex_spoken}}.
  claims:
  - fed
- id: a4_net
  chapter: Everyone takes a cut
  narration: On top of that, the card networks collected {{fed.net_spoken}} in network fees on those debit and prepaid cards.
    And credit cards aren't covered by that cap at all. On a record weekend, every lane on the payment highway has a toll booth.
  claims:
  - fed
- id: a4_bnpl
  chapter: Everyone takes a cut
  narration: Then there's buy now, pay later. Split the price into installments, often with no interest for the shopper. Adobe
    says it drove {{bnpl}} of online spending last holiday season, and on Cyber Monday alone it crossed {{bnpl.cm_spoken}}.
  claims:
  - bnpl
- id: a4_fee
  chapter: Everyone takes a cut
  narration: So who pays for the free ride? Often, the merchant. In a Consumer Financial Protection Bureau study of five lenders,
    merchant fees averaged {{cfpb}} of sales volume in twenty twenty-one. The lenders sell stores on bigger baskets.
  claims:
  - cfpb
- id: a4_draw
  chapter: Everyone takes a cut
  narration: Let me draw one purchase. The shopper pays the store. From the store, one slice goes to the bank that issued the
    card, one to the card network, and, if you split the payment, one to the lender. And before you ever clicked, someone was
    paid to show you the ad.
  claims: []
  analysis: true
  source_note: Simplified money-flow diagram (no figures), built from the Fed and CFPB descriptions.
- id: a4_ads
  chapter: Everyone takes a cut
  narration: That last slice is getting huge. Retailers now sell ads on their own sites and apps to the brands they stock.
    Amazon earned {{amzn}} from advertising services in twenty twenty-five. Best Buy and Target run their own retail media
    networks too.
  claims:
  - amzn
  - target
- id: a4_aff
  chapter: Everyone takes a cut
  narration: And Adobe found that affiliates and partners, influencers included, drove {{adobe_aff}} of online holiday revenue.
    On Black Friday, the first deal you see may be the one somebody paid to put there.
  claims:
  - adobe_aff
- id: a5_card
  chapter: The hangover
  narration: ''
  claims: []
- id: a5_returns
  chapter: The hangover
  narration: Then comes January. Retailers surveyed by the National Retail Federation and Happy Returns expected {{nrf_ret}}
    of holiday sales to come back. For all of twenty twenty-five, they estimated returns of {{nrf_ret.total_spoken}}, about
    {{nrf_ret.rate_spoken}} of sales. And they believed about {{nrf_ret.fraud_spoken}} of returns were fraudulent.
  claims:
  - nrf_ret
- id: a5_mountain
  chapter: The hangover
  narration: Every return has to be shipped back, checked, repacked or sold off cheap. Online orders come back more often, about
    {{nrf_ret.online_spoken}} of online sales by the same estimate. Part of the holiday profit leaks out the back door.
  claims:
  - nrf_ret
- id: a5_real
  chapter: The hangover
  narration: And are the deals even real? In Britain, the consumer group Which tracked {{which.n_spoken}} Black Friday deals
    from twenty twenty-three. {{which}} of them were the same price or cheaper at other times of the year. That's one study,
    in one country. But the lesson travels.
  claims:
  - which
- id: a5_draw
  chapter: The hangover
  narration: Let me draw how that happens. Here's one price over a year. It sits high for a while. That's the reference price.
    Then it drops for Black Friday, and the tag shouts a big percentage off the high. But look. It was this low in the summer
    too. The discount is real against the tag. Not always against the year.
  claims: []
  analysis: true
  source_note: Illustrative price-history line (no real product, no figures), labelled ILLUSTRATIVE on screen.
- id: a5_adobe
  chapter: The hangover
  narration: Real discounts do exist. Adobe, which tracks online prices, measured peak discounts of about {{adobe_disc}} off
    listed prices on electronics last season, and about {{adobe_disc.toys_spoken}} on toys. The trick is knowing what the listed
    price was.
  claims:
  - adobe_disc
- id: payoff
  chapter: The bill
  narration: So how does Black Friday actually make money? Not on the doorbuster. On the visit. The cart around the deal, the
    plan at the register, the supplier who chips in for the markdown, and the one quarter that carries the year. And a whole
    crowd of card networks, lenders and ad sellers gets paid whether your deal was great or not.
  claims: []
  analysis: true
  source_note: Conclusion drawn from the sourced facts above.
- id: teaser
  chapter: The bill
  narration: Next time, we follow the money behind another hidden link of the world economy. This is The Hidden Economics.
  claims: []
  analysis: true
  source_note: Generic closing teaser (channel rule).
