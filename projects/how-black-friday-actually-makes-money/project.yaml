title: "How Black Friday Actually Makes Money"
slug: how-black-friday-actually-makes-money
language: en
# Episode 56 (owner request, 2026-11-15; post Nov 20-23, 2026; Black Friday is Nov 27, 2026).
# Owner creative direction: feel like an actual episode of a prime-time animated TV sitcom (genre level only: all
# characters, designs, names, title card text and music are original). Visual direction: visual_direction.yaml.
# Five-part structure internal only. Money: US dollars only. Best Buy/Target fiscal years end Jan 31: say "fiscal".
renderer: remotion
remotion_geo: [world]
style:
  name: cartoon-day
  palette:
    bg: "#FFF4DE"
    bg2: "#FFFBF2"
    ink: "#1B2433"
    muted: "#6B7385"
    land: "#9CCB7A"
    border: "#2E4A66"
    accent: "#FFC93C"
    accent2: "#2F6FD1"
    accent3: "#2E9E5B"
    risk: "#E53950"
  fonts:
    display: InterDisplay-Bold
    heading: InterDisplay-SemiBold
    body: Inter-Regular
    body_bold: Inter-SemiBold
  web_fonts:
    display: "Inter Display, Inter, sans-serif"
    body: "Inter, sans-serif"
  transition: scan
  background: grid
  motifs: [chapter-tags]
budget:
  max_paid_usd: 1.00
presenter_min: 4
# TV structure: cold open (hook) -> channel intro (the "theme") -> show title card -> acts.
intro:
  after_segment: co_promise
# Channel voice stays "ash"; livelier comedic-documentary delivery for this sitcom-style episode.
tts_overrides:
  openai:
    voice: ash
    instructions: >-
      Voice: the narrator of a smart prime-time animated comedy who is also a sharp economics documentarian. Warm, wry
      and lively, with a playful twinkle on the jokes and dry deadpan on the punchlines, but always clear and credible on
      facts. Pacing: brisk and energetic in the comic beats, then slow down noticeably and land every number cleanly. Take
      a short beat before a punchline and after a surprising figure. Natural American English, conversational, never an
      announcer, never salesy, never sing-song.
