claims:
  - id: volume
    text: "Visa 10-K FY2026: 'During fiscal 2026, 355 billion payments and cash transactions with Visa's brand were processed by Visa or other networks, equating to an average of 973 million transactions per day. Of the 355 billion total transactions, 281 billion were processed by Visa.' 'Visa's total payments and cash volume was $18 trillion' ... 'over 5 billion payment credentials' ... 'more than 400 million seller locations' (includes an internal estimate of indirect acceptance). Mastercard 10-K FY2025: gross dollar volume $10.6T; switched transactions 175.5B; cards 1,083M consumer credit, 2,134M debit/prepaid, 174M commercial (≈ 3.4bn, our sum)."
    spoken: three hundred and fifty-five billion
    display: "Visa: 355bn transactions in FY2026"
    fields: {day_spoken: nine hundred and seventy-three million, vol_spoken: eighteen trillion dollars, ma_spoken: ten point six trillion dollars, cards_spoken: five billion}
    source_ids: [visak, mak]
    status: source_located
    verification_note: Visa-brand transactions include some processed by other networks (said 'with its name on them').

  - id: origins
    text: "Fed History: 'The origins of the Visa network, for example, trace to 1958 when Bank of America launched BankAmericard in California.' 'Bank of America began licensing the credit card to other banks in the U.S. and abroad in 1966.' 'The MasterCard network began in 1966 under the name Interbank, a cooperative formed by several banks in New York.' 'BankAmericard was spun off into its own company in 1970 and rebranded as Visa in 1976.' MasterCard S-4 (2001): 'In 1969, ICA acquired exclusive rights to the \"MasterCharge\" name.' Visa S-4/A: 'In 1970, Bank of America transferred ownership of the BankAmericard program to the financial institutions that issued the card'; before the IPO Visa U.S.A. was 'owned by certain of its approximately 14,000 customer financial institutions.' Visa (Dee Hock memorial): he 'gathered a hand-picked group of bankers to a hotel in Sausalito in 1969'; for the 1976 name he 'turned to his internal team, via a contest, to surface Visa.'"
    spoken: nineteen fifty-eight
    display: "BankAmericard 1958; Interbank 1966; Visa name 1976"
    fields: {members_spoken: about fourteen thousand}
    source_ids: [fedhist, visas4, mas4, hock]
    status: source_located
    verification_note: Visa's S-4/A dates the legal/brand switch to 1977; we say the name was chosen in 1976.

  - id: ipo
    text: "MasterCard 424B4 (May 24, 2006): 61,520,912 shares at $39.00, total $2,399,315,568; 'We intend to use all but $650 million of our net proceeds ... to redeem shares of Class B common stock from our existing stockholders.' Visa (Mar 18, 2008): 406,000,000 shares at $44; net proceeds approximately $17.3 billion; trading on NYSE from March 19, 2008; with over-allotment net proceeds approximately $19.1 billion. Visa: 'in 2008, the company went public in one of the largest IPOs in history.' Gross 406M × $44 ≈ $17.9bn (our calc)."
    spoken: two point four billion dollars
    display: "IPOs: Mastercard 2006 ($2.4bn), Visa 2008 (~$17.9bn)"
    fields: {visa_spoken: about seventeen point nine billion dollars}
    source_ids: [maipo, visaipo]
    status: source_located
    verification_note: Visa gross is our multiplication; 'one of the largest IPOs in history' is Visa's wording.

  - id: network
    text: "Ohio v. American Express (2018): credit-card networks are 'a special type of two-sided platform known as a \"transaction\" platform'; 'two-sided platforms exhibit \"indirect network effects,\" which exist where the value of the platform to one group depends on how many members of another group participate'; 'Visa and MasterCard began as bank cooperatives and thus almost every bank that offers credit cards is in the Visa or MasterCard network'; 'the vast majority of Amex cardholders have a Visa or MasterCard, but only a small number of Visa and MasterCard cardholders have an Amex.' Visa 10-K table (calendar 2025, competitors from The Nilson Report): payments volume Visa $14,567B, Mastercard $8,812B, Amex $1,888B, JCB $342B, Diners/Discover $257B."
    spoken: two-sided platform
    display: "Payments volume 2025: Visa $14.6T, Mastercard $8.8T (Visa 10-K/Nilson)"
    fields: {visa_spoken: fourteen point six trillion dollars, ma_spoken: eight point eight trillion dollars, amex_spoken: one point nine trillion dollars}
    source_ids: [scotus, visak]
    status: source_located
    verification_note: Table limited to five networks (said 'among the big card networks').

  - id: exclusive
    text: "Solicitor General brief (2004): Visa's Bylaw 2.10(e) and MasterCard's Competitive Programs Policy barred member banks from issuing American Express or Discover cards; 'no bank in the continental United States has agreed to issue American Express' cards; the district court 'ordered Visa and MasterCard to repeal their exclusionary rules'; Second Circuit judgment entered September 17, 2003. Visa and MasterCard 'account for 73% of general purpose card transactions and 85% of card issuance.'"
    spoken: seventy-three percent
    display: "Exclusivity rules struck down (2003)"
    fields: {issue_spoken: eighty-five percent}
    source_ids: [osg]
    status: source_located
    verification_note: Shares as stated in the government brief (around 2000).

  - id: durbin
    text: "Fed: an issuer 'may not receive, for any electronic debit transaction, an interchange fee that exceeds $0.21 plus 0.05 percent multiplied by the value of the transaction, plus a $0.01 fraud-prevention adjustment' (section 920, Dodd-Frank, 2010). Fed proposal Oct 25, 2023: for an average $50 transaction the cap 'would decline from 24.5 cents ... to 17.7 cents.' Visa 10-K (Nov 2026) still describes the Fed as 'proposing further rate reductions'; Mastercard 10-K: two district courts issued 'conflicting decisions' in Aug/Sep 2025; 'The interchange cap remains in effect while the litigation continues.' DOJ: Durbin 'requires that each debit card support at least two unaffiliated debit networks.'"
    spoken: twenty-one cents
    display: "Debit cap: 21¢ + 0.05% + 1¢ (Fed Regulation II)"
    fields: {old_spoken: twenty-four and a half cents, new_spoken: seventeen point seven cents}
    source_ids: [regii, visak, mak, doj]
    status: source_located
    verification_note: Proposal not finalized as of Nov 2026 (said).

  - id: dojsuit
    text: "DOJ complaint (Sep 24, 2024), ALLEGATIONS: 'more than 60% of debit transactions run on Visa's debit network, allowing it to charge over $7 billion in fees each year'; network effects create 'an enormous moat' (quoting Visa); Mastercard 'processing less than 25% of all U.S. debit transactions.' Opinion and Order June 23, 2025: 'Visa's motion to dismiss is denied.' Visa 10-K (Nov 5, 2026): case pending, no trial date reported."
    spoken: more than sixty percent
    display: "DOJ alleges: Visa runs >60% of U.S. debit (2024 suit)"
    fields: {fees_spoken: more than seven billion dollars}
    source_ids: [doj, visak]
    status: source_located
    verification_note: Allegations, not findings (said). Case pending.

  - id: settle
    text: "Visa 10-K FY2026, Note 20: ~$5.3bn deposited under the 2012 settlement; Sept 17, 2018 amended settlement added $900 million; final approval December 13, 2019; $700 million returned for opt-outs; affirmed March 15, 2023. Net ≈ $5.5bn (our calc). March 25, 2024 injunctive settlement: preliminary approval 'denied on June 25, 2024.' November 10, 2025 superseding settlement: preliminary approval granted June 9, 2026; final approval motion filed July 15, 2026. Visa 8-K (Nov 10, 2025): 'reduction of the U.S. combined average effective credit interchange rate by 10 bps for five years'; 'standard U.S. consumer credit rates will be capped at 125 bps'; merchants 'will be able to choose whether to accept U.S. credit cards in distinct categories—commercial, premium consumer and standard consumer'; 'subject to approval by the court.'"
    spoken: about five and a half billion dollars
    display: "Merchant case: ≈ $5.5bn (2019, our net); 2025 deal pending"
    source_ids: [visak, visa8k]
    status: source_located
    verification_note: Net total our arithmetic; 2025 settlement awaits final approval (said).

  - id: ccca
    text: "Durbin press release (Jan 13, 2026): the Credit Card Competition Act would require banks with 'more than $100 billion in assets' to support 'at least two unaffiliated card networks (including one outside Visa/Mastercard)'; 'President Trump endorsed the legislation early this morning.' Visa 10-K (Nov 2026): 'It remains unclear if the CCCA will gain sufficient traction to advance in the current Congress.' EU Regulation 2015/751: caps of '0,2 %' (debit, Art. 3) and '0,3 %' (credit, Art. 4), applying from 9 December 2015."
    spoken: one hundred billion dollars
    display: "CCCA (2026, not law); EU caps 0.2% / 0.3% (2015)"
    source_ids: [ccca, visak, euifr]
    status: source_located
    verification_note: Bill not enacted as of Nov 2026 (said).
