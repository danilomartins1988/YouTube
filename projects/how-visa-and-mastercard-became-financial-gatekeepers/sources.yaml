# Sources and claims for "How Visa and Mastercard Became Financial Gatekeepers" (Episode 39, US batch #18).
# Every claim was read on its primary page/file on 2026-11-10 (notes: docs/episodes/39-visa-mastercard/RESEARCH_NOTES.md).
# Status stays source_located until a named human reviewer signs off. US dollars as published.
# RULES: overlap watch vs Ep 30 (no swipe-fee split, no rewards loop, no margins). DOJ v. Visa (2024) = ALLEGATIONS (said);
# merchant settlement net ≈ $5.5bn is OUR arithmetic; Nov 2025 settlement awaits final approval (said); Fed 2023 proposal
# not final (said); Fresno card count NOT used (secondary only); Visa name: "chose the name Visa in 1976" (Fed/Visa).
# Network table is Visa's 10-K citing The Nilson Report (attributed). No logos, no card designs, no real people drawn.
