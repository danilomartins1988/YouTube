# Sources and claims for "Why America's Airports Make Money Before You Fly" (Episode 38, US batch #12).
# Every claim was read on its primary page/file on 2026-11-10 (notes: docs/episodes/38-airports/RESEARCH_NOTES.md).
# Status stays source_located until a named human reviewer signs off. US dollars as published.
