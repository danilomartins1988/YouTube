# Editorial topic candidates. Scores are 1-5 judgements by the editorial team, with reasons.
# audience_interest / evergreen / evidence_quality: higher is better.
# production_difficulty: higher is HARDER (counts against the topic).
# "key_sources_to_find" lists source TYPES to locate - none of these are citations yet.
topics:
  - title: Why Switzerland Is So Rich
    angle: How a small landlocked country reached one of the highest incomes per person
    audience_interest: 5
    evergreen: 5
    evidence_quality: 5
    production_difficulty: 2
    rationale:
      audience_interest: "'Why is X rich' questions are a durable explainer format; Switzerland is widely recognised."
      evergreen: Structural story (institutions, specialisation, skills) that changes slowly.
      evidence_quality: Open official statistics (World Bank, Swiss federal offices, WIPO) are available in English.
      production_difficulty: Maps and charts are enough; no archival footage required.
    key_sources_to_find: [World Bank WDI, Swiss Federal Statistical Office, Federal Office for Customs and Border Security trade statistics, SERI on vocational training, WIPO Global Innovation Index]

  - title: How De Beers Sold the World on Diamonds
    angle: Supply control and advertising that shaped a market
    audience_interest: 5
    evergreen: 5
    evidence_quality: 4
    production_difficulty: 3
    rationale:
      audience_interest: Consumer-facing story with a clear 'hidden economics' twist.
      evergreen: Historical core with a present-day lab-grown diamond angle.
      evidence_quality: Business histories and competition-authority documents exist; advertising claims need care.
      production_difficulty: Historical advertising is usually copyrighted - must be described, not shown.
    key_sources_to_find: [competition authority decisions, company annual reports, academic business histories]

  - title: Norway's Oil Fund and the Resource Curse
    angle: Why Norway saved its oil money when many producers did not
    audience_interest: 4
    evergreen: 5
    evidence_quality: 5
    production_difficulty: 2
    rationale:
      audience_interest: Sovereign wealth is a recurring curiosity topic.
      evergreen: Fund rules and history are stable; the fund value is a live number to refresh.
      evidence_quality: Fund manager and government publish detailed public reports.
      production_difficulty: Charts plus maps; data is downloadable.
    key_sources_to_find: [Norges Bank Investment Management reports, Norwegian Ministry of Finance, IMF papers on resource revenue]

  - title: Why Argentina Keeps Defaulting
    angle: Inflation, debt and politics in a once-rich country
    audience_interest: 5
    evergreen: 4
    evidence_quality: 4
    production_difficulty: 3
    rationale:
      audience_interest: Topical and dramatic.
      evergreen: History is durable but current policy changes fast - needs dated framing.
      evidence_quality: IMF and central bank data exist; political interpretation is contested and must be balanced.
      production_difficulty: Needs careful multi-decade timeline graphics.
    key_sources_to_find: [IMF country reports, central bank statistics, peer-reviewed economic history]

  - title: The Dutch East India Company, the First Megacorporation
    angle: How shares, monopoly and violence built a trading empire
    audience_interest: 4
    evergreen: 5
    evidence_quality: 4
    production_difficulty: 4
    rationale:
      audience_interest: History-of-capitalism stories perform well with curious audiences.
      evergreen: Purely historical.
      evidence_quality: Strong academic literature; popular claims (e.g. 'most valuable company ever') are often unsupported and must be avoided.
      production_difficulty: Needs licensed or public-domain historical imagery (museum open-access collections).
    key_sources_to_find: [academic histories, museum open-access image collections, archival records]

  - title: How Singapore Became Rich in One Generation
    angle: Port, planning and state-linked capitalism
    audience_interest: 4
    evergreen: 4
    evidence_quality: 4
    production_difficulty: 2
    rationale:
      audience_interest: Popular development story; risks overlap with Switzerland episode, so needs a distinct angle.
      evergreen: Mostly historical.
      evidence_quality: Official statistics are good; political-economy interpretation needs balance.
      production_difficulty: Maps and charts suffice.
    key_sources_to_find: [Singapore Department of Statistics, World Bank WDI, academic development studies]

  - title: Shipping Chokepoints That Run the World Economy
    angle: Suez, Panama, Hormuz, Malacca - what happens when one closes
    audience_interest: 4
    evergreen: 4
    evidence_quality: 4
    production_difficulty: 3
    rationale:
      audience_interest: Recurring news hook whenever a disruption happens.
      evergreen: Geography is permanent, volumes change.
      evidence_quality: UNCTAD and canal authorities publish traffic data.
      production_difficulty: Animated route maps are more complex than country maps.
    key_sources_to_find: [UNCTAD maritime reports, canal authority statistics, energy agency transit estimates]

  - title: Japan's Lost Decades
    angle: What really happened after the 1980s bubble
    audience_interest: 4
    evergreen: 5
    evidence_quality: 4
    production_difficulty: 3
    rationale:
      audience_interest: Common question among economics viewers.
      evergreen: Historical with continuing relevance.
      evidence_quality: Good data; the 'lost decades' framing itself is debated and should be presented as such.
      production_difficulty: Many time-series charts; few rights-cleared visuals of the era.
    key_sources_to_find: [Bank of Japan statistics, Cabinet Office data, academic reviews of the debate]

  - title: How Ireland Became a Corporate Tax Hub
    angle: Multinationals, tax rules and a GDP statistic that misleads
    audience_interest: 3
    evergreen: 3
    evidence_quality: 4
    production_difficulty: 3
    rationale:
      audience_interest: Niche but strong with business viewers.
      evergreen: International tax rules are changing - risk of dating quickly.
      evidence_quality: Irish statistics office publishes alternative measures; OECD documents available.
      production_difficulty: Abstract topic - harder to visualise.
    key_sources_to_find: [Central Statistics Office Ireland, OECD tax documents, EU decisions]

  - title: The Hanseatic League, a Medieval Trade Network
    angle: How merchant towns built a trading bloc without a state
    audience_interest: 3
    evergreen: 5
    evidence_quality: 3
    production_difficulty: 4
    rationale:
      audience_interest: History fans; smaller general audience.
      evergreen: Purely historical.
      evidence_quality: Quantitative data is thin; mostly scholarly narrative.
      production_difficulty: Historical maps must be redrawn; imagery needs public-domain sourcing.
    key_sources_to_find: [academic histories, public-domain historical maps]
