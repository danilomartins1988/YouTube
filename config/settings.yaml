# Global pipeline settings. Per-video choices live in projects/<slug>/project.yaml.
video:                # shared by all formats; width/height/lead/tail come from `formats`
  fps: 30
  crf: 20            # x264 quality (lower = better/larger)
  preset: medium
  audio_sample_rate: 48000
  render_workers: 3     # scenes rendered in parallel (set to CPU cores - 1)
  encoder_threads: 2    # x264 threads per scene encoder

# Output formats. A deliverable picks one in its deliverable.yaml.
formats:
  long_16x9:
    width: 1920
    height: 1080
    loudness_lufs: -16       # long-form: a little more headroom
    scene_lead_in: 0.35
    scene_tail: 0.5
    fade: 0.35
  short_9x16:
    width: 1080
    height: 1920
    loudness_lufs: -14       # mobile feeds play louder
    scene_lead_in: 0.2
    scene_tail: 0.3
    fade: 0.18
    # Areas platform UI tends to cover (px). Key content and captions stay out of them.
    safe_zone: {top: 250, bottom: 480, left: 60, right: 140}
  extended_9x16:
    width: 1080
    height: 1920
    loudness_lufs: -14
    scene_lead_in: 0.35
    scene_tail: 0.55
    fade: 0.2
    safe_zone: {top: 250, bottom: 480, left: 60, right: 140}

tts:
  # First available free provider is used. Paid providers are never chosen automatically.
  default_provider: [kokoro, festival, espeak]   # kokoro | festival | piper | espeak | elevenlabs | openai | silent
  sentence_gap: 0.22           # seconds of silence between sentences
  # FFmpeg filter chain applied to every narration sentence: rumble cut, body (+2 dB @160 Hz),
  # presence (+1.5 dB @3.2 kHz), gentle 2.5:1 compression, very soft room so the voice isn't "dry".
  voice_polish: "highpass=f=70,equalizer=f=160:t=q:w=1:g=2,equalizer=f=3200:t=q:w=1.2:g=1.5,acompressor=threshold=-20dB:ratio=2.5:attack=8:release=120:makeup=2,aecho=0.85:0.8:24|41:0.06|0.04"
  providers:
    festival:
      voice: cmu_us_slt_arctic_hts   # apt: festival festvox-us-slt-hts (free, CMU ARCTIC licence)
      tempo: 1.12                    # pitch-preserving speed-up applied with FFmpeg atempo
    kokoro:
      model_path_env: KOKORO_MODEL_PATH     # kokoro-v1.0.onnx (Apache-2.0)
      voices_path_env: KOKORO_VOICES_PATH   # voices-v1.0.bin
      voice: af_heart        # Kokoro's highest-quality English voice (US). Alternatives: af_bella, bf_emma (en-gb)
      lang: en-us            # en-gb for b* (British) voices
      speed: 1.0             # natural pace; speeding up costs naturalness
    espeak:
      voice: en-gb-x-rp
      words_per_minute: 176
      pitch: 42
    piper:
      voice_path_env: PIPER_VOICE_PATH
      length_scale: 1.05
    elevenlabs:
      api_key_env: ELEVENLABS_API_KEY
      voice_id: ""               # choose in the ElevenLabs voice library
      model_id: eleven_multilingual_v2
    openai:
      api_key_env: OPENAI_API_KEY
      model: gpt-4o-mini-tts       # or tts-1-hd (no style instructions)
      voice: ash                   # chosen by the editor in a blind A/B (onyx/ash/sage), 2026-11-03
      unit: paragraph              # one request per segment: intonation flows across sentences
      voice_polish: none           # the global EQ/echo chain was tuned for Kokoro; it made this voice metallic
      instructions: >-
        Voice: an engaging documentary storyteller, warm, curious and human, like a presenter talking to one
        listener. Pacing: unhurried but alive; vary the rhythm, slow down slightly before and on key numbers,
        and let sentences flow into each other. Intonation: natural rises and falls, no sing-song, no announcer
        voice. Pauses: short natural breaths at commas, a beat after a striking fact. Tone: confident and
        understated, never salesy.
    silent:
      words_per_minute: 150

# Pricing is used ONLY for estimates. Prices change: verify on the vendor's pricing
# page before relying on them, and update `verified_on`. `null` means "unknown" and
# the cost report will say so instead of guessing.
pricing:
  festival:   {usd_per_1k_chars: 0.0,   verified_on: "n/a (open source, local)"}
  kokoro:     {usd_per_1k_chars: 0.0,   verified_on: "n/a (open source, local)"}
  espeak:     {usd_per_1k_chars: 0.0,   verified_on: "n/a (open source, local)"}
  piper:      {usd_per_1k_chars: 0.0,   verified_on: "n/a (open source, local)"}
  silent:     {usd_per_1k_chars: 0.0,   verified_on: "n/a"}
  # Conservative: tts-1-hd is $30/1M chars; gpt-4o-mini-tts is token-priced (~$0.015/min of audio,
  # roughly $15-17/1M chars). Using $30/1M for both keeps the budget cap on the safe side.
  openai:     {usd_per_1k_chars: 0.030, verified_on: "2026-11-03 via search results (not OpenAI's page) - confirm at https://openai.com/api/pricing"}
  elevenlabs: {usd_per_1k_chars: null,  verified_on: "unverified - depends on your plan, see https://elevenlabs.io/pricing"}
  local_compute: {usd_per_cpu_hour: 0.0, verified_on: "assumed negligible on your own machine"}

licensing:
  # Licences the QC step accepts for visual/audio assets without manual review.
  allowlist:
    - original-programmatic     # generated by this pipeline
    - public-domain
    - CC0-1.0
    - CC-BY-4.0
    - OFL-1.1
    - GPL-3.0-or-later-output   # e.g. espeak-ng speech output (output is not GPL-encumbered)
    - CMU-ARCTIC                # Festival slt voice data: free use incl. commercial, keep notice
  attribution_required: [CC-BY-4.0]

qc:
  narration_wpm_min: 120
  narration_wpm_max: 185
  max_scene_similarity: 0.80    # editorial distinctiveness vs. previous projects

# Hard limit for paid APIs, per topic, enforced before every request (see hiddeneco/budget.py).
budget:
  currency: USD
  max_paid_usd_per_topic: 0.50

# Used only to show costs in BRL alongside USD. Not live - update when you need precision.
brl_per_usd: null
